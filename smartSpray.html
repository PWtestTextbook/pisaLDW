  /* เฉลย/รูบริคจาก "คู่มือเฉลยและเกณฑ์การให้คะแนน" (.docx) ของสถานการณ์นี้ - คัดลอกมาตามเอกสารทุกประการ */
  var DOCKEY = {"i": [{"s": "SHOW", "n": 1, "t": "ข้อ 1  ข. ระยะวงจรชีวิตแมลง วันที่พ่นล่าสุด ค่าความเข้มข้น และกลุ่มกลไกการออกฤทธิ์ (MoA) ที่ใช้  (3 คะแนน)\n• ก. ราคาสารกำจัดศัตรูพืชในท้องตลาด  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      ราคาสารเป็นปัจจัยทางเศรษฐศาสตร์ ไม่ใช่ตัวแปรอินพุตที่ปรากฏในเงื่อนไข (condition) ของอัลกอริทึม จึงไม่เกี่ยวข้องกับตรรกะการประมวลผลของระบบ\n• ข. ระยะวงจรชีวิตแมลง วันที่พ่นล่าสุด ค่าความเข้มข้น และกลุ่มกลไกการออกฤทธิ์ (MoA) ที่ใช้  —  ✓ ถูกต้อง\n      ตัวแปรทั้ง 4 นี้ปรากฏตรงในเงื่อนไขของผังงาน ใช้คำนวณทั้งกำหนดเวลาพ่นซ้ำ ช่วงความเข้มข้นที่ปลอดภัย และความเสี่ยงดื้อยาจากรูปแบบการใช้ MoA จึงเป็นข้อมูลหลักที่ระบบใช้ประมวลผลจริง\n• ค. จำนวนแรงงานที่มีในแปลง  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      เป็นทรัพยากรด้านแรงงาน (operational resource) ไม่ใช่ตัวแปรทางชีวภาพหรือเคมีที่ระบบใช้ประเมินความเสี่ยงการดื้อยาหรือความปลอดภัยของพืช\n• ง. ยี่ห้อของเครื่องพ่นสาร  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      เป็นคุณลักษณะของอุปกรณ์ ไม่มีความสัมพันธ์เชิงเหตุผลกับการคำนวณความเสี่ยงทางชีวภาพของระบบ"}, {"s": "SHOW", "n": 2, "t": "ข้อ 2  ใช้สารกลุ่ม MoA เดิมซ้ำหลายครั้งติดต่อกัน  และ  พ่นถี่กว่าระยะเวลาที่แนะนำ  (เลือกทั้ง 2 ข้อ; ต้องไม่เลือกตัวลวง \"สีของบรรจุภัณฑ์\" และ \"ทิศทางลม\")  (3 คะแนน)\n• ใช้สารกลุ่มกลไกการออกฤทธิ์ (MoA) เดิมซ้ำหลายครั้งติดต่อกัน  —  ✓ ถูกต้อง\n      ตามหลักกีฏวิทยา การใช้กลไกออกฤทธิ์ (MoA) เดียวกันซ้ำ ๆ สร้างแรงกดดันคัดเลือก (selection pressure) ต่อประชากรแมลง ทำให้ตัวที่มียีนทนทานอยู่รอดและแพร่พันธุ์ต่อ นำไปสู่การดื้อยาของประชากรโดยรวม\n• สีของบรรจุภัณฑ์สารกำจัดศัตรูพืช  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      สีของบรรจุภัณฑ์เป็นคุณลักษณะภายนอกที่ไม่มีกลไกทางเภสัชวิทยาหรือชีววิทยาใดเชื่อมโยงกับการดื้อยาของแมลง จึงเป็นตัวลวงที่ไม่เกี่ยวข้องกับหลักวิชาการของโจทย์\n• พ่นถี่กว่าระยะเวลาที่แบบจำลองแนะนำ  —  ✓ ถูกต้อง\n      การพ่นถี่กว่าที่แนะนำเพิ่มความถี่ของแรงกดดันคัดเลือกเช่นเดียวกัน ทำให้กระบวนการคัดเลือกสายพันธุ์ที่ทนทานเกิดเร็วขึ้น\n• ทิศทางลมขณะพ่นสารในแต่ละครั้ง  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      ทิศทางลมมีผลต่อการฟุ้งกระจายของละอองสาร (spray drift) และความปลอดภัยของผู้พ่นหรือพื้นที่ข้างเคียง แต่ไม่ได้เพิ่มแรงกดดันคัดเลือก (selection pressure) ต่อประชากรแมลง จึงไม่ใช่ปัจจัยที่ทำให้แมลงดื้อยาโดยตรง เป็นตัวลวงที่ฟังดูเกี่ยวข้องกับการพ่นสาร\nเกณฑ์ย่อย: ให้คะแนนเต็ม 3 คะแนนเมื่อเลือกครบทั้ง 2 ข้อที่ถูกต้องและไม่เลือกข้อลวง ให้ 1.5 คะแนนหากเลือกถูก 1 ใน 2 ข้อและไม่เลือกข้อลวง ไม่ให้คะแนนหากเลือกข้อลวงข้อใดข้อหนึ่ง (\"สีของบรรจุภัณฑ์\" หรือ \"ทิศทางลม\") ไม่ว่าจะเลือกข้ออื่นถูกด้วยหรือไม่"}, {"s": "SHOW", "n": 3, "t": "ข้อ 3  ก. จุดตัดสินใจ (decision) ที่มีทางแยกตามเงื่อนไข  (3 คะแนน)\n• ก. จุดตัดสินใจ (decision) ที่มีทางแยกตามเงื่อนไข  —  ✓ ถูกต้อง\n      ตามมาตรฐานสัญลักษณ์ผังงาน (flowchart standard) รูปสี่เหลี่ยมข้าวหลามตัด (◇) แทนจุดตรวจเงื่อนไข/ตัดสินใจที่มีทางแยกของผลลัพธ์ (เช่น ใช่/ไม่ใช่) ตรงตามนิยามมาตรฐาน\n• ข. ขั้นตอนการประมวลผลข้อมูลทั่วไป  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      สัญลักษณ์มาตรฐานสำหรับขั้นตอนประมวลผล (process) คือรูปสี่เหลี่ยมผืนผ้า ไม่ใช่สี่เหลี่ยมข้าวหลามตัด\n• ค. การรับข้อมูลเข้า / แสดงผลข้อมูลออก  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      สัญลักษณ์มาตรฐานสำหรับการรับข้อมูลเข้า/แสดงผลออก (input/output) คือรูปสี่เหลี่ยมด้านขนาน ไม่ใช่สี่เหลี่ยมข้าวหลามตัด\n• ง. จุดเริ่มต้นหรือจุดสิ้นสุดของผังงาน  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      สัญลักษณ์มาตรฐานสำหรับจุดเริ่มต้น/สิ้นสุด (terminal) คือรูปวงรีหรือสี่เหลี่ยมมุมมน ไม่ใช่สี่เหลี่ยมข้าวหลามตัด"}, {"s": "SHOW", "n": 4, "t": "ข้อ 4  ง. แจ้งเตือนว่ายังไม่ถึงกำหนด และไม่อนุญาตให้พิจารณาพ่นครั้งถัดไป  (3 คะแนน)\n• ก. สั่งพ่นสารทันทีโดยอัตโนมัติ  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      ขัดกับหลักการออกแบบของระบบที่เป็นเพียงเครื่องมือช่วยวิเคราะห์ข้อมูล (decision-support) ไม่ใช่ระบบสั่งพ่นอัตโนมัติ อีกทั้งยังขัดกับเงื่อนไขที่ระบุว่ายังไม่ถึงกำหนด\n• ข. เปลี่ยนกลุ่ม MoA ให้อัตโนมัติ  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      เงื่อนไขที่ตรวจสอบเกี่ยวกับระยะเวลา ไม่เกี่ยวข้องกับกลุ่ม MoA จึงไม่ใช่การตอบสนองที่สอดคล้องเชิงตรรกะกับเงื่อนไขนี้\n• ค. ลบข้อมูลการพ่นครั้งก่อนหน้าทิ้ง  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      การลบข้อมูลย้อนหลังจะทำลายความสามารถของระบบในการติดตามประวัติ ซึ่งจำเป็นต่อการคำนวณเงื่อนไขอื่น ๆ ในอนาคต ไม่ใช่การตอบสนองที่สมเหตุสมผลต่อเงื่อนไขนี้\n• ง. แจ้งเตือนว่ายังไม่ถึงกำหนด และไม่อนุญาตให้พิจารณาพ่นครั้งถัดไป  —  ✓ ถูกต้อง\n      สอดคล้องตรงตามตรรกะของเงื่อนไข: เมื่อยังไม่ผ่านระยะเวลาขั้นต่ำที่กำหนด (safety margin) ระบบต้องระงับการอนุญาตพ่นเพื่อป้องกันการพ่นถี่เกินไปซึ่งเพิ่มความเสี่ยงดื้อยา สอดคล้องกับบทบาทของระบบที่เป็นเครื่องมือช่วยตัดสินใจ ไม่ใช่ผู้สั่งการ"}, {"s": "SHOW", "n": 5, "t": "ข้อ 5  ค. บล็อก “ถ้า … แล้ว”  (3 คะแนน)\n• ก. บล็อก “ทำซ้ำ 10 ครั้ง”  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      เป็นโครงสร้างการทำซ้ำ (loop) สั่งให้ทำคำสั่งด้านในซ้ำตามจำนวนรอบที่กำหนดโดยไม่ตรวจเงื่อนไข จึงจะแสดงคำเตือนซ้ำ 10 ครั้งทุกครั้ง ไม่ว่าเงื่อนไขจะเป็นจริงหรือไม่\n• ข. บล็อก “รอ 1 วินาที”  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      เป็นคำสั่งหน่วงเวลา ไม่มีการตรวจสอบเงื่อนไข จึงไม่สามารถเลือกทำหรือไม่ทำคำสั่งตามข้อมูลได้\n• ค. บล็อก “ถ้า … แล้ว”  —  ✓ ถูกต้อง\n      เป็นโครงสร้างแบบมีทางเลือก (selection / conditional) ทำคำสั่งด้านในเฉพาะเมื่อเงื่อนไขเป็นจริงเท่านั้น ตรงกับหลักการของระบบที่ต้องแจ้งเตือนเมื่อพบความเสี่ยง และเป็นบล็อกหลักที่ใช้ในภาระงานที่ 2\n• ง. บล็อก “เคลื่อนที่ 10 ก้าว”  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      เป็นคำสั่งด้านการเคลื่อนไหวของตัวละคร ไม่เกี่ยวข้องกับการตัดสินใจหรือการตรวจสอบเงื่อนไข"}, {"s": "LEARN", "n": 1, "t": "ส่วน A · เฉลยคำตอบ\n      ส่วนที่ 2 · LEARN ภาระงานที่ 1 — เรียงลำดับอัลกอริทึม (10 คะแนน)\n1.1 ลำดับขั้นตอนที่ถูกต้อง (6 คะแนน — 1 คะแนนต่อขั้นตอนที่ถูกตำแหน่ง)\n• ลำดับ  —  ขั้นตอน\n• 1  —  เริ่มต้น (Start)\n• 2  —  รับค่านำเข้า: วันที่ปัจจุบัน, วันที่พ่นล่าสุด, ค่าความเข้มข้นที่เลือก, กลุ่ม MoA ที่ใช้\n• 3  —  ตรวจสอบว่าถึงกำหนดเวลาที่อนุญาตให้พ่นครั้งถัดไปหรือยัง\n• 4  —  ตรวจสอบว่าค่าความเข้มข้นอยู่ในช่วงที่กำหนดหรือไม่\n• 5  —  ตรวจสอบว่าใช้กลุ่ม MoA เดิมซ้ำเกินจำนวนครั้งที่กำหนดหรือไม่\n• 6  —  แสดงผลลัพธ์การประเมิน (แจ้งเตือน หรือ อนุญาตพิจารณาพ่น) แล้วจบการทำงาน (End)\n1.2 คำอธิบายเหตุผล (4 คะแนน)\nข้อนี้เป็นคำถามอัตนัยเชิงเหตุผล — ให้ใช้ \"รูบริค 3 มิติ\" ในส่วน B ประกอบการตรวจ แนวคำตอบที่คาดหวัง (ระดับดีเยี่ยม): อธิบายว่าการตรวจสอบเงื่อนไขเดียวไม่เพียงพอ เพราะแต่ละเงื่อนไข (ระยะเวลา / ความเข้มข้น / การใช้ MoA ซ้ำ) สะท้อนความเสี่ยงคนละมิติกัน หากตรวจสอบข้อใดข้อหนึ่งเพียงข้อเดียวอาจปล่อยให้พ่นสารในสภาวะที่เสี่ยงต่อการดื้อยาหรือเป็นอันตรายต่อพืชได้ แม้เงื่อนไขอื่นจะผ่านก็ตาม การตรวจครบทุกเงื่อนไขจึงช่วยลดความเสี่ยงจากหลายปัจจัยพร้อมกัน"}, {"s": "LEARN", "n": 2, "t": "ส่วน A · เฉลยคำตอบ\n      ส่วนที่ 2 · LEARN ภาระงานที่ 2 — เขียนโปรแกรมด้วยบล็อกคำสั่ง (10 คะแนน)\n2.1 เฉลยโปรแกรม (6 คะแนน)\n• บรรทัดที่  —  บล็อกหลัก\n      บล็อกที่ซ้อนอยู่ด้านใน (บนลงล่าง)\n• 1  —  A  เมื่อคลิก ⚑ เริ่ม\n      –\n• 2  —  B  รับค่า [วันที่พ่นล่าสุด] [ความเข้มข้น] [กลุ่ม MoA]\n      –\n• 3  —  E  ถ้า ⟨จำนวนวันนับจากพ่นล่าสุด < 7⟩ แล้ว\n      K  พูด [ยังไม่ถึงกำหนดพ่น]  →  G  หยุด [ทั้งหมด]\n• 4  —  C  ถ้า ⟨ความเข้มข้น < 20 หรือ > 40⟩ แล้ว\n      L  พูด [ปรับค่าความเข้มข้นให้อยู่ในช่วง]  →  G  หยุด [ทั้งหมด]\n• 5  —  D  ถ้า ⟨ใช้ MoA เดิมติดกัน > 2 ครั้ง⟩ แล้ว\n      I  พูด [เสี่ยงดื้อยา ให้สลับกลุ่ม MoA]  →  G  หยุด [ทั้งหมด]\n• 6  —  H  พูด [อนุญาตให้พิจารณาพ่นได้]\n      –\nคำตอบแบบย่อ:  1 A · 2 B · 3 E | K, G · 4 C | L, G · 5 D | I, G · 6 H\nภาพโปรแกรมที่ถูกต้องเมื่อต่อบล็อกในฉบับคอมพิวเตอร์ (ภาระงานที่ 2):\nเกณฑ์การให้คะแนนข้อ 2.1 (6 คะแนน)\n• เกณฑ์  —  คะแนน\n• 1) บรรทัดแรกเป็น A และบรรทัดถัดไปเป็น B (เริ่มโปรแกรม แล้วรับค่าข้อมูลก่อนตรวจเงื่อนไขใด ๆ)  —  1\n• 2) ใช้บล็อก “ถ้า … แล้ว” ครบ 3 บล็อก และเรียงลำดับ E → C → D ตามอัลกอริทึมในภาระงานที่ 1 (ครบ 3 บล็อกแต่ลำดับผิด ให้ 0.5)  —  1\n• 3) ด้านในบล็อก E, C, D มีบล็อกพูดข้อความที่ตรงกับเงื่อนไขนั้น (K, L, I ตามลำดับ) ตามด้วย G — บล็อกละ 1 คะแนน (มีข้อความถูกแต่ขาด G หรือวาง G ก่อนบล็อกพูด ให้ 0.5)  —  3\n• 4) จบโปรแกรมด้วย H ซึ่งอยู่นอกบล็อก “ถ้า” และไม่ใช้บล็อกลวง (F, J, M) ในโปรแกรม  —  1\n• รวม  —  6\nข้อผิดพลาดที่พบบ่อยและผลที่เกิดเมื่อรันโปรแกรม (ใช้ให้ข้อมูลป้อนกลับแก่นักเรียน)\n• ข้อผิดพลาด  —  ผลที่เกิดขึ้น\n• ไม่ใส่ G (หยุด ทั้งหมด) ในบล็อก “ถ้า”  —  แปลงที่ไม่ผ่านเงื่อนไขจะแสดงหลายข้อความต่อกัน และแสดง “อนุญาตให้พิจารณาพ่นได้” ต่อท้าย ซึ่งขัดแย้งกับคำเตือน (เช่น แปลง 1 จะแสดง 4 ข้อความ)\n• วาง H ไว้ในบล็อก “ถ้า” หรือไว้ก่อนบล็อก “ถ้า”  —  ระบบแจ้ง “อนุญาต” ก่อนตรวจครบทุกเงื่อนไข หรือไม่แจ้งอะไรเลยเมื่อแปลงผ่านทุกเงื่อนไข\n• สลับลำดับบล็อก “ถ้า”  —  แปลงที่ไม่ผ่านหลายเงื่อนไขพร้อมกัน (แปลง 1 และ 2) จะแสดงคำเตือนคนละเรื่องกับอัลกอริทึมที่กำหนด\n• วาง B หลังบล็อก “ถ้า” หรือไม่ใช้ B  —  บล็อก “ถ้า” ไม่มีข้อมูลให้ตรวจสอบ ทุกแปลงจึงได้ผล “อนุญาต” ซึ่งเป็นความผิดพลาดที่อันตรายที่สุด\n• ใช้บล็อกลวง F / J / M  —  F ทำให้พูดซ้ำ 10 ครั้ง · J สั่งพ่นทันทีซึ่งขัดกับบทบาทของระบบช่วยตัดสินใจ · M ไม่เกี่ยวข้องกับตรรกะของระบบ\n2.2 ผลการไล่โปรแกรม (4 คะแนน — แปลงละ 1 คะแนน)\n• แปลง  —  ข้อมูล (วัน · มล. · ครั้ง)\n      ข้อความที่ถูกต้อง  เหตุผลจากการไล่โปรแกรม\n• แปลง 1  —  2 · 50 · 3\n      ยังไม่ถึงกำหนดพ่น  ไม่ผ่านทั้ง 3 เงื่อนไข แต่บล็อก E (2 < 7) ถูกตรวจก่อน จึงพูดแล้วหยุดทันที ไม่ตรวจเงื่อนไขอื่นต่อ\n• แปลง 2  —  9 · 55 · 3\n      ปรับค่าความเข้มข้นให้อยู่ในช่วง  ผ่านเงื่อนไขเวลา (9 ≥ 7) แต่ 55 > 40 จึงพูดแล้วหยุด ก่อนถึงการตรวจ MoA (3 > 2)\n• แปลง 3  —  10 · 30 · 4\n      เสี่ยงดื้อยา ให้สลับกลุ่ม MoA  ผ่านเงื่อนไขเวลาและความเข้มข้น แต่ใช้ MoA เดิมติดกัน 4 ครั้ง > 2\n• แปลง 4  —  12 · 28 · 1\n      อนุญาตให้พิจารณาพ่นได้  ผ่านทุกเงื่อนไข จึงไม่เข้าบล็อก “ถ้า” ใดเลย และทำงานถึงบล็อก H\nเกณฑ์ย่อย: ให้ 1 คะแนนต่อแปลงเมื่อข้อความตรงกับเฉลย หากโปรแกรมในข้อ 2.1 ไม่ถูกต้อง แต่นักเรียนไล่ผลตามโปรแกรมของตนเองได้ถูกต้องสอดคล้อง ให้แปลงละ 0.5 คะแนน (เพื่อประเมินทักษะการไล่โปรแกรมแยกจากการเขียนโปรแกรม) หมายเหตุ: ในฉบับคอมพิวเตอร์ นักเรียนกดรันโปรแกรมกับแปลงจำลองทั้ง 4 แปลงได้จริง ระบบจึงให้คะแนนอัตโนมัติจากโครงสร้างโปรแกรมและผลการรัน"}, {"s": "LEARN", "n": 3, "t": "ส่วน A · เฉลยคำตอบ\n      ส่วนที่ 2 · LEARN ภาระงานที่ 3 — วางแผนงานด้วยผังงาน (10 คะแนน)\n3.1 เฉลยผังงาน (8 คะแนน)\nผังงานที่ถูกต้องใช้ข้อความ 7 ข้อความ (ไม่ใช้ข้อความลวง ค และ ซ) ดังภาพ ซึ่งเป็นผังงานที่วาดเสร็จสมบูรณ์ในฉบับคอมพิวเตอร์ (ภาระงานที่ 3):\n• รหัส  —  ข้อความ\n      สัญลักษณ์ที่ถูกต้อง\n• ฌ  —  เริ่มต้น\n      Terminal (วงรี / สี่เหลี่ยมมุมมน)\n• จ  —  รับค่า วันที่พ่นล่าสุด และวันที่ปัจจุบัน\n      Input / Output (สี่เหลี่ยมด้านขนาน)\n• ข  —  จำนวนวัน = วันที่ปัจจุบัน − วันที่พ่นล่าสุด\n      Process (สี่เหลี่ยมผืนผ้า)\n• ช  —  จำนวนวัน ≥ 7 วัน ?\n      Decision (สี่เหลี่ยมข้าวหลามตัด)\n• ฉ  —  แสดงผล “อนุญาตให้พิจารณาพ่นได้”\n      Input / Output (สี่เหลี่ยมด้านขนาน)\n• ก  —  แสดงผล “ยังไม่ถึงกำหนดพ่น”\n      Input / Output (สี่เหลี่ยมด้านขนาน)\n• ง  —  สิ้นสุด\n      Terminal (วงรี / สี่เหลี่ยมมุมมน)\n• ค, ซ  —  สั่งพ่นสารทันทีโดยอัตโนมัติ / เลือกสารเคมีกำจัดแมลงแทนเกษตรกร\n      ไม่ใช้ (ข้อความลวง — ขัดกับบทบาทระบบช่วยตัดสินใจ)\nลูกศรที่ถูกต้อง (7 เส้น):  ฌ → จ → ข → ช ;  ช —“ใช่”→ ฉ ;  ช —“ไม่ใช่”→ ก ;  ฉ → ง ;  ก → ง\nเกณฑ์การให้คะแนนข้อ 3.1 (8 คะแนน)\n• เกณฑ์  —  คะแนน\n• 1) ใช้สัญลักษณ์ถูกต้องตามหน้าที่ของ 7 ขั้นตอน: ถูก 7 = 3 · ถูก 5–6 = 2 · ถูก 3–4 = 1 · ถูก 0–2 = 0  —  3\n• 2) ลำดับและทิศทางลูกศรถูกต้องตามเฉลย 7 เส้น: ถูก 7 = 3 · ถูก 5–6 = 2 · ถูก 3–4 = 1 · ถูก 0–2 = 0  —  3\n• 3) จุดตัดสินใจมีลูกศรออก 2 เส้น ป้าย “ใช่” ไปยัง ฉ และ “ไม่ใช่” ไปยัง ก (มีครบ 2 ทางแต่ป้ายสลับหรือขาดป้าย ให้ 1)  —  2\n• หักคะแนน: ใช้ข้อความลวง ค หรือ ซ ในผังงาน หัก 1 คะแนน (คะแนนข้อ 3.1 ต่ำสุดเป็น 0)  —  −1\n• รวม  —  8\nคำตอบที่ยอมรับได้: (1) ใช้สัญลักษณ์ “สิ้นสุด” 1 หรือ 2 สัญลักษณ์ก็ได้ (2) เขียนรหัสตัวอักษรแทนข้อความเต็มได้ (3) การแสดงผลที่ใช้สัญลักษณ์ Display หรือ Document ตามที่บางตำราใช้ ให้ถือว่าถูกต้อง (4) ลายเส้นไม่สวยงามไม่หักคะแนน หากรูปทรง ลำดับ และทิศทางลูกศรชัดเจน (5) หากนักเรียนเขียนเงื่อนไขเองเป็น “จำนวนวัน < 7 ?” และสลับป้ายลูกศรให้สอดคล้อง (ใช่ → ยังไม่ถึงกำหนดพ่น) ถือว่าถูกต้องเชิงตรรกะ\n3.2 การทดสอบผังงาน (2 คะแนน)\nเฉลย:  แสดงผล “ยังไม่ถึงกำหนดพ่น” (ก) โดยทำงานไปตามลูกศรป้าย “ไม่ใช่”\nเหตุผล: จำนวนวัน = 5 และเงื่อนไข 5 ≥ 7 เป็นเท็จ ผังงานจึงไปตามลูกศร “ไม่ใช่” สู่การแสดงผลว่ายังไม่ถึงกำหนดพ่น ให้ 1 คะแนนสำหรับข้อความที่แสดงผลถูกต้อง และ 1 คะแนนสำหรับป้ายลูกศรที่ถูกต้อง (หากผังงานของนักเรียนใช้เงื่อนไข “< 7” ป้ายที่ถูกต้องคือ “ใช่” ให้ตรวจตามผังงานของนักเรียนเอง)\nหมายเหตุ: ในฉบับคอมพิวเตอร์ ระบบให้คะแนนภาระงานนี้อัตโนมัติจากสัญลักษณ์และข้อความถูกต้อง 35% · ลูกศรเชื่อมต่อถูกต้อง 50% · ความเรียบร้อยของผังงาน (ไม่มีข้อความลวง จุดตัดสินใจมีป้ายครบ ทิศทางถูกต้อง) 15%"}, {"s": "LEARN", "n": 4, "t": "ส่วน A · เฉลยคำตอบ\n      ส่วนที่ 2 · LEARN ภาระงานที่ 4 — เงื่อนไขช่วงความเข้มข้น (10 คะแนน)\n4.1–4.3 หลักการตรวจ\nคำตอบข้อ 4.1 ไม่ได้มีค่าที่ตายตัวเพียงคำตอบเดียว เพราะช่วง (min–max) ที่นักเรียนกำหนดถือว่า \"ถูกต้อง\" ได้หลายช่วง ตราบใดที่ช่วงนั้นจำแนกทั้ง 6 ค่าทดสอบได้ตรงกับผลที่ควรเป็นครบทุกค่า เงื่อนไขทางคณิตศาสตร์ที่ทำให้ถูกต้องครบ 6/6 คือ: 15 < min ≤ 20  และ  38 ≤ max < 41 (ตัวอย่างช่วงที่ถูกต้อง เช่น 18–40, 20–39, 16–38 เป็นต้น)\n• ค่าความเข้มข้น (มล.)  —  ผลที่ควรเป็น\n• 15  —  ไม่ปลอดภัย\n• 25  —  ปลอดภัย\n• 38  —  ปลอดภัย\n• 45  —  ไม่ปลอดภัย\n• 20  —  ปลอดภัย\n• 41  —  ไม่ปลอดภัย\nเกณฑ์การให้คะแนน\n4.1 (4 คะแนน): ให้คะแนนเต็มหากช่วงที่เขียนสอดคล้องกับเงื่อนไขข้างต้น (จำแนกถูกทั้ง 6 ค่า) ให้คะแนนบางส่วนตามสัดส่วนค่าที่จำแนกถูกในข้อ 4.2 หากช่วงนั้นจำแนกถูกเพียงบางค่า (เช่น ถูก 4/6 ให้ 4 × 4/6 ≈ 2.5 คะแนน ปัดตามดุลยพินิจ)\n4.2 (4 คะแนน): ตรวจว่านักเรียนกรอกผลตามกฎของตนเองถูกต้องตรงตรรกะ (สอดคล้องกับคำตอบข้อ 4.1 ที่เขียนไว้จริง) และคอลัมน์ \"ถูกต้อง?\" ตรงกับการเทียบกับคอลัมน์ \"ผลที่ควรเป็น\" — ให้คะแนนตามสัดส่วนจำนวนช่องที่ตรวจตรงตรรกะ ไม่ใช่ตัดสินจากผลลัพธ์ทางชีววิทยาแต่จากความถูกต้องเชิงตรรกะของนักเรียนเอง\n4.3 (2 คะแนน): ให้คะแนนเต็มหากตัวเลขที่กรอก (0-6) ตรงกับจำนวนค่าที่ทำนายถูกจริงในข้อ 4.2 ไม่ให้คะแนนหากตัวเลขไม่ตรงกับที่ตนเองกรอกไว้ (คำตอบที่ควรได้หากกำหนดช่วงถูกต้องคือ 6 จาก 6 ค่า)"}, {"s": "LEARN", "n": 5, "t": "ส่วน A · เฉลยคำตอบ\n      ส่วนที่ 2 · LEARN ภาระงานที่ 5 — วิเคราะห์ข้อมูลจำลอง (10 คะแนน)\nตารางวิเคราะห์อ้างอิง (สำหรับผู้ตรวจ)\n• ครั้งที่  —  วัน\n      กลุ่ม MoA  ระบบเตือน?  ดื้อยาจริง?  ผลการวิเคราะห์\n• 1  —  10\n      A  ไม่เตือน  ไม่ดื้อยา  ถูกต้อง\n• 2  —  3\n      A  ไม่เตือน  ดื้อยาจริง  ผลลบลวง\n• 3  —  12\n      B  ไม่เตือน  ไม่ดื้อยา  ถูกต้อง\n• 4  —  A\n      ไม่เตือน  ดื้อยาจริง  ผลลบลวง\n• 5  —  14\n      C  ไม่เตือน  ไม่ดื้อยา  ถูกต้อง\n• 6  —  A\n      เตือน  ไม่ดื้อยา  ผลบวกลวง\n• 7  —  5\n      B  เตือน  ดื้อยาจริง  ถูกต้อง\n• 8  —  3\n      A  ไม่เตือน  ดื้อยาจริง  ผลลบลวง\n• 9  —  11\n      C  เตือน  ดื้อยาจริง  ถูกต้อง\n• 10  —  13\n      B  ไม่เตือน  ไม่ดื้อยา  ถูกต้อง\n5.1 ผลลบลวง  3 ครั้ง (ครั้งที่ 2, 4, 8)  (2 คะแนน)\n5.2 ผลบวกลวง  1 ครั้ง (ครั้งที่ 6)  (2 คะแนน)\n5.3 ความแม่นยำโดยรวม  60% (ถูกต้อง 6 จาก 10 ครั้ง คือ ครั้งที่ 1, 3, 5, 7, 9, 10)  (2 คะแนน)\n5.4 กลุ่มที่ผิดพลาดมากที่สุด (4 คะแนน — คำถามอัตนัย ใช้รูบริคส่วน B ประกอบ)\nคำตอบที่ถูกต้อง: กลุ่ม A มีความผิดพลาดมากที่สุด กลุ่ม A มีข้อมูลทั้งหมด 5 ครั้ง (ครั้งที่ 1, 2, 4, 6, 8) เกิดข้อผิดพลาด 4 ครั้ง (ผลลบลวงครั้งที่ 2, 4, 8 และผลบวกลวงครั้งที่ 6) คิดเป็น 4/5 = 80% ของข้อมูลกลุ่ม A ซึ่งสูงกว่ากลุ่ม B (0 จาก 3 ครั้ง = 0%) และกลุ่ม C (0 จาก 2 ครั้ง = 0%) มาก แนวคำตอบระดับดีเยี่ยมต้องระบุทั้งตัวเลขความผิดพลาด (4/5) และเปรียบเทียบกับกลุ่มอื่นเพื่อสนับสนุนข้อสรุป"}, {"s": "APPLY", "n": 6, "t": "ข้อ 6.1–6.2 ไม่มีค่าพารามิเตอร์ \"ถูกต้อง\" เพียงชุดเดียว เพราะเป็นการออกแบบระบบ (design task) — ผู้ตรวจต้องตรวจสอบว่านักเรียนคำนวณผลจากค่าที่ตนเองกำหนดถูกต้องตามกติกาหรือไม่ ใช้วิธีตรวจสอบดังนี้\nกติกา: \"ผ่าน\" เมื่อ  ระยะห่างขั้นต่ำ(นักเรียน) ≥ ค่ากำหนด  และ  ช่วงความเข้มข้น(นักเรียน) ≤ ค่ากำหนด  และ  จำนวนซ้ำสูงสุด(นักเรียน) ≤ ค่ากำหนด  — ครบทั้ง 3 ข้อ\n• สถานการณ์  —  ระยะห่างขั้นต่ำ (วัน)\n      ช่วงความเข้มข้น (± มล.)  จำนวนซ้ำสูงสุด MoA\n• แปลงเสี่ยงต่ำ ประชากรแมลงน้อย  —  3\n      8  4\n• แปลงเสี่ยงปานกลาง  —  5\n      6  3\n• แปลงเสี่ยงสูง ประชากรระบาด  —  7\n      4  2\n• ใช้สารกลุ่ม MoA เดิมติดต่อกันหลายรอบ  —  6\n      5  1\n• ฤดูฝน ประสิทธิภาพสารลดลง  —  4\n      5  3\n• ใกล้ช่วงเก็บเกี่ยว (pre-harvest)  —  8\n      6  2\n• แปลงเกษตรผสมผสาน  —  5\n      7  3\n• แปลงระบาดรุนแรง หลายชนิดแมลง  —  7\n      3  1\nตัวอย่างชุดพารามิเตอร์ที่ผ่านครบ 8/8 สถานการณ์ (100%) โดยไม่ต้องไวเกินจำเป็น\nระยะห่างขั้นต่ำ = 8 วัน   ช่วงความเข้มข้น = ± 3 มล.   จำนวนซ้ำสูงสุด = 1 ครั้ง  →  ผ่านทั้ง 8 สถานการณ์ (ตรวจสอบ: ค่านี้มากกว่าหรือเท่ากั      ผู้เรียนรู้ที่ชำนาญ (Proficient Digital Learner)\n• 50 – 69  —  ระดับ 2\n      ผู้เรียนรู้ที่กำลังพัฒนา (Developing Digital Learner)\n• 0 – 49  —  ระดับ 1\n      ผู้เรียนรู้เริ่มต้น (Emerging Digital Learner)\nส่วนนี้เป็นการประเมินตนเอง (self-assessment) จึงไม่มีคำตอบ \"ถูก/ผิด\" ตายตัว ข้อ 7.1–7.3 (มาตรประมาณค่า 2 คะแนน/ข้อ) ให้คะแนนเต็มเมื่อนักเรียนทำเครื่องหมายเลือกคำตอบมาชัดเจนครบถ้วน (1 ตัวเลือกต่อข้อ) ข้อ 7.4–7.5 (ปลายเปิด 2 คะแนน/ข้อ) ให้ 2 คะแนนเมื่อคำตอบเป็นรูปธรรมและสื่อความหมายได้ชัดเจน ให้ 1 คะแนนเมื่อคำตอบกว้างหรือสั้นเกินไปแต่ยังสื่อความหมายได้ และ 0 คะแนนเมื่อเว้นว่าง — ดูรายละเอียดแนวทางการประเมินเชิงคุณภาพเพิ่มเติมในส่วน C\nส่วน B · รูบริคการให้คะแนน\n      รูบริคสำหรับคำถามอัตนัยเชิงเหตุผล (3 มิติ)\nใช้รูบริคนี้ตรวจให้คะแนนคำถามอัตนัยที่ต้องให้เหตุผลประกอบทั้ง 3 ข้อในแบบทดสอบ ได้แก่ ข้อ 1.2 (LEARN ภาระงานที่ 1, 4 คะแนน) ข้อ 5.4 (LEARN ภาระงานที่ 5, 4 คะแนน) และข้อ 6.3 (APPLY, 10 คะแนน) รูบริคประกอบด้วย 3 มิติ แต่ละมิติแบ่งเป็น 4 ระดับคุณภาพ (ตั้งแต่ระดับ 4 ดีเยี่ยม ถึงระดับ 1 ควรปรับปรุง) ส่วนภาระงานที่ 2 (บล็อกคำสั่ง) และภาระงานที่ 3 (ผังงาน) ให้ใช้เกณฑ์แยกองค์ประกอบ (analytic) ที่กำหนดไว้ในส่วน A\nมิติที่ 1: ความถูกต้องและการอ้างอิงข้อมูลเชิงประจักษ์ (Accuracy & Evidence-based Reasoning)\n• ระดับ  —  เกณฑ์การพิจารณา\n• 4 — ดีเยี่ยม  —  อ้างอิงตัวเลข/ข้อมูลจากตารางได้ถูกต้อง ครบถ้วน และตรงประเด็น ใช้ตัวเลขสนับสนุนข้อสรุปได้อย่างสมเหตุสมผลทุกจุด\n• 3 — ดี  —  อ้างอิงตัวเลข/ข้อมูลจากตารางได้ถูกต้องเป็นส่วนใหญ่ อาจขาดรายละเอียดบางจุดแต่ไม่กระทบข้อสรุปหลัก\n• 2 — พอใช้  —  อ้างอิงข้อมูลได้บางส่วน มีตัวเลขคลาดเคลื่อนหรือไม่ครบถ้วน ทำให้ข้อสรุปไม่หนักแน่นเท่าที่ควร\n• 1 — ควรปรับปรุง  —  ไม่อ้างอิงข้อมูล/ตัวเลขจากตารางเลย หรืออ้างอิงผิดจนข้อสรุปคลาดเคลื่อน\nมิติที่ 2: ความลึกของการให้เหตุผลเชิงเหตุ-ผลและเชิงระบบ (Depth of Causal / Systems Reasoning)\n• ระดับ  —  เกณฑ์การพิจารณา\n• 4 — ดีเยี่ยม  —  อธิบายความเชื่อมโยงเชิงเหตุ-ผลได้ชัดเจน เห็นภาพรวมของระบบ (เช่น ข้อแลกเปลี่ยน/trade-off ระหว่างความแม่นยำกับผลกระทบอื่น) ไม่ใช่แค่บอกข้อเท็จจริง\n• 3 — ดี  —  อธิบายเหตุ-ผลได้ถูกทิศทาง เห็นความเชื่อมโยงหลัก แต่ยังไม่ครอบคลุมมุมมองเชิงระบบทั้งหมด\n• 2 — พอใช้  —  อธิบายในเชิงพรรณนา (บอกว่าเกิดอะไร) มากกว่าอธิบายเหตุผล (ทำไมจึงเกิด) เหตุผลที่ให้ยังตื้นหรือไม่ชัดเจน\n• 1 — ควรปรับปรุง  —  ไม่มีการให้เหตุผลเชิงเหตุ-ผล เป็นเพียงการคัดลอกโจทย์หรือให้คำตอบแบบเดา\nมิติที่ 3: ความชัดเจนในการสื่อสาร (Clarity of Communication)\n• ระดับ  —  เกณฑ์การพิจารณา\n• 4 — ดีเยี่ยม  —  เรียบเรียงความคิดเป็นลำดับ อ่านเข้าใจง่าย ใช้ศัพท์เทคนิค (เช่น MoA, threshold, ผลบวกลวง) ได้ถูกต้องเหมาะสม\n• 3 — ดี  —  สื่อสารเข้าใจได้ มีโครงสร้างชัดเจนพอสมควร อาจใช้ศัพท์เทคนิคไม่สม่ำเสมอ\n• 2 — พอใช้  —  สื่อสารเข้าใจได้บางส่วน ลำดับความคิดสับสนหรือประโยคไม่สมบูรณ์\n• 1 — ควรปรับปรุง  —  อ่านไม่เข้าใจ ประโยคขาดตอน หรือคำตอบสั้นเกินกว่าจะสื่อความหมายได้\nตารางแปลงระดับรูบริคเป็นคะแนน (สำหรับแต่ละข้อ)\nนำคะแนนเฉลี่ยจาก 3 มิติ (แต่ละมิติมีน้ำหนักเท่ากัน) มาคำนวณสัดส่วน แล้วเทียบกับคะแนนเต็มของแต่ละข้อ ดังตาราง\n• ระดับเฉลี่ย 3 มิติ  —  ข้อ 1.2 (เต็ม 4)\n      ข้อ 5.4 (เต็ม 4)  ข้อ 6.3 (เต็ม 10, 2 ประเด็นๆ ละ 5)\n• 4.0 (ดีเยี่ยมทุกมิติ)  —  4\n      10\n• 3.0 - 3.9 (ดี)  —  3\n      8\n• 2.0 - 2.9 (พอใช้)  —  2\n      5-6\n• 1.0 - 1.9 (ควรปรับปรุง)  —  1\n      2-3\nหมายเหตุ: ข้อ 6.3 มี 2 ประเด็นย่อย (เหตุผลของชุดที่ 5 / การเลือกชุดที่ดีที่สุด) ผู้ตรวจอาจให้คะแนนแยกประเด็นละ 5 คะแนนโดยใช้รูบริคเดียวกันประเมินแต่ละประเด็น แล้วรวมกันเป็นคะแนนเต็ม 10 ก็ได้ ขึ้นอยู่กับดุลยพินิจของผู้ตรวจแต่ละโรงเรียน\nส่วน C · แนวทางการประเมิน\n      มิติการประเมินขั้นตอนที่ 4 REFLECT (ประเมินตนเอง)\nขั้นตอน REFLECT มีลักษณะต่างจาก 3 ส่วนแรก เพราะเป็นการให้นักเรียน \"ประเมินตนเอง\" ไม่ใช่การวัดความรู้ที่ถูกผิดตายตัว ดังนั้นนอกจากคะแนนตัวเลข (10 คะแนน ตามเกณฑ์ในส่วน A) ผู้ตรวจควรใช้ 3 มิติต่อไปนี้ประกอบการพิจารณาเชิงคุณภาพ เพื่อให้ข้อมูลป้อนกลับ (feedback) แก่นักเรียนและครูผู้สอนในการปรับการเรียนการสอนต่อไป\nมิติที่ 1: ความครบถ้วนและตรงประเด็นของคำตอบ (Completeness & Relevance)\n• ระดับ  —  เกณฑ์การพิจารณา\n• สูง  —  ตอบครบทุกข้อ (7.1-7.5) ตรงประเด็นคำถาม คำตอบปลายเปิด (7.4, 7.5) มีเนื้อหาที่จับต้องได้ ไม่ใช่คำตอบกว้าง ๆ\n• กลาง  —  ตอบครบเกือบทุกข้อ แต่บางข้อปลายเปิดตอบสั้นหรือคลุมเครือ ไม่เจาะจง\n• ต่ำ  —  ตอบไม่ครบ หรือข้ามคำถามปลายเปิดไป หรือคำตอบไม่เกี่ยวข้องกับคำถาม\nมิติที่ 2: ความสอดคล้องระหว่างการประเมินตนเองกับผลการปฏิบัติจริง (Consistency with Observed Performance)\n• ระดับ  —  เกณฑ์การพิจารณา"}, "rb": "3.  ส่วน B — รูบริคการให้คะแนนคำถามอัตนัยเชิงเหตุผล (3 มิติ อย่างน้อยมิติละ 3 ระดับ)\n4.  ส่วน C — แนวทางและมิติการประเมินขั้นตอนที่ 4 REFLECT (ประเมินตนเอง)\nภาพรวมแบบทดสอบ\n      ตารางโครงสร้างแบบทดสอบและสัดส่วนคะแนน (100 คะแนน)\nสัดส่วนคะแนนของฉบับกระดาษกำหนดให้ตรงกับฉบับคอมพิวเตอร์ (ไฟล์ HTML) ซึ่งถ่วงน้ำหนักคะแนนแต่ละขั้นตอนดังนี้ SHOW 15% · LEARN 50% (5 ภาระงาน ภาระงานละ 10%) · APPLY 25% · REFLECT 10% คะแนนจากทั้งสองฉบับจึงนำมาเปรียบเทียบกันได้โดยตรง\n• ส่วน / ภาระงาน  —  ข้อ\n      สิ่งที่วัด  รูปแบบคำถาม  คะแนน\n5.4 กลุ่มที่ผิดพลาดมากที่สุด (4 คะแนน — คำถามอัตนัย ใช้รูบริคส่วน B ประกอบ)\nคำตอบที่ถูกต้อง: กลุ่ม A มีความผิดพลาดมากที่สุด กลุ่ม A มีข้อมูลทั้งหมด 5 ครั้ง (ครั้งที่ 1, 2, 4, 6, 8) เกิดข้อผิดพลาด 4 ครั้ง (ผลลบลวงครั้งที่ 2, 4, 8 และผลบวกลวงครั้งที่ 6) คิดเป็น 4/5 = 80% ของข้อมูลกลุ่ม A ซึ่งสูงกว่ากลุ่ม B (0 จาก 3 ครั้ง = 0%) และกลุ่ม C (0 จาก 2 ครั้ง = 0%) มาก แนวคำตอบระดับดีเยี่ยมต้องระบุทั้งตัวเลขความผิดพลาด (4/5) และเปรียบเทียบกับกลุ่มอื่นเพื่อสนับสนุนข้อสรุป\n6.3 แนวคำตอบอ้างอิง (10 คะแนน — คำถามอัตนัย ใช้รูบริคส่วน B ประกอบ)\n(1) เหตุใดชุดที่ 5 จึงไม่ใช่ทางเลือกที่ดีที่สุด: แม้ชุดที่ 5 จะให้ความแม่นยำ 100% เท่ากับชุดที่ 4 แต่การตั้งค่าให้ระบบไวเกินความจำเป็น (ระยะห่างนานถึง 12 วัน ช่วงความเข้มข้นแคบเพียง ±1 มล.) ทำให้เกิดการแจ้งเตือนที่ไม่จำเป็นถึง 7 ครั้ง ซึ่งอาจทำให้เกษตรกรเสียเวลา ต้นทุน หรือเกิด \"ความเคยชินกับการเตือน\" (alert fatigue) จนสุดท้ายเพิกเฉยต่อคำเตือนที่แท้จริง\n(2) ควรเลือกชุดที่ 4 (ระยะห่าง 8 วัน, ช่วงความเข้มข้น ±3 มล., ซ้ำสูงสุด 1 ครั้ง) เพราะให้ความแม่นยำ 100% เท่ากับชุดที่ 5 แต่ก่อให้เกิดการแจ้งเตือนที่ไม่จำเป็น 0 ครั้ง จึงเป็นจุดสมดุลที่ดีที่สุดระหว่างความแม่นยำกับการไม่รบกวนเกษตรกรเกินจำเป็น\nส่วน B · รูบริคการให้คะแนน\n      รูบริคสำหรับคำถามอัตนัยเชิงเหตุผล (3 มิติ)\nใช้รูบริคนี้ตรวจให้คะแนนคำถามอัตนัยที่ต้องให้เหตุผลประกอบทั้ง 3 ข้อในแบบทดสอบ ได้แก่ ข้อ 1.2 (LEARN ภาระงานที่ 1, 4 คะแนน) ข้อ 5.4 (LEARN ภาระงานที่ 5, 4 คะแนน) และข้อ 6.3 (APPLY, 10 คะแนน) รูบริคประกอบด้วย 3 มิติ แต่ละมิติแบ่งเป็น 4 ระดับคุณภาพ (ตั้งแต่ระดับ 4 ดีเยี่ยม ถึงระดับ 1 ควรปรับปรุง) ส่วนภาระงานที่ 2 (บล็อกคำสั่ง) และภาระงานที่ 3 (ผังงาน) ให้ใช้เกณฑ์แยกองค์ประกอบ (analytic) ที่กำหนดไว้ในส่วน A\nมิติที่ 1: ความถูกต้องและการอ้างอิงข้อมูลเชิงประจักษ์ (Accuracy & Evidence-based Reasoning)\n• ระดับ  —  เกณฑ์การพิจารณา\n• 4 — ดีเยี่ยม  —  อ้างอิงตัวเลข/ข้อมูลจากตารางได้ถูกต้อง ครบถ้วน และตรงประเด็น ใช้ตัวเลขสนับสนุนข้อสรุปได้อย่างสมเหตุสมผลทุกจุด\n• 3 — ดี  —  อ้างอิงตัวเลข/ข้อมูลจากตารางได้ถูกต้องเป็นส่วนใหญ่ อาจขาดรายละเอียดบางจุดแต่ไม่กระทบข้อสรุปหลัก\n• 2 — พอใช้  —  อ้างอิงข้อมูลได้บางส่วน มีตัวเลขคลาดเคลื่อนหรือไม่ครบถ้วน ทำให้ข้อสรุปไม่หนักแน่นเท่าที่ควร\n• 1 — ควรปรับปรุง  —  ไม่อ้างอิงข้อมูล/ตัวเลขจากตารางเลย หรืออ้างอิงผิดจนข้อสรุปคลาดเคลื่อน\nมิติที่ 2: ความลึกของการให้เหตุผลเชิงเหตุ-ผลและเชิงระบบ (Depth of Causal / Systems Reasoning)\n• ระดับ  —  เกณฑ์การพิจารณา\n• 4 — ดีเยี่ยม  —  อธิบายความเชื่อมโยงเชิงเหตุ-ผลได้ชัดเจน เห็นภาพรวมของระบบ (เช่น ข้อแลกเปลี่ยน/trade-off ระหว่างความแม่นยำกับผลกระทบอื่น) ไม่ใช่แค่บอกข้อเท็จจริง\n• 3 — ดี  —  อธิบายเหตุ-ผลได้ถูกทิศทาง เห็นความเชื่อมโยงหลัก แต่ยังไม่ครอบคลุมมุมมองเชิงระบบทั้งหมด\n• 2 — พอใช้  —  อธิบายในเชิงพรรณนา (บอกว่าเกิดอะไร) มากกว่าอธิบายเหตุผล (ทำไมจึงเกิด) เหตุผลที่ให้ยังตื้นหรือไม่ชัดเจน\n• 1 — ควรปรับปรุง  —  ไม่มีการให้เหตุผลเชิงเหตุ-ผล เป็นเพียงการคัดลอกโจทย์หรือให้คำตอบแบบเดา\nมิติที่ 3: ความชัดเจนในการสื่อสาร (Clarity of Communication)\n• ระดับ  —  เกณฑ์การพิจารณา\n• 4 — ดีเยี่ยม  —  เรียบเรียงความคิดเป็นลำดับ อ่านเข้าใจง่าย ใช้ศัพท์เทคนิค (เช่น MoA, threshold, ผลบวกลวง) ได้ถูกต้องเหมาะสม\n• 3 — ดี  —  สื่อสารเข้าใจได้ มีโครงสร้างชัดเจนพอสมควร อาจใช้ศัพท์เทคนิคไม่สม่ำเสมอ\n• 2 — พอใช้  —  สื่อสารเข้าใจได้   var LNAME = (qs("name") || (savedLearner && savedLearner.name) || "").trim();
  var LGRADE = (qs("grade") || (savedLearner && savedLearner.grade) || "").trim();
  function learnerKey() { return LNAME + "|" + LGRADE; }

  /* ---------- small helpers ---------- */
  function norm(s) {
    return (s == null ? "" : String(s))
      .replace(/ /g, " ").replace(/\s+/g, " ")
      .replace(/^[\s\-•▪●◦*]+/, "").trim();
  }
  function squash(s) { return norm(s).toLowerCase().replace(/[\s"'“”‘’.,!?()[\]{}:;/\\-]/g, ""); }
  function clip(s, n) { s = norm(s); return s.length > n ? s.slice(0, n) + "…" : s; }
  /* เหมือน clip แต่คงการขึ้นบรรทัดใหม่ไว้ (ใช้กับคำตอบแบบเรียงลำดับ/หลายบรรทัด) */
  function clipML(s, n) {
    s = String(s == null ? "" : s).replace(/\u00a0/g, " ").replace(/[ \t]+/g, " ")
         .replace(/\n{3,}/g, "\n\n").trim();
    return s.length > n ? s.slice(0, n) + "…" : s;
  }
  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  function probe(name) { try { return eval(name); } catch (e) { return undefined; } }

  /* ---------- live stage of the host app ---------- */
  var STAGE_LABEL = {
    show: "SHOW", learn: "LEARN", apply: "APPLY", reflect: "REFLECT",
    report: "REPORT", summary: "REPORT"
  };
  function rawStage() {
    var holders = ["state", "S", "appState", "APP", "app"];
    var fields = ["stage", "screen", "phase"];
    for (var i = 0; i < holders.length; i++) {
      var o = probe(holders[i]);
      if (o && typeof o === "object") {
        for (var j = 0; j < fields.length; j++) {
          var v = o[fields[j]];
          if (typeof v === "string" && v) return v;
        }
      }
    }
    return "";
  }
  function stageOf(raw) {
    raw = (raw || rawStage()).toLowerCase();
    var keys = ["show", "learn", "apply", "reflect", "report", "summary"];
    for (var i = 0; i < keys.length; i++) {
      if (raw.indexOf(keys[i]) === 0) return STAGE_LABEL[keys[i]];
    }
    return "";
  }

  /* ---------- the host app's own question banks ---------- */
  var BANK_NAMES = [
    ["SHOW_ITEMS", "SHOW"], ["SHOW_Q", "SHOW"], ["SHOW_QUESTIONS", "SHOW"], ["SHOW_MCQ", "SHOW"],
    ["LEARN_TASKS", "LEARN"], ["LEARN", "LEARN"], ["LEARN_QUIZ", "LEARN"], ["BLOCK_TESTS", "LEARN"],
    ["APPLY_SCENARIOS", "APPLY"], ["APPLY_ITEMS", "APPLY"],
    ["REFLECT_LIKERT", "REFLECT"], ["LIKERT_ITEMS", "REFLECT"], ["REFLECT_ITEMS", "REFLECT"],
    ["REFLECT_TEXT", "REFLECT"], ["REFLECT_OPEN", "REFLECT"], ["OPEN_ITEMS", "REFLECT"]
  ];
  var QTEXT_KEYS = ["q", "question", "text", "prompt", "title", "statement", "label", "name", "desc", "stem"];
  var OPT_KEYS = ["options", "choices", "opts", "answers"];
  var ANS_KEYS = ["correct", "answer", "correctIndex", "ans", "key"];
  var EXP_KEYS = ["explain", "explanation", "why", "rationale", "feedback", "rubric", "guide", "hint", "note", "model"];

  function firstKey(obj, keys) {
    for (var i = 0; i < keys.length; i++) {
      if (obj && obj[keys[i]] !== undefined && obj[keys[i]] !== null && obj[keys[i]] !== "") return obj[keys[i]];
    }
    return undefined;
  }

  /* index: normalised option text -> bank item */
  var optionIndex = {};
  var bankItems = [];
  function buildBanks() {
    optionIndex = {}; bankItems = [];
    for (var b = 0; b < BANK_NAMES.length; b++) {
      var name = BANK_NAMES[b][0], stage = BANK_NAMES[b][1];
      var arr = probe(name);
      if (!Array.isArray(arr)) continue;
      for (var i = 0; i < arr.length; i++) {
        var it = arr[i];
        if (!it || typeof it !== "object") {
          if (typeof it === "string") {
            bankItems.push({ bank: name, stage: stage, idx: i, q: it, options: null, correct: null, explain: "" });
          }
          continue;
        }
        var qt = firstKey(it, QTEXT_KEYS);
        var opts = firstKey(it, OPT_KEYS);
        var corr = firstKey(it, ANS_KEYS);
        var exp = firstKey(it, EXP_KEYS);
        var rec = {
          bank: name, stage: stage, idx: i,
          q: typeof qt === "string" ? qt : "",
          options: Array.isArray(opts) ? opts.map(function (o) {
            return typeof o === "string" ? o : (o && (o.text || o.label || o.t)) || String(o);
          }) : null,
          correct: (typeof corr === "number" || typeof corr === "string" || typeof corr === "boolean") ? corr : null,
          explain: typeof exp === "string" ? exp : ""
        };
        bankItems.push(rec);
        if (rec.options) {
          for (var o2 = 0; o2 < rec.options.length; o2++) {
            var k = squash(rec.options[o2]);
            if (k && k.length >= 2 && !optionIndex[k]) optionIndex[k] = { item: rec, optIdx: o2 };
          }
        }
      }
    }
  }

  function correctTextOf(item) {
    if (!item || item.correct === null) return "";
    if (typeof item.correct === "number" && item.options && item.options[item.correct] !== undefined) {
      return item.options[item.correct];
    }
    if (typeof item.correct === "string") return item.correct;
    if (typeof item.correct === "boolean") return item.correct ? "ถูก" : "ผิด";
    return "";
  }

  /* ---------- เฉลย/รูบริคตามคู่มือเฉลย ---------- */
  function docItemFor(row) {
    if (!DOCKEY || !DOCKEY.i) return null;
    /* แถวที่รู้เลขข้อในคู่มือเฉลยแน่นอน (เช่น กิจกรรมที่ 1 ของขั้น APPLY) */
    if (row.docNum && row.stage) {
      for (var d = 0; d < DOCKEY.i.length; d++) {
        if (DOCKEY.i[d].s === row.stage && DOCKEY.i[d].n === row.docNum) return DOCKEY.i[d];
      }
    }
    if (row.bankKey && DOCKEY.m && DOCKEY.m[row.bankKey] !== undefined) {
      return DOCKEY.i[DOCKEY.m[row.bankKey]] || null;
    }
    var qs = squash(row.q), as = squash(row.answer);
    if (DOCKEY.q) {
      for (var i = 0; i < DOCKEY.q.length; i++) {
        if (DOCKEY.q[i] && qs.length > 18 && DOCKEY.q[i].indexOf(qs.slice(0, 36)) > -1) return DOCKEY.i[i];
      }
      for (var j = 0; j < DOCKEY.q.length; j++) {
        if (DOCKEY.q[j] && as.length > 10 && DOCKEY.q[j].indexOf(as.slice(0, 26)) > -1 &&
            (!row.stage || !DOCKEY.i[j].s || DOCKEY.i[j].s === row.stage)) return DOCKEY.i[j];
      }
    }
    return null;
  }
  function docBlockFor(row) {
    if (!DOCKEY || !DOCKEY.i) return "";
    /* ใช้ตัวจับคู่ชุดเดียวกับ docItemFor (เลขข้อในคู่มือ → คลังข้อสอบ → ข้อความ) */
    var hit = docItemFor(row);
    if (hit && hit.t) return hit.t;
    /* เกณฑ์ระดับขั้นตอน แล้วจึงรูบริคอัตนัยส่วนท้ายเอกสาร */
    if (DOCKEY.st && row.stage && DOCKEY.st[row.stage]) return DOCKEY.st[row.stage];
    if (row.kind === "text" && DOCKEY.rb) return DOCKEY.rb;
    return "";
  }
  function stageDocText(stage) {
    if (!DOCKEY) return "";
    if (DOCKEY.st && DOCKEY.st[stage]) return DOCKEY.st[stage];
    var out = [];
    if (DOCKEY.i) {
      for (var i = 0; i < DOCKEY.i.length; i++) {
        if (DOCKEY.i[i].s === stage) out.push(DOCKEY.i[i].t);
      }
    }
    return out.join("\n\n");
  }

  /* ---------- ดึงคำตอบจาก state ของแบบทดสอบ (เรียงลำดับ / เติมคำ / ผลการทดสอบ APPLY) ---------- */
  function hostState() {
    var names = ["state", "S", "appState", "APP"];
    for (var i = 0; i < names.length; i++) {
      var o = probe(names[i]);
      if (o && typeof o === "object") return o;
    }
    return null;
  }
  function fmtVal(v) {
    if (v === null || v === undefined || v === "") return "—";
    if (typeof v === "boolean") return v ? "ใช่" : "ไม่ใช่";
    if (typeof v === "number") return String(Math.round(v * 100) / 100);
    if (typeof v === "string") return v;
    if (Array.isArray(v)) return v.map(fmtVal).join(", ");
    if (typeof v === "object") {
      return Object.keys(v).filter(function (k) {
        return typeof v[k] !== "function" && (Array.isArray(v[k]) || typeof v[k] !== "object");
      }).map(function (k) { return k + " = " + fmtVal(v[k]); }).join(", ");
    }
    return String(v);
  }
  function asNum(v) {
    return (typeof v === "number" && isFinite(v)) ? Math.round(v) : null;
  }
  function adapterRows() {
    var st = hostState();
    if (!st || typeof ADAPTER !== "function") return [];
    var out = [];
    var ctx = {
      S: st,
      c: function (n) { return probe(n); },
      fmt: fmtVal,
      num: asNum,
      push: function (r) {
        if (!r || (!r.answer && r.score == null)) return;
        r.kind = r.kind || "state";
        r.stage = r.stage || "LEARN";
        r.fromState = true;
        out.push(r);
      }
    };
    try { ADAPTER(ctx); } catch (e) {}
    return out;
  }
  function allRows() {
    var extra = adapterRows();
    if (!extra.length) return rows;
    /* ไม่ให้ซ้ำกับแถวที่เก็บจากการคลิก/พิมพ์ */
    var seen = {};
    rows.forEach(function (r) { seen[squash(r.q).slice(0, 40)] = 1; });
    var merged = rows.slice();
    extra.forEach(function (r) {
      var k = squash(r.q).slice(0, 40);
      if (!seen[k]) { seen[k] = 1; merged.push(r); }
    });
    return merged;
  }

  /* ---------- the running transcript ---------- */
  /* rows: {stage, kind:'choice'|'text', q, answer, correctText, verdict, explain, key, ts} */
  var rows = [];
  var rowByKey = {};

  function upsert(row) {
    if (rowByKey[row.key]) {
      var old = rowByKey[row.key];
      for (var k in row) if (row[k] !== undefined && row[k] !== "") old[k] = row[k];
      old.ts = row.ts;
    } else {
      rowByKey[row.key] = row;
      rows.push(row);
    }
  }

  /* ปุ่มนำทาง/ปุ่มระบบ - ไม่ใช่คำตอบ (ตรวจแบบ "มีคำนี้อยู่" กับข้อความสั้น ๆ
     เพื่อให้ครอบคลุมคำอย่าง "ข้อถัดไป" หรือ "▶ ถัดไป" ด้วย) */
  var NAV_WORDS = /(ถัดไป|ต่อไป|ไปขั้นตอน|ขั้นตอนถัดไป|ไปต่อ|ย้อนกลับ|ก่อนหน้า|เริ่ม|บันทึก|ส่งผล|ส่งคำตอบ|ตรวจคำตอบ|ตรวจสอบ|รีเซ็ต|เคลียร์|ล้าง|ปิด|ตกลง|ยืนยัน|ดาวน์โหลด|พิมพ์|ทำอีกครั้ง|กลับสู่หน้าหลัก|กลับไป|เข้าสู่ระบบ|ดูเฉลย|ดูผล|สรุปผล|รายงานผล|แนวคำตอบ|รัน|run|reset|next|back|start|close|submit|ย้อนดูประวัติ|ออกจากโหมด)/i;
  function isNav(t) {
    if (t.length <= 44 && NAV_WORDS.test(t)) return true;
    /* ปุ่มนำทางมักลงท้ายด้วยลูกศร เช่น "ไปขั้นตอน REFLECT →" */
    if (t.length <= 44 && /[→➔»▶›]\s*$/.test(t)) return true;
    if (t.length <= 44 && /^[←◀‹]/.test(t)) return true;
    return false;
  }

  function nearestQuestionText(el) {
    var node = el, hops = 0;
    while (node && hops < 6) {
      node = node.parentElement; hops++;
      if (!node) break;
      var head = node.querySelector("h1,h2,h3,h4,h5,.q,.question,.prompt,.qtext,.stem,legend,strong,b");
      if (head) {
        var t = norm(head.textContent);
        if (t.length > 8 && t.length < 400) return t;
      }
    }
    return "";
  }

  function recordChoice(el) {
    var txt = norm(el.textContent);
    if (!txt || txt.length > 320) return;
    if (isNav(txt)) return;

    var stage = stageOf();
    if (!stage || stage === "REPORT") return;

    var hit = optionIndex[squash(txt)];
    var row;
    if (hit) {
      var it = hit.item;
      var cTxt = correctTextOf(it);
      var verdict = "";
      if (typeof it.correct === "number") verdict = (hit.optIdx === it.correct) ? "ถูก" : "ผิด";
      row = {
        key: "bank:" + it.bank + ":" + it.idx,
        bankKey: it.bank + ":" + it.idx,
        stage: it.stage || stage, kind: "choice",
        q: it.q || nearestQuestionText(el) || "(ไม่ระบุโจทย์)",
        answer: txt, correctText: cTxt, verdict: verdict,
        explain: it.explain || "", ts: Date.now()
      };
    } else {
      /* ไม่ตรงกับคลังข้อสอบ: รับเฉพาะการคลิกที่เป็น "ตัวเลือกคำตอบ" จริง ๆ
         เพื่อไม่ให้แถบความคืบหน้า/ชิป/ป้ายกำกับ กลายเป็นแถวขยะในตาราง */
      var tag = (el.tagName || "").toLowerCase();
      var cls = (typeof el.className === "string") ? el.className : "";
      var interactive = /^(button|label|li|a|option)$/.test(tag) ||
                        el.getAttribute("role") === "button" ||
                        /(opt|choice|ans|btn)/i.test(cls);
      if (!interactive) return;
      /* ตัวเลขโดด ๆ มักเป็นหมายเลขขั้นตอน/ชิปความคืบหน้า ยกเว้นมาตรวัด REFLECT */
      if (txt.length < 2 && stage !== "REFLECT") return;
      var q = nearestQuestionText(el);
      if (!q || q.length < 20) return;    /* ไม่ใช่ตัวเลือกคำตอบ - ข้าม */
      row = {
        key: "dom:" + stage + ":" + squash(q).slice(0, 60),
        stage: stage, kind: "choice", q: q,
        answer: txt, correctText: "", verdict: "", explain: "", ts: Date.now()
      };
    }
    upsert(row);
    captureFeedback(el, row);
  }

  /* เก็บข้อความเฉลย/ผลตรวจที่ตัวแบบทดสอบแสดงเองหลังเลือกคำตอบ */
  /* อ่านเฉพาะข้อความที่ผู้ใช้เห็นจริง ตัด <script>/<style> ออก */
  function textOf(node) {
    try {
      var c = node.cloneNode(true);
      var junk = c.querySelectorAll("script,style,noscript,canvas,svg");
      for (var i = 0; i < junk.length; i++) junk[i].remove();
      return c.textContent || "";
    } catch (e) { return ""; }
  }
  /* ข้อความที่หน้าตาเป็นซอร์สโค้ด ไม่ใช่คำอธิบายเชิงวิชาการ */
  function looksLikeCode(t) {
    if (!t) return false;
    return /(function\s*\(|=>|document\.|querySelector|getElementById|await |const |let |var |JSON\.|addEventListener|\{\s*\}|;\s*\})/.test(t);
  }
  function captureFeedback(el, row) {
    setTimeout(function () {
      try {
        var box = el.closest ? el.closest("div,li,section,form") : null;
        for (var hop = 0; box && hop < 4; hop++) {
          var t = norm(textOf(box));
          var m = t.match(/(ถูกต้อง|ไม่ถูกต้อง|ยังไม่ถูก|คำอธิบาย|เฉลย|แนวคำตอบ)[\s:：]*([^]{0,300})/);
          if (m) {
            if (!row.verdict && /^(ถูกต้อง)/.test(m[1])) row.verdict = "ถูก";
            if (!row.verdict && /^(ไม่ถูกต้อง|ยังไม่ถูก)/.test(m[1])) row.verdict = "ผิด";
            if (!row.explain && !looksLikeCode(m[0])) row.explain = clip(m[0], 320);
            return;
          }
          box = box.parentElement;
        }
      } catch (e) {}
    }, 260);
  }

  function labelForField(el) {
    /* หาคำถามที่ใกล้ช่องกรอกที่สุดก่อน แล้วค่อยไล่ออกไปกว้างขึ้น */
    if (el.id) {
      var lab = document.querySelector('label[for="' + el.id + '"]');
      if (lab) { var t = norm(lab.textContent); if (t) return t; }
    }
    var aria = el.getAttribute && (el.getAttribute("aria-label") || el.getAttribute("title"));
    if (aria && norm(aria)) return norm(aria);
    var wrapLab = el.closest && el.closest("label");
    if (wrapLab) {
      var wt = norm(wrapLab.textContent);
      if (wt.length > 3) return clip(wt, 220);
    }
    var prev = el.previousElementSibling;
    for (var i = 0; prev && i < 3; i++) {
      var pt = norm(prev.textContent);
      if (pt.length > 6) return clip(pt, 220);
      prev = prev.previousElementSibling;
    }
    var par = el.parentElement;
    if (par) {
      var clone = par.cloneNode(true);
      var kill = clone.querySelectorAll("input,textarea,select,button");
      for (var k = 0; k < kill.length; k++) kill[k].remove();
      var ptxt = norm(clone.textContent);
      if (ptxt.length > 6) return clip(ptxt, 220);
    }
    var ph = el.getAttribute && el.getAttribute("placeholder");
    var near = nearestQuestionText(el);
    return near || (ph ? norm(ph) : "") || "คำตอบเขียนบรรยาย";
  }

  var GATE_IDS = { inName: 1, inputName: 1, nameInput: 1, gateName: 1, "inp-name": 1, inpName: 1 };
  function recordText(el) {
    if (!el || GATE_IDS[el.id]) return;
    var val = norm(el.value);
    if (!val) return;
    var stage = stageOf();
    if (!stage || stage === "REPORT") return;
    var key = "txt:" + (el.id || el.name || labelForField(el)).slice(0, 60);
    upsert({
      key: key, stage: stage, kind: "text",
      q: labelForField(el), answer: el.value, correctText: "",
      verdict: "", explain: "", ts: Date.now()
    });
  }

  document.addEventListener("click", function (ev) {
    try {
      var el = ev.target;
      if (!el || !el.closest) return;
      if (el.closest("#pisaReviewPanel,#pisaHistoryOverlay")) return;
      var clickable = el.closest("button,label,li,a,[role='button'],[class*='opt'],[class*='choice'],[class*='ans'],[class*='card']") || el;
      recordChoice(clickable);
    } catch (e) {}
  }, true);

  document.addEventListener("change", function (ev) {
    try {
      var el = ev.target;
      if (!el) return;
      if (el.closest && el.closest("#pisaReviewPanel,#pisaHistoryOverlay")) return;
      var tag = (el.tagName || "").toLowerCase();
      if (tag === "textarea" || (tag === "input" && /^(text|number|range)$/.test(el.type || "text"))) recordText(el);
      if (tag === "select" && el.id !== "inGrade" && el.getAttribute("data-pisa-grade") !== "1") {
        var opt = el.options[el.selectedIndex];
        if (opt) recordChoice(opt);
      }
    } catch (e) {}
  }, true);
  document.addEventListener("blur", function (ev) {
    try {
      var el = ev.target, tag = (el && el.tagName || "").toLowerCase();
      /* เฉพาะช่องพิมพ์ข้อความเท่านั้น - ปุ่มตัวเลือก radio/checkbox ถูกเก็บจากการคลิกอยู่แล้ว */
      if (tag === "textarea" || (tag === "input" && /^(text|search|email)$/.test(el.type || "text"))) recordText(el);
    } catch (e) {}
  }, true);

  /* ---------- attempts storage ---------- */
  function readAttempts() {
    try { return JSON.parse(localStorage.getItem(ATTEMPTS_KEY) || "{}"); } catch (e) { return {}; }
  }
  function saveAttempt(payload, scores) {
    try {
      var all = readAttempts();
      var lk = learnerKey();
      if (!all[lk]) all[lk] = {};
      if (!all[lk][SCENARIO_ID]) all[lk][SCENARIO_ID] = [];
      all[lk][SCENARIO_ID].push({
        title: SCENARIO_TITLE, name: LNAME, grade: LGRADE,
        finishedAt: new Date().toISOString(),
        scores: scores || {},
        rows: allRows().map(function (r) {
          return { stage: r.stage, kind: r.kind, bankKey: r.bankKey || "", score: (r.score == null ? null : r.score), q: clip(r.q, 300),
                   answer: clipML(r.answer, 1600), correctText: clipML(r.correctText, 600),
                   verdict: r.verdict, explain: clip(r.explain, 600) };
        })
      });
      while (all[lk][SCENARIO_ID].length > MAX_ATTEMPTS_PER_SCENARIO) all[lk][SCENARIO_ID].shift();
      localStorage.setItem(ATTEMPTS_KEY, JSON.stringify(all));
    } catch (e) {}
  }
  function attemptsForLearner() {
    var all = readAttempts();
    return (all[learnerKey()] && all[learnerKey()][SCENARIO_ID]) || [];
  }

  /* ---------- scores out of the payload the app posts ---------- */
  function num(v) { return (typeof v === "number" && isFinite(v)) ? Math.round(v) : null; }
  function pctFromText(t) {
    if (typeof t !== "string") return null;
    var m = t.match(/(?:รวม|เฉลี่ย)\s*([\d.]+)\s*%/) || t.match(/([\d.]+)\s*%/);
    return m ? Math.round(parseFloat(m[1])) : null;
  }
  function fromTotal(p, label) {
    if (typeof p.totalReport !== "string") return null;
    var m = p.totalReport.match(new RegExp(label + "\\s*([\\d.]+)"));
    return m ? Math.round(parseFloat(m[1])) : null;
  }
  function sect(p, keys, textKey, label) {
    for (var i = 0; i < keys.length; i++) { var v = num(p[keys[i]]); if (v !== null) return v; }
    var ft = fromTotal(p, label); if (ft !== null) return ft;
    return pctFromText(p[textKey]);
  }
  function scoresOf(p) {
    return {
      show: sect(p, ["show", "show_score"], "showReport", "SHOW"),
      learn: sect(p, ["learn", "learn_score"], "learnReport", "LEARN"),
      apply: sect(p, ["apply", "apply_score"], "applyReport", "APPLY"),
      reflect: sect(p, ["reflect", "reflect_score"], "reflectReport", "REFLECT"),
      overall: (function () {
        var v = num(p.overall); if (v !== null) return v;
        v = num(p.overall_score); if (v !== null) return v;
        var t = [p.overallReport, p.totalReport, p.qualityReport].filter(Boolean).join(" ");
        var m = t.match(/([\d.]+)\s*%/) || t.match(/([\d.]+)\s*\/\s*100/);
        return m ? Math.round(parseFloat(m[1])) : null;
      })(),
      levelName: p.levelName || p.levelLabel || p.quality_label || p.qualityLevel || p.qualityReport || ""
    };
  }

  function injectCSS() {

    document.head.appendChild(st);

  /* ---------- table rendering ---------- */
  var STAGE_ORDER = ["SHOW", "LEARN", "APPLY", "REFLECT"];
  var STAGE_TH = {
    SHOW: "SHOW · แสดงสิ่งที่รู้", LEARN: "LEARN · เรียนรู้",
    APPLY: "APPLY · ประยุกต์ใช้", REFLECT: "REFLECT · ประเมินตนเอง"
  };

  function verdictHTML(r) {
    var v = r.verdict;
    if (v === "ถูก") return '<span class="pr-v ok">✓ ถูก</span>';
    if (v === "ผิด") return '<span class="pr-v no">✗ ผิด</span>';
    if (r.score != null) {
      var w = Math.max(0, Math.min(100, r.score));
      return '<div><span class="pr-v ' + (w >= 80 ? "ok" : (w >= 50 ? "na" : "no")) + '">ได้ ' + w + '%</span>' +
             '<div class="pr-bar"><i style="width:' + w + '%"></i></div></div>';
    }
    return '<span class="pr-v na">บันทึกแล้ว</span>';
  }

  function labelFor(r) {
    /* ถ้าข้อความโจทย์ที่จับได้เป็นเพียงหัวข้อสั้น ๆ ให้เติมเลขข้อจากคู่มือเฉลยกำกับไว้ */
    var q = r.q || "";
    if (/^(ข้อ|กิจกรรม|ภาระงาน|ภารกิจ|คำถาม)/.test(q)) return q;   /* มีเลขข้อ/ชื่อภาระงานอยู่แล้ว */
    if (q.length < 46 && !/[?？]$/.test(q)) {
      var d = docItemFor(r);
      if (d && d.n) return "ข้อ " + d.n + " · " + q;
    }
    return q;
  }
  function tableFor(stage, list, scores, idPrefix) {
    var sc = scores && scores[stage.toLowerCase()];
    var head = '<h4>' + esc(STAGE_TH[stage] || stage) +
      (sc != null ? ' <span class="pr-chip">คะแนนขั้นตอนนี้ ' + sc + '%</span>' : '') +
      ' <span class="pr-chip">' + list.length + ' รายการ</span></h4>';
    if (!list.length) {
      if (sc != null) {
        var noKey0 = (stage === "REFLECT");
        return head +
          '<table><thead><tr><th class="pr-no">ข้อ</th><th>โจทย์ / ภาระงาน</th>' +
          '<th>คำตอบของผู้เข้าสอบ</th><th>ผลการตรวจ</th>' +
          (noKey0 ? '' : '<th>แนวคำตอบ / เฉลย</th>') + '</tr></thead><tbody>' +
          '<tr><td class="pr-no">1</td>' +
          '<td>' + (noKey0 ? 'แบบประเมินตนเองของขั้นตอนนี้' :
                   'ภาระงานเชิงปฏิบัติของขั้นตอนนี้ (ต่อวงจร / เขียนบล็อกคำสั่ง / ปรับพารามิเตอร์ / ผังงาน)') + '</td>' +
          '<td class="pr-ans">' + (noKey0 ? 'ตอบแบบประเมินตนเองแล้ว' : 'ทำภาระงานในระบบจำลอง') + '</td>' +
          '<td><span class="pr-v na">ได้ ' + sc + '%</span></td>' +
          (noKey0 ? '' : '<td>' + (function () {
            var dt = stageDocText(stage);
            if (!dt) return '<span style="color:#9aa3b5;">ระบบให้คะแนนจากผลการปฏิบัติในระบบจำลอง</span>';
            var kid = idPrefix + "-stage-" + stage;
            return '<button type="button" class="pr-toggle" data-key="' + kid + '">ดูเกณฑ์การให้คะแนน</button>' +
                   '<div class="pr-key" id="' + kid + '">' + esc(dt) + '</div>';
          })() + '</td>') + '</tr>' +
          '</tbody></table>';
      }
      return head + '<div class="pr-empty">ไม่มีข้อมูลการตอบที่บันทึกไว้ในขั้นตอนนี้</div>';
    }
    /* REFLECT คือการประเมินตนเอง ไม่มีเฉลย จึงไม่ต้องมีคอลัมน์แนวคำตอบ */
    var noKey = (stage === "REFLECT");
    var html = head + '<table><thead><tr>' +
      '<th class="pr-no">ข้อ</th><th>โจทย์ / ภาระงาน</th><th>คำตอบของผู้เข้าสอบ</th>' +
      '<th>ผลการตรวจ</th>' + (noKey ? '' : '<th>แนวคำตอบ / เฉลย</th>') + '</tr></thead><tbody>';
    for (var i = 0; i < list.length; i++) {
      var r = list[i];
      var keyId = idPrefix + "-" + stage + "-" + i;
      /* ขั้น REFLECT เป็นการประเมินตนเอง ไม่มีคำตอบถูก-ผิด จึงแสดงเฉพาะคำตอบของผู้เข้าสอบ */
      var keyText = (stage === "REFLECT") ? "" : docBlockFor(r);
      if (!keyText && stage !== "REFLECT") {
        if (r.correctText) keyText += "เฉลย:\n" + clipML(r.correctText, 600);
        if (r.explain && !looksLikeCode(r.explain)) keyText += (keyText ? "\n" : "") + r.explain;
      }
      var keyCell = keyText
        ? '<button type="button" class="pr-toggle" data-key="' + keyId + '">ดูแนวคำตอบ</button>' +
          '<div class="pr-key" id="' + keyId + '">' + esc(keyText) + '</div>'
        : '<span style="color:#9aa3b5;">—</span>';
      html += '<tr>' +
        '<td class="pr-no">' + (i + 1) + '</td>' +
        '<td>' + esc(clip(labelFor(r), 260)) + '</td>' +
        '<td class="pr-ans ' + (/\n/.test(r.answer || "") || r.kind === "text" ? "pr-txt" : "") + '">' +
          esc(clipML(r.answer, 1600)) + '</td>' +
        '<td>' + verdictHTML(r) + '</td>' +
        (noKey ? '' : '<td>' + keyCell + '</td>') +
        '</tr>';
    }
    return html + '</tbody></table>';
  }

  function groupRows(list) {
    var g = { SHOW: [], LEARN: [], APPLY: [], REFLECT: [] };
    for (var i = 0; i < list.length; i++) {
      var s = list[i].stage;
      if (!g[s]) g[s] = [];
      g[s].push(list[i]);
    }
    return g;
  }

  function detailHTML(list, scores, idPrefix) {
    var g = groupRows(list), out = "";
    for (var i = 0; i < STAGE_ORDER.length; i++) {
      var st = STAGE_ORDER[i];
      out += '<div class="pr-stage">' + tableFor(st, g[st] || [], scores, idPrefix) + '</div>';
    }
    var extra = Object.keys(g).filter(function (k) { return STAGE_ORDER.indexOf(k) === -1; });
    for (var j = 0; j < extra.length; j++) {
      out += '<div class="pr-stage">' + tableFor(extra[j], g[extra[j]], scores, idPrefix) + '</div>';
    }
    return out;
  }

  function wireToggles(root) {
    var btns = root.querySelectorAll(".pr-toggle");
    for (var i = 0; i < btns.length; i++) {
      btns[i].addEventListener("click", function (ev) {
        var box = document.getElementById(ev.currentTarget.getAttribute("data-key"));
        if (!box) return;
        var open = box.classList.contains("pr-open");
        box.classList.toggle("pr-open", !open);
        ev.currentTarget.textContent = open ? "ดูแนวคำตอบ" : "ซ่อนแนวคำตอบ";
      });
    }
  }

  /* ---------- history mode (read-only + watermark) ---------- */
  function watermark(text) {
    var wm = document.createElement("div");
    wm.id = "pisaWatermark";
    var html = "";
    for (var y = -1; y < 14; y++) {
      for (var x = -1; x < 4; x++) {
        html += '<div style="top:' + (y * 120 + 30) + 'px;left:' + (x * 420 - 60) + 'px;">' + esc(text) + '</div>';
      }
    }
    wm.innerHTML = html;
    return wm;
  }

  function closeHistory() {
    var o = document.getElementById("pisaHistoryOverlay");
    var w = document.getElementById("pisaWatermark");
    if (o) o.remove();
    if (w) w.remove();
    document.body.style.overflow = "";
  }

  function openHistory() {
    closeHistory();
    injectCSS();
    var attempts = attemptsForLearner().slice().reverse();
    var ov = document.createElement("div");
    ov.id = "pisaHistoryOverlay";

    var listHTML = "";
    if (!attempts.length) {
      listHTML = '<div class="ph-item"><div><b>ยังไม่มีประวัติการทำแบบทดสอบของสถานการณ์นี้</b>' +
        '<div class="ph-meta">ประวัติจะถูกบันทึกอัตโนมัติทุกครั้งที่ทำแบบทดสอบจนจบและส่งผลสำเร็จ</div></div></div>';
    } else {
      for (var i = 0; i < attempts.length; i++) {
        var a = attempts[i];
        var when = "";
        try { when = new Date(a.finishedAt).toLocaleString("th-TH"); } catch (e) { when = a.finishedAt; }
        var ov2 = (a.scores && a.scores.overall != null) ? a.scores.overall + "%" : "—";
        listHTML += '<div class="ph-item"><div><b>ครั้งที่ ' + (attempts.length - i) + ' · ' + esc(when) + '</b>' +
          '<div class="ph-meta">คะแนนรวม ' + esc(ov2) + (a.scores && a.scores.levelName ? ' · ' + esc(a.scores.levelName) : '') +
          ' · บันทึกคำตอบ ' + (a.rows ? a.rows.length : 0) + ' รายการ</div></div>' +
          '<button type="button" class="ph-open" data-idx="' + i + '">เปิดดูคำตอบ</button></div>';
      }
    }

    ov.innerHTML =
      '<div class="ph-inner">' +
        '<div class="ph-bar">' +
          '<div><h3>📜 โหมดย้อนดูประวัติการทำแบบทดสอบ</h3>' +
          '<div class="ph-note">ดูได้อย่างเดียว — แก้ไขหรือเปลี่ยนคำตอบไม่ได้ · ' + esc(SCENARIO_TITLE) + ' · ' + esc(LNAME || "ผู้เข้าสอบ") + '</div></div>' +
          '<button type="button" class="ph-exit" id="pisaHistExit">ออกจากโหมดย้อนดู ✕</button>' +
        '</div>' +
        '<div class="ph-list" id="pisaHistList">' + listHTML + '</div>' +
        '<div id="pisaHistDetail"></div>' +
      '</div>';

    document.body.appendChild(ov);
    document.body.appendChild(watermark("ย้อนดูประวัติการทำแบบทดสอบ · อ่านอย่างเดียว"));
    document.body.style.overflow = "hidden";

    document.getElementById("pisaHistExit").addEventListener("click", closeHistory);

    var openers = ov.querySelectorAll(".ph-open");
    for (var k = 0; k < openers.length; k++) {
      openers[k].addEventListener("click", function (ev) {
        var idx = parseInt(ev.currentTarget.getAttribute("data-idx"), 10);
        var a = attempts[idx];
        var det = document.getElementById("pisaHistDetail");
        var when = "";
        try { when = new Date(a.finishedAt).toLocaleString("th-TH"); } catch (e) {}
        det.innerHTML = '<div class="ph-body ph-readonly" id="pisaHistBody">' +
          '<div id="pisaReviewPanel" style="margin:0;max-width:none;"><div class="pr-card" style="border:none;box-shadow:none;">' +
          '<div class="pr-head"><div><h3>คำตอบของครั้งที่ ' + (attempts.length - idx) + '</h3>' +
          '<div class="pr-sub">' + esc(when) + ' · คะแนนรวม ' +
          esc(a.scores && a.scores.overall != null ? a.scores.overall + "%" : "—") + '</div></div></div>' +
          detailHTML(a.rows || [], a.scores || {}, "hist" + idx) +
          '</div></div></div>';
        /* ปุ่มดูแนวคำตอบต้องกดได้ แม้เนื้อหาอื่นจะอ่านอย่างเดียว */
        var body = document.getElementById("pisaHistBody");
        var tgs = body.querySelectorAll(".pr-toggle");
        for (var t = 0; t < tgs.length; t++) tgs[t].style.pointerEvents = "auto";
        wireToggles(body);
        det.scrollIntoView({ behavior: "smooth", block: "start" });
      });
    }
  }

  /* ---------- หน้าที่ 1: แถบบนหน้าแดชบอร์ดสรุปผล (คงหน้าเดิมไว้ทุกอย่าง) ---------- */
  function isVisible(el) {
    return !!(el && (el.offsetWidth || el.offsetHeight || el.getClientRects().length));
  }
  function anchorEl() {
    /* ต้องเลือกกล่องที่ "มองเห็นอยู่จริง" เพราะบางไฟล์ซ่อนกล่องของหน้าแรก
       ไว้ตอนเข้าสู่หน้าทำข้อสอบ/หน้ารายงานผล */
    var sel = ["#app-main", "#app", "#screen", "main", ".wrap", ".container"];
    for (var i = 0; i < sel.length; i++) {
      var list = document.querySelectorAll(sel[i]);
      for (var j = 0; j < list.length; j++) {
        if (isVisible(list[j])) return list[j];
      }
    }
    return document.body;
  }

  var lastScores = {};

  function renderBar(scores) {
    injectCSS();
    lastScores = scores || lastScores || {};
    var old = document.getElementById("pisaReportBar");
    if (old) old.remove();

    var n = attemptsForLearner().length;
    var bar = document.createElement("div");
    bar.id = "pisaReportBar";
    bar.innerHTML =
      '<div class="rb-card">' +
        '<div><h3>📋 รายละเอียดการทำแบบทดสอบรายข้อ</h3>' +
        '<div class="rb-sub">ดูว่าทำข้อใดบ้าง ตอบอะไรไว้ ได้ผลอย่างไร พร้อมแนวคำตอบและเกณฑ์การให้คะแนนตามคู่มือเฉลย</div></div>' +
        '<div class="rb-actions">' +
          '<button type="button" class="rb-btn" id="pisaGoDetail">เปิดตารางรายละเอียดรายข้อ →</button>' +
          '<button type="button" class="rb-btn ghost" id="pisaOpenHist">📜 ย้อนดูประวัติ (' + n + ')</button>' +
        '</div>' +
      '</div>';
    anchorEl().appendChild(bar);
    document.getElementById("pisaGoDetail").addEventListener("click", function () { openDetail(); });
    document.getElementById("pisaOpenHist").addEventListener("click", openHistory);
  }

  /* ---------- หน้าที่ 2: ตารางรายละเอียดการทำแบบทดสอบรายข้อ ---------- */
  function closeDetail() {
    var o = document.getElementById("pisaDetailOverlay");
    if (o) o.remove();
    document.body.style.overflow = "";
  }

  function openDetail() {
    injectCSS();
    closeDetail();
    var ov = document.createElement("div");
    ov.id = "pisaDetailOverlay";
    ov.innerHTML =
      '<div class="pd-inner">' +
        '<div class="pd-bar">' +
          '<div><h3>📋 ตารางรายละเอียดการทำแบบทดสอบรายข้อ</h3>' +
          '<div class="pd-sub">' + esc(SCENARIO_TITLE) + ' · ' + esc(LNAME || "ผู้เข้าสอบ") +
          (LGRADE ? " · " + esc(LGRADE) : "") +
          ' · คะแนนรวม ' + esc(lastScores.overall != null ? lastScores.overall + "%" : "—") + '</div></div>' +
          '<div style="display:flex;gap:8px;flex-wrap:wrap;">' +
            '<button type="button" class="pd-btn ghost" id="pisaDetailHist">📜 ย้อนดูประวัติ</button>' +
            '<button type="button" class="pd-btn" id="pisaBackDash">← กลับไปหน้าสรุปผล (แดชบอร์ด)</button>' +
          '</div>' +
        '</div>' +
        '<div class="pr-card" id="pisaReviewPanel" style="max-width:none;margin:0;padding:0;">' +
          detailHTML(allRows(), lastScores, "cur") +
          '<div class="pr-foot">บันทึกจากการทำจริงของผู้เข้าสอบในครั้งนี้ · ช่อง “แนวคำตอบ / เฉลย” ใช้ข้อความจาก “คู่มือเฉลยและเกณฑ์การให้คะแนน” ของหน่วยข้อสอบนี้</div>' +
        '</div>' +
      '</div>';
    document.body.appendChild(ov);
    document.body.style.overflow = "hidden";
    wireToggles(ov);
    document.getElementById("pisaBackDash").addEventListener("click", closeDetail);
    document.getElementById("pisaDetailHist").addEventListener("click", openHistory);
  }

  /* ---------- hook the app's result POST = the report moment ---------- */
  var origFetch = window.fetch;
  window.fetch = function (url, opts) {
    try {
      if (opts && opts.body && typeof opts.body === "string") {
        var p = JSON.parse(opts.body);
        if (p && (p.name || p.user) && p.grade) {
          buildBanks();
          var sc = scoresOf(p);
          saveAttempt(p, sc);
          setTimeout(function () { try { renderBar(sc); } catch (e) {} }, 900);
          /* แบบทดสอบบางไฟล์วาดหน้ารายงานผลใหม่อีกครั้ง (เช่น หลังอัปเดตสถานะการบันทึก)
             ซึ่งจะลบตารางของเราไปด้วย - คอยตรวจและเติมกลับให้อัตโนมัติ */
          var guard = 0;
          var watchdog = setInterval(function () {
            guard++;
            try {
              var bar = document.getElementById("pisaReportBar");
              if (!document.getElementById("pisaHistoryOverlay") &&
                  !document.getElementById("pisaDetailOverlay") &&
                  (!bar || !isVisible(bar))) {
                renderBar(sc);
              }
            } catch (e) {}
            if (guard > 120) clearInterval(watchdog);   /* ~3 นาที */
          }, 1500);
        }
      }
    } catch (e) {}
    return origFetch.apply(this, arguments);
  };

  /* banks can only be read once the app's own scripts have run */
  try { buildBanks(); } catch (e) {}
  setTimeout(function () { try { buildBanks(); } catch (e) {} }, 1200);

  /* expose for manual use/debugging */
  window.pisaReview = {
    openHistory: openHistory, closeHistory: closeHistory,
    openDetail: openDetail, closeDetail: closeDetail,
    rows: function () { return rows; }, banks: function () { return bankItems; },
    docKeys: function () { return DOCKEY; },
    render: function (sc) { renderBar(sc || {}); }
  };
})();

</script>
</body>
</html>
