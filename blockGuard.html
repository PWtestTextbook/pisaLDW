<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BlockGuard — แบบฝึกฝนเทียบเคียง PISA 2025 LDW</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
  /* Robust multi-CDN loader for Chart.js. Some school/office networks block
     individual CDNs (e.g. cdnjs.cloudflare.com); this tries several sources
     in turn so a single blocked host doesn't take down every graph. */
  window.__chartJsLoad = new Promise(function (resolve) {
    var sources = [
      "https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js",
      "https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js",
      "https://unpkg.com/chart.js@4.4.1/dist/chart.umd.min.js"
    ];
    var i = 0;
    function tryNext() {
      if (typeof window.Chart !== "undefined") { resolve(true); return; }
      if (i >= sources.length) { resolve(false); return; }
      var url = sources[i++];
      var s = document.createElement("script");
      s.src = url;
      s.onload = function () { resolve(typeof window.Chart !== "undefined"); };
      s.onerror = tryNext;
      document.head.appendChild(s);
    }
    tryNext();
  });
</script>
<style>
  :root{
    --bg:#0A0F1C;
    --bg-grid: rgba(108,140,255,0.045);
    --panel:#111A2C;
    --panel-2:#0D1524;
    --border:#243051;
    --border-soft:#1A2440;
    --text:#E7ECF6;
    --muted:#8C9AC0;
    --dim:#5B6889;
    --verify:#2FD98A;
    --verify-bg:rgba(47,217,138,0.12);
    --alert:#F5A93B;
    --alert-bg:rgba(245,169,59,0.12);
    --mismatch:#E4576B;
    --mismatch-bg:rgba(228,87,107,0.12);
    --primary:#6C8CFF;
    --primary-bg:rgba(108,140,255,0.12);
    --radius:10px;
    --radius-sm:6px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(108,140,255,0.10), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 0%, rgba(47,217,138,0.06), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:'IBM Plex Sans Thai', sans-serif;
    line-height:1.6;
    min-height:100vh;
    padding:28px 16px 60px;
  }
  .mono{font-family:'IBM Plex Mono', monospace;}
  #app{max-width:840px; margin:0 auto;}

  /* ---------- Top identity bar ---------- */
  .idbar{
    display:none;
    justify-content:space-between;
    align-items:center;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:12px 18px;
    margin-bottom:18px;
    font-size:14px;
  }
  .idbar.show{display:flex;}
  .idbar .who{color:var(--text); font-weight:600;}
  .idbar .grade{color:var(--muted);}
  .idbar .badge{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:var(--primary);
    background:var(--primary-bg);
    border:1px solid rgba(108,140,255,0.35);
    padding:3px 9px;
    border-radius:100px;
  }

  /* ---------- Chain progress ---------- */
  .chainbar{
    display:none;
    align-items:center;
    justify-content:space-between;
    margin-bottom:26px;
    padding:0 4px;
  }
  .chainbar.show{display:flex;}
  .chain-node{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    flex:0 0 auto;
  }
  .chain-node .dot{
    width:38px; height:38px;
    border-radius:9px;
    display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono', monospace;
    font-size:12px; font-weight:700;
    background:var(--panel-2);
    border:1.5px solid var(--border);
    color:var(--dim);
    transition:all .25s ease;
  }
  .chain-node .lbl{font-size:11px; color:var(--dim); letter-spacing:.02em;}
  .chain-node.active .dot{border-color:var(--primary); color:var(--primary); background:var(--primary-bg); box-shadow:0 0 0 4px rgba(108,140,255,0.10);}
  .chain-node.active .lbl{color:var(--text); font-weight:600;}
  .chain-node.done .dot{border-color:var(--verify); color:var(--verify); background:var(--verify-bg);}
  .chain-node.done .lbl{color:var(--muted);}
  .chain-link{
    flex:1 1 auto;
    height:1px;
    background:linear-gradient(90deg, var(--border-soft), var(--border-soft));
    margin:0 6px;
    position:relative;
    top:-10px;
  }
  .chain-link .hx{
    position:absolute; top:-9px; left:50%; transform:translateX(-50%);
    font-family:'IBM Plex Mono', monospace;
    font-size:9px; color:var(--dim);
    background:var(--bg);
    padding:0 4px;
    white-space:nowrap;
  }

  /* ---------- Cards / panels ---------- */
  .card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:24px;
    margin-bottom:16px;
  }
  .card.tight{padding:18px;}
  .eyebrow-tag{
    display:inline-flex; align-items:center; gap:6px;
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px;
    color:var(--primary);
    background:var(--primary-bg);
    border:1px solid rgba(108,140,255,0.3);
    padding:4px 10px;
    border-radius:100px;
    margin-bottom:14px;
  }
  h1{font-size:26px; font-weight:700; margin:0 0 8px; letter-spacing:-0.01em;}
  h2{font-size:20px; font-weight:700; margin:0 0 10px; letter-spacing:-0.01em;}
  h3{font-size:16px; font-weight:600; margin:0 0 8px;}
  p{color:var(--muted); margin:0 0 12px;}
  .lead{color:var(--text); font-size:15px;}

  /* ---------- Intro screen ---------- */
  .hero-chain{
    display:flex; align-items:center; gap:4px; margin-bottom:22px; flex-wrap:wrap;
  }
  .hero-block{
    font-family:'IBM Plex Mono', monospace; font-size:12px;
    border:1px solid var(--border); border-radius:6px;
    padding:8px 12px; color:var(--muted); background:var(--panel-2);
  }
  .hero-block b{color:var(--text);}
  .hero-arrow{color:var(--dim); font-family:'IBM Plex Mono', monospace; font-size:12px;}

  label{display:block; font-size:13px; color:var(--muted); margin-bottom:6px; font-weight:500;}
  input[type=text], select{
    width:100%;
    background:var(--panel-2);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:var(--radius-sm);
    padding:11px 13px;
    font-size:14.5px;
    font-family:inherit;
    margin-bottom:16px;
  }
  input[type=text]:focus, select:focus{outline:2px solid var(--primary); outline-offset:1px; border-color:var(--primary);}

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    background:var(--primary);
    color:#0A0F1C;
    border:none;
    padding:12px 22px;
    font-size:14.5px;
    font-weight:700;
    border-radius:var(--radius-sm);
    cursor:pointer;
    font-family:inherit;
    transition:filter .15s ease, transform .1s ease;
  }
  .btn:hover{filter:brightness(1.08);}
  .btn:active{transform:scale(0.98);}
  .btn:disabled{opacity:.4; cursor:not-allowed;}
  .btn.secondary{background:transparent; color:var(--text); border:1px solid var(--border);}
  .btn.secondary:hover{border-color:var(--primary); color:var(--primary);}
  .btnrow{display:flex; justify-content:space-between; align-items:center; margin-top:20px; gap:10px;}
  .btnrow .spacer{flex:1;}

  /* ---------- Questions ---------- */
  .qcount{font-size:12.5px; color:var(--dim); font-family:'IBM Plex Mono', monospace; margin-bottom:10px;}
  .qtext{font-size:16px; color:var(--text); margin-bottom:16px; font-weight:600;}
  .choice{
    display:flex; align-items:flex-start; gap:11px;
    border:1px solid var(--border);
    border-radius:var(--radius-sm);
    padding:12px 14px;
    margin-bottom:9px;
    cursor:pointer;
    background:var(--panel-2);
    transition:border-color .12s ease, background .12s ease;
  }
  .choice:hover{border-color:var(--primary);}
  .choice.selected{border-color:var(--primary); background:var(--primary-bg);}
  .choice .radio{
    width:17px; height:17px; border-radius:50%;
    border:1.5px solid var(--dim); flex:0 0 auto; margin-top:2px;
    position:relative;
  }
  .choice.selected .radio{border-color:var(--primary);}
  .choice.selected .radio::after{
    content:''; position:absolute; inset:3px; border-radius:50%; background:var(--primary);
  }
  .choice .ctext{font-size:14.5px; color:var(--text);}

  /* ---------- Chart wrap ---------- */
  .chartwrap{
    background:var(--panel-2);
    border:1px solid var(--border-soft);
    border-radius:var(--radius-sm);
    padding:16px 12px 8px;
    margin:14px 0 18px;
    height:260px;
  }
  .lesson-box{
    background:var(--panel-2);
    border-left:2.5px solid var(--primary);
    border-radius:0 var(--radius-sm) var(--radius-sm) 0;
    padding:14px 16px;
    margin-bottom:16px;
    font-size:14px;
    color:var(--text);
  }

  /* ---------- Status pills ---------- */
  .pill{
    display:inline-flex; align-items:center; gap:5px;
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px; font-weight:600;
    padding:3px 9px; border-radius:100px;
  }
  .pill.ok{color:var(--verify); background:var(--verify-bg);}
  .pill.bad{color:var(--mismatch); background:var(--mismatch-bg);}
  .pill.warn{color:var(--alert); background:var(--alert-bg);}

  /* ---------- Apply controls ---------- */
  .slider-row{margin-bottom:16px;}
  .slider-row .sr-top{display:flex; justify-content:space-between; font-size:13px; margin-bottom:6px;}
  .slider-row .sr-top .sname{color:var(--text); font-weight:500;}
  .slider-row .sr-top .sval{color:var(--primary); font-family:'IBM Plex Mono', monospace; font-weight:600;}
  input[type=range]{
    width:100%; -webkit-appearance:none; appearance:none;
    height:5px; border-radius:4px; background:var(--border);
    outline:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; appearance:none;
    width:17px; height:17px; border-radius:50%;
    background:var(--primary); cursor:pointer; border:2px solid #0A0F1C;
  }
  input[type=range]::-moz-range-thumb{
    width:17px; height:17px; border-radius:50%;
    background:var(--primary); cursor:pointer; border:2px solid #0A0F1C;
  }
  .accuracy-banner{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--panel-2); border:1px solid var(--border-soft);
    border-radius:var(--radius-sm); padding:12px 16px; margin:14px 0;
  }
  .accuracy-banner .acc-label{font-size:13px; color:var(--muted);}
  .accuracy-banner .acc-value{font-family:'IBM Plex Mono', monospace; font-size:20px; font-weight:700;}
  .acc-value.full{color:var(--verify);}
  .acc-value.partial{color:var(--alert);}
  .acc-value.low{color:var(--mismatch);}

  table.blocktbl{width:100%; border-collapse:collapse; font-size:13px; margin-bottom:14px;}
  table.blocktbl th, table.blocktbl td{
    border:1px solid var(--border-soft); padding:8px 10px; text-align:left;
  }
  table.blocktbl th{color:var(--muted); font-weight:600; background:var(--panel-2); font-size:12px;}
  table.blocktbl td{color:var(--text); font-family:'IBM Plex Mono', monospace; font-size:12.5px;}
  .num-input{
    width:90px; background:var(--panel); border:1px solid var(--primary);
    color:var(--primary); font-family:'IBM Plex Mono', monospace; font-weight:700;
    border-radius:6px; padding:6px 8px; font-size:13px;
  }

  textarea{
    width:100%; background:var(--panel-2); border:1px solid var(--border);
    color:var(--text); border-radius:var(--radius-sm); padding:12px 13px;
    font-family:inherit; font-size:14px; min-height:88px; resize:vertical;
    margin-bottom:16px;
  }
  textarea:focus{outline:2px solid var(--primary); outline-offset:1px; border-color:var(--primary);}

  .likert-row{margin-bottom:20px;}
  .likert-q{font-size:14.5px; color:var(--text); margin-bottom:10px; font-weight:500;}
  .likert-opts{display:flex; gap:8px; flex-wrap:wrap;}
  .likert-opt{
    flex:1 1 100px; text-align:center; border:1px solid var(--border);
    border-radius:var(--radius-sm); padding:10px 6px; cursor:pointer;
    font-size:12.5px; color:var(--muted); background:var(--panel-2);
  }
  .likert-opt.selected{border-color:var(--primary); color:var(--primary); background:var(--primary-bg); font-weight:600;}

  /* ---------- Report ---------- */
  .score-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-bottom:18px;}
  .score-card{
    background:var(--panel-2); border:1px solid var(--border-soft);
    border-radius:var(--radius-sm); padding:16px;
  }
  .score-card .sc-name{font-size:12px; color:var(--muted); margin-bottom:6px; font-family:'IBM Plex Mono', monospace;}
  .score-card .sc-val{font-size:26px; font-weight:700; font-family:'IBM Plex Mono', monospace;}
  .level-banner{
    text-align:center; padding:26px 16px; border-radius:var(--radius);
    margin-bottom:18px; border:1px solid var(--border);
  }
  .level-banner .lv-num{font-size:44px; font-weight:700; font-family:'IBM Plex Mono', monospace; line-height:1;}
  .level-banner .lv-name{font-size:15px; margin-top:6px; color:var(--muted);}
  .hist-table{width:100%; border-collapse:collapse; font-size:12.5px; margin-top:10px;}
  .hist-table th, .hist-table td{border:1px solid var(--border-soft); padding:7px 8px; text-align:left;}
  .hist-table th{background:var(--panel-2); color:var(--muted); font-weight:600;}
  .hist-table td{color:var(--muted);}
  .save-status{font-size:12.5px; margin-top:10px; color:var(--dim); font-family:'IBM Plex Mono', monospace;}


  /* ---------- Drag-and-drop builder ---------- */
  .drag-stage{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:12px;}
  .drag-palette, .drag-script{
    background:var(--panel-2); border:1px dashed var(--border);
    border-radius:var(--radius-sm); padding:12px; min-height:120px;
  }
  .drag-col-label{font-size:12px; color:var(--muted); margin-bottom:10px; font-weight:600;}
  .drag-block{
    border-radius:6px; padding:9px 11px; margin-bottom:8px; cursor:grab;
    font-size:13px; line-height:1.45; color:#0A0F1C; font-weight:500;
    border:1px solid rgba(0,0,0,0.18); user-select:none;
    touch-action:none; -webkit-user-select:none;
  }
  .drag-block:active{cursor:grabbing;}
  .drag-ghost{
    position:fixed; z-index:9999; pointer-events:none; opacity:.9;
    box-shadow:0 8px 24px rgba(0,0,0,0.45); margin:0;
  }
  .drag-palette.over{border-color:var(--primary); background:var(--primary-bg);}
  .drag-block.dragging{opacity:.45;}
  .drag-block.in-slot{margin-bottom:0;}
  .shape-hat{background:#F5A93B; border-top-left-radius:16px; border-top-right-radius:16px;}
  .shape-ctrl{background:#F0A23C; background:#E8A33E;}
  .shape-cmd{background:#6C8CFF;}
  .shape-start, .shape-end{background:#2FD98A; border-radius:100px;}
  .shape-process{background:#6C8CFF;}
  .shape-decision{background:#F5A93B; border-radius:4px;
    clip-path:polygon(4% 50%, 12% 0%, 88% 0%, 96% 50%, 88% 100%, 12% 100%);
    padding:9px 26px; text-align:center;}
  .drag-slot{
    display:flex; align-items:center; gap:9px;
    border:1px dashed var(--border-soft); border-radius:6px;
    padding:7px 9px; background:rgba(255,255,255,0.015); min-height:44px;
  }
  .drag-slot.filled{border-style:solid; border-color:var(--border); background:transparent;}
  .drag-slot.over{border-color:var(--primary); background:var(--primary-bg);}
  .drag-slot .slot-num{
    font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--dim);
    flex:0 0 auto; width:16px; text-align:center;
  }
  .drag-slot .slot-inner{flex:1 1 auto; min-width:0;}
  .drag-slot .slot-hint{font-size:12px; color:var(--dim);}
  .drag-arrow{text-align:center; color:var(--dim); font-size:13px; line-height:1; margin:3px 0;}
  .drag-status{font-size:12.5px; color:var(--muted); margin-top:12px; font-family:'IBM Plex Mono', monospace;}
  .drag-empty-note{font-size:12px; color:var(--dim); line-height:1.5;}

  @media (max-width:640px){
    .drag-stage{grid-template-columns:1fr;}
  }

  @media (max-width:560px){
    .chain-node .lbl{display:none;}
    .score-grid{grid-template-columns:1fr;}
    .idbar{flex-direction:column; align-items:flex-start; gap:6px;}
  }
</style>
</head>
<body>
<div id="app">
  <div class="idbar" id="idbar">
    <div><span class="who" id="idbar-name"></span> · <span class="grade" id="idbar-grade"></span></div>
    <div class="badge mono" id="idbar-stage">SHOW</div>
  </div>
  <div class="chainbar" id="chainbar"></div>
  <div id="screen"></div>
</div>
<script>
/* =========================================================
   BlockGuard — PISA 2025 LDW practice test
   ========================================================= */
const WEBAPP_URL = "https://script.google.com/macros/s/AKfycby_qOyx8J8WZJyRuYGKmdy6sdMGg3gvo4cOIXbCex56Nok1W2zVID81M41o40rQAyW9/exec";

const GRADES = ["มัธยมศึกษาปีที่ 2","มัธยมศึกษาปีที่ 3","มัธยมศึกษาปีที่ 4","ปวช."];

/* ---------- SHOW: 5 items, 4 choices ---------- */
const SHOW_Q = [
  {
    q: "ระบบบล็อกเชนจำลองในสถานการณ์นี้ เก็บข้อมูลธุรกรรมอย่างไร",
    choices: [
      "เก็บเป็นบล็อกอิสระที่ไม่เกี่ยวข้องกัน",
      "เก็บเป็นไฟล์เดียวรวมทุกธุรกรรม",
      "เก็บเป็นบล็อกที่เชื่อมโยงต่อกันเป็นสายโซ่ตามลำดับ",
      "เก็บเฉพาะธุรกรรมล่าสุดเพียงบล็อกเดียว"
    ], correct: 2
  },
  {
    q: "Hash ในระบบจำลองนี้มีหน้าที่หลักอย่างไร",
    choices: [
      "เป็นค่าที่ใช้ยืนยันว่าเนื้อหาของบล็อกไม่ถูกเปลี่ยนแปลง",
      "เข้ารหัสข้อมูลเพื่อไม่ให้ผู้อื่นอ่านได้",
      "บอกจำนวนเงินในธุรกรรม",
      "กำหนดลำดับเวลาที่บล็อกถูกสร้าง"
    ], correct: 0
  },
  {
    q: "\"ข้อมูลไม่สอดคล้อง\" ตามนิยามที่กำหนด หมายถึงข้อใด",
    choices: [
      "Hash ของบล็อกก่อนหน้า ตรงกับ Previous Hash ของบล็อกปัจจุบัน",
      "Hash ของบล็อกก่อนหน้า ไม่ตรงกับ Previous Hash ของบล็อกปัจจุบัน",
      "Transaction Data ของสองบล็อกเหมือนกัน",
      "บล็อกปัจจุบันไม่มี Block ID"
    ], correct: 1
  },
  {
    q: "จากตาราง: B1 (Previous Hash —, Current Hash H100), B2 (Previous Hash H100, Current Hash H200), B3 (Previous Hash H999, Current Hash H300) — บล็อกใดคือ \"บล็อกที่ต้องตรวจสอบ\"",
    choices: ["B1","B2","ไม่มีบล็อกใดต้องตรวจสอบ","B3"], correct: 3
  },
  {
    q: "BlockBot ทำงานตามลำดับขั้นตอนใดจึงจะถูกต้อง",
    choices: [
      "อ่านข้อมูล Block → คำนวณ Hash → ตรวจ Previous Hash → เปรียบเทียบ Hash → ตรวจความถูกต้อง → รายงานผล",
      "คำนวณ Hash → อ่านข้อมูล Block → ตรวจ Previous Hash → เปรียบเทียบ Hash → ตรวจความถูกต้อง → รายงานผล",
      "อ่านข้อมูล Block → ตรวจความถูกต้อง → คำนวณ Hash → เปรียบเทียบ Hash → ตรวจ Previous Hash → รายงานผล",
      "รายงานผล → อ่านข้อมูล Block → คำนวณ Hash → ตรวจ Previous Hash → เปรียบเทียบ Hash → ตรวจความถูกต้อง"
    ], correct: 0
  }
];

  applyIdx:0,

    if(a.kind==="weights") return {w:[...a.defaultWeights]};

    if(a.kind==="chainRepair"){
      const vals={};
      a.blocks.forEach(b=>{ if(b.editable) vals[b.id]=b.prev; });
      return {vals};

    return {};
  }),
  applyAccuracy: Array(APPLY_ACTIVITIES.length).fill(0),
  reflectLikert: Array(LIKERT_ITEMS.length).fill(null),
  reflectOpen: Array(OPEN_ITEMS.length).fill(""),

  posted:false,
  chartInstances:[]
}; }

/* Restart the whole test. Name and grade are kept (and stay editable on the
   intro screen) so the same student can try again quickly. */
function restartTest(){
  const keepName = state.name, keepGrade = state.grade;
  destroyCharts();
  Object.assign(state, freshState(), {name:keepName, grade:keepGrade});
  go("intro");
}

const STAGES = ["show","learn","apply","reflect"];
const STAGE_LABELS = {show:"SHOW", learn:"LEARN", apply:"APPLY", reflect:"REFLECT"};
const HASH_HINTS = ["0xF3A2","0x9C10","0x77B4"];

function destroyCharts(){
  state.chartInstances.forEach(c=>{ try{ c.destroy(); }catch(e){} });
  state.chartInstances = [];
}

/* Draws into `canvasHolderDiv` using `drawFn(canvas)` (which must return a Chart
   instance). If Chart.js isn't available yet, shows a small retry notice instead
   of leaving a blank box or throwing and breaking the rest of the screen. */
function safeChart(canvasHolderDiv, drawFn){
  if(typeof Chart !== "undefined"){
    try{
      const canvas = document.createElement("canvas");
      canvasHolderDiv.innerHTML = "";
      canvasHolderDiv.appendChild(canvas);
      const chart = drawFn(canvas);
      state.chartInstances.push(chart);
      return chart;
    }catch(err){
      console.error("Chart render error:", err);
    }
  }
  canvasHolderDiv.innerHTML = "";
  const notice = el("div", null);
  notice.style.cssText = "display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;height:100%;color:#8C9AC0;font-size:13px;text-align:center;padding:0 12px;";
  notice.innerHTML = "ไม่สามารถโหลดกราฟได้ในขณะนี้ (เครือข่ายอาจปิดกั้นการโหลดไลบรารีกราฟ) คำถามและกิจกรรมอื่น ๆ ยังทำต่อได้ตามปกติ";
  const retryBtn = el("button","btn secondary","ลองโหลดกราฟอีกครั้ง");
  retryBtn.style.cssText = "padding:8px 14px;font-size:12.5px;";
  retryBtn.addEventListener("click", ()=>{ render(); });
  notice.appendChild(retryBtn);
  canvasHolderDiv.appendChild(notice);
  return null;
}

function el(tag, cls, html){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(html !== undefined) e.innerHTML = html;
  return e;
}

/* ---------- Chain progress + identity bar ---------- */
function renderChrome(){
  const idbar = document.getElementById("idbar");
  const chainbar = document.getElementById("chainbar");
  if(state.stage === "intro"){
    idbar.classList.remove("show");
    chainbar.classList.remove("show");
    return;
  }
  idbar.classList.add("show");
  document.getElementById("idbar-name").textContent = state.name;
  document.getElementById("idbar-grade").textContent = state.grade;
  document.getElementById("idbar-stage").textContent = state.stage === "report" ? "รายงานผล" : STAGE_LABELS[state.stage];

  chainbar.classList.add("show");
  chainbar.innerHTML = "";
  STAGES.forEach((s, i) => {
    const idx = STAGES.indexOf(state.stage);
    const node = el("div", "chain-node" + (state.stage===s ? " active" : "") + (state.stage!=="report" && idx>i ? " done" : "") + (state.stage==="report" ? " done" : ""));
    node.appendChild(el("div","dot","B"+(i+1)));
    node.appendChild(el("div","lbl",STAGE_LABELS[s]));
    chainbar.appendChild(node);
    if(i < STAGES.length-1){
      const link = el("div","chain-link");
      link.appendChild(el("span","hx",HASH_HINTS[i]));
      chainbar.appendChild(link);
    }
  });
}

function go(stage){
  state.stage = stage;
  window.scrollTo({top:0, behavior:"smooth"});
  render();
}

/* ---------- Drag-and-drop builder (Scratch-style blocks / flowchart) ---------- */
function renderDragBuilder(container, task, ti){
  const d = task.drag;
  const placed = state.learnDrag[ti];

  const card = el("div","card");
  card.innerHTML = `<h3>${d.title}</h3><p style="font-size:13.5px;">${d.prompt}</p>`;

  const stage = el("div","drag-stage");
  const palette = el("div","drag-palette");
  palette.appendChild(el("div","drag-col-label","กล่องบล็อกคำสั่ง"));
  const script = el("div","drag-script");
  script.appendChild(el("div","drag-col-label", d.mode==="flowchart" ? "ผังงานของคุณ" : "สคริปต์ของคุณ"));

  /* Pointer-based drag: works with mouse AND touch (HTML5 drag-and-drop has no
     touch support, so tablets would otherwise be stuck with tap-only). A short
     press without movement is treated as a tap. */
  let drag = null;

  function placeBlock(id, fromSlot, toSlot){
    if(fromSlot !== null && fromSlot !== undefined) placed[fromSlot] = null;
    if(toSlot !== null && toSlot !== undefined){
      const displaced = placed[toSlot];
      placed[toSlot] = id;
      if(displaced && displaced !== id){
        const empty = placed.indexOf(null);
        if(empty !== -1) placed[empty] = displaced;
      }
    }
    render();
  }

  function clearHighlights(){
    script.querySelectorAll(".drag-slot.over").forEach(e=>e.classList.remove("over"));
    palette.classList.remove("over");
  }

  function targetUnder(x, y){
    const el2 = document.elementFromPoint(x, y);
    if(!el2) return null;
    const slot = el2.closest(".drag-slot");
    if(slot && script.contains(slot)) return {type:"slot", el:slot, index:Number(slot.dataset.slotIndex)};
    if(el2.closest(".drag-palette")) return {type:"palette"};
    return null;
  }

  function onPointerMove(ev){
    if(!drag) return;
    const dx = ev.clientX - drag.startX, dy = ev.clientY - drag.startY;
    if(!drag.active && Math.hypot(dx, dy) < 6) return;
    if(!drag.active){
      drag.active = true;
      const r = drag.el.getBoundingClientRect();
      drag.ghost = drag.el.cloneNode(true);
      drag.ghost.classList.add("drag-ghost");
      drag.ghost.style.width = r.width + "px";
      drag.ghost.style.marginLeft = "0";
      document.body.appendChild(drag.ghost);
      drag.offX = drag.startX - r.left;
      drag.offY = drag.startY - r.top;
      drag.el.classList.add("dragging");
    }
    ev.preventDefault();
    drag.ghost.style.left = (ev.clientX - drag.offX) + "px";
    drag.ghost.style.top  = (ev.clientY - drag.offY) + "px";
    clearHighlights();
    const t = targetUnder(ev.clientX, ev.clientY);
    if(t && t.type === "slot") t.el.classList.add("over");
    else if(t && t.type === "palette") palette.classList.add("over");

    // auto-scroll when dragging near the top/bottom edge, so slots that are
    // off-screen (common on phones and tablets) can still be reached
    const edge = 70;
    if(ev.clientY < edge) window.scrollBy(0, -Math.ceil((edge - ev.clientY) / 4));
    else if(ev.clientY > window.innerHeight - edge) window.scrollBy(0, Math.ceil((ev.clientY - (window.innerHeight - edge)) / 4));
  }

  function onPointerUp(ev){
    if(!drag) return;
    const d = drag; drag = null;
    window.removeEventListener("pointermove", onPointerMove);
    window.removeEventListener("pointerup", onPointerUp);
    window.removeEventListener("pointercancel", onPointerUp);
    if(d.ghost) d.ghost.remove();
    d.el.classList.remove("dragging");
    clearHighlights();

    if(!d.active){
      // treated as a tap
      if(d.from === null){
        const empty = placed.indexOf(null);
        if(empty !== -1) placeBlock(d.id, null, empty);
      } else {
        placed[d.from] = null;
        render();
      }
      return;
    }
    const t = targetUnder(ev.clientX, ev.clientY);
    if(t && t.type === "slot") placeBlock(d.id, d.from, t.index);
    else if(t && t.type === "palette" && d.from !== null) placeBlock(d.id, d.from, null);
  }

  function blockEl(b, opts){
    const e = el("div","drag-block shape-"+b.shape+(opts && opts.inSlot ? " in-slot":""));
    e.style.marginLeft = (b.indent||0) * 18 + "px";
    e.innerHTML = `<span class="db-text">${b.text}</span>`;
    e.addEventListener("pointerdown", (ev)=>{
      if(ev.button !== undefined && ev.button !== 0) return;
      drag = {
        id: b.id,
        from: (opts && opts.inSlot) ? opts.slotIndex : null,
        el: e, startX: ev.clientX, startY: ev.clientY, active:false, ghost:null
      };
      window.addEventListener("pointermove", onPointerMove, {passive:false});
      window.addEventListener("pointerup", onPointerUp);
      window.addEventListener("pointercancel", onPointerUp);
    });
    return e;
  }

  // palette: blocks not yet placed  // palette: blocks not yet placed
  const unused = d.blocks.filter(b=> placed.indexOf(b.id) === -1);
  if(unused.length === 0){
    const empty = el("div","drag-empty-note","วางบล็อกครบทุกช่องแล้ว — แตะบล็อกในสคริปต์เพื่อนำกลับมาแก้ไขได้");
    palette.appendChild(empty);
  }
  unused.forEach(b=>{ palette.appendChild(blockEl(b, {inSlot:false})); });

  // script: numbered slots
  for(let i=0;i<d.slots;i++){
    const slot = el("div","drag-slot" + (placed[i] ? " filled":""));
    slot.dataset.slotIndex = String(i);
    slot.appendChild(el("span","slot-num", String(i+1)));
    const inner = el("div","slot-inner");
    if(placed[i]){
      const b = d.blocks.find(x=>x.id===placed[i]);
      inner.appendChild(blockEl(b, {inSlot:true, slotIndex:i}));
    } else {
      inner.appendChild(el("span","slot-hint", d.mode==="flowchart" ? "วางสัญลักษณ์ผังงานที่นี่" : "วางบล็อกคำสั่งที่นี่"));
    }
    slot.appendChild(inner);
    script.appendChild(slot);
    if(i < d.slots-1) script.appendChild(el("div","drag-arrow","↓"));
  }

  stage.appendChild(palette);
  stage.appendChild(script);
  card.appendChild(stage);

  const filled = placed.filter(v=>v!==null).length;
  const status = el("div","drag-status", `วางแล้ว ${filled} / ${d.slots} ช่อง`);
  card.appendChild(status);

  const resetBtn = el("button","btn secondary","ล้างและเริ่มใหม่");
  resetBtn.style.cssText = "margin-top:10px;padding:8px 14px;font-size:12.5px;";
  resetBtn.addEventListener("click", ()=>{
    for(let i=0;i<d.slots;i++) placed[i]=null;
    render();
  });
  card.appendChild(resetBtn);

  container.appendChild(card);
}

/* =========================================================
   APPLY — compute helpers
   ========================================================= */
function labelThai(l){
  return {low:"ต่ำ", med:"ปานกลาง", high:"สูง", normal:"ปกติ", tampered:"ผิดปกติ", pay:"จ่ายชดเชย", nopay:"ไม่จ่าย"}[l] || l;
}
function labelColor(l){
  return {low:"#2FD98A", med:"#F5A93B", high:"#E4576B", normal:"#2FD98A", tampered:"#E4576B", pay:"#2FD98A", nopay:"#8C9AC0"}[l] || "#6C8CFF";
}

function classifyThree(score, low, high){
  if(score < low) return "low";
  if(score <= high) return "med";
  return "high";
}
function classifyBinary(score, t){
  return score < t ? "tampered" : "normal";
}

function computeActivityResult(activity, params){
  if(activity.kind === "weights"){
    const sw = params.w.reduce((a,b)=>a+b,0);
    const results = activity.blocks.map(b=>{
      const score = sw===0 ? 0 : b.f.reduce((acc,fi,idx)=>acc+fi*params.w[idx],0)/sw;
      const computed = classifyThree(score, activity.thresholds.low, activity.thresholds.high);
      return {id:b.id, score, computed, truth:b.label, correct: computed===b.label};
    });
    return results;
  }
  if(activity.kind === "dualThreshold"){
    return activity.blocks.map(b=>{
      const computed = classifyThree(b.score, params.lo, params.hi);
      return {id:b.id, score:b.score, computed, truth:b.label, correct: computed===b.label};
    });
  }
  if(activity.kind === "singleThreshold"){
    return activity.blocks.map(b=>{
      const computed = classifyBinary(b.score, params.t);
      return {id:b.id, score:b.score, computed, truth:b.label, correct: computed===b.label};
    });
  }
  if(activity.kind === "ifThenPayout"){
    return activity.blocks.map(b=>{
      const computed = (b.delay >= params.d && b.agree >= params.a) ? "pay" : "nopay";
      return {id:b.id, score:b.delay, computed, truth:b.label, correct: computed===b.label};
    });
  }
  if(activity.kind === "chainRepair"){
    return activity.blocks.map((b,idx)=>{
      if(b.prev===null || idx===0){
        return {id:b.id, correct:true, status:"ถูกต้อง (บล็อกเริ่มต้น)"};
      }
      const effectivePrev = b.editable ? Number(params.vals[b.id]) : b.prev;
      const priorCur = activity.blocks[idx-1].cur;
      const match = effectivePrev === priorCur;
      return {id:b.id, correct:match, status: match?"ถูกต้อง":"ไม่ถูกต้อง", effectivePrev, priorCur};
    });
  }
  return [];
}

function accuracyOf(results){
  if(results.length===0) return 0;
  const correct = results.filter(r=>r.correct).length;
  return Math.round((correct/results.length)*100);
}

function accuracyClass(pct){
  if(pct===100) return "full";
  if(pct>=70) return "partial";
  return "low";
}

function renderAccuracyBanner(parent, pct){
  const banner = el("div","accuracy-banner");
  banner.innerHTML = `<div class="acc-label">ความแม่นยำเทียบกับผลจริง</div><div class="acc-value ${accuracyClass(pct)}">${pct}%</div>`;
  parent.appendChild(banner);
  return banner;
}

function makeResultChart(chartDiv, results, isThree){
  return safeChart(chartDiv, (canvas)=> new Chart(canvas.getContext("2d"), {
    type:"bar",
    data:{
      labels: results.map(r=>r.id),
      datasets:[{
        label:"ผลจำแนกปัจจุบัน",
        data: results.map(r=> isThree ? (r.computed==="low"?1:r.computed==="med"?2:3) : (r.computed==="normal"?1:2) ),
        backgroundColor: results.map(r=> r.correct ? "#2FD98A" : "#E4576B")
      }]
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{display:false},
        tooltip:{ callbacks:{ label:(ctx)=>{
          const r = results[ctx.dataIndex];
          return "จำแนกเป็น: "+labelThai(r.computed)+" (จริง: "+labelThai(r.truth)+")";
        }}}
      },
      scales:{
        x:{ ticks:{color:"#8C9AC0", font:{size:10}}, grid:{display:false} },
        y:{ display:false }
      }
    }
  }));
}

/* =========================================================
   Scoring
   ========================================================= */
function computeShowScore(){
  const correct = SHOW_Q.filter((q,i)=>state.showAns[i]===q.correct).length;
  return {correct, total:SHOW_Q.length, pct: Math.round(correct/SHOW_Q.length*100)};
}
function dragIsCorrect(ti){
  const t = LEARN_TASKS[ti];
  if(!t.drag) return false;
  const placed = state.learnDrag[ti];
  return t.drag.answer.every((id,i)=> placed[i]===id);
}
function computeLearnScore(){
  let correct=0, total=0;
  LEARN_TASKS.forEach((t,ti)=>{
    if(t.drag){
      total++;
      if(dragIsCorrect(ti)) correct++;
    }
    t.questions.forEach((q,qi)=>{
      total++;
      if(state.learnAns[ti][qi]===q.correct) correct++;
    });
  });
  return {correct, total, pct: Math.round(correct/total*100)};
}
function computeApplyScore(){
  const avg = state.applyAccuracy.reduce((a,b)=>a+b,0)/state.applyAccuracy.length;
  return {perActivity: [...state.applyAccuracy], pct: Math.round(avg)};
}
function computeReflectScore(){
  const likertPts = state.reflectLikert.filter(v=>v!==null).length * (40/LIKERT_ITEMS.length);
  const openPts = state.reflectOpen.filter(v=>v.trim().length>=10).length * (60/OPEN_ITEMS.length);
  return {pct: Math.round(likertPts+openPts)};
}
function computeOverall(show, learn, apply, reflect){
  return Math.round(show.pct*0.15 + learn.pct*0.35 + apply.pct*0.35 + reflect.pct*0.15);
}
function computeLevel(overall){
  if(overall>=85) return {num:4, name:"ระดับ 4 · Advanced (ขั้นสูง)"};
  if(overall>=70) return {num:3, name:"ระดับ 3 · Proficient (ชำนาญ)"};
  if(overall>=50) return {num:2, name:"ระดับ 2 · Basic (พื้นฐาน)"};
  return {num:1, name:"ระดับ 1 · Needs Improvement (ควรปรับปรุง)"};
}

/* =========================================================
   Submission
   ========================================================= */
function submitTest(){
  state.submitted = true;
  go("report");
}

function buildReportStrings(show, learn, apply, reflect, overall, level){
  return {
    showReport: `SHOW: ตอบถูก ${show.correct}/${show.total} ข้อ (${show.pct}%)`,
    learnReport: `LEARN: ตอบถูก ${learn.correct}/${learn.total} ข้อ (${learn.pct}%)`,
    applyReport: `APPLY: ความแม่นยำเฉลี่ย ${apply.pct}% (กิจกรรม 1-${apply.perActivity.length}: ${apply.perActivity.join(", ")}%)`,
    reflectReport: `REFLECT: ระดับความสมบูรณ์ของการประเมินตนเอง ${reflect.pct}%`,
    overallReport: `คะแนนรวม ${overall}%`,
    qualityReport: level.name
  };
}

async function postResult(payload){
  try{
    const res = await fetch(WEBAPP_URL, {
      method:"POST",
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body: JSON.stringify(payload)
    });
    return {ok:true, text: await res.text()};
  }catch(err){
    return {ok:false, error: String(err)};
  }
}

async function fetchHistory(name){
  try{
    const res = await fetch(WEBAPP_URL + "?action=history&name=" + encodeURIComponent(name));
    const data = await res.json();
    return {ok:true, rows: Array.isArray(data) ? data : (data.rows || [])};
  }catch(err){
    return {ok:false, error:String(err)};
  }
}

  try { saved = JSON.parse(localStorage.getItem("pisaLearner") || "null"); } catch (e) {}
  var fillName = (qs("name") || (saved && saved.name) || "").trim();
  var fillGrade = (qs("grade") || (saved && saved.grade) || "").trim();
  var fromHub = !!(fillName && fillGrade);
  var learnerKey = fillName + "|" + fillGrade;

  /* ---------------- progress store (per learner) ---------------- */
  function readAll() {
    try { return JSON.parse(localStorage.getItem(PROGRESS_KEY) || "{}"); }
    catch (e) { return {}; }
  }
  function writeRecord(rec) {
    if (!learnerKey || learnerKey === "|") return;
    try {
      var all = readAll();
      if (!all[learnerKey]) all[learnerKey] = {};
      all[learnerKey][SCENARIO_ID] = rec;
      localStorage.setItem(PROGRESS_KEY, JSON.stringify(all));
    } catch (e) {}
  }
  function currentRecord() {
    var all = readAll();
    return (all[learnerKey] && all[learnerKey][SCENARIO_ID]) || null;
  }

  if (fromHub) {
    try {
      localStorage.setItem("pisaLearner", JSON.stringify({ name: fillName, grade: fillGrade, ts: Date.now() }));
    } catch (e) {}

    /* mark as "opened but not finished" - only when this learner has no
       finished result yet, so a finished result is never downgraded */
    var existing = currentRecord();
    if (!existing || !existing.completed) {
      writeRecord({
        title: SCENARIO_TITLE, name: fillName, grade: fillGrade,
        completed: false, started: true, startedAt: new Date().toISOString()
      });
    }

    var NAME_IDS = ["inName", "inputName", "nameInput", "gateName", "inp-name", "inpName"];
    var GRADE_IDS = ["inGrade", "gradeSelect", "gradeInput", "gateGrade", "inp-grade", "inpGrade"];

    function byIds(ids) {
      for (var i = 0; i < ids.length; i++) {
        var el = document.getElementById(ids[i]);
        if (el) return el;
      }
      return null;
    }
    function fire(el) {
      el.dispatchEvent(new Event("input", { bubbles: true }));
      el.dispatchEvent(new Event("change", { bubbles: true }));
    }

    function applyLearner() {
      var nameEl = byIds(NAME_IDS);
      var gradeEl = byIds(GRADE_IDS);

      if (nameEl && fillName && !(nameEl.value || "").trim()) {
        nameEl.value = fillName;
        fire(nameEl);
      }
      if (!gradeEl) return;

      if (gradeEl.tagName === "SELECT") {
        if (gradeEl.getAttribute("data-pisa-grade") !== "1") {
          var list = GRADE_CHOICES.slice();
          if (fillGrade && list.indexOf(fillGrade) === -1) list.unshift(fillGrade);
          gradeEl.innerHTML = "";
          for (var i = 0; i < list.length; i++) {
            var opt = document.createElement("option");
            opt.value = list[i];
            opt.textContent = list[i];
            if (list[i] === fillGrade) opt.selected = true;
            gradeEl.appendChild(opt);
          }
          gradeEl.setAttribute("data-pisa-grade", "1");
          gradeEl.value = fillGrade;
          fire(gradeEl);
        } else if (!(gradeEl.value || "").trim() && fillGrade) {
          gradeEl.value = fillGrade;
          fire(gradeEl);
        }
      } else if (fillGrade && !(gradeEl.value || "").trim()) {
        gradeEl.value = fillGrade;
        fire(gradeEl);
      }
    }

    var tries = 0;
    var poll = setInterval(function () {
      tries++;
      try { applyLearner(); } catch (e) {}
      if (tries > 9000) clearInterval(poll); // ~25 min safety cap
    }, 170);
    try { applyLearner(); } catch (e) {}

    var bar = document.createElement("div");
    bar.style.cssText = "position:fixed;right:0;bottom:0;z-index:999999;display:flex;justify-content:flex-end;pointer-events:none;";
    var backBtn = document.createElement("button");
    backBtn.type = "button";
    backBtn.textContent = "🏠 กลับสู่หน้าหลัก";
    backBtn.style.cssText = "pointer-events:auto;margin:12px;padding:10px 20px;border-radius:999px;border:none;background:#1f2a44;color:#fff;font-weight:700;font-family:system-ui,'IBM Plex Sans Thai',sans-serif;font-size:13px;box-shadow:0 6px 18px rgba(0,0,0,.28);cursor:pointer;opacity:.9;transition:opacity .15s;";
    backBtn.addEventListener("mouseenter", function () { backBtn.style.opacity = "1"; });
    backBtn.addEventListener("mouseleave", function () { backBtn.style.opacity = ".9"; });
    backBtn.addEventListener("click", goBackToHub);
    bar.appendChild(backBtn);
    document.body.appendChild(bar);
    /* keep the floating button from covering the page content */
    try { document.body.style.paddingBottom = "76px"; } catch (e) {}
  }

  /* ---------------- capture the result sent to Google Sheet ------------- */
  var lastPayload = null;
  var origFetch = window.fetch;
  window.fetch = function (url, opts) {
    try {
      if (opts && opts.body && typeof opts.body === "string") {
        var bodyObj = JSON.parse(opts.body);
        var hasName = bodyObj && (bodyObj.name || bodyObj.user);
        var hasGrade = bodyObj && bodyObj.grade;
        if (hasName && hasGrade) {
          lastPayload = bodyObj;
          recordProgress(bodyObj);
        }
      }
    } catch (e) {}
    return origFetch.apply(this, arguments);
  };

  function num(v) {
    return (typeof v === "number" && isFinite(v)) ? Math.round(v) : null;
  }
  /* pull a percentage out of a report sentence:
     "... (รวม 62%)" / "ความแม่นยำเฉลี่ย 75% (...)" -> the summary number,
     otherwise the first percentage in the text ("4/5 (80%)" -> 80) */
  function pctFromText(t) {
    if (typeof t !== "string") return null;
    var m = t.match(/(?:รวม|เฉลี่ย)\s*([\d.]+)\s*%/);
    if (m) return Math.round(parseFloat(m[1]));
    m = t.match(/([\d.]+)\s*%/);
    if (m) return Math.round(parseFloat(m[1]));
    return null;
  }
  /* "รวม 78/100 (SHOW 60, LEARN 80, APPLY 75, REFLECT 90)" */
  function fromTotalReport(p, label) {
    var t = p.totalReport;
    if (typeof t !== "string") return null;
    var m = t.match(new RegExp(label + "\\s*([\\d.]+)"));
    return m ? Math.round(parseFloat(m[1])) : null;
  }
  function section(p, keys, textKey, label) {
    for (var i = 0; i < keys.length; i++) {
      var v = num(p[keys[i]]);
      if (v !== null) return v;
    }
    var fromTotal = fromTotalReport(p, label);
    if (fromTotal !== null) return fromTotal;
    return pctFromText(p[textKey]);
  }
  function extractSections(p) {
    return {
      show:    section(p, ["show", "show_score", "showScore"], "showReport", "SHOW"),
      learn:   section(p, ["learn", "learn_score", "learnScore"], "learnReport", "LEARN"),
      apply:   section(p, ["apply", "apply_score", "applyScore"], "applyReport", "APPLY"),
      reflect: section(p, ["reflect", "reflect_score", "reflectScore"], "reflectReport", "REFLECT")
    };
  }
  function extractOverall(p) {
    var v = num(p.overall);
    if (v !== null) return v;
    v = num(p.overall_score);
    if (v !== null) return v;
    var texts = [p.overallReport, p.totalReport, p.qualityReport].filter(Boolean).join(" ");
    var m = texts.match(/([\d.]+)\s*%/) || texts.match(/([\d.]+)\s*\/\s*100/);
    return m ? Math.round(parseFloat(m[1])) : null;
  }
  function extractLevelName(p) {
    return p.levelName || p.levelLabel || p.quality_label || p.qualityLevel || p.qualityReport || "";
  }
  function recordProgress(p) {
    var sec = extractSections(p);
    writeRecord({
      title: SCENARIO_TITLE,
      name: p.name || p.user || fillName,
      grade: p.grade || fillGrade,
      overall: extractOverall(p),
      show: sec.show, learn: sec.learn, apply: sec.apply, reflect: sec.reflect,
      levelName: extractLevelName(p),
      timestamp: p.timestamp || new Date().toISOString(),
      completed: true
    });
  }

  function goBackToHub() {
    var q = new URLSearchParams();
    q.set("done", SCENARIO_ID);
    if (fillName) q.set("name", fillName);
    if (fillGrade) q.set("grade", fillGrade);
    if (lastPayload) {
      var ov = extractOverall(lastPayload);
      var ln = extractLevelName(lastPayload);
      var sec = extractSections(lastPayload);
      if (ov != null) q.set("overall", ov);
      if (ln) q.set("levelName", ln);
      if (sec.show != null) q.set("show", sec.show);
      if (sec.learn != null) q.set("learn", sec.learn);
      if (sec.apply != null) q.set("apply", sec.apply);
      if (sec.reflect != null) q.set("reflect", sec.reflect);
    }
    location.href = "index.html?" + q.toString();
  }
})();
</script>

















<script>

   1) บันทึก "รอยการทำแบบทดสอบ" ของผู้เข้าสอบระหว่างทำ (เลือกตัวเลือกใด
      และเขียนคำตอบอัตนัยว่าอย่างไร) โดยไม่ยุ่งกับตรรกะเดิมของแบบทดสอบ
   2) จับคู่ตัวเลือกที่เลือกกับคลังข้อสอบของไฟล์นั้นเอง (SHOW_ITEMS /

   3) เติม "ตารางรายละเอียดรายข้อ" ลงในหน้ารายงานผล แยกตาม 4 ขั้นตอน
   4) ปุ่ม "ย้อนดูประวัติการทำแบบทดสอบ" เปิดโหมดอ่านอย่างเดียว พร้อม
      ลายน้ำบนเลเยอร์บนสุด และปุ่มออกจากโหมด
   =================================================================== */
(function () {
  "use strict";

  var SCENARIO_ID = "blockGuard";
  var SCENARIO_TITLE = "BlockGuard";
  var ATTEMPTS_KEY = "pisaAttempts";
  /* เฉลย/รูบริคจาก "คู่มือเฉลยและเกณฑ์การให้คะแนน" (.docx) ของสถานการณ์นี้ - คัดลอกมาตามเอกสารทุกประการ */
  var DOCKEY = {"i": [{"s": "SHOW", "n": 1, "t": "ข้อ 1 ค. เก็บเป็นบล็อกที่เชื่อมโยงต่อกันเป็นสายโซ่ตามลำดับ  (3 คะแนน)\n• ก. เก็บเป็นบล็อกอิสระที่ไม่เกี่ยวข้องกัน  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      ขัดกับหลักการพื้นฐานของ Blockchain ที่บล็อกทุกบล็อกเชื่อมโยงกันด้วยค่า Hash ตามลำดับเวลา ไม่ใช่จัดเก็บแบบแยกอิสระจากกัน\n• ข. เก็บเป็นไฟล์เดียวรวมทุกธุรกรรม  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      ขัดกับสถาปัตยกรรมบัญชีแยกประเภทแบบกระจาย (distributed ledger) ที่แบ่งข้อมูลเป็นบล็อกย่อยเชื่อมต่อกัน ไม่ใช่รวมเป็นไฟล์เดียว\n• ค. เก็บเป็นบล็อกที่เชื่อมโยงต่อกันเป็นสายโซ่ตามลำดับ  —  ✓ ถูกต้อง\n      สอดคล้องกับนิยามของ Blockchain (chain of blocks) ที่แต่ละบล็อกอ้างอิง Hash ของบล็อกก่อนหน้าผ่านค่า Previous Hash ทำให้เกิดเป็นสายโซ่ต่อเนื่องตามลำดับเวลา ตรวจสอบย้อนกลับได้\n• ง. เก็บเฉพาะธุรกรรมล่าสุดเพียงบล็อกเดียว  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      ขัดกับหลักความคงกระพัน (immutability) ที่ต้องเก็บประวัติธุรกรรมทั้งหมดไว้ในสายโซ่ ไม่ใช่ทับข้อมูลเดิมด้วยธุรกรรมล่าสุด"}, {"s": "SHOW", "n": 2, "t": "ข้อ 2 ก. เป็นค่าที่ใช้ยืนยันว่าเนื้อหาของบล็อกไม่ถูกเปลี่ยนแปลง  (3 คะแนน)\n• ก. เป็นค่าที่ใช้ยืนยันว่าเนื้อหาของบล็อกไม่ถูกเปลี่ยนแปลง  —  ✓ ถูกต้อง\n      ตรงกับคุณสมบัติหลักของฟังก์ชันแฮชในบล็อกเชน คือทำหน้าที่เป็นลายนิ้วมือดิจิทัลที่ยืนยันความถูกต้อง (integrity verification) ของเนื้อหาบล็อก\n• ข. เข้ารหัสข้อมูลเพื่อไม่ให้ผู้อื่นอ่านได้  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      ฟังก์ชันแฮช (hash function) เป็นฟังก์ชันทางเดียว (one-way function) ใช้สำหรับยืนยันความถูกต้อง ไม่ใช่การเข้ารหัส (encryption) ที่ออกแบบมาให้ถอดรหัสกลับได้\n• ค. บอกจำนวนเงินในธุรกรรม  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      Hash เป็นค่าที่คำนวณได้จากข้อมูลทั้งหมดในบล็อก ไม่ใช่ตัวเลขจำนวนเงินโดยตรง\n• ง. กำหนดลำดับเวลาที่บล็อกถูกสร้าง  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      ลำดับเวลาบันทึกแยกต่างหาก (เช่น timestamp) ส่วน Hash ทำหน้าที่ยืนยันความถูกต้องของเนื้อหา ไม่ใช่กำหนดลำดับเวลา"}, {"s": "SHOW", "n": 3, "t": "ข้อ 3 ข. Hash ของบล็อกก่อนหน้า ไม่ตรงกับ Previous Hash ของบล็อกปัจจุบัน  (3 คะแนน)\n• ก. Hash ของบล็อกก่อนหน้า ตรงกับ Previous Hash ของบล็อกปัจจุบัน  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      คำอธิบายนี้เป็นนิยามของ “ข้อมูลสอดคล้อง” ซึ่งตรงข้ามกับสิ่งที่คำถามถาม\n• ข. Hash ของบล็อกก่อนหน้า ไม่ตรงกับ Previous Hash ของบล็อกปัจจุบัน  —  ✓ ถูกต้อง\n      ตรงกับนิยามที่กำหนดในสถานการณ์อย่างชัดเจน: เมื่อ Previous Hash ของบล็อกหนึ่งไม่ตรงกับ Current Hash ของบล็อกก่อนหน้า ถือว่าข้อมูลไม่สอดคล้อง\n• ค. Transaction Data ของสองบล็อกเหมือนกัน  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      การที่ข้อมูลธุรกรรม (Transaction Data) ของสองบล็อกเหมือนกันหรือไม่ ไม่เกี่ยวข้องกับนิยามความสอดคล้องของ Hash ซึ่งพิจารณาจากค่า Hash ที่เชื่อมโยงกัน ไม่ใช่เนื้อหาธุรกรรม\n• ง. บล็อกปัจจุบันไม่มี Block ID  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      การไม่มี Block ID เป็นปัญหาด้านโครงสร้างข้อมูลอีกประเภทหนึ่ง ไม่ใช่กลไกการตรวจสอบ Hash ที่ใช้นิยามความสอดคล้องในระบบนี้"}, {"s": "SHOW", "n": 4, "t": "ข้อ 4 ง. B3  (3 คะแนน)\nตารางในโจทย์: B1 (Previous Hash —, Current Hash H100) · B2 (Previous Hash H100, Current Hash H200) · B3 (Previous Hash H999, Current Hash H300)\n• ก. B1  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      B1 เป็นบล็อกเริ่มต้น (Genesis) ไม่มี Previous Hash ให้เทียบ จึงไม่ต้องตรวจสอบ\n• ข. B2  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      Previous Hash ของ B2 (H100) ตรงกับ Current Hash ของ B1 (H100) พอดี ข้อมูลจึงสอดคล้อง ไม่ใช่บล็อกที่ต้องตรวจสอบ\n• ค. ไม่มีบล็อกใดต้องตรวจสอบ  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      ขัดแย้งกับข้อมูลในตารางที่แสดงความไม่สอดคล้องของ B3 อย่างชัดเจน\n• ง. B3  —  ✓ ถูกต้อง\n      Previous Hash ของ B3 คือ H999 แต่ Current Hash ของ B2 (บล็อกก่อนหน้า) คือ H200 ไม่ตรงกัน จึงเป็น “บล็อกที่ต้องตรวจสอบ” ตามนิยามที่กำหนด"}, {"s": "SHOW", "n": 5, "t": "ข้อ 5 ก. อ่านข้อมูล Block → คำนวณ Hash → ตรวจ Previous Hash → เปรียบเทียบ Hash → ตรวจความถูกต้อง → รายงานผล  (3 คะแนน)\n• ก. อ่านข้อมูล Block → คำนวณ Hash → ตรวจ Previous Hash → เปรียบเทียบ Hash → ตรวจความถูกต้อง → รายงานผล  —  ✓ ถูกต้อง\n      เป็นลำดับตรรกะที่ถูกต้อง: อ่านข้อมูลก่อน แล้วจึงคำนวณ Hash จากข้อมูลนั้น จากนั้นตรวจ Previous Hash เปรียบเทียบค่า Hash แล้วจึงสรุปและรายงานผล\n• ข. คำนวณ Hash → อ่านข้อมูล Block → ตรวจ Previous Hash → เปรียบเทียบ Hash → ตรวจความถูกต้อง → รายงานผล  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      ลำดับไม่ถูกต้อง เพราะต้องอ่านข้อมูลก่อนจึงจะคำนวณ Hash ได้ (Hash คำนวณจากเนื้อหาของบล็อก ไม่ใช่คำนวณก่อนอ่านข้อมูล)\n• ค. อ่านข้อมูล Block → ตรวจความถูกต้อง → คำนวณ Hash → เปรียบเทียบ Hash → ตรวจ Previous Hash → รายงานผล  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      ขั้น “ตรวจความถูกต้อง” ต้องทำหลังจากเปรียบเทียบ Hash แล้วเท่านั้น ไม่ใช่ก่อนคำนวณ Hash\n• ง. รายงานผล → อ่านข้อมูล Block → คำนวณ Hash → ตรวจ Previous Hash → เปรียบเทียบ Hash → ตรวจความถูกต้อง  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      “รายงานผล” ต้องเป็นขั้นตอนสุดท้ายเสมอ เพราะต้องรอผลจากการตรวจสอบก่อนจึงจะรายงานได้"}, {"s": "LEARN", "n": 1, "t": "ภาระงานที่ 1: ทำความรู้จัก Hash ของบล็อก (4 คะแนน)\n1.1 ค. เนื้อหาของบล็อกนั้น (เช่น Transaction Data)  (2 คะแนน)\n• ก. วันที่สร้างบล็อกเท่านั้น  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      วันที่/เวลาเป็นได้อย่างมากเพียงส่วนหนึ่งของข้อมูลที่นำไปคำนวณ ไม่ใช่ปัจจัยเดียวที่กำหนดค่า Hash\n• ข. ชื่อผู้ดูแลระบบ  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      ชื่อผู้ดูแลระบบไม่ใช่ส่วนหนึ่งของข้อมูลบล็อกที่ใช้คำนวณ Hash ในระบบจำลองนี้\n• ค. เนื้อหาของบล็อกนั้น (เช่น Transaction Data)  —  ✓ ถูกต้อง\n      ฟังก์ชันแฮชรับข้อมูลทั้งหมดในบล็อก (รวมถึง Transaction Data) เป็นอินพุตในการคำนวณค่า Hash\n• ง. จำนวนบล็อกทั้งหมดในสายโซ่  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      Hash คำนวณจากเนื้อหาของบล็อกนั้นเอง ไม่ใช่จากจำนวนบล็อกทั้งหมดในสายโซ่\n1.2 ง. แต่ละบล็อกมีค่า Current Hash เฉพาะตัว ไม่ซ้ำกัน  (2 คะแนน)\n• ก. บล็อกที่สร้างทีหลังจะมี Current Hash เท่ากับบล็อกก่อนหน้าเสมอ  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      ขัดกับตารางที่ B1–B5 มีค่า Hash ต่างกันทุกบล็อก (100, 200, 300, 400, 500)\n• ข. ค่า Current Hash จะลดลงเมื่อบล็อกใหม่ถูกสร้าง  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      ขัดกับตารางที่ค่าปรากฏเพิ่มขึ้นตามลำดับการสร้าง ไม่ใช่ลดลง (ตัวเลขในแบบฝึกนี้เป็นรหัสอย่างง่ายเพื่อการเรียนรู้ ไม่ใช่ Hash จริง)\n• ค. ตารางนี้แสดงจำนวนธุรกรรมในแต่ละบล็อก  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      ตารางแสดงค่า Current Hash ของแต่ละบล็อก ไม่ใช่จำนวนธุรกรรม\n• ง. แต่ละบล็อกมีค่า Current Hash เฉพาะตัว ไม่ซ้ำกัน  —  ✓ ถูกต้อง\n      สอดคล้องกับตารางที่แสดงค่า Current Hash ต่างกันในทุกบล็อก อันเป็นคุณสมบัติของฟังก์ชันแฮชที่ให้ผลลัพธ์จำเพาะตามเนื้อหาของแต่ละบล็อก"}, {"s": "LEARN", "n": 2, "t": "ภาระงานที่ 2: ตรวจสอบความสอดคล้องของ Hash (4 คะแนน)\n2.1 ข. B3 และ B5  (2 คะแนน)\n• ก. B2 และ B4  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      ตามตาราง B2 และ B4 มีผลการตรวจสอบ = 1 (ถูกต้อง) จึงไม่ใช่บล็อกที่มีปัญหา\n• ข. B3 และ B5  —  ✓ ถูกต้อง\n      ตามตาราง B3 และ B5 มีผลการตรวจสอบ = 0 (ไม่ถูกต้อง) ตรงกับคำถาม\n• ค. B2 เท่านั้น  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      B2 มีสถานะถูกต้อง (1) ไม่ใช่บล็อกที่มีปัญหา และคำตอบยังไม่ครบตามข้อมูลจริงที่มี 2 บล็อก\n• ง. ทุกบล็อกถูกต้อง  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      ขัดแย้งกับตารางที่แสดงค่า 0 (ไม่ถูกต้อง) อยู่ 2 ตำแหน่งอย่างชัดเจน\n2.2 ค. บล็อกที่ต้องตรวจสอบ  (2 คะแนน)\n• ก. บล็อก Genesis  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      บล็อก Genesis คือบล็อกเริ่มต้นของสายโซ่ (เช่น B1) ไม่เกี่ยวข้องกับสถานะการตรวจสอบความสอดคล้อง\n• ข. บล็อกสำรอง  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      ไม่ใช่คำศัพท์หรือสถานะที่นิยามไว้ในระบบนี้\n• ค. บล็อกที่ต้องตรวจสอบ  —  ✓ ถูกต้อง\n      ตรงตามนิยามที่กำหนดไว้ในสถานการณ์: บล็อกที่ข้อมูลไม่สอดคล้องจัดเป็น “บล็อกที่ต้องตรวจสอบ”\n• ง. บล็อกที่ถูกลบ  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      ระบบบล็อกเชนไม่มีการลบบล็อกออกจากสายโซ่ (หลักความคงกระพัน / immutability) บล็อกที่ผิดปกติยังคงอยู่แต่ถูกทำเครื่องหมายว่าต้องตรวจสอบ"}, {"s": "LEARN", "n": 3, "t": "ภาระงานที่ 3: ผลกระทบแบบ Avalanche (5 คะแนน)\n3.1 ก. เพราะฟังก์ชัน Hash ถูกออกแบบให้ไวต่อการเปลี่ยนแปลงแม้เพียงเล็กน้อย (Avalanche Effect)  (2 คะแนน)\n• ก. เพราะฟังก์ชัน Hash ถูกออกแบบให้ไวต่อการเปลี่ยนแปลงแม้เพียงเล็กน้อย (Avalanche Effect)  —  ✓ ถูกต้อง\n      ตรงตามนิยามของ Avalanche Effect ซึ่งเป็นคุณสมบัติสำคัญของฟังก์ชันแฮชเข้ารหัส (cryptographic hash function) ที่การเปลี่ยนอินพุตเพียงเล็กน้อยทำให้เอาต์พุตเปลี่ยนไปอย่างสิ้นเชิง\n• ข. เพราะระบบสุ่มค่า Hash ใหม่ทุกครั้งโดยไม่เกี่ยวกับข้อมูล  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      ขัดกับหลักการของฟังก์ชันแฮชที่เป็น deterministic (อินพุตเดียวกันให้ผลลัพธ์เดียวกันเสมอ) ไม่ใช่การสุ่มโดยไม่เกี่ยวกับข้อมูล\n• ค. เพราะข้อมูลที่เปลี่ยนมีขนาดใหญ่กว่าเดิมมาก  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      ขัดกับข้อมูลในตารางที่ระบุว่าข้อมูลเปลี่ยนเพียง 2% (ขนาดเล็กมาก) แต่ Hash เปลี่ยนไปเกือบ 100%\n• ง. เพราะบล็อกก่อนหน้าถูกลบไปแล้ว  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      ไม่เกี่ยวข้องกับกลไก Avalanche Effect ซึ่งเกิดจากคุณสมบัติของฟังก์ชันแฮชเอง ไม่ใช่จากการลบบล็อก\n3.2 แนวคำตอบอ้างอิง (3 คะแนน — คำถามอัตนัย ใช้รูบริคส่วน B ประกอบ)\nAvalanche Effect ช่วยให้ BlockGuard ตรวจจับการปลอมแปลงหรือแก้ไขข้อมูลได้ง่ายและรวดเร็ว เพราะเมื่อมีการแก้ไขข้อมูลในบล็อกแม้เพียงเล็กน้อย (เช่น เปลี่ยนจำนวนเงิน) ค่า Hash ที่คำนวณใหม่จะเปลี่ยนแปลงไปอย่างสิ้นเชิงทันที (จากตาราง ข้อมูลเปลี่ยน 2% แต่ Hash เปลี่ยนถึง 97%) ทำให้ BlockBot สามารถเปรียบเทียบ Hash แล้วพบความผิดปกติได้อย่างชัดเจนในทันที โดยไม่ต้องตรวจสอบเนื้อหาข้อมูลทีละรายการอย่างละเอียด จึงเป็นกลไกสำคัญที่ทำให้ข้อมูลบนบล็อกเชนยากต่อการปลอมแปลงโดยไม่ถูกตรวจพบ"}, {"s": "LEARN", "n": 4, "t": "ภาระงานที่ 4: แนวโน้มบล็อกที่ต้องตรวจสอบรายวัน (5 คะแนน)\n4.1 ข. ศุกร์  (2 คะแนน)\n• ก. จันทร์  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      ตามตาราง วันจันทร์มีบล็อกที่ต้องตรวจสอบ 1 รายการ ต่ำกว่าวันศุกร์\n• ข. ศุกร์  —  ✓ ถูกต้อง\n      ตามตาราง วันศุกร์มีค่าสูงสุด = 4 บล็อก ซึ่งมากกว่าทุกวันในตาราง\n• ค. พุธ  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      ตามตาราง วันพุธมีบล็อกที่ต้องตรวจสอบ 2 รายการ ต่ำกว่าวันศุกร์\n• ง. อาทิตย์  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      ตามตาราง วันอาทิตย์มีบล็อกที่ต้องตรวจสอบ 1 รายการ ต่ำกว่าวันศุกร์\n4.2 แนวคำตอบอ้างอิง (3 คะแนน — คำถามอัตนัย ใช้รูบริคส่วน B ประกอบ)\nทีมดูแลระบบควรตรวจสอบสาเหตุและบล็อกที่เกี่ยวข้องเพิ่มเติมก่อนตัดสินใจใด ๆ เป็นลำดับแรก เนื่องจากวันศุกร์มีจำนวนบล็อกที่ต้องตรวจสอบสูงถึง 4 รายการ ซึ่งมากกว่าค่าเฉลี่ยของวันอื่นในตาราง (0-2 รายการ) อย่างมีนัยสำคัญ การลบข้อมูลทิ้งทันทีหรือปิดระบบทั้งหมดโดยไม่สืบสวนก่อนอาจทำให้สูญเสียหลักฐานสำคัญของการโจมตีหรือความผิดปกติที่แท้จริง ในขณะที่การเพิกเฉยก็เสี่ยงต่อการปล่อยให้ปัญหาลุกลาม จึงควรวิเคราะห์ข้อมูลเชิงลึกของบล็อกที่ต้องตรวจสอบในวันนั้นก่อน แล้วจึงตัดสินใจขั้นตอนต่อไปตามหลักฐานที่พบ"}, {"s": "LEARN", "n": 5, "t": "ภาระงานที่ 5: เปรียบเทียบ Hash ของบล็อกก่อนหน้า กับ Previous Hash ที่บันทึกไว้ (4 คะแนน)\n5.1 ค. B3 และ B5  (2 คะแนน)\n• ก. B2 และ B4  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      ตามตาราง B2 (100=100) และ B4 (300=300) ค่าทั้งสองตรงกัน ไม่ใช่บล็อกที่แยกออกจากกัน\n• ข. B2 เท่านั้น  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      B2 มีค่าตรงกัน จึงไม่ใช่คำตอบที่ถูกต้อง\n• ค. B3 และ B5  —  ✓ ถูกต้อง\n      ตามตาราง B3 (200 ≠ 999) และ B5 (400 ≠ 450) ค่าทั้งสองแยกออกจากกันอย่างชัดเจน\n• ง. ไม่มีบล็อกใดที่ค่าแยกออกจากกัน  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      ขัดแย้งกับข้อมูลในตารางที่แสดงความแตกต่างที่ B3 และ B5\n5.2 ข. สถานะ: ไม่ถูกต้อง และเป็นบล็อกที่ต้องตรวจสอบ  (2 คะแนน)\n• ก. สถานะ: ถูกต้อง  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      ขัดกับนิยามที่กำหนด เพราะค่าทั้งสองไม่ตรงกัน\n• ข. สถานะ: ไม่ถูกต้อง และเป็นบล็อกที่ต้องตรวจสอบ  —  ✓ ถูกต้อง\n      สอดคล้องกับนิยาม “ข้อมูลไม่สอดคล้อง” ที่กำหนดไว้ในสถานการณ์: เมื่อค่าทั้งสองแยกกัน บล็อกนั้นต้องจัดเป็นบล็อกที่ต้องตรวจสอบ\n• ค. บล็อก Genesis  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      ไม่เกี่ยวข้องกับผลการเปรียบเทียบ Hash ในกรณีนี้\n• ง. ไม่ต้องดำเนินการใด ๆ  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      ขัดกับหลักการตรวจสอบความปลอดภัยที่ต้องดำเนินการตรวจสอบเพิ่มเติมทันทีเมื่อพบความไม่สอดคล้อง"}, {"s": "LEARN", "n": 6, "t": "ภาระงานที่ 6: Smart Contract คืออะไร (4 คะแนน)\n6.1 ง. ทำงานโดยอัตโนมัติเมื่อเงื่อนไขที่เขียนไว้ล่วงหน้าครบถ้วน  (2 คะแนน)\n• ก. รอให้เจ้าหน้าที่กดอนุมัติทุกขั้นตอน  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      ขัดกับหลักการสำคัญของ Smart Contract ที่ทำงานอัตโนมัติโดยไม่ต้องมีคนกลางดำเนินการทุกขั้นตอน\n• ข. ทำงานเมื่อผู้ใช้ร้องขอเท่านั้น ไม่ว่าเงื่อนไขจะครบหรือไม่  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      ขัดกับหลักการที่ Smart Contract ต้องตรวจสอบเงื่อนไขก่อนทำงานเสมอ ไม่ใช่ทำงานตามคำขอโดยไม่ตรวจสอบเงื่อนไข\n• ค. สุ่มผลลัพธ์ในแต่ละครั้ง  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      ขัดกับหลักการทำงานแบบกำหนดผลลัพธ์แน่นอน (deterministic) ของโปรแกรมที่บันทึกไว้บนบล็อกเชน\n• ง. ทำงานโดยอัตโนมัติเมื่อเงื่อนไขที่เขียนไว้ล่วงหน้าครบถ้วน  —  ✓ ถูกต้อง\n      ตรงตามนิยามของ Smart Contract ที่ทำงานอัตโนมัติตามเงื่อนไข If-Then ที่กำหนดไว้ล่วงหน้า\n6.2 ก. สัญญาแบบเดิมใช้เวลามากที่สุดในขั้นตอน “โอนสิทธิ์/เงิน” และ Smart Contract ลดเวลาลงมากในทุกขั้นตอน  (2 คะแนน)\n• ก. สัญญาแบบเดิมใช้เวลามากที่สุดในขั้นตอน “โอนสิทธิ์/เงิน” และ Smart Contract ลดเวลาลงมากในทุกขั้นตอน  —  ✓ ถูกต้อง\n      ตรงตามตาราง: “โอนสิทธิ์/เงิน” ใช้เวลามากที่สุด (72 ชม.) ในสัญญาแบบเดิม และ Smart Contract ลดเวลาลงอย่างมากในทุกขั้นตอน (เหลือ 1-2 ชม.)\n• ข. สัญญาแบบเดิมใช้เวลามากที่สุดในขั้นตอน “แจ้งผล”  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      ตามตาราง “แจ้งผล” ใช้เวลาเพียง 12 ชม. ซึ่งน้อยที่สุดในสัญญาแบบเดิม ไม่ใช่มากที่สุด\n• ค. Smart Contract ใช้เวลามากกว่าสัญญาแบบเดิมในทุกขั้นตอน  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      ขัดแย้งกับตารางที่ Smart Contract ใช้เวลาน้อยกว่าสัญญาแบบเดิมในทุกขั้นตอนอย่างชัดเจน\n• ง. ทั้งสองแบบใช้เวลาเท่ากัน  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      ขัดแย้งกับตัวเลขในตารางที่แตกต่างกันอย่างชัดเจนในทุกขั้นตอน"}, {"s": "LEARN", "n": 7, "t": "ภาระงานที่ 7: ระบบ VOTE บนบล็อกเชน (5 คะแนน)\n7.1 ลำดับที่ถูกต้อง (3 คะแนน)\nค (เมื่อ ได้รับคะแนนโหวตจากกระเป๋าดิจิทัล) → ก (ถ้า กระเป๋าดิจิทัลนี้เคยลงคะแนนแล้ว) → จ (ปฏิเสธคะแนน และแจ้งว่า “ลงคะแนนซ้ำ”) → ช (มิฉะนั้น) → ซ (บันทึกคะแนนเป็นบล็อกใหม่ และเชื่อม Hash กับบล็อกก่อนหน้า) → ง (แสดงผลคะแนนรวมของทุกตัวเลือก) — บล็อกที่ไม่ใช้ (ตัวลวง) คือ ข (แก้ไขคะแนนของบล็อกเก่าย้อนหลัง) และ ฉ (ลบบล็อกคะแนนก่อนหน้าทิ้ง) เพราะขัดกับหลักความคงกระพันของบล็อกเชนที่ไม่สามารถแก้ไขหรือลบบล็อกที่บันทึกแล้วได้ เกณฑ์การให้คะแนน: เรียงถูกครบทั้ง 6 ตำแหน่ง = 3 คะแนน, ถูก 4-5 ตำแหน่ง = 2 คะแนน, ถูก 2-3 ตำแหน่ง = 1 คะแนน, ถูกน้อยกว่า 2 ตำแหน่ง = 0 คะแนน\n7.2 ข. เพราะเงื่อนไขกำหนดว่า 1 กระเป๋าลงคะแนนได้ 1 ครั้ง สัญญาจึงตรวจและปฏิเสธเองโดยอัตโนมัติ  (2 คะแนน)\n• ก. เพราะผู้ดูแลระบบเลือกปฏิเสธด้วยตนเองทุกครั้ง  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      ขัดกับหลักการทำงานอัตโนมัติของ Smart Contract ที่ไม่ต้องมีคนกลางดำเนินการทีละกรณี\n• ข. เพราะเงื่อนไขกำหนดว่า 1 กระเป๋าลงคะแนนได้ 1 ครั้ง สัญญาจึงตรวจและปฏิเสธเองโดยอัตโนมัติ  —  ✓ ถูกต้อง\n      ตรงตามหลักการเขียนเงื่อนไข If-Then ของ Smart Contract ที่ตรวจสอบสถานะการลงคะแนนก่อนหน้าของกระเป๋าดิจิทัลนั้นโดยอัตโนมัติ\n• ค. เพราะคะแนนซ้ำทำให้ Hash ของบล็อกก่อนหน้าหายไป  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      ไม่มีความสัมพันธ์เชิงเหตุผลระหว่างการลงคะแนนซ้ำกับการหายไปของ Hash บล็อกก่อนหน้า\n• ง. เพราะตัวเลือก A ต้องได้คะแนนสูงที่สุดเสมอ  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      ไม่เกี่ยวข้องกับกลไกการตรวจจับคะแนนซ้ำ เป็นข้อมูลที่ไม่ปรากฏอยู่ในเงื่อนไขของสถานการณ์"}, {"s": "LEARN", "n": 8, "t": "ภาระงานที่ 8: หลักการทำงานแบบ If-Then (4 คะแนน)\n8.1 ลำดับที่ถูกต้อง (2 คะแนน)\nข (เริ่มต้น: เริ่มสัญญาซื้อขายบ้าน) → ฉ (รับข้อมูลยอดชำระสะสมจากระบบ) → ก (ยอดชำระสะสม ≥ 2.4 ล้านบาท หรือไม่) → จ (ใช่ (Then): โอนกรรมสิทธิ์บ้านให้ผู้ซื้ออัตโนมัติ) → ช (ไม่ใช่: รอรับชำระงวดถัดไป แล้วกลับไปตรวจสอบเงื่อนไขใหม่) → ง (จบการทำงานของสัญญา) — บล็อกที่ไม่ใช้ (ตัวลวง) คือ ค (ส่งเรื่องให้เจ้าหน้าที่พิจารณาอนุมัติด้วยตนเอง) และ ซ (ลบเงื่อนไขในสัญญาทิ้ง แล้วโอนกรรมสิทธิ์ทันที) เพราะขัดกับหลักการทำงานอัตโนมัติโดยไม่ต้องมีคนกลางของ Smart Contract เกณฑ์การให้คะแนน: เรียงถูกครบทั้ง 6 ตำแหน่ง = 2 คะแนน, ถูก 4-5 ตำแหน่ง = 1 คะแนน, ถูกน้อยกว่า 4 ตำแหน่ง = 0 คะแนน\n8.2 ง. ยังไม่โอน เพราะเงื่อนไข If ยังไม่ครบถ้วน จึงวนกลับไปรอรับชำระงวดถัดไป  (2 คะแนน)\n• ก. โอนกรรมสิทธิ์ทันทีเพราะจ่ายไปแล้วเกินครึ่ง  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      ขัดกับเงื่อนไขที่กำหนดไว้ชัดเจนว่าต้องชำระ ≥ 2.4 ล้านบาทเท่านั้น ไม่มีเงื่อนไข “จ่ายเกินครึ่ง” ในสัญญา\n• ข. ลบสัญญาทิ้ง  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      ขัดกับหลักความคงกระพันของ Smart Contract บนบล็อกเชน ที่ไม่สามารถลบหรือแก้ไขสัญญาที่บันทึกแล้วได้\n• ค. ให้เจ้าหน้าที่ตัดสินใจโอนแทนสัญญา  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      ขัดกับหลักการทำงานอัตโนมัติโดยไม่ต้องมีคนกลางของ Smart Contract\n• ง. ยังไม่โอน เพราะเงื่อนไข If ยังไม่ครบถ้วน จึงวนกลับไปรอรับชำระงวดถัดไป  —  ✓ ถูกต้อง\n      ตรงตามผังงาน If-Then: เมื่อเงื่อนไขยังไม่ครบ (2.0 < 2.4) ระบบวนกลับไปรอรับชำระงวดถัดไปตามที่ผังงานกำหนด"}, {"s": "APPLY", "n": 1, "t": "กิจกรรมที่ 1: ปรับน้ำหนักปัจจัยเสี่ยงบล็อก (8 คะแนน)\n1.1 (4 คะแนน) — ตารางคำตอบอ้างอิง: น้ำหนักเท่ากันทุกปัจจัย (20% ต่อปัจจัย) คะแนนรวม = ค่าเฉลี่ยของ 5 ปัจจัย\n• Block  —  BLK-101\n      BLK-102  BLK-103  BLK-104  BLK-105  BLK-106  BLK-107  BLK-108\n• คะแนนรวม  —  48.0\n      29.0  28.0  91.0  49.0  32.0  28.0  36.0\n• ระดับที่ประเมินได้  —  ปานกลาง\n      ต่ำ  ต่ำ ✗  สูง  ปานกลาง ✗  ต่ำ ✗  ต่ำ  ต่ำ ✗\n(เครื่องหมาย ✗ คือบล็อกที่ประเมินผิด) ความแม่นยำของชุดน้ำหนักเท่ากัน = 4/8 = 50%\n1.2 (1 คะแนน): บล็อกที่ประเมินผิด คือ BLK-103, BLK-105, BLK-106, BLK-108 — ความแม่นยำ = 4/8 = 50%\n1.3 แนวคำตอบอ้างอิง (3 คะแนน — คำถามอัตนัย ใช้รูบริคส่วน B ประกอบ)\nจากตาราง จะเห็นว่าปัจจัย “ความคลาดเคลื่อนของ Hash” (ปัจจัยที่ 1) เป็นตัวบ่งชี้ที่สอดคล้องกับความเสี่ยงจริงมากที่สุด: บล็อกที่ความเสี่ยงจริง = ต่ำ มีค่าปัจจัยนี้อยู่ในช่วง 5-20 เท่านั้น ส่วนบล็อกที่ความเสี่ยงจริง = ปานกลาง มีค่าปัจจัยนี้อยู่ในช่วง 55-85 อย่างชัดเจน แต่เมื่อให้น้ำหนักปัจจัยนี้เท่ากับอีก 4 ปัจจัยที่ไม่สัมพันธ์กับความเสี่ยงจริงอย่างสม่ำเสมอ (เช่น ปัจจัยที่ 2-5 ของ BLK-105 สูงถึง 80, 70, 75 ทั้งที่ความเสี่ยงจริงต่ำ) ค่าเฉลี่ยถ่วงน้ำหนักจึงถูก “ปัจจัยรบกวน” เหล่านี้ดึงออกจากค่าที่ควรจะเป็น กล่าวคือ BLK-103, 106, 108 มีปัจจัยที่ 1 อยู่ในช่วงบ่งชี้ “ปานกลาง” (55-75) แต่ถูกปัจจัยอื่นที่ต่ำดึงคะแนนเฉลี่ยลงมาต่ำกว่า 40 กลายเป็น “ต่ำ” อย่างผิดพลาด ในขณะที่ BLK-105 มีปัจจัยที่ 1 ต่ำ (บ่งชี้ “ต่ำ” ถูกต้อง) แต่ถูกปัจจัยอื่นที่สูงดันคะแนนเฉลี่ยขึ้นมาเป็น “ปานกลาง” อย่างผิดพลาด แนวทางแก้ไขเชิงแนวคิด (ไม่ต้องคำนวณตัวเลขใหม่) คือควรเพิ่มน้ำหนักของปัจจัยที่ 1 ให้มากกว่าปัจจัยอื่น เนื่องจากเป็นปัจจัยที่มีความสัมพันธ์กับความเสี่ยงจริงชัดเจนที่สุดในชุดข้อมูลนี้ แต่ก็ควรระวังไม่ให้ลดทอนน้ำหนักของปัจจัยอื่นจนเหลือน้อยเกินไป เพราะอาจทำให้ระบบพลาดกรณีที่ปัจจัยอื่นเป็นสัญญาณสำคัญ (เช่น BLK-104 ที่ทุกปัจจัยสูงพร้อมกัน)"}, {"s": "APPLY", "n": 2, "t": "กิจกรรมที่ 2: ปรับเกณฑ์ตัดสินความเสี่ยงบล็อก (6 คะแนน)\n2.1 (2 คะแนน) — ใช้เกณฑ์เริ่มต้น t1=30, t2=60\n• Block  —  200\n      201  202  203  204  205  206  207  208  209\n• คะแนนรวม  —  12\n      28  34  41  47  55  63  74  82  91\n• ความเสี่ยงจริง  —  ต่ำ\n      ปกลาง  สูง\n• ระดับที่ได้ (t1=30,t2=60)  —  ต่ำ\n      ปกลาง ✗  ปกลาง  สูง ✗  สูง\nความแม่นยำของเกณฑ์เริ่มต้น = 8/10 = 80% (BLK-202 และ BLK-206 ประเมินผิด)\n2.2 (1 คะแนน): BLK-202 (คะแนน 34) ถูกจัดเป็น “ปานกลาง” ทั้งที่ความเสี่ยงจริงคือ “ต่ำ” เพราะ t1=30 ต่ำเกินไป (34 ≥ 30 จึงไม่ถูกนับเป็นต่ำ) ส่วน BLK-206 (คะแนน 63) ถูกจัดเป็น “สูง” ทั้งที่ความเสี่ยงจริงคือ “ปานกลาง” เพราะ t2=60 ต่ำเกินไป (63 > 60 จึงถูกจัดเป็นสูง)\n2.3 (3 คะแนน)\nค่า t1 และ t2 ไม่มีคำตอบตายตัวเพียงชุดเดียว — ถือว่าถูกต้องได้ทุกชุดที่จำแนกครบทั้ง 10 รายการถูกต้อง เงื่อนไขทางคณิตศาสตร์คือ 34 < t1 ≤ 41 (มากกว่าคะแนนของ BLK-202=34 แต่ไม่เกินคะแนนของ BLK-203=41) และ 63 ≤ t2 < 74 (มากกว่าหรือเท่ากับคะแนนของ BLK-206=63 แต่น้อยกว่าคะแนนของ BLK-207=74) ตัวอย่างค่าที่ใช้ได้ เช่น t1 = 38, t2 = 68 — เมื่อใช้ค่านี้ BLK-202 (34 < 38) จะกลายเป็น “ต่ำ” ถูกต้อง และ BLK-206 (63 ≤ 68) จะกลายเป็น “ปานกลาง” ถูกต้อง ทำให้ความแม่นยำเพิ่มจาก 80% เป็น 100% ให้คะแนนเต็มเมื่อค่า t1, t2 ที่นักเรียนเสนออยู่ในช่วงที่ถูกต้องข้างต้น (หรือค่าอื่นที่ตรวจสอบแล้วให้ผลจำแนกถูกครบ 10/10) และแสดงผลลัพธ์ใหม่ของทั้ง 2 บล็อกตรงตามค่าที่เสนอ ให้คะแนนบางส่วน (1.5 คะแนน) หากแก้ไขได้ถูกต้องเพียง 1 ใน 2 บล็อก"}, {"s": "APPLY", "n": 3, "t": "กิจกรรมที่ 3: ซ่อมสายโซ่บล็อกให้ถูกต้อง (3 คะแนน)\n3.1: B3 · Previous Hash ที่ถูกต้อง = H245 (ต้องตรงกับ Current Hash ของ B2 = H245 จึงจะทำให้สายโซ่สอดคล้อง) ให้ 1.5 คะแนน · B5 · Previous Hash ที่ถูกต้อง = H455 (ต้องตรงกับ Current Hash ของ B4 = H455) ให้ 1.5 คะแนน"}, {"s": "APPLY", "n": 4, "t": "กิจกรรมที่ 4: ปรับเกณฑ์ตรวจจับ Hash ผิดปกติ — Avalanche Check (5 คะแนน)\n4.1 (2 คะแนน) — ใช้เกณฑ์เริ่มต้น t=45\n• ธุรกรรม  —  300\n      301  302  303  304  305  306  307  308  309\n• คะแนน  —  92\n      88  81  74  66  58  49  41  33  20\n• ผลจริง  —  ปกติ\n      ผิดปกติ\n• ผลจากเกณฑ์ t=45  —  ปกติ\n      ปกติ ✗  ผิดปกติ\nความแม่นยำของเกณฑ์เริ่มต้น = 9/10 = 90% (TXN-306 ประเมินผิด — คะแนน 49 ≥ 45 จึงถูกจัดเป็น “ปกติ” ทั้งที่ผลจริงคือ “ผิดปกติ”)\n4.2 (1 คะแนน): TXN-306 ประเมินผิดเพียงรายการเดียว เพราะคะแนน (49) สูงกว่าเกณฑ์ t=45 เพียงเล็กน้อย (ต่างกัน 4 หน่วย) ทำให้ถูกจัดเป็น “ปกติ” ทั้งที่ผลจริงคือ “ผิดปกติ” แสดงว่าเกณฑ์ t=45 ตั้งไว้ต่ำเกินไปเล็กน้อยสำหรับข้อมูลชุดนี้\n4.3 (2 คะแนน): ค่า t ที่ถูกต้องอยู่ในช่วง 49 < t ≤ 58 (มากกว่าคะแนนของ TXN-306=49 แต่ไม่เกินคะแนนของ TXN-305=58) ตัวอย่างค่าที่ใช้ได้ เช่น t = 52 ซึ่งจะทำให้ TXN-306 (49 < 52) ถูกจัดเป็น “ผิดปกติ” ถูกต้อง โดยไม่กระทบรายการอื่น รวมเป็นความแม่นยำ 100%"}, {"s": "APPLY", "n": 5, "t": "กิจกรรมที่ 5: ปรับเกณฑ์ความเห็นพ้องของโหนด — Node Agreement (5 คะแนน)\n5.1 (2 คะแนน) — ใช้เกณฑ์เริ่มต้น t=75\n• Block  —  400\n      401  402  403  404  405  406  407  408  409  410  411\n• Node Agr.(%)  —  98\n      95  91  87  84  79  73  68  61  54  47  39\n• ผลจริง  —  ปกติ\n      ผิดปกติ\n• ผลจากเกณฑ์ t=75  —  ปกติ\n      ผิดปกติ ✗  ผิดปกติ\nความแม่นยำของเกณฑ์เริ่มต้น = 10/12 = 83.3% (BLK-406 และ BLK-407 ประเมินผิด — คะแนน 73 และ 68 ต่ำกว่าเกณฑ์ t=75 จึงถูกจัดเป็น “ผิดปกติ” ทั้งที่ผลจริงคือ “ปกติ” — เป็นผลบวกลวง/False Positive)\n5.2 (1 คะแนน): BLK-406 (73) และ BLK-407 (68) ประเมินผิดเพราะเกณฑ์ t=75 สูงเกินไปสำหรับข้อมูลชุดนี้ ทำให้บล็อกปกติที่มีค่า Node Agreement ค่อนข้างสูง (68-73%) แต่ยังไม่ถึง 75% ถูกจัดว่าผิดปกติอย่างไม่เป็นธรรม\n5.3 (2 คะแนน): ค่า t ที่ถูกต้องอยู่ในช่วง 61 < t ≤ 68 (มากกว่าคะแนนของ BLK-408=61 แต่ไม่เกินคะแนนของ BLK-407=68) ตัวอย่างค่าที่ใช้ได้ เช่น t = 65 ซึ่งจะทำให้ BLK-406 (73≥65) และ BLK-407 (68≥65) ถูกจัดเป็น “ปกติ” ถูกต้อง โดย BLK-408 (61<65) ยังคงเป็น “ผิดปกติ” ถูกต้องเช่นเดิม รวมเป็นความแม่นยำ 100%"}, {"s": "APPLY", "n": 6, "t": "กิจกรรมที่ 6: ประกันภัยเที่ยวบินล่าช้าอัตโนมัติ — Smart Contract (8 คะแนน)\n6.1 (3 คะแนน) — ใช้เกณฑ์เริ่มต้น D=60 นาที, A=0%\n• เที่ยวบิน  —  ล่าช้า\n      ตรงกัน%  ผลจริง  ผลจาก D=60,A=0\n• FL-01  —  20\n      95  ไม่จ่าย\n• FL-02  —  45\n      90  ไม่จ่าย\n• FL-03  —  100\n      92  ไม่จ่าย  จ่าย ✗\n• FL-04  —  125\n      96  จ่าย\n• FL-05  —  150\n      45  ไม่จ่าย  จ่าย ✗\n• FL-06  —  180\n      88  จ่าย\n• FL-07  —  210\n      60  ไม่จ่าย  จ่าย ✗\n• FL-08  —  240\n      91  จ่าย\n• FL-09  —  130\n      80  จ่าย\n• FL-10  —  70\n      30  ไม่จ่าย  จ่าย ✗\nความแม่นยำของเกณฑ์เริ่มต้น = 6/10 = 60% (FL-03, FL-05, FL-07, FL-10 ถูกจ่ายชดเชยผิดพลาด เพราะ A=0% ไม่กรองข้อมูลที่ไม่น่าเชื่อถือเลย ทำให้ทุกเที่ยวบินที่ล่าช้า ≥ 60 นาทีได้รับเงินชดเชยโดยไม่พิจารณาความน่าเชื่อถือของข้อมูล)\n6.2 (1 คะแนน): FL-03, FL-05, FL-07, FL-10 มีลักษณะร่วมกันคือล่าช้า ≥ 60 นาที (ผ่านเกณฑ์ D) แต่มีค่าข้อมูลตรงกันระหว่างแหล่งข้อมูล (agree%) ค่อนข้างต่ำเมื่อเทียบกับกลุ่มที่จ่ายจริง (30-92% เทียบกับกลุ่มจ่ายจริงที่ 80-96%) แสดงว่าข้อมูลเที่ยวบินล่าช้าอาจไม่น่าเชื่อถือพอที่จะยืนยันสิทธิ์การจ่ายชดเชยอัตโนมัติ\n6.3 (4 คะแนน)\nค่า D และ A ไม่มีคำตอบตายตัวเพียงชุดเดียว — เงื่อนไขทางคณิตศาสตร์คือ 100 < D ≤ 125 (มากกว่าความล่าช้าของ FL-03=100 แต่ไม่เกินของ FL-04=125) และ 60 < A ≤ 80 (มากกว่าค่าตรงกันของ FL-07=60 แต่ไม่เกินค่าตรงกันของ FL-09=80) ตัวอย่างค่าที่ใช้ได้ เช่น D = 110, A = 70 ซึ่งจะทำให้ FL-03, FL-05, FL-07, FL-10 ทั้ง 4 รายการถูกจัดเป็น “ไม่จ่าย” ถูกต้อง รวมเป็นความแม่นยำ 100% ส่วนคำอธิบายเรื่องการตั้งค่า A ต่ำเกินไป (เช่น A=0): แม้จะช่วยให้ผู้โดยสารที่ล่าช้าจริงได้รับเงินชดเชยเร็วขึ้นโดยไม่ต้องรอตรวจสอบ แต่การไม่พิจารณาความน่าเชื่อถือของข้อมูลเลยทำให้ระบบจ่ายเงินชดเชยผิดพลาดให้กับกรณีที่ข้อมูลแหล่งต่าง ๆ ไม่ตรงกัน (agree% ต่ำ) ซึ่งอาจเกิดจากข้อผิดพลาดของระบบตรวจจับหรือข้อมูลที่ไม่สมบูรณ์ ไม่ใช่ความล่าช้าที่เกิดขึ้นจริง การจ่ายเงินชดเชยผิดพลาดบ่อยครั้งสร้างความเสียหายทางการเงินให้บริษัทประกัน และหากภายหลังพบว่าจ่ายผิดพลาด การเรียกเงินคืนจากผู้เอาประกันก็ยากและกระทบความน่าเชื่อถือของระบบ Smart Contract เอง จึงควรตั้งค่า A ให้สูงพอที่จะกรองข้อมูลที่ไม่น่าเชื่อถือออกไป แม้จะทำให้การจ่ายชดเชยบางกรณีล่าช้าลงบ้างก็ตาม"}, {"s": "REFLECT", "n": 4, "t": "ส่วนที่ 4 · REFLECT — ประเมินตนเอง (15 คะแนน): เป็นการประเมินตนเอง (self-assessment) จึงไม่มีคำตอบ “ถูก/ผิด” ตายตัว ข้อ 4.1-4.4 (Likert 2 คะแนน/ข้อ รวม 8 คะแนน) ให้คะแนนเต็มเมื่อทำเครื่องหมายเลือกคำตอบมาชัดเจนครบถ้วน (1 ตัวเลือกต่อข้อ) ข้อ 4.5 (ปลายเปิด 3 คะแนน) และข้อ 4.6 (ปลายเปิด 4 คะแนน) ให้คะแนนเต็มเมื่อมีคำตอบที่มีเนื้อหาความยาวอย่างน้อย 1-2 ประโยคที่สื่อความหมายได้ (ไม่ปล่อยว่าง) — ใช้แนวทางการประเมินเชิงคุณภาพในส่วน C ประกอบการพิจารณาเพิ่มเติม โดยเฉพาะข้อ 4.6 ซึ่งเป็นคำถามเชิงจริยธรรมเรื่องบทบาทของมนุษย์ในการตรวจสอบระบบอัตโนมัติ\nส่วน B · รูบริคการให้คะแนน\n      รูบริคสำหรับคำถามอัตนัยเชิงเหตุผล (3 มิติ)\nใช้รูบริคนี้ตรวจให้คะแนนคำถามอัตนัยที่ต้องให้เหตุผลประกอบทั้ง 3 ข้อในแบบทดสอบ ได้แก่ ข้อ 3.2 (LEARN ภาระงานที่ 3 — ประโยชน์ของ Avalanche Effect, 3 คะแนน) ข้อ 4.2 (LEARN ภาระงานที่ 4 — การรับมือความผิดปกติ, 3 คะแนน) และข้อ 1.3 (APPLY กิจกรรมที่ 1 — วิเคราะห์สาเหตุการจำแนกผิดพลาด, 3 คะแนน) รูบริคประกอบด้วย 3 มิติ แต่ละมิติแบ่งเป็น 4 ระดับคุณภาพ (ตั้งแต่ระดับ 4 ดีเยี่ยม ถึงระดับ 1 ควรปรับปรุง)\nมิติที่ 1: ความถูกต้องและการอ้างอิงข้อมูลเชิงประจักษ์ (Accuracy & Evidence-based Reasoning)\n• ระดับ  —  เกณฑ์การพิจารณา\n• 4 — ดีเยี่ยม  —  อ้างอิงตัวเลข/ข้อมูลจากตารางได้ถูกต้อง ครบถ้วน และตรงประเด็น ใช้ตัวเลขสนับสนุนข้อสรุปได้อย่างสมเหตุสมผลทุกจุด\n• 3 — ดี  —  อ้างอิงตัวเลข/ข้อมูลจากตารางได้ถูกต้องเป็นส่วนใหญ่ อาจขาดรายละเอียดบางจุดแต่ไม่กระทบข้อสรุปหลัก\n• 2 — พอใช้  —  อ้างอิงข้อมูลได้บางส่วน มีตัวเลขคลาดเคลื่อนหรือไม่ครบถ้วน ทำให้ข้อสรุปไม่หนักแน่นเท่าที่ควร\n• 1 — ควรปรับปรุง  —  ไม่อ้างอิงข้อมูล/ตัวเลขจากตารางเลย หรืออ้างอิงผิดจนข้อสรุปคลาดเคลื่อน\nมิติที่ 2: ความลึกของการให้เหตุผลเชิงเหตุ-ผลและเชิงระบบ (Depth of Causal / Systems Reasoning)\n• ระดับ  —  เกณฑ์การพิจารณา\n• 4 — ดีเยี่ยม  —  อธิบายความเชื่อมโยงเชิงเหตุ-ผลได้ชัดเจน เห็นภาพรวมของระบบ (เช่น กลไก Avalanche Effect หรือข้อแลกเปลี่ยนของการปรับน้ำหนัก) ไม่ใช่แค่บอกข้อเท็จจริง\n• 3 — ดี  —  อธิบายเหตุ-ผลได้ถูกทิศทาง เห็นความเชื่อมโยงหลัก แต่ยังไม่ครอบคลุมมุมมองเชิงระบบทั้งหมด\n• 2 — พอใช้  —  อธิบายในเชิงพรรณนา (บอกว่าเกิดอะไร) มากกว่าอธิบายเหตุผล (ทำไมจึงเกิด) เหตุผลที่ให้ยังตื้นหรือไม่ชัดเจน\n• 1 — ควรปรับปรุง  —  ไม่มีการให้เหตุผลเชิงเหตุ-ผล เป็นเพียงการคัดลอกโจทย์หรือให้คำตอบแบบเดา\nมิติที่ 3: ความชัดเจนในการสื่อสาร (Clarity of Communication)\n• ระดับ  —  เกณฑ์การพิจารณา\n• 4 — ดีเยี่ยม  —  เรียบเรียงความคิดเป็นลำดับ อ่านเข้าใจง่าย ใช้ศัพท์เทคนิค (เช่น Hash, Avalanche Effect, Smart Contract, threshold, น้ำหนักปัจจัย) ได้ถูกต้องเหมาะสม\n• 3 — ดี  —  สื่อสารเข้าใจได้ มีโครงสร้างชัดเจนพอสมควร อาจใช้ศัพท์เทคนิคไม่สม่ำเสมอ\n• 2 — พอใช้  —  สื่อสารเข้าใจได้บางส่วน ลำดับความคิดสับสนหรือประโยคไม่สมบูรณ์\n• 1 — ควรปรับปรุง  —  อ่านไม่เข้าใจ ประโยคขาดตอน หรือคำตอบสั้นเกินกว่าจะสื่อความหมายได้\nตารางแปลงระดับรูบริคเป็นคะแนน (สำหรับแต่ละข้อ)\nนำคะแนนเฉลี่ยจาก 3 มิติ (แต่ละมิติมีน้ำหนักเท่ากัน) มาคำนวณสัดส่วน แล้วเทียบกับคะแนนเต็มของแต่ละข้อ (ข้อ 3.2, 4.2 และ 1.3 ต่างเต็ม 3 คะแนนเท่ากัน) ดังตาราง\n• ระดับเฉลี่ย 3 มิติ  —  ข้อ 3.2 / 4.2 / 1.3 (เต็มข้อละ 3 คะแนน)\n• 4.0 (ดีเยี่ยมทุกมิติ)  —  3\n• 3.0 – 3.9 (ดี)  —  2–3\n• 2.0 – 2.9 (พอใช้)  —  2\n• 1.0 – 1.9 (ควรปรับปรุง)  —  0–1\nส่วน C · แนวทางการประเมิน\n      มิติการประเมินขั้นตอนที่ 4 REFLECT (ประเมินตนเอง)\nขั้นตอน REFLECT มีลักษณะต่างจาก 3 ส่วนแรก เพราะเป็นการให้นักเรียน “ประเมินตนเอง” และสะท้อนคิดเชิงจริยธรรมเรื่องบทบาทของระบบอัตโนมัติกับมนุษย์ ไม่ใช่การวัดความรู้ที่ถูกผิดตายตัว ดังนั้นนอกจากคะแนนตัวเลข (15 คะแนน ตามเกณฑ์ในส่วน A) ผู้ตรวจควรใช้ 3 มิติต่อไปนี้ประกอบการพิจารณาเชิงคุณภาพ โดยเฉพาะข้อ 4.6 ที่ถามเรื่องบทบาทของมนุษย์ในการตรวจสอบร่วมกับระบบอัตโนมัติ เพื่อให้ข้อมูลป้อนกลับ (feedback) แก่นักเรียนและครูผู้สอนในการปรับการเรียนการสอนต่อไป\nมิติที่ 1: ความครบถ้วนและตรงประเด็นของคำตอบ (Completeness & Relevance)\n• ระดับ  —  เกณฑ์การพิจารณา\n• สูง  —  ตอบครบทุกข้อ (4.1-4.6) ตรงประเด็นคำถาม คำตอบปลายเปิด (4.5, 4.6) มีเนื้อหาที่จับต้องได้ ไม่ใช่คำตอบกว้าง ๆ\n• กลาง  —  ตอบครบเกือบทุกข้อ แต่บางข้อปลายเปิดตอบสั้นหรือคลุมเครือ ไม่เจาะจง\n• ต่ำ  —  ตอบไม่ครบ หรือข้ามคำถามปลายเปิดไป หรือคำตอบไม่เกี่ยวข้องกับคำถาม\nมิติที่ 2: ความสอดคล้องระหว่างการประเมินตนเองกับผลการปฏิบัติจริง (Consistency with Observed Performance)\n• ระดับ  —  เกณฑ์การพิจารณา"}], "q": ["ข้อ1คเก็บเป็นบล็อกที่เชื่อมโยงต่อกันเป็นสายโซ่ตามลำดับ3คะแนนตัวเลือกผลเหตุผลเชิงวิชาการกเก็บเป็นบล็อกอิสระที่ไม่เกี่ยวข้องกันไม่ถูกต้องตัวลวงขั C — แนวทางและมิติการประเมินขั้นตอนที่ 4 REFLECT (ประเมินตนเอง)\n3.2 แนวคำตอบอ้างอิง (3 คะแนน — คำถามอัตนัย ใช้รูบริคส่วน B ประกอบ)\nAvalanche Effect ช่วยให้ BlockGuard ตรวจจับการปลอมแปลงหรือแก้ไขข้อมูลได้ง่ายและรวดเร็ว เพราะเมื่อมีการแก้ไขข้อมูลในบล็อกแม้เพียงเล็กน้อย (เช่น เปลี่ยนจำนวนเงิน) ค่า Hash ที่คำนวณใหม่จะเปลี่ยนแปลงไปอย่างสิ้นเชิงทันที (จากตาราง ข้อมูลเปลี่ยน 2% แต่ Hash เปลี่ยนถึง 97%) ทำให้ BlockBot สามารถเปรียบเทียบ Hash แล้วพบความผิดปกติได้อย่างชัดเจนในทันที โดยไม่ต้องตรวจสอบเนื้อหาข้อมูลทีละรายการอย่างละเอียด จึงเป็นกลไกสำคัญที่ทำให้ข้อมูลบนบล็อกเชนยากต่อการปลอมแปลงโดยไม่ถูกตรวจพบ\n4.2 แนวคำตอบอ้างอิง (3 คะแนน — คำถามอัตนัย ใช้รูบริคส่วน B ประกอบ)\nทีมดูแลระบบควรตรวจสอบสาเหตุและบล็อกที่เกี่ยวข้องเพิ่มเติมก่อนตัดสินใจใด ๆ เป็นลำดับแรก เนื่องจากวันศุกร์มีจำนวนบล็อกที่ต้องตรวจสอบสูงถึง 4 รายการ ซึ่งมากกว่าค่าเฉลี่ยของวันอื่นในตาราง (0-2 รายการ) อย่างมีนัยสำคัญ การลบข้อมูลทิ้งทันทีหรือปิดระบบทั้งหมดโดยไม่สืบสวนก่อนอาจทำให้สูญเสียหลักฐานสำคัญของการโจมตีหรือความผิดปกติที่แท้จริง ในขณะที่การเพิกเฉยก็เสี่ยงต่อการปล่อยให้ปัญหาลุกลาม จึงควรวิเคราะห์ข้อมูลเชิงลึกของบล็อกที่ต้องตรวจสอบในวันนั้นก่อน แล้วจึงตัดสินใจขั้นตอนต่อไปตามหลักฐานที่พบ\n1.3 แนวคำตอบอ้างอิง (3 คะแนน — คำถามอัตนัย ใช้รูบริคส่วน B ประกอบ)\nจากตาราง จะเห็นว่าปัจจัย “ความคลาดเคลื่อนของ Hash” (ปัจจัยที่ 1) เป็นตัวบ่งชี้ที่สอดคล้องกับความเสี่ยงจริงมากที่สุด: บล็อกที่ความเสี่ยงจริง = ต่ำ มีค่าปัจจัยนี้อยู่ในช่วง 5-20 เท่านั้น ส่วนบล็อกที่ความเสี่ยงจริง = ปานกลาง มีค่าปัจจัยนี้อยู่ในช่วง 55-85 อย่างชัดเจน แต่เมื่อให้น้ำหนักปัจจัยนี้เท่ากับอีก 4 ปัจจัยที่ไม่สัมพันธ์กับความเสี่ยงจริงอย่างสม่ำเสมอ (เช่น ปัจจัยที่ 2-5 ของ BLK-105 สูงถึง 80, 70, 75 ทั้งที่ความเสี่ยงจริงต่ำ) ค่าเฉลี่ยถ่วงน้ำหนักจึงถูก “ปัจจัยรบกวน” เหล่านี้ดึงออกจากค่าที่ควรจะเป็น กล่าวคือ BLK-103, 106, 108 มีปัจจัยที่ 1 อยู่ในช่วงบ่งชี้ “ปานกลาง” (55-75) แต่ถูกปัจจัยอื่นที่ต่ำดึงคะแนนเฉลี่ยลงมาต่ำกว่า 40 กลายเป็น “ต่ำ” อย่างผิดพลาด ในขณะที่ BLK-105 มีปัจจัยที่ 1 ต่ำ (บ่งชี้ “ต่ำ” ถูกต้อง) แต่ถูกปัจจัยอื่นที่สูงดันคะแนนเฉลี่ยขึ้นมาเป็น “ปานกลาง” อย่างผิดพลาด แนวทางแก้ไขเชิงแนวคิด (ไม่ต้องคำนวณตัวเลขใหม่) คือควรเพิ่มน้ำหนักของปัจจัยที่ 1 ให้มากกว่าปัจจัยอื่น เนื่องจากเป็นปัจจัยที่มีความสัมพันธ์กับความเสี่ยงจริงชัดเจนที่สุดในชุดข้อมูลนี้ แต่ก็ควรระวังไม่ให้ลดทอนน้ำหนักของปัจจัยอื่นจนเหลือน้อยเกินไป เพราะอาจทำให้ระบบพลาดกรณีที่ปัจจัยอื่นเป็นสัญญาณสำคัญ (เช่น BLK-104 ที่ทุกปัจจัยสูงพร้อมกัน)\nส่วน B · รูบริคการให้คะแนน\n      รูบริคสำหรับคำถามอัตนัยเชิงเหตุผล (3 มิติ)\nใช้รูบริคนี้ตรวจให้คะแนนคำถามอัตนัยที่ต้องให้เหตุผลประกอบทั้ง 3 ข้อในแบบทดสอบ ได้แก่ ข้อ 3.2 (LEARN ภาระงานที่ 3 — ประโยชน์ของ Avalanche Effect, 3 คะแนน) ข้อ 4.2 (LEARN ภาระงานที่ 4 — การรับมือความผิดปกติ, 3 คะแนน) และข้อ 1.3 (APPLY กิจกรรมที่ 1 — วิเคราะห์สาเหตุการจำแนกผิดพลาด, 3 คะแนน) รูบริคประกอบด้วย 3 มิติ แต่ละมิติแบ่งเป็น 4 ระดับคุณภาพ (ตั้งแต่ระดับ 4 ดีเยี่ยม ถึงระดับ 1 ควรปรับปรุง)\nมิติที่ 1: ความถูกต้องและการอ้างอิงข้อมูลเชิงประจักษ์ (Accuracy & Evidence-based Reasoning)\n• ระดับ  —  เกณฑ์การพิจารณา\n• 4 — ดีเยี่ยม  —  อ้างอิงตัวเลข/ข้อมูลจากตารางได้ถูกต้อง ครบถ้วน และตรงประเด็น ใช้ตัวเลขสนับสนุนข้อสรุปได้อย่างสมเหตุสมผลทุกจุด\n• 3 — ดี  —  อ้างอิงตัวเลข/ข้อมูลจากตารางได้ถูกต้องเป็นส่วนใหญ่ อาจขาดรายละเอียดบางจุดแต่ไม่กระทบข้อสรุปหลัก\n• 2 — พอใช้  —  อ้างอิงข้อมูลได้บางส่วน มีตัวเลขคลาดเคลื่อนหรือไม่ครบถ้วน ทำให้ข้อสรุปไม่หนักแน่นเท่าที่ควร\n• 1 — ควรปรับปรุง  —  ไม่อ้างอิงข้อมูล/ตัวเลขจากตารางเลย หรืออ้างอิงผิดจนข้อสรุปคลาดเคลื่อน\nมิติที่ 2: ความลึกของการให้เหตุผลเชิงเหตุ-ผลและเชิงระบบ (Depth of Causal / Systems Reasoning)\n• ระดับ  —  เกณฑ์การพิจารณา\n• 4 — ดีเยี่ยม  —  อธิบายความเชื่อมโยงเชิงเหตุ-ผลได้ชัดเจน เห็นภาพรวมของระบบ (เช่น กลไก Avalanche Effect หรือข้อแลกเปลี่ยนของการปรับน้ำหนัก) ไม่ใช่แค่บอกข้อเท็จจริง\n• 3 — ดี  —  อธิบายเหตุ-ผลได้ถูกทิศทาง เห็นความเชื่อมโยงหลัก แต่ยังไม่ครอบคลุมมุมมองเชิงระบบทั้งหมด\n• 2 — พอใช้  —  อธิบายในเชิงพรรณนา (บอกว่าเกิดอะไร) มากกว่าอธิบายเหตุผล (ทำไมจึงเกิด) เหตุผลที่ให้ยังตื้นหรือไม่ชัดเจน\n• 1 — ควรปรับปรุง  —  ไม่มีการให้เหตุผลเชิงเหตุ-ผล เป็นเพียงการคัดลอกโจทย์หรือให้คำตอบแบบเดา\nมิติที่ 3: ความชัดเจนในการสื่อสาร (Clarity of Communication)\n• ระดับ  —  เกณฑ์การพิจารณา\n• 4 — ดีเยี่ยม  —  เรียบเรียงความคิดเป็นลำดับ อ่านเข้าใจง่าย ใช้ศัพท์เทคนิค (เช่น Hash, Avalanche Effect, Smart Contract, threshold, น้ำหนักปัจจัย) ได้ถูกต้องเหมาะสม\n• 3 — ดี  —  สื่อสารเข้าใจได้ มีโครงสร้างชัดเจนพอสมควร อาจใช้ศัพท์เทคนิคไม่สม่ำเสมอ\n• 2 — พอใช้  —  สื่อสารเข้าใจได้บางส่วน ลำดับความคิดสับสนหรือประโยคไม่สมบูรณ์\n• 1 — ควรปรับปรุง  —  อ่านไม่เข้าใจ ประโยคขาดตอน หรือคำตอบสั้นเกินกว่าจะสื่อความหมายได้\nตารางแปลงระดับรูบริคเป็นคะแนน (สำหรับแต่ละข้อ)\nนำคะแนนเฉลี่ยจาก 3 มิติ (แต่ละมิติมีน้ำหนักเท่ากัน) มาคำนวณสัดส่วน แล้วเทียบกับคะแนนเต็มของแต่ละข้อ (ข้อ 3.2, 4.2 และ 1.3 ต่างเต็ม 3 คะแนนเท่ากัน) ดังตาราง\n• ระดับเฉลี่ย 3 มิติ  —  ข้อ 3.2 / 4.2 / 1.3 (เต็มข้อละ 3 คะแนน)\n• 4.0 (ดีเยี่ยมทุกมิติ)  —  3\n• 3.0 – 3.9 (ดี)  —  2–3\n• 2.0 – 2.9 (พอใช้)  —  2\n• 1.0 – 1.9 (ควรปรับปรุง)  —  0–1\nส่วน C · แนวทางการประเมิน\n      มิติการประเมินขั้นตอนที่ 4 REFLECT (ประเมินตนเอง)\nขั้นตอน REFLECT มีลักษณะต่างจาก 3 ส่วนแรก เพราะเป็นการให้นักเรียน “ประเมินตนเอง” และสะท้อนคิดเชิงจริยธรรมเรื่องบทบาทของระบบอัตโนมัติกับมนุษย์ ไม่ใช่การวัดความรู้ที่ถูกผิดตายตัว ดังนั้นนอกจากคะแนนตัวเลข (15 คะแนน ตามเกณฑ์ในส่วน A) ผู้ตรวจควรใช้ 3 มิติต่อไปนี้ประกอบการพิจารณาเชิงคุณภาพ โดยเฉพาะข้อ 4.6 ที่ถามเรื่องบทบาทของมนุษย์ในการตรวจสอบร่วมกับระบบอัตโนมัติ เพื่อให้ข้อมูลป้อนกลับ (feedback) แก่นักเรียนและครูผู้สอนในการปรับการเรียนการสอนต่อไป\nมิติที่ 1: ความครบถ้วนและตรงประเด็นของคำตอบ (Completeness & Relevance)\n• ระดับ  —  เกณฑ์การพิจารณา\n• สูง  —  ตอบครบทุกข้อ (4.1-4.6) ตรงประเด็นคำถาม คำตอบปลายเปิด (4.5, 4.6) มีเนื้อหาที่จับต้องได้ ไม่ใช่คำตอบกว้าง ๆ\n• กลาง  —  ตอบครบเกือบทุกข้อ แต่บางข้อปลายเปิดตอบสั้นหรือคลุมเครือ ไม่เจาะจง\n• ต่ำ  —  ตอบไม่ครบ หรือข้ามคำถามปลายเปิดไป หรือคำตอบไม่เกี่ยวข้องกับคำถาม\nมิติที่ 2: ความสอดคล้องระหว่างการประเมินตนเองกับผลการปฏิบัติจริง (Consistency with Observed Performance)\n• ระดับ  —  เกณฑ์การพิจารณา"};
