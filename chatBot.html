<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>แบบฝึกฝนเทียบเคียง PISA 2025 LDW — Chatbot มั่นคงวัสดุภัณฑ์</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  :root{
    --concrete:#F1EDE4;
    --concrete-dark:#E4DDCE;
    --ink:#23201B;
    --ink-soft:#5B564C;
    --orange:#E1611B;
    --orange-dark:#B84D12;
    --steel:#2E5266;
    --steel-light:#4B7A93;
    --rebar:#8C8577;
    --good:#3F7A4E;
    --bad:#B0463D;
    --paper:#FFFDF8;
    --line:#D8D0BF;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--concrete);
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size:34px 34px;
    color:var(--ink);
    font-family:'IBM Plex Sans Thai', sans-serif;
    line-height:1.65;
    min-height:100vh;
  }
  h1,h2,h3,.display{font-family:'Kanit',sans-serif;}
  .app{max-width:920px;margin:0 auto;padding:0 18px 60px;}

  /* Top bar */
  .topbar{
    position:sticky;top:0;z-index:30;
    background:var(--ink);
    color:var(--concrete);
    padding:10px 18px;
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    border-bottom:4px solid var(--orange);
  }
  .topbar .brand{font-family:'Kanit';font-weight:700;font-size:15px;letter-spacing:.2px;display:flex;align-items:center;gap:8px;}
  .topbar .who{margin-left:auto;font-size:13px;color:#D8D2C4;display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .who b{color:#fff;}
  .topbar .who{margin-right:18px;}
  .timer{font-size:13px;color:#D8D2C4;display:flex;align-items:center;gap:6px;white-space:nowrap;}
  .timer b{font-family:'Kanit';font-size:18px;color:#fff;background:var(--steel);padding:1px 10px;border-radius:6px;font-variant-numeric:tabular-nums;}
  .timer.warn b{background:var(--orange);}
  .timer.over b{background:var(--bad);}
  .who .tag{background:var(--steel);color:#fff;padding:2px 9px;border-radius:20px;font-size:12px;}
  .progress-rail{display:flex;gap:4px;width:100%;margin-top:8px;}
  .progress-rail .seg{flex:1;height:6px;border-radius:3px;background:#463F33;position:relative;overflow:hidden;}
  .progress-rail .seg.done{background:var(--orange);}
  .progress-rail .seg.current{background:linear-gradient(90deg,var(--orange) 50%,#463F33 50%);}
  .progress-labels{display:flex;justify-content:space-between;font-size:10.5px;color:#B7AF9E;margin-top:4px;letter-spacing:.3px;}

  /* Card */
  .card{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:26px 26px 22px;
    margin-top:22px;
    box-shadow:0 1px 0 rgba(35,32,27,.04);
  }
  .eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--orange-dark);font-weight:600;margin-bottom:6px;}
  .eyebrow .dot{width:7px;height:7px;background:var(--orange);border-radius:50%;}
  h2.section-title{font-size:23px;margin:0 0 4px;color:var(--ink);}
  .subtitle{color:var(--ink-soft);font-size:14.5px;margin:0 0 16px;}

  /* Buttons */
  .btn{
    font-family:'Kanit';font-weight:600;font-size:15px;
    background:var(--orange);color:#fff;border:none;
    padding:11px 22px;border-radius:6px;cursor:pointer;
    transition:transform .08s ease, background .15s;
  }
  .btn:hover{background:var(--orange-dark);}
  .btn:active{transform:scale(.98);}
  .btn.secondary{background:transparent;color:var(--steel);border:1.5px solid var(--steel);}
  .btn.secondary:hover{background:var(--steel);color:#fff;}
  .btn:disabled{background:#C9C2B2;cursor:not-allowed;}
  .btn-row{display:flex;justify-content:space-between;margin-top:24px;gap:10px;}

  /* Form */
  label.field-label{display:block;font-weight:600;font-size:14px;margin-bottom:6px;color:var(--ink);}
  input[type=text], select, textarea{
    width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:6px;
    font-family:'IBM Plex Sans Thai';font-size:15px;background:#fff;color:var(--ink);
  }
  textarea{resize:vertical;min-height:90px;}
  input[type=text]:focus, select:focus, textarea:focus{outline:2px solid var(--steel-light);border-color:var(--steel-light);}
  .field{margin-bottom:18px;}

  /* MCQ */
  .qtext{font-size:16.5px;font-weight:600;margin:14px 0 12px;color:var(--ink);}
  .options{display:flex;flex-direction:column;gap:9px;}
  .opt{
    display:flex;gap:10px;align-items:flex-start;
    border:1.5px solid var(--line);border-radius:7px;padding:11px 13px;
    cursor:pointer;background:#fff;transition:border-color .1s, background .1s;
  }
  .opt:hover{border-color:var(--steel-light);}
  .opt.selected{border-color:var(--orange);background:#FDF1E9;}
  .opt input{margin-top:3px;}
  .qcounter{font-size:12.5px;color:var(--ink-soft);letter-spacing:.3px;}

  /* Chart wrap */
  .chart-wrap{background:#fff;border:1px solid var(--line);border-radius:8px;padding:14px;margin:14px 0;}
  .chart-wrap canvas{max-height:260px;}
  .teach-box{background:var(--concrete-dark);border-left:4px solid var(--steel);padding:12px 15px;border-radius:0 6px 6px 0;font-size:14.5px;margin:12px 0;}

  /* Chat bubbles hero */
  .chat-demo{display:flex;flex-direction:column;gap:10px;margin:18px 0;}
  .bubble{max-width:78%;padding:10px 14px;border-radius:14px;font-size:14.5px;position:relative;}
  .bubble.user{align-self:flex-start;background:#fff;border:1.5px solid var(--line);border-bottom-left-radius:3px;}
  .bubble.bot{align-self:flex-end;background:var(--steel);color:#fff;border-bottom-right-radius:3px;}
  .bubble .intent-tag{display:inline-block;margin-top:6px;font-size:11px;background:var(--orange);color:#fff;padding:1px 8px;border-radius:10px;font-family:'Kanit';}

  /* Apply activity */
  .control{margin-bottom:16px;}
  .control-head{display:flex;justify-content:space-between;font-size:14px;font-weight:600;margin-bottom:4px;}
  .control-head .val{font-family:'Kanit';color:var(--orange-dark);}
  input[type=range]{width:100%;accent-color:var(--orange);}
  table.msg-table{width:100%;border-collapse:collapse;margin-top:14px;font-size:13.8px;}
  table.msg-table th, table.msg-table td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;}
  table.msg-table th{color:var(--ink-soft);font-weight:600;font-size:12.5px;text-transform:none;}
  .pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;font-family:'Kanit';font-weight:600;}
  .pill.BUY{background:#FDE7DA;color:var(--orange-dark);}
  .pill.PRICE{background:#DDEAF0;color:var(--steel);}
  .pill.PRODUCT{background:#E4EEDF;color:var(--good);}
  .pill.CLARIFY{background:#EFEAE0;color:var(--ink-soft);}
  .row-ok{background:#F2F8F3;}
  .row-bad{background:#FBEEEC;}
  .accbar-wrap{margin-top:16px;background:var(--concrete-dark);border-radius:20px;height:14px;overflow:hidden;}
  .accbar-fill{height:100%;background:var(--good);transition:width .25s;}
  .acc-readout{display:flex;justify-content:space-between;margin-top:6px;font-size:13.5px;font-weight:600;}

  /* Likert */
  .likert-row{margin-bottom:20px;}
  .likert-stmt{font-size:15px;font-weight:500;margin-bottom:8px;}
  .likert-scale{display:flex;gap:8px;}
  .likert-opt{flex:1;text-align:center;border:1.5px solid var(--line);border-radius:7px;padding:9px 4px;cursor:pointer;font-size:12.5px;background:#fff;}
  .likert-opt.selected{border-color:var(--steel);background:#EAF1F4;color:var(--steel);font-weight:600;}

  /* Report */
  .score-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0;}
  .score-box{background:var(--concrete-dark);border-radius:8px;padding:14px 10px;text-align:center;}
  .score-box .n{font-family:'Kanit';font-size:24px;font-weight:700;color:var(--steel);}
  .score-box .l{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
  .level-banner{padding:18px;border-radius:8px;text-align:center;margin:14px 0;color:#fff;}
  .level-banner .lv{font-family:'Kanit';font-size:26px;font-weight:700;}
  .save-status{font-size:13px;color:var(--ink-soft);margin-top:10px;text-align:center;}
  .hist-table{width:100%;border-collapse:collapse;margin-top:10px;font-size:12.8px;}
  .hist-table th,.hist-table td{border-bottom:1px solid var(--line);padding:6px 5px;text-align:center;}
  .hist-table th{background:var(--concrete-dark);}

  .stripe{height:8px;background:repeating-linear-gradient(45deg,var(--ink) 0 10px, var(--orange) 10px 20px);border-radius:4px;margin:20px 0;}
  footer{text-align:center;color:var(--ink-soft);font-size:12px;margin-top:30px;padding-bottom:10px;}
  .icon{width:20px;height:20px;flex-shrink:0;}
  @media(max-width:600px){
    .score-grid{grid-template-columns:repeat(2,1fr);}
    .bubble{max-width:88%;}
  }

  .phone{width:300px;max-width:100%;margin:22px auto;border:9px solid var(--ink);border-radius:34px;background:#EDE6DA;overflow:hidden;box-shadow:0 8px 24px rgba(35,32,27,.25);position:relative;}
  .phone-notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:90px;height:16px;background:var(--ink);border-radius:0 0 12px 12px;z-index:2;}
  .phone-status{background:var(--steel);color:#fff;font-size:11px;display:flex;justify-content:space-between;padding:5px 16px 3px;}
  .phone-head{background:var(--steel);color:#fff;display:flex;gap:10px;align-items:center;padding:8px 14px 10px;}
  .avatar{width:34px;height:34px;border-radius:50%;background:var(--orange);display:flex;align-items:center;justify-content:center;font-size:18px;}
  .pname{font-family:'Kanit';font-weight:600;font-size:14px;line-height:1.2;}
  .pstat{font-size:11px;color:#BFE3C5;}
  .phone-body{padding:12px 10px;display:flex;flex-direction:column;gap:8px;min-height:260px;}
  .msg{max-width:80%;padding:7px 11px;border-radius:14px;font-size:13.5px;line-height:1.45;}
  .msg .t{display:block;font-size:9.5px;opacity:.6;text-align:right;margin-top:2px;}
  .msg.me{align-self:flex-end;background:#DCF3D0;border-bottom-right-radius:3px;}
  .msg.bot{align-self:flex-start;background:#fff;border-bottom-left-radius:3px;}
  .msg .intent-tag{display:inline-block;margin-left:6px;font-size:11px;background:var(--orange);color:#fff;padding:1px 8px;border-radius:10px;font-family:'Kanit';}
  .phone-input{display:flex;gap:8px;padding:8px 10px;background:#fff;border-top:1px solid var(--line);}
  .fake-input{flex:1;background:var(--concrete);border-radius:16px;padding:6px 12px;font-size:12.5px;color:var(--rebar);}
  .send{width:30px;height:30px;border-radius:50%;background:var(--orange);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;}

  /* --- Scratch-like command blocks --- */
  .blocks-hint{font-size:13px;color:var(--ink-soft);background:var(--concrete);border-radius:6px;padding:9px 12px;margin:12px 0;}
  .blocks-layout{display:grid;grid-template-columns:1fr 1.15fr;gap:16px;align-items:start;}
  .col-head{font-size:14px;margin:0 0 8px;color:var(--ink-soft);font-weight:600;}
  .palette,.script{background:var(--concrete);border:1px dashed var(--line);border-radius:8px;padding:12px 10px;min-height:120px;}
  .sblock{
    position:relative;cursor:grab;user-select:none;
    color:#fff;font-size:13.2px;line-height:1.4;font-weight:500;
    padding:11px 13px 11px 15px;margin:0 0 14px;border-radius:6px;
    box-shadow:0 2px 0 rgba(0,0,0,.22);
  }
  .sblock:last-child{margin-bottom:4px;}
  .sblock::before{content:'';position:absolute;top:-6px;left:16px;width:20px;height:7px;background:inherit;border-radius:3px 3px 0 0;}
  .sblock::after{content:'';position:absolute;bottom:-7px;left:16px;width:20px;height:7px;background:inherit;border-radius:0 0 4px 4px;box-shadow:0 2px 0 rgba(0,0,0,.18);}
  .sblock.cond{background:#E0A32E;}
  .sblock.act{background:#4C97D6;}
  .sblock.else{background:#CF63CF;}
  .sblock.picked{outline:3px solid var(--ink);outline-offset:2px;}
  .sblock:active{cursor:grabbing;}
  .sblock.in-slot{margin:0;}
  .sblock.in-slot::after{display:none;}
  .slot-row{margin-bottom:12px;}
  .slot-label{font-size:11.5px;color:var(--ink-soft);margin-bottom:3px;}
  .slot{border:2px dashed var(--rebar);border-radius:7px;min-height:46px;padding:5px;background:#FFFDF8;display:flex;align-items:center;}
  .slot.filled{border-style:solid;border-color:transparent;background:transparent;padding:0;}
  .slot.filled .sblock{width:100%;}
  .slot.over{border-color:var(--orange);background:#FDF1E9;}
  .slot.ready:not(.filled){border-color:var(--orange);}
  .slot-empty{font-size:12.5px;color:var(--rebar);padding-left:8px;}
  .empty-note{font-size:12.5px;color:var(--rebar);text-align:center;padding:14px 0;}
  @media(max-width:700px){ .blocks-layout{grid-template-columns:1fr;} }
</style>
</head>
<body>
<div id="topbar" class="topbar" style="display:none;">
  <div class="brand">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5h16v10H8l-4 4V5z"/></svg>
    Chatbot RiskGuard · มั่นคงวัสดุภัณฑ์
  </div>
  <div class="who" id="whoBox"></div>
  <div class="timer" id="timerBox">เหลือเวลา <b id="timerVal">30:00</b></div>
  <div style="width:100%;">
    <div class="progress-rail" id="progressRail"></div>
    <div class="progress-labels"><span>SHOW</span><span>LEARN</span><span>APPLY</span><span>REFLECT</span><span>REPORT</span></div>
  </div>
</div>

<div class="app">
  <div id="screen"></div>
  <footer>แบบฝึกฝนเทียบเคียงกรอบการประเมิน PISA 2025 — Learning in the Digital World (LDW) · สถานการณ์จำลอง ไม่ใช่เครื่องมือให้บริการจริง</footer>
</div>

<script>
/* ============================= DATA ============================= */

const WEBAPP_URL = "https://script.google.com/macros/s/AKfycby_qOyx8J8WZJyRuYGKmdy6sdMGg3gvo4cOIXbCex56Nok1W2zVID81M41o40rQAyW9/exec";
const SHEET_NAME = "Sheet8";
const SCENARIO_NAME = "Chatbot มั่นคงวัสดุภัณฑ์";
const GRADE_OPTIONS = ["ชั้นมัธยมศึกษาปีที่ 2","ชั้นมัธยมศึกษาปีที่ 3","ชั้นมัธยมศึกษาปีที่ 4","ปวช."];

const state = {
  screen:"intro",
  name:"",
  grade:"",
  showIdx:0, showAnswers:[null,null,null,null,null],
  learnIdx:0, learnAnswers:[null,null,null,null,null,null,null],
  applyIdx:0, applyResults:[null,null,null,null,null], // locked accuracy per activity (0-1)
  applyState:{}, // live control values per activity
  reflectLikert:[null,null,null,null],
  reflectOpen:["",""],
  saving:false, saveMsg:"", history:[], timedOut:false
};

const SHOW_Q = [
 { q:"Chatbot ในบริบทของร้านค้าออนไลน์ทำหน้าที่อะไรเป็นหลัก?",
   opts:["โต้ตอบกับลูกค้าด้วยข้อความแทนพนักงานได้ตลอดเวลา","เก็บภาษีสินค้าให้ร้านค้าโดยอัตโนมัติ","จัดส่งสินค้าให้ลูกค้าโดยไม่ต้องใช้พนักงานขนส่ง","คำนวณภาษีนำเข้าสินค้าวัสดุก่อสร้าง"], correct:0},
 { q:"คำว่า “Intent” ในระบบแชทบอท หมายถึงสิ่งใด?",
   opts:["รหัสสินค้าที่ลูกค้าต้องการซื้อ","จำนวนตัวอักษรในข้อความของลูกค้า","ชื่อผู้ดูแลระบบแชทบอท","ความตั้งใจหรือเป้าหมายที่แท้จริงของข้อความที่ผู้ใช้พิมพ์เข้ามา"], correct:3},
 { q:"เพราะเหตุใดระบบจึงควรคำนวณ “คะแนน” รวมของคำบ่งชี้ทั้งประโยค แทนที่จะตัดสินจากคำแรกที่พบเพียงคำเดียว?",
   opts:["เพื่อให้ประมวลผลเร็วขึ้นโดยไม่ต้องอ่านทั้งประโยค","เพื่อพิจารณาน้ำหนักของคำบ่งชี้ทุกคำร่วมกัน ลดโอกาสตัดสินใจผิดจากคำเดียว","เพราะคำแรกในประโยคภาษาไทยมักไม่มีความหมาย","เพื่อลดจำนวนคำที่ต้องเก็บในฐานข้อมูล"], correct:1},
 { q:"จากกราฟแสดงจำนวนข้อความที่ลูกค้าถามในแต่ละหมวด (ซื้อ 40, ถามราคา 55, ถามรายการสินค้า 25) หมวดใดที่ลูกค้าถามมากที่สุด?",
   opts:["ถามซื้อสินค้า","ถามรายการสินค้า","ถามราคาสินค้า","มากเท่ากันทุกหมวด"], correct:2, chart:{labels:["ซื้อสินค้า","ถามราคา","ถามรายการสินค้า"],data:[40,55,25]}},
 { q:"เหตุใดข้อความภาษาถิ่นหรือคำสะกดผิด เช่น “มีปูนก่อขายบ่” จึงเป็นความท้าทายของแชทบอท?",
   opts:["เพราะคำเหล่านี้ไม่ตรงกับรูปแบบมาตรฐานที่ระบบถูกฝึกให้จดจำ จึงอาจตรวจไม่พบคำบ่งชี้","เพราะลูกค้าพิมพ์เร็วเกินไปจนระบบประมวลผลไม่ทัน","เพราะภาษาถิ่นมีตัวอักษรมากกว่าภาษามาตรฐาน","เพราะระบบไม่อนุญาตให้พิมพ์ภาษาถิ่น"], correct:0},
];

const LEARN_TASKS = [
 { title:"ภาระงานที่ 1 · น้ำหนักคะแนนของคำบ่งชี้ Intent",

function decide(scores, margin){
  const entries = Object.entries(scores).sort((a,b)=>b[1]-a[1]);
  const top = entries[0][1], second = entries[1][1];
  return (top - second) > margin ? entries[0][0] : "CLARIFY";
}

const $ = sel => document.querySelector(sel);
function el(html){ const d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstChild; }

function updateTopbar(){
  const tb = $('#topbar');
  if(state.screen==='intro'){ tb.style.display='none'; return; }
  tb.style.display='flex';
  $('#whoBox').innerHTML = `<span><b>${escapeHtml(state.name)}</b></span><span class="tag">${escapeHtml(state.grade)}</span>`;
  const order = ['show','learn','apply','reflect','report'];
  const curIdx = order.indexOf(state.screen);
  const rail = $('#progressRail'); rail.innerHTML='';
  order.forEach((s,i)=>{
    const seg = document.createElement('div');
    seg.className = 'seg' + (i<curIdx?' done':'') + (i===curIdx?' current':'');
    rail.appendChild(seg);
  });
}
function escapeHtml(s){ return (s||'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

let chartInstances = [];
function destroyCharts(){ chartInstances.forEach(c=>c.destroy()); chartInstances=[]; }

function renderChart(canvas, cfg){
  if(cfg.type==='bar'){
    const c = new Chart(canvas, {type:'bar', data:{labels:cfg.labels, datasets:[{label:'คะแนนน้ำหนัก/จำนวน', data:cfg.data, backgroundColor:cfg.color}]},
      options:{plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true}}}});
    chartInstances.push(c);
  } else if(cfg.type==='line'){
    const c = new Chart(canvas, {type:'line', data:{labels:cfg.labels, datasets:[{label:'BUY Score สะสม', data:cfg.data, borderColor:cfg.color, backgroundColor:cfg.color, tension:.25, fill:false, pointRadius:5}]},
      options:{plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true, suggestedMax:8}}}});
    chartInstances.push(c);
  } else if(cfg.type==='grouped'){
    const c = new Chart(canvas, {type:'bar', data:{labels:cfg.labels, datasets:cfg.series.map(s=>({label:s.name, data:s.data, backgroundColor:s.color}))},
      options:{scales:{y:{beginAtZero:true}}}});
    chartInstances.push(c);
  }
}

/* ============================= SCORING ============================= */
function computeShowScore(){
  let c=0; SHOW_Q.forEach((q,i)=>{ if(state.showAnswers[i]===q.correct) c++; });
  return c/SHOW_Q.length*100;
}
function learnTaskScore(t, ans){
  // returns 0..1 for one task
  if(t.type==='blocks'){
    if(!Array.isArray(ans)) return 0;
    let ok=0;
    t.slots.forEach((s,i)=>{ if(ans[i]===s.ans) ok++; });
    return ok/t.slots.length;
  }
  return ans===t.correct ? 1 : 0;
}
function learnTaskWeight(t){ return t.type==='blocks' ? 2 : 1; }
function computeLearnScore(){
  let got=0, total=0;
  LEARN_TASKS.forEach((t,i)=>{
    const w = learnTaskWeight(t);
    total += w;
    got += w * learnTaskScore(t, state.learnAnswers[i]);
  });
  return total? got/total*100 : 0;
}
function computeApplyScore(){
  const vals = state.applyResults.filter(v=>v!==null);
  if(vals.length===0) return 0;
  const sum = vals.reduce((a,b)=>a+b,0);
  return sum/state.applyResults.length*100;
}
function computeReflectScore(){
  let pts=0;
  state.reflectLikert.forEach(v=>{ if(v!==null) pts+=12.5; });
  state.reflectOpen.forEach(v=>{ if(v && v.trim().length>=15) pts+=25; });
  return pts;
}
function computeOverall(show,learn,apply,reflect){
  return show*0.10 + learn*0.40 + apply*0.35 + reflect*0.15;
}
function qualityLevel(overall){
  if(overall>=85) return {n:4,label:"ระดับ 4 — Advanced (เชี่ยวชาญ)", color:"#3F7A4E"};
  if(overall>=70) return {n:3,label:"ระดับ 3 — Proficient (ชำนาญ)", color:"#2E5266"};
  if(overall>=50) return {n:2,label:"ระดับ 2 — Basic (พื้นฐาน)", color:"#B8862D"};
  return {n:1,label:"ระดับ 1 — Needs Improvement (ต้องพัฒนา)", color:"#B0463D"};
}

function renderMCQScreen(opts){

}

      <div class="script-col">
        <h3 class="col-head">พื้นที่ประกอบคำสั่ง</h3>
        <div class="script" id="script"></div>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn secondary" id="backBtn">ย้อนกลับ</button>
      <button class="btn" id="nextBtn">${i===LEARN_TASKS.length-1 ? "ไปขั้นตอน APPLY" : "ภาระงานถัดไป"}</button>
    </div>
  </div>`);
  $('#screen').appendChild(wrap);

  const paletteEl = wrap.querySelector('#palette');
  const scriptEl = wrap.querySelector('#script');

  function blockHtml(b, extraClass){
    return `<div class="sblock ${b.kind} ${extraClass||''}" draggable="true" data-id="${b.id}">${b.text}</div>`;
  }
  function byId(id){ return t.blocks.find(b=>b.id===id); }

  // Shuffle the palette once per task so the listed order never reveals the answer.
  if(!t._order){
    const arr = t.blocks.map(b=>b.id);
    let seed = t.slots.length*7919 + t.blocks.length*104729;
    for(let k=arr.length-1;k>0;k--){
      seed = (seed*1103515245 + 12345) & 0x7fffffff;
      const j = seed % (k+1);
      [arr[k],arr[j]] = [arr[j],arr[k]];
    }
    t._order = arr;
  }
  const orderedBlocks = t._order.map(id=>t.blocks.find(b=>b.id===id));

  function draw(){
    // palette = blocks not yet placed
    paletteEl.innerHTML = orderedBlocks
      .filter(b=>!placed.includes(b.id))
      .map(b=>blockHtml(b)).join('') || '<div class="empty-note">วางบล็อกครบแล้ว</div>';

    scriptEl.innerHTML = t.slots.map((s,si)=>{
      const id = placed[si];
      const inner = id ? blockHtml(byId(id),'in-slot') : '<div class="slot-empty">วางบล็อกที่นี่</div>';
      return `<div class="slot-row">
        <div class="slot-label">${s.label}</div>
        <div class="slot ${id?'filled':''} ${picked?'ready':''}" data-slot="${si}">${inner}</div>
      </div>`;
    }).join('');

    bind();
    const nb = wrap.querySelector('#nextBtn');
    nb.disabled = placed.some(x=>x===null);
  }

  function place(slotIdx, blockId){
    const prev = placed.indexOf(blockId);
    if(prev !== -1) placed[prev] = null;      // move within script
    placed[slotIdx] = blockId;
    picked = null;
    draw();
  }

  function bind(){
    paletteEl.querySelectorAll('.sblock').forEach(b=>{
      b.addEventListener('dragstart', e=>{ e.dataTransfer.setData('text/plain', b.dataset.id); });
      b.onclick = ()=>{
        picked = (picked===b.dataset.id) ? null : b.dataset.id;
        paletteEl.querySelectorAll('.sblock').forEach(x=>x.classList.toggle('picked', x.dataset.id===picked));
        scriptEl.querySelectorAll('.slot').forEach(x=>x.classList.toggle('ready', !!picked));
      };
    });
    scriptEl.querySelectorAll('.sblock').forEach(b=>{
      b.addEventListener('dragstart', e=>{ e.dataTransfer.setData('text/plain', b.dataset.id); });
      b.onclick = (e)=>{
        e.stopPropagation();
        const si = placed.indexOf(b.dataset.id);
        if(si!==-1){ placed[si]=null; picked=null; draw(); }
      };
    });
    scriptEl.querySelectorAll('.slot').forEach(sl=>{
      sl.addEventListener('dragover', e=>{ e.preventDefault(); sl.classList.add('over'); });
      sl.addEventListener('dragleave', ()=> sl.classList.remove('over'));
      sl.addEventListener('drop', e=>{
        e.preventDefault(); sl.classList.remove('over');
        const id = e.dataTransfer.getData('text/plain');
        if(id) place(parseInt(sl.dataset.slot), id);
      });
      sl.onclick = ()=>{ if(picked) place(parseInt(sl.dataset.slot), picked); };
    });
  }

  draw();
  wrap.querySelector('#backBtn').onclick = ()=>{
    if(i>0){ state.learnIdx--; } else { state.screen='show'; state.showIdx=SHOW_Q.length-1; }
    render();
  };
  wrap.querySelector('#nextBtn').onclick = ()=>{
    if(placed.some(x=>x===null)) return;
    if(i<LEARN_TASKS.length-1){ state.learnIdx++; } else { state.screen='apply'; state.applyIdx=0; }
    render();
  };
}

function getApplyCtrlState(actIdx){
  const act = APPLY_ACTIVITIES[actIdx];
  if(!state.applyState[act.id]) state.applyState[act.id] = Object.assign({}, act.defaults);
  return state.applyState[act.id];
}

function renderApply(){
  const idx = state.applyIdx, act = APPLY_ACTIVITIES[idx];
  const ctrl = getApplyCtrlState(idx);

  const wrap = el(`<div class="card">
    <div class="eyebrow"><span class="dot"></span>ขั้นตอนที่ 3 · APPLY — ประยุกต์ใช้</div>
    <h2 class="section-title">${act.title}</h2>
    <div class="qcounter">กิจกรรมที่ ${idx+1} / ${APPLY_ACTIVITIES.length}</div>
    <p class="subtitle">${act.desc}</p>
    <div id="controlsBox"></div>
    <table class="msg-table">
      <thead><tr><th>ข้อความลูกค้า</th><th>คะแนนที่คำนวณได้</th><th>Intent ที่ถูกต้อง</th><th>ระบบทำนาย</th><th></th></tr></thead>
      <tbody id="rowsBody"></tbody>
    </table>
    <div class="accbar-wrap"><div class="accbar-fill" id="accFill"></div></div>

      <button class="btn" id="nextBtn">${idx===APPLY_ACTIVITIES.length-1 ? "ยืนยันและไปขั้นตอน REFLECT" : "ยืนยันและไปกิจกรรมถัดไป"}</button>
    </div>
  </div>`);
  $('#screen').appendChild(wrap);

  let acc = 0;
  function update(){
    let correctCount = 0;
    const rows = act.msgs.map(m=>{
      const scores = act.scoreFn(m, ctrl);
      const margin = ctrl.margin!==undefined ? ctrl.margin : 0;
      const pred = decide(scores, margin);
      const ok = pred === m.true;
      if(ok) correctCount++;
      const scoreStr = Object.entries(scores).map(([k,v])=>`${k}:${v}`).join(' / ');
      return `<tr class="${ok?'row-ok':'row-bad'}">
        <td>${escapeHtml(m.text)}</td>
        <td style="font-size:12px;color:var(--ink-soft);">${scoreStr}</td>
        <td><span class="pill ${m.true}">${m.true}</span></td>
        <td><span class="pill ${pred}">${pred}</span></td>
        <td>${ok?'✅':'❌'}</td></tr>`;
    }).join('');
    acc = correctCount / act.msgs.length;
    wrap.querySelector('#rowsBody').innerHTML = rows;
    const f = wrap.querySelector('#accFill');
    f.style.width = (acc*100).toFixed(0)+'%';
    f.style.background = acc===1 ? 'var(--good)' : (acc>=0.7 ? '#B8862D' : 'var(--bad)');
    wrap.querySelector('#accText').textContent = `${correctCount} / ${act.msgs.length} (${(acc*100).toFixed(1)}%)`;
  }

  const cbox = wrap.querySelector('#controlsBox');
  act.controls.forEach(c=>{
    const row = el(`<div class="control">
      <div class="control-head"><span>${c.l}</span><span class="val">${ctrl[c.k]}</span></div>
      <input type="range" min="${c.min}" max="${c.max}" step="${c.step}" value="${ctrl[c.k]}">
    </div>`);
    cbox.appendChild(row);
    const input = row.querySelector('input'), val = row.querySelector('.val');
    const handler = (e)=>{
      ctrl[c.k] = parseFloat(e.target.value);
      val.textContent = ctrl[c.k];
      update();
    };
    input.addEventListener('input', handler);
    input.addEventListener('change', handler);
  });
  update();

  wrap.querySelector('#backBtn').onclick = ()=>{
    if(idx>0){ state.applyIdx--; } else { state.screen='learn'; state.learnIdx=LEARN_TASKS.length-1; }
    render();
  };
  wrap.querySelector('#nextBtn').onclick = ()=>{
    state.applyResults[idx] = acc;
    if(idx<APPLY_ACTIVITIES.length-1){ state.applyIdx++; } else { state.screen='reflect'; }
    render();
  };
}

  wrap.querySelector('#submitBtn').onclick = ()=>{

function renderReport(){
  const show = computeShowScore(), learn = computeLearnScore(), apply = computeApplyScore(), reflect = computeReflectScore();

/* ============================= SAVE ============================= */
async function saveResult(){
  const show = computeShowScore(), learn = computeLearnScore(), apply = computeApplyScore(), reflect = computeReflectScore();
  const overall = computeOverall(show,learn,apply,reflect);
  const lvl = qualityLevel(overall);
  const learn_detail = {};
  LEARN_TASKS.forEach((t,i)=>{ learn_detail['task'+(i+1)] = Math.round(learnTaskScore(t, state.learnAnswers[i])*100); });
  const payload = {
    sheet: SHEET_NAME,
    timestamp: new Date().toISOString(),
    scenario: SCENARIO_NAME,
    user: state.name,
    grade: state.grade,
    show: Math.round(show*10)/10,
    learn: Math.round(learn*10)/10,
    learn_detail: learn_detail,
    apply: Math.round(apply*10)/10,
    reflect: Math.round(reflect*10)/10,
    overall: Math.round(overall*10)/10,
    level: lvl.n,
    levelName: lvl.label,
    timedOut: state.timedOut
  };
  state.saveMsg = 'กำลังบันทึกผล...';
  const statusEl = document.getElementById('saveStatus');
  if(statusEl) statusEl.textContent = state.saveMsg;
  try{
    const res = await fetch(WEBAPP_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(payload) });
    const data = await res.json();
    state.saveMsg = (data && data.result === 'success') ? 'บันทึกผลเรียบร้อยแล้ว' : 'บันทึกผลไม่สำเร็จ: ' + (data && data.error ? data.error : 'ไม่ทราบสาเหตุ');
  }catch(e){
    state.saveMsg = 'บันทึกผลไม่สำเร็จ (ตรวจสอบการเชื่อมต่อ) — ผลของนักเรียนยังแสดงอยู่ด้านบน';
  }
  const s2 = document.getElementById('saveStatus');
  if(s2) s2.textContent = state.saveMsg;
}

/* ============================= TIMER ============================= */
const EXAM_SECONDS = 30*60;
let timerStart = null, timerHandle = null;
function fmtTime(s){ s=Math.max(0,s); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
function tickTimer(){
  if(!timerStart) return;
  const left = EXAM_SECONDS - Math.floor((Date.now()-timerStart)/1000);
  if(left<=0) state.timedOut = true;
  const v = document.getElementById('timerVal'), box = document.getElementById('timerBox');
  if(v) v.textContent = fmtTime(left);
  if(box){ box.classList.toggle('warn', left<=300 && left>60); box.classList.toggle('over', left<=60); }
}
function startTimer(){
  stopTimer(); timerStart = Date.now(); tickTimer();
  timerHandle = setInterval(tickTimer, 1000);
}
function stopTimer(){ if(timerHandle){ clearInterval(timerHandle); timerHandle=null; } }
function resetTimer(){ stopTimer(); timerStart=null; const v=document.getElementById('timerVal'); if(v) v.textContent=fmtTime(EXAM_SECONDS); const b=document.getElementById('timerBox'); if(b) b.className='timer'; }

/* ============================= INIT ============================= */
render();
</script>
<script>
/* ===================================================================
   PISA Hub integration bootstrap (auto-added)
   - Reads name/grade from URL (?name=..&grade=..) or localStorage
     "pisaLearner" written by index.html, so the learner never types
     the name or picks the grade again inside this scenario.
   - Pre-fills the name field and rebuilds the grade <select> with the
     SAME option list used on index.html, learner's grade preselected.
   - Does NOT auto-click "start" and does NOT skip the intro/story
     screen - the learner reads the scenario and starts it themselves.
   - Marks this scenario as "started" for the current learner as soon
     as it is opened, and upgrades it to "completed" (with SHOW /
     LEARN / APPLY / REFLECT scores) when the result is posted to the
     Google Sheet, so index.html can report either real scores or
     "did not finish".
   - Progress is stored per learner (name + grade), so switching user
     on index.html switches to that person's own history.
   =================================================================== */
(function () {
  "use strict";
  var SCENARIO_ID = "chatBot";
  var SCENARIO_TITLE = "Chatbot RiskGuard (มั่นคงวัสดุภัณฑ์)";
  var PROGRESS_KEY = "pisaProgressByUser";

  /* the single source of truth for grade options - identical to index.html */
  var GRADE_CHOICES = [
    "ระดับชั้นมัธยมศึกษาปีที่ 1",
    "ระดับชั้นมัธยมศึกษาปีที่ 2",
    "ระดับชั้นมัธยมศึกษาปีที่ 3",
    "อื่นๆ/บุคคลทั่วไป"
  ];

  function qs(k) {
    try { return new URLSearchParams(location.search).get(k) || ""; }
    catch (e) { return ""; }
  }
  var saved = null;
  try { saved = JSON.parse(localStorage.getItem("pisaLearner") || "null"); } catch (e) {}
  var fillName = (qs("name") || (saved && saved.name) || "").trim();
  var fillGrade = (qs("grade") || (saved && saved.grade) || "").trim();
  var fromHub = !!(fillName && fillGrade);
  var learnerKey = fillName + "|" + fillGrade;

  /* ---------------- progress store (per learner) ---------------- */
  function readAll() {
    try { return JSON.parse(localStorage.getItem(PROGRESS_KEY) || "{}"); }
    catch (e) { return {}; }
  }
  function writeRecord(rec) {
    if (!learnerKey || learnerKey === "|") return;
    try {
      var all = readAll();
      if (!all[learnerKey]) all[learnerKey] = {};
      all[learnerKey][SCENARIO_ID] = rec;
      localStorage.setItem(PROGRESS_KEY, JSON.stringify(all));
    } catch (e) {}
  }
  function currentRecord() {
    var all = readAll();
    return (all[learnerKey] && all[learnerKey][SCENARIO_ID]) || null;
  }

  if (fromHub) {
    try {
      localStorage.setItem("pisaLearner", JSON.stringify({ name: fillName, grade: fillGrade, ts: Date.now() }));
    } catch (e) {}

    /* mark as "opened but not finished" - only when this learner has no
       finished result yet, so a finished result is never downgraded */
    var existing = currentRecord();
    if (!existing || !existing.completed) {
      writeRecord({
        title: SCENARIO_TITLE, name: fillName, grade: fillGrade,
        completed: false, started: true, startedAt: new Date().toISOString()
      });
    }

    var NAME_IDS = ["inName", "inputName", "nameInput", "gateName", "inp-name", "inpName"];
    var GRADE_IDS = ["inGrade", "gradeSelect", "gradeInput", "gateGrade", "inp-grade", "inpGrade"];

    function byIds(ids) {
      for (var i = 0; i < ids.length; i++) {
        var el = document.getElementById(ids[i]);
        if (el) return el;
      }
      return null;
    }
    function fire(el) {
      el.dispatchEvent(new Event("input", { bubbles: true }));
      el.dispatchEvent(new Event("change", { bubbles: true }));
    }

    function applyLearner() {
      var nameEl = byIds(NAME_IDS);
      var gradeEl = byIds(GRADE_IDS);

      if (nameEl && fillName && !(nameEl.value || "").trim()) {
        nameEl.value = fillName;
        fire(nameEl);
      }
      if (!gradeEl) return;

      if (gradeEl.tagName === "SELECT") {
        if (gradeEl.getAttribute("data-pisa-grade") !== "1") {
          var list = GRADE_CHOICES.slice();
          if (fillGrade && list.indexOf(fillGrade) === -1) list.unshift(fillGrade);
          gradeEl.innerHTML = "";
          for (var i = 0; i < list.length; i++) {
            var opt = document.createElement("option");
            opt.value = list[i];
            opt.textContent = list[i];
            if (list[i] === fillGrade) opt.selected = true;
            gradeEl.appendChild(opt);
          }
          gradeEl.setAttribute("data-pisa-grade", "1");
          gradeEl.value = fillGrade;
          fire(gradeEl);
        } else if (!(gradeEl.value || "").trim() && fillGrade) {
          gradeEl.value = fillGrade;
          fire(gradeEl);
        }
      } else if (fillGrade && !(gradeEl.value || "").trim()) {
        gradeEl.value = fillGrade;
        fire(gradeEl);
      }
    }

    var tries = 0;
    var poll = setInterval(function () {
      tries++;
      try { applyLearner(); } catch (e) {}
      if (tries > 9000) clearInterval(poll); // ~25 min safety cap
    }, 170);
    try { applyLearner(); } catch (e) {}

    var bar = document.createElement("div");
    bar.style.cssText = "position:fixed;right:0;bottom:0;z-index:999999;display:flex;justify-content:flex-end;pointer-events:none;";
    var backBtn = document.createElement("button");
    backBtn.type = "button";
    backBtn.textContent = "🏠 กลับสู่หน้าหลัก";
    backBtn.style.cssText = "pointer-events:auto;margin:12px;padding:10px 20px;border-radius:999px;border:none;background:#1f2a44;color:#fff;font-weight:700;font-family:system-ui,'IBM Plex Sans Thai',sans-serif;font-size:13px;box-shadow:0 6px 18px rgba(0,0,0,.28);cursor:pointer;opacity:.9;transition:opacity .15s;";
    backBtn.addEventListener("mouseenter", function () { backBtn.style.opacity = "1"; });
    backBtn.addEventListener("mouseleave", function () { backBtn.style.opacity = ".9"; });
    backBtn.addEventListener("click", goBackToHub);
    bar.appendChild(backBtn);
    document.body.appendChild(bar);
    /* keep the floating button from covering the page content */
    try { document.body.style.paddingBottom = "76px"; } catch (e) {}
  }

  /* ---------------- capture the result sent to Google Sheet ------------- */
  var lastPayload = null;
  var origFetch = window.fetch;
  window.fetch = function (url, opts) {
    try {
      if (opts && opts.body && typeof opts.body === "string") {
        var bodyObj = JSON.parse(opts.body);
        var hasName = bodyObj && (bodyObj.name || bodyObj.user);
        var hasGrade = bodyObj && bodyObj.grade;
        if (hasName && hasGrade) {
          lastPayload = bodyObj;
          recordProgress(bodyObj);
        }
      }
    } catch (e) {}
    return origFetch.apply(this, arguments);
  };

  function num(v) {
    return (typeof v === "number" && isFinite(v)) ? Math.round(v) : null;
  }
  /* pull a percentage out of a report sentence:
     "... (รวม 62%)" / "ความแม่นยำเฉลี่ย 75% (...)" -> the summary number,
     otherwise the first percentage in the text ("4/5 (80%)" -> 80) */
  function pctFromText(t) {
    if (typeof t !== "string") return null;
    var m = t.match(/(?:รวม|เฉลี่ย)\s*([\d.]+)\s*%/);
    if (m) return Math.round(parseFloat(m[1]));
    m = t.match(/([\d.]+)\s*%/);
    if (m) return Math.round(parseFloat(m[1]));
    return null;
  }
  /* "รวม 78/100 (SHOW 60, LEARN 80, APPLY 75, REFLECT 90)" */
  function fromTotalReport(p, label) {
    var t = p.totalReport;
    if (typeof t !== "string") return null;
    var m = t.match(new RegExp(label + "\\s*([\\d.]+)"));
    return m ? Math.round(parseFloat(m[1])) : null;
  }
  function section(p, keys, textKey, label) {
    for (var i = 0; i < keys.length; i++) {
      var v = num(p[keys[i]]);
      if (v !== null) return v;
    }
    var fromTotal = fromTotalReport(p, label);
    if (fromTotal !== null) return fromTotal;
    return pctFromText(p[textKey]);
  }
  function extractSections(p) {
    return {
      show:    section(p, ["show", "show_score", "showScore"], "showReport", "SHOW"),
      learn:   section(p, ["learn", "learn_score", "learnScore"], "learnReport", "LEARN"),
      apply:   section(p, ["apply", "apply_score", "applyScore"], "applyReport", "APPLY"),
      reflect: section(p, ["reflect", "reflect_score", "reflectScore"], "reflectReport", "REFLECT")
    };
  }
  function extractOverall(p) {
    var v = num(p.overall);
    if (v !== null) return v;
    v = num(p.overall_score);
    if (v !== null) return v;
    var texts = [p.overallReport, p.totalReport, p.qualityReport].filter(Boolean).join(" ");
    var m = texts.match(/([\d.]+)\s*%/) || texts.match(/([\d.]+)\s*\/\s*100/);
    return m ? Math.round(parseFloat(m[1])) : null;
  }
  function extractLevelName(p) {
    return p.levelName || p.levelLabel || p.quality_label || p.qualityLevel || p.qualityReport || "";
  }
  function recordProgress(p) {
    var sec = extractSections(p);
    writeRecord({
      title: SCENARIO_TITLE,
      name: p.name || p.user || fillName,
      grade: p.grade || fillGrade,
      overall: extractOverall(p),
      show: sec.show, learn: sec.learn, apply: sec.apply, reflect: sec.reflect,
      levelName: extractLevelName(p),
      timestamp: p.timestamp || new Date().toISOString(),
      completed: true
    });
  }

  function goBackToHub() {
    var q = new URLSearchParams();
    q.set("done", SCENARIO_ID);
    if (fillName) q.set("name", fillName);
    if (fillGrade) q.set("grade", fillGrade);
    if (lastPayload) {
      var ov = extractOverall(lastPayload);
      var ln = extractLevelName(lastPayload);
      var sec = extractSections(lastPayload);
      if (ov != null) q.set("overall", ov);
      if (ln) q.set("levelName", ln);
      if (sec.show != null) q.set("show", sec.show);
      if (sec.learn != null) q.set("learn", sec.learn);
      if (sec.apply != null) q.set("apply", sec.apply);
      if (sec.reflect != null) q.set("reflect", sec.reflect);
    }
    location.href = "index.html?" + q.toString();
  }
})();
</script>

  var DOCKEY = {"i": [{"s": "SHOW", "n": 1, "t": "ข้อ 1  ก. โต้ตอบกับลูกค้าด้วยข้อความแทนพนักงานได้ตลอดเวลา   (2 คะแนน)\n• ก. โต้ตอบกับลูกค้าด้วยข้อความแทนพนักงานได้ตลอดเวลา  —  ✓ ถูกต้อง\n      ตรงกับนิยามของ Chatbot คือระบบสนทนาอัตโนมัติที่รับข้อความ ตีความความต้องการ และตอบกลับได้ต่อเนื่อง 24 ชั่วโมง โดยไม่ถูกจำกัดด้วยเวลาทำงานของพนักงาน\n• ข. เก็บภาษีสินค้าให้ร้านค้าโดยอัตโนมัติ  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      เป็นงานด้านบัญชี/ภาษี ไม่ใช่หน้าที่ของระบบสนทนาอัตโนมัติ และไม่เกี่ยวกับการวิเคราะห์ข้อความของลูกค้า\n• ค. จัดส่งสินค้าให้ลูกค้าโดยไม่ต้องใช้พนักงานขนส่ง  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      สับสนระหว่างระบบสนทนากับระบบโลจิสติกส์ Chatbot ทำงานที่ชั้นการสื่อสาร ไม่ได้ทำงานทางกายภาพ\n• ง. คำนวณภาษีนำเข้าสินค้าวัสดุก่อสร้าง  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      เป็นงานเฉพาะทางด้านศุลกากร ไม่ใช่หน้าที่หลักของ Chatbot บริการลูกค้า"}, {"s": "SHOW", "n": 2, "t": "ข้อ 2  ง. ความตั้งใจหรือเป้าหมายที่แท้จริงของข้อความที่ผู้ใช้พิมพ์เข้ามา   (2 คะแนน)\n• ก. รหัสสินค้าที่ลูกค้าต้องการซื้อ  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      สับสนระหว่าง Intent (ความตั้งใจ) กับ Entity (สิ่งที่ถูกอ้างถึง เช่น ชนิดสินค้า) ซึ่งเป็นคนละองค์ประกอบในระบบเข้าใจภาษา\n• ข. จำนวนตัวอักษรในข้อความของลูกค้า  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      เป็นคุณสมบัติเชิงรูปแบบของข้อความ ไม่สื่อความหมายหรือเป้าหมายใด ๆ\n• ค. ชื่อผู้ดูแลระบบแชทบอท  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      ไม่เกี่ยวข้องกับการประมวลผลข้อความของผู้ใช้เลย\n• ง. ความตั้งใจหรือเป้าหมายที่แท้จริงของข้อความที่ผู้ใช้พิมพ์เข้ามา  —  ✓ ถูกต้อง\n      ตรงกับนิยามของ Intent ในงาน Natural Language Understanding คือการจำแนกว่าผู้ใช้ต้องการให้ระบบทำอะไร โดยไม่ขึ้นกับถ้อยคำที่ใช้"}, {"s": "SHOW", "n": 3, "t": "ข้อ 3  ข. เพื่อพิจารณาน้ำหนักของคำบ่งชี้ทุกคำร่วมกัน ลดโอกาสตัดสินใจผิดจากคำเดียว   (2 คะแนน)\n• ก. เพื่อให้ประมวลผลเร็วขึ้นโดยไม่ต้องอ่านทั้งประโยค  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      ขัดแย้งในตัวเอง การคำนวณคะแนนรวมต้องอ่านทั้งประโยค จึงไม่ได้เร็วกว่า และความเร็วไม่ใช่เหตุผลของการออกแบบนี้\n• ข. เพื่อพิจารณาน้ำหนักของคำบ่งชี้ทุกคำร่วมกัน ลดโอกาสตัดสินใจผิดจากคำเดียว  —  ✓ ถูกต้อง\n      หลักการของแบบจำลองให้คะแนนแบบสะสม (additive scoring) คือรวมหลักฐานจากทุกคำบ่งชี้ ทำให้คำเดียวที่กำกวมไม่สามารถชี้ขาดผลลัพธ์ได้\n• ค. เพราะคำแรกในประโยคภาษาไทยมักไม่มีความหมาย  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      เป็นข้อความเท็จเชิงภาษาศาสตร์ คำแรกอาจเป็นคำบ่งชี้สำคัญได้ เช่น “เอา”, “ขอ”\n• ง. เพื่อลดจำนวนคำที่ต้องเก็บในฐานข้อมูล  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      การคำนวณคะแนนรวมไม่ได้ลดขนาดพจนานุกรม ตรงกันข้าม ระบบยังต้องเก็บคำบ่งชี้ทุกประเภทไว้ครบ"}, {"s": "SHOW", "n": 4, "t": "ข้อ 4  ค. ถามราคาสินค้า (55 ข้อความ ซึ่งมากที่สุดในสามหมวด)   (2 คะแนน)\n• ก. ถามซื้อสินค้า  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      มี 40 ข้อความ น้อยกว่าหมวดถามราคา (55) จึงไม่ใช่หมวดที่มากที่สุด\n• ข. ถามรายการสินค้า  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      มี 25 ข้อความ ต่ำที่สุดในทั้งสามหมวด\n• ค. ถามราคาสินค้า  —  ✓ ถูกต้อง\n      มี 55 ข้อความ สูงที่สุดในทั้งสามหมวด สอดคล้องกับพฤติกรรมลูกค้าร้านวัสดุก่อสร้างที่มักเปรียบเทียบราคาก่อนตัดสินใจซื้อ\n• ง. มากเท่ากันทุกหมวด  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      ขัดกับข้อมูลในตารางซึ่งมีค่าต่างกันชัดเจน (40 / 55 / 25)"}, {"s": "SHOW", "n": 5, "t": "ข้อ 5  ก. เพราะคำเหล่านี้ไม่ตรงกับรูปแบบมาตรฐานที่ระบบถูกฝึกให้จดจำ จึงอาจตรวจไม่พบคำบ่งชี้   (2 คะแนน)\n• ก. เพราะคำเหล่านี้ไม่ตรงกับรูปแบบมาตรฐานที่ระบบถูกฝึกให้จดจำ จึงอาจตรวจไม่พบคำบ่งชี้  —  ✓ ถูกต้อง\n      ระบบจับคู่คำกับพจนานุกรมคำบ่งชี้ หากคำท้องถิ่นหรือคำสะกดผิดไม่อยู่ในพจนานุกรม คะแนนของทุก Intent จะเป็น 0 ระบบจึงตีความไม่ได้\n• ข. เพราะลูกค้าพิมพ์เร็วเกินไปจนระบบประมวลผลไม่ทัน  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      ความเร็วในการพิมพ์ไม่เกี่ยวกับความสามารถในการตีความ ระบบรับข้อความทั้งประโยคหลังผู้ใช้ส่งแล้ว\n• ค. เพราะภาษาถิ่นมีตัวอักษรมากกว่าภาษามาตรฐาน  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      เป็นข้อความเท็จ จำนวนตัวอักษรไม่ใช่สาเหตุของความผิดพลาดในการจำแนก Intent\n• ง. เพราะระบบไม่อนุญาตให้พิมพ์ภาษาถิ่น  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      ระบบรับข้อความได้ทุกรูปแบบ ปัญหาอยู่ที่การตีความ ไม่ใช่การจำกัดสิทธิ์การพิมพ์"}, {"s": "LEARN", "n": 1, "t": "ภาระงานที่ 1  น้ำหนักคะแนนของคำบ่งชี้ Intent (5 คะแนน)\n1.1  ง. คำระบุสินค้า   (2 คะแนน)\n• ก. คำที่แสดงความต้องการซื้อ  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      มีน้ำหนัก 3 คะแนน เท่ากับกลุ่มคำบ่งชี้ Intent หลักอีกสองกลุ่ม ไม่ใช่ค่าต่ำสุด\n• ข. คำเกี่ยวกับราคา  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      มีน้ำหนัก 3 คะแนน เท่ากับคำบ่งชี้ Intent หลักอื่น ๆ\n• ค. จำนวนสินค้าที่ต้องการ  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      มีน้ำหนัก 2 คะแนน มากกว่าคำระบุสินค้า เพราะการระบุจำนวนเป็นสัญญาณของเจตนาสั่งซื้อที่ชัดเจนกว่า\n• ง. คำระบุสินค้า  —  ✓ ถูกต้อง\n      มีน้ำหนักเพียง 1 คะแนน ต่ำที่สุดในตาราง เพราะบอกได้เพียง “พูดถึงสินค้าใด” แต่ไม่บอกว่าผู้ใช้ต้องการทำอะไรกับสินค้านั้น\n1.2  แนวคำตอบอ้างอิง (3 คะแนน — คำถามอัตนัย ใช้รูบริคส่วน B ประกอบ)\nคำระบุสินค้า เช่น “ปูน” หรือ “เหล็ก” ปรากฏได้ในทั้งสาม Intent — ทั้งข้อความซื้อ (“เอาปูน 5 ถุง”) ข้อความถามราคา (“ปูนกี่บาท”) และข้อความถามรายการสินค้า (“ร้านมีปูนอะไรบ้าง”) จึงเป็นคำที่ “ไม่จำแนก” Intent ถ้าให้น้ำหนักสูงเท่าคำบ่งชี้เจตนา คะแนนของ Intent ที่ผูกกับคำระบุสินค้าจะสูงขึ้นในทุกข้อความ ทำให้ระบบเอนเอียงไปทาง Intent นั้นอย่างไม่มีเหตุผล ส่วนคำอย่าง “เอา” หรือ “กี่บาท” ปรากฏเฉพาะกับเจตนาเดียว จึงมีอำนาจจำแนกสูงกว่าและควรได้น้ำหนักมากกว่า\nเกณฑ์ให้คะแนน: อธิบายว่าคำระบุสินค้าปรากฏได้ในทุก Intent จึงจำแนกไม่ได้ = 1 คะแนน · ยกตัวอย่างข้อความประกอบอย่างน้อย 2 Intent = 1 คะแนน · เชื่อมโยงไปถึงผลเสียของการให้น้ำหนักสูงเกินไป (ระบบเอนเอียง/ทำนายผิด) = 1 คะแนน"}, {"s": "LEARN", "n": 2, "t": "ภาระงานที่ 2  การคำนวณ Intent Score ทีละขั้น (5 คะแนน)\n2.1  ข. 6   (2 คะแนน)\n• ก. 7  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      เกินค่าจริง เกิดจากการนับคำบ่งชี้ซ้ำ เช่น นับ “ถุง” เป็นคำระบุสินค้าอีกหนึ่งครั้ง\n• ข. 6  —  ✓ ถูกต้อง\n      คำนวณจาก 3 (“เอา”) + 1 (“ปูน”) + 2 (“5 ถุง”) = 6 ตรงกับการสะสมทีละขั้นในตารางและตรงกับตัวอย่างในสถานการณ์\n• ค. 5  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      ไม่ตรงกับขั้นใดในตาราง เกิดจากการบวกผิด เช่น ให้ “5 ถุง” เพียง +1\n• ง. 4  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      เป็นคะแนนสะสมหลังพบ “ปูน” เท่านั้น ยังไม่ได้บวกคะแนนของ “5 ถุง” (+2) จึงเป็นการอ่านตารางไม่ครบขั้น\n2.2  แนวคำตอบอ้างอิง (3 คะแนน)\n• คำบ่งชี้ที่ตรวจพบใน “ขอเหล็ก 10 เส้น”  —  ประเภท\n      คะแนนที่เพิ่ม  ให้แก่ Intent\n• “ขอ”  —  คำแสดงความต้องการซื้อ\n      +3  BUY\n• “เหล็ก”  —  คำระบุสินค้า\n      +1  BUY\n• “10 เส้น”  —  จำนวนสินค้า\n      +2  BUY\n• รวม  —  BUY = 6 · PRICE = 0 · PRODUCT = 0\nสรุป: BUY สูงกว่าอีกสอง Intent ทั้งคู่ ระบบจึงเลือก BUY\nเกณฑ์ให้คะแนน: ระบุคำบ่งชี้ครบ 3 คำพร้อมคะแนนถูกต้อง = 2 คะแนน (ระบุถูก 2 คำ = 1 คะแนน) · สรุปคะแนนทั้งสาม Intent และเลือก BUY ได้ถูกต้อง = 1 คะแนน"}, {"s": "LEARN", "n": 3, "t": "ภาระงานที่ 3  ภาษาพูด ภาษาถิ่น และคำสะกดผิด (5 คะแนน)\n3.1  ก. เพิ่มขึ้นจาก 3 เป็น 8   (2 คะแนน)\n• ก. เพิ่มขึ้นจาก 3 เป็น 8  —  ✓ ถูกต้อง\n      ตรงกับข้อมูลในตาราง ระดับ 0 = 3 ข้อความ และระดับ 3 = 8 ข้อความ กล่าวคือครอบคลุมครบทุกข้อความทดสอบ\n• ข. ลดลงจาก 8 เหลือ 3  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      อ่านตารางกลับทิศทาง ระดับ 0 ให้ค่า 3 และระดับ 3 ให้ค่า 8 การขยายพจนานุกรมทำให้ค่าเพิ่ม ไม่ใช่ลด\n• ค. คงที่ตลอดทุกระดับ  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      ขัดกับข้อมูลซึ่งเพิ่มขึ้นทุกระดับ (3 → 5 → 7 → 8)\n• ง. เพิ่มขึ้นแล้วลดลง  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      ไม่มีจุดใดในตารางที่ค่าลดลง แนวโน้มเป็นการเพิ่มแบบต่อเนื่องจนอิ่มตัวที่ 8\n3.2  แนวคำตอบอ้างอิง (3 คะแนน — คำถามอัตนัย ใช้รูบริคส่วน B ประกอบ)\nระบบจะให้คะแนน Intent ได้ก็ต่อเมื่อจับคู่คำในข้อความกับพจนานุกรมคำบ่งชี้ได้ เมื่อพจนานุกรมครอบคลุมเฉพาะภาษามาตรฐาน (ระดับ 0) มีเพียง 3 จาก 8 ข้อความที่ตรวจพบคำบ่งชี้ อีก 5 ข้อความได้คะแนนทุก Intent เป็น 0 ระบบจึงตอบไม่ได้ เมื่อขยายเป็นระดับ 1 เพิ่มเป็น 5 ข้อความ ระดับ 2 เพิ่มเป็น 7 และระดับ 3 ครบทั้ง 8 ข้อความ คิดเป็นการเพิ่มความครอบคลุมจาก 37.5% เป็น 100% การขยายพจนานุกรมจึงเพิ่มจำนวนข้อความที่ระบบ “มีหลักฐานพอจะตัดสินใจ” โดยตรง\nเกณฑ์ให้คะแนน: อธิบายกลไกการจับคู่คำกับพจนานุกรมและผลเมื่อจับคู่ไม่ได้ = 1 คะแนน · อ้างอิงตัวเลขจากตารางอย่างน้อย 2 ค่า = 1 คะแนน · เชื่อมโยงกับความแม่นยำโดยรวมของระบบ = 1 คะแนน"}, {"s": "LEARN", "n": 4, "t": "ภาระงานที่ 4  กฎการตัดสินใจเลือก Intent (5 คะแนน)\n4.1  ค. PRICE   (2 คะแนน)\n• ก. BUY  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      ขัดกับเงื่อนไขที่โจทย์กำหนด เพราะ BUY มีคะแนนต่ำกว่า PRICE ในกรณีนี้\n• ข. PRODUCT  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      ขัดกับเงื่อนไข เพราะ PRODUCT มีคะแนนต่ำกว่า PRICE\n• ค. PRICE  —  ✓ ถูกต้อง\n      ตรงตามกฎ เมื่อ Intent ใดมีคะแนนสูงกว่าอีกสอง Intent ทั้งคู่ ระบบจะเลือก Intent นั้นทันที\n• ง. ถามผู้ใช้เพิ่มเติมเสมอ  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      ระบบจะถามเพิ่มเติมเฉพาะกรณีที่ไม่มี Intent ใดสูงกว่าที่เหลือทั้งคู่ (คะแนนสูงสุดเสมอกัน) ไม่ใช่กรณีนี้\n4.2  แนวคำตอบอ้างอิง (3 คะแนน — คำถามอัตนัย ใช้รูบริคส่วน B ประกอบ)\nถ้าใช้เกณฑ์เพียง “สูงกว่า Intent ใด Intent หนึ่ง” จะมีมากกว่าหนึ่ง Intent ที่ผ่านเกณฑ์พร้อมกัน ทำให้กฎไม่สามารถชี้ขาดคำตอบเดียวได้ ตัวอย่างเช่น BUY = 3, PRICE = 3, PRODUCT = 0 ทั้ง BUY และ PRICE ต่างสูงกว่า PRODUCT จึงผ่านเกณฑ์ทั้งคู่ ระบบต้องเลือกโดยพลการหรือเลือกตามลำดับการเขียนโปรแกรม ซึ่งเป็นการเดา การกำหนดให้ต้องสูงกว่าทั้งสอง Intent จึงรับประกันว่าผู้ชนะมีเพียงหนึ่งเดียว และกรณีที่เหลือทั้งหมดถูกส่งเข้าเงื่อนไข “ถามผู้ใช้เพิ่มเติม” อย่างเป็นระบบ\nเกณฑ์ให้คะแนน: อธิบายว่าเกณฑ์แบบหลังทำให้มีผู้ผ่านเกณฑ์มากกว่าหนึ่ง = 1 คะแนน · ยกตัวอย่างคะแนนที่แสดงปัญหาได้จริง = 1 คะแนน · เชื่อมโยงว่าการเลือกโดยพลการคือการเดาและกฎที่ถูกต้องนำไปสู่ CLARIFY = 1 คะแนน"}, {"s": "LEARN", "n": 5, "t": "ภาระงานที่ 5  เมื่อคะแนนเสมอกัน (Tie) (5 คะแนน)\n5.1  ง. ส่งข้อความถามผู้ใช้เพิ่มเติม   (2 คะแนน)\n• ก. เลือก BUY เพราะมาก่อนตามลำดับ  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      เป็นการตัดสินด้วยลำดับการเขียนโปรแกรม ไม่ใช่ด้วยหลักฐานในข้อความ ถือเป็นการเดาที่ระบบควรหลีกเลี่ยง\n• ข. เลือก PRODUCT เพราะเป็นสินค้าที่ขาย  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      ใช้เหตุผลเชิงธุรกิจแทนเหตุผลเชิงข้อมูล คะแนนของ PRODUCT ไม่ได้สูงกว่า BUY จึงไม่มีหลักฐานสนับสนุน\n• ค. เลือกทั้ง BUY และ PRODUCT พร้อมกัน  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      ขัดกับการออกแบบระบบที่ต้องส่งต่อ Intent เดียวไปยังขั้นตอบคำถาม การส่งสอง Intent พร้อมกันทำให้ขั้นถัดไปทำงานไม่ได้\n• ง. ส่งข้อความถามผู้ใช้เพิ่มเติม  —  ✓ ถูกต้อง\n      ตรงตามกฎการตัดสินใจ เมื่อคะแนนสูงสุดเสมอกัน ระบบไม่มีหลักฐานเพียงพอ การขอข้อมูลเพิ่มเติมจึงมีต้นทุนความผิดพลาดต่ำที่สุด\n5.2  แนวคำตอบอ้างอิง (3 คะแนน — คำถามอัตนัย ใช้รูบริคส่วน B ประกอบ)\nเมื่อคะแนนเสมอกัน โอกาสที่การเดาจะถูกเหลือราวครึ่งเดียว ความผิดพลาดที่เกิดขึ้นมีต้นทุนไม่เท่ากันในแต่ละทิศทาง เช่น ถ้าลูกค้าเพียงถามข้อมูลแต่ระบบเดาเป็น BUY แล้วบันทึกคำสั่งซื้อ อาจเกิดการสั่งซื้อที่ลูกค้าไม่ได้ตั้งใจ ต้องยกเลิกภายหลัง เสียเวลาทั้งสองฝ่ายและกระทบความน่าเชื่อถือของร้าน ในทางกลับกันถ้าลูกค้าต้องการสั่งซื้อแต่ระบบตอบเป็นรายการสินค้า ลูกค้าต้องพิมพ์ซ้ำและอาจเปลี่ยนไปซื้อร้านอื่น การถามกลับหนึ่งประโยคใช้เวลาเพียงเล็กน้อยแต่ตัดความเสี่ยงทั้งสองแบบออกไป\nเกณฑ์ให้คะแนน: ระบุว่าการเดามีโอกาสผิดสูงเมื่อไม่มีหลักฐานชี้ขาด = 1 คะแนน · ยกผลกระทบที่เป็นรูปธรรมต่อลูกค้าหรือร้านค้าอย่างน้อย 1 กรณีพร้อมตัวอย่าง = 1 คะแนน · เปรียบเทียบต้นทุนของการถามกลับกับต้นทุนของการเดาผิด = 1 คะแนน"}, {"s": "LEARN", "n": 6, "t": "ภาระงานที่ 6  ประกอบบล็อกคำสั่ง “กฎการตัดสินใจเลือก Intent” (8 คะแนน)\n6.1  เฉลยการวางบล็อก (5 คะแนน)\n• ช่องที่  —  ตำแหน่งในชุดคำสั่ง\n      คำตอบ  ข้อความในบล็อก\n• 1  —  เงื่อนไขที่ 1\n      ซ  ถ้า BUY Score > PRICE Score และ BUY Score > PRODUCT Score\n• 2  —  ทำเมื่อเงื่อนไขที่ 1 เป็นจริง\n      ค  เลือก Intent เป็น BUY\n• 3  —  เงื่อนไขที่ 2\n      ฉ  มิฉะนั้น ถ้า PRICE Score > BUY Score และ PRICE Score > PRODUCT Score\n• 4  —  ทำเมื่อเงื่อนไขที่ 2 เป็นจริง\n      ก  เลือก Intent เป็น PRICE\n• 5  —  เงื่อนไขที่ 3\n      ข  มิฉะนั้น ถ้า PRODUCT Score > BUY Score และ PRODUCT Score > PRICE Score\n• 6  —  ทำเมื่อเงื่อนไขที่ 3 เป็นจริง\n      ช  เลือก Intent เป็น PRODUCT\n• 7  —  กรณีอื่นทั้งหมด\n      จ  มิฉะนั้น ส่งข้อความถามผู้ใช้เพิ่มเติม\nบล็อกลวง 2 บล็อกที่ไม่ได้ใช้: ง (“ถ้า BUY Score เท่ากับ PRICE Score”) เป็นการตรวจเงื่อนไขเสมอซึ่งกฎจัดการไว้แล้วด้วยบล็อก จ · ฌ (“เลือก Intent ที่มีคะแนนน้อยที่สุด”) ขัดกับหลักการเลือกหลักฐานที่หนักที่สุด\nเกณฑ์ให้คะแนน: ถูกครบ 7 ช่อง = 5 คะแนน · ถูก 6 ช่อง = 4 คะแนน · ถูก 5 ช่อง = 3 คะแนน · ถูก 3–4 ช่อง = 2 คะแนน · ถูก 1–2 ช่อง = 1 คะแนน · ยอมรับการสลับลำดับคู่เงื่อนไข-การกระทำระหว่าง Intent (เช่น เริ่มด้วย PRICE ก่อน BUY) หากยังจับคู่เงื่อนไขกับการกระทำถูกต้องและบล็อก จ อยู่ท้ายสุด\n6.2  แนวคำตอบอ้างอิง (3 คะแนน — คำถามอัตนัย ใช้รูบริคส่วน B ประกอบ)\nบล็อก จ ทำหน้าที่เป็นทางออกสุดท้าย (default case) ของโครงสร้างเงื่อนไขแบบลูกโซ่ หากตัดออก ข้อความที่ไม่เข้าเงื่อนไขใดเลย เช่น BUY = 3, PRICE = 3, PRODUCT = 0 จะไหลผ่านทั้งสามเงื่อนไขโดยไม่มีคำสั่งใดทำงาน ระบบจึงไม่ส่ง Intent ใดไปยังขั้นตอบคำถาม ผลคือลูกค้าไม่ได้รับการตอบกลับเลย หรือระบบค้างรอ ซึ่งร้ายแรงกว่าการตอบผิด เพราะลูกค้าไม่ทราบว่าเกิดอะไรขึ้นและไม่มีทางแก้ด้วยตนเอง\nเกณฑ์ให้คะแนน: ระบุว่าไม่มีคำสั่งใดทำงานเมื่อไม่เข้าเงื่อนไขใดเลย = 1 คะแนน · ยกตัวอย่างชุดคะแนนที่ทำให้เกิดกรณีนี้ = 1 คะแนน · อธิบายผลที่เกิดกับลูกค้า (ไม่ได้รับคำตอบ/ระบบค้าง) = 1 คะแนน"}, {"s": "LEARN", "n": 7, "t": "ภาระงานที่ 7  เขียนบล็อกคำสั่ง If–Then–Else ตรวจสอบสต็อกสินค้า (7 คะแนน)\n7.1  เฉลยการวางบล็อก (4 คะแนน)\n• ช่องที่  —  ตำแหน่งในชุดคำสั่ง\n      คำตอบ  ข้อความในบล็อก\n• 1  —  ขั้นที่ 1 — รับข้อมูล\n      ง  รับค่า “จำนวนที่ลูกค้าสั่ง” จากข้อความของลูกค้า\n• 2  —  ขั้นที่ 2 — เงื่อนไข (if)\n      ก  ถ้า จำนวนในคลัง ≥ จำนวนที่ลูกค้าสั่ง\n• 3  —  ขั้นที่ 3 — then\n      ช  ยืนยันคำสั่งซื้อ และตัดสต็อกตามจำนวนที่สั่ง\n• 4  —  ขั้นที่ 4 — then (ต่อ)\n      ค  ตอบลูกค้าพร้อมยอดรวมและวิธีจัดส่ง\n• 5  —  ขั้นที่ 5 — else\n      ฉ  มิฉะนั้น (จำนวนในคลังไม่พอ)\n• 6  —  ขั้นที่ 6 — else (ต่อ)\n      ซ  แจ้งจำนวนที่มีอยู่จริง และเสนอให้สั่งจองส่วนที่ขาด\nบล็อกลวง 2 บล็อกที่ไม่ได้ใช้: จ (ยืนยันคำสั่งซื้อทันทีโดยไม่ตรวจสอบจำนวนในคลัง) ข้ามเงื่อนไขที่จำเป็น · ข (ปิดการสนทนาโดยไม่ตอบกลับลูกค้า) ทิ้งลูกค้าไว้โดยไม่มีข้อมูล\nเกณฑ์ให้คะแนน: ถูกครบ 6 ช่อง = 4 คะแนน · ถูก 5 ช่อง = 3 คะแนน · ถูก 3–4 ช่อง = 2 คะแนน · ถูก 1–2 ช่อง = 1 คะแนน · ยอมรับการสลับลำดับภายในกิ่งเดียวกัน (ช่อง 3 กับ 4) เพราะทั้งคู่อยู่ในกิ่ง then\n7.2  แนวคำตอบอ้างอิง (3 คะแนน — คำถามอัตนัย ใช้รูบริคส่วน B ประกอบ)\nเงื่อนไข if ต้องเปรียบเทียบ “จำนวนในคลัง” กับ “จำนวนที่ลูกค้าสั่ง” ถ้ายังไม่ได้รับค่าที่สองเข้ามาก่อน ตัวแปรนั้นจะยังไม่มีค่า การเปรียบเทียบจึงไม่มีความหมายหรือเกิดข้อผิดพลาดขณะทำงาน ลำดับ “รับข้อมูลก่อน แล้วจึงตัดสินใจ” เป็นหลักพื้นฐานของการเขียนโปรแกรมเชิงลำดับ ส่วนบล็อก จ ผิดเพราะยืนยันคำสั่งซื้อโดยข้ามการตรวจสอบ ทำให้ระบบอาจรับออร์เดอร์เกินจำนวนสินค้าที่มีจริง เกิดการขายเกินสต็อก (overselling) ร้านต้องยกเลิกออร์เดอร์ภายหลัง กระทบทั้งความน่าเชื่อถือและข้อมูลสต็อกที่ผิดพลาดสะสมต่อไป\nเกณฑ์ให้คะแนน: อธิบายเหตุผลด้านลำดับการทำงาน (ต้องมีค่าก่อนเปรียบเทียบ) = 1 คะแนน · ระบุว่าบล็อก จ ข้ามการตรวจสอบเงื่อนไข = 1 คะแนน · อธิบายผลเสียที่เป็นรูปธรรม เช่น ขายเกินสต็อกหรือต้องยกเลิกออร์เดอร์ = 1 คะแนน"}, {"s": "APPLY", "n": 1, "t": "กิจกรรมที่ 1  ปรับน้ำหนักคำบ่งชี้พื้นฐาน (7 คะแนน)\n1.1  ตารางคำตอบอ้างอิง — ค่าเริ่มต้น: ซื้อ = 2, ราคา = 3, รายการสินค้า = 1, ระบุสินค้า = 1, จำนวนสินค้า = 2   (3 คะแนน)\n• ข้อความของลูกค้า  —  BUY\n      PRICE  PRODUCT  ถูกต้อง  ระบบทำนาย  ผล\n• เอาปูน 5 ถุงครับ  —  5\n      0  BUY  ✓\n• ปูนถุงละกี่บาทครับ  —  1\n      3  0  PRICE  ✓\n• ร้านมีปูนอะไรบ้าง  —  1\n      0  1  PRODUCT  CLARIFY  ✗\n• ขอเหล็ก 10 เส้น  —  5\n      0  BUY  ✓\n• เหล็กเส้นราคาเท่าไหร่  —  1\n      3  0  PRICE  ✓\n• มีสีกี่ยี่ห้อ  —  1\n      0  1  PRODUCT  CLARIFY  ✗\n• ซื้อทราย 3 กระสอบ  —  5\n      0  BUY  ✓\n• ร้านขายอิฐกี่แบบ  —  1\n      0  1  PRODUCT  CLARIFY  ✗\nความแม่นยำของค่าเริ่มต้น = 5 ÷ 8 × 100 = 62.5%\nเกณฑ์ให้คะแนน: คะแนนทั้ง 3 Intent และผลทำนายถูกครบ 8 แถว = 3 คะแนน · ถูก 6–7 แถว = 2 คะแนน · ถูก 3–5 แถว = 1 คะแนน · คำนวณความแม่นยำได้ 62.5% ถือเป็นเงื่อนไขของการได้คะแนนเต็ม\n1.2  เฉลย (2 คะแนน)\nข้อความที่ผิดคือ “ร้านมีปูนอะไรบ้าง”, “มีสีกี่ยี่ห้อ” และ “ร้านขายอิฐกี่แบบ” ทั้งสามข้อความระบบตอบ CLARIFY แทน PRODUCT เพราะคะแนน PRODUCT (1) เท่ากับคะแนน BUY (1) ที่ได้จากคำระบุสินค้า จึงไม่มี Intent ใดสูงกว่าที่เหลือทั้งคู่\nเกณฑ์ให้คะแนน: ระบุข้อความที่ผิดครบทั้ง 3 ข้อความ = 1 คะแนน · ระบุว่าระบบตอบ CLARIFY แทน PRODUCT พร้อมเหตุผลเรื่องคะแนนเสมอ = 1 คะแนน\n1.3  แนวคำตอบอ้างอิง (2 คะแนน — ส่วนเหตุผลใช้รูบริคส่วน B ประกอบ)\nคำตอบไม่มีชุดเดียวตายตัว เงื่อนไขที่ทำให้ถูกต้องครบ 8 ข้อความคือ น้ำหนักคำ “รายการสินค้า” ≥ 2 และน้ำหนักคำ “ราคา” ≥ 2 ส่วนน้ำหนักคำ “ต้องการซื้อ” ใช้ค่าใดก็ได้ตั้งแต่ 1 ถึง 5 (มีชุดคำตอบที่ถูกต้องรวม 80 ชุด) ตัวอย่างที่ตรงไปตรงมาที่สุดคือ ซื้อ = 3, ราคา = 3, รายการสินค้า = 3 ตามค่ามาตรฐานในสถานการณ์\nเหตุผล: ปัญหาเกิดจากคำ “ปูน/สี/อิฐ” มอบคะแนน 1 ให้ BUY ทุกครั้ง ทำให้ PRODUCT ที่ได้ 1 คะแนนเท่ากันไม่สามารถชนะได้ การยกน้ำหนักคำบ่งชี้รายการสินค้าให้สูงกว่าน้ำหนักคำระบุสินค้าจึงคืนอำนาจจำแนกให้กลุ่ม PRODUCT โดยไม่กระทบข้อความกลุ่ม BUY ซึ่งมีคะแนนนำอยู่แล้ว\nเกณฑ์ให้คะแนน: เสนอค่าน้ำหนักที่อยู่ในเงื่อนไขข้างต้นและตรวจสอบได้ว่าถูก 8/8 = 1 คะแนน · อธิบายเหตุผลเชื่อมโยงกับสาเหตุของความผิดพลาดเดิม = 1 คะแนน (ตรวจตามรูบริคส่วน B)"}, {"s": "APPLY", "n": 2, "t": "กิจกรรมที่ 2  ความไวของสัญญาณ “จำนวนสินค้า” (7 คะแนน)\n2.1  ตารางคำตอบอ้างอิง — ค่าเริ่มต้น: จำนวนสินค้า = 6 (ซื้อ = 3, ราคา = 3, ระบุสินค้า = 1)   (3 คะแนน)\n• ข้อความของลูกค้า  —  BUY\n      PRICE  ถูกต้อง  ระบบทำนาย  ผล\n• เอาปูน 5 ถุงครับ  —  3+1+6 = 10\n      0  BUY  ✓\n• ปูน 5 ถุงราคาเท่าไหร่  —  0+1+6 = 7\n      3  PRICE  BUY  ✗\n• ขอเหล็ก 3 เส้น  —  3+1+6 = 10\n      0  BUY  ✓\n• เหล็ก 3 เส้นราคาเท่าไหร่  —  0+1+6 = 7\n      3  PRICE  BUY  ✗\n• ซื้อทราย 2 กระสอบ  —  3+1+6 = 10\n      0  BUY  ✓\n• ทราย 2 กระสอบราคาเท่าไร  —  0+1+6 = 7\n      3  PRICE  BUY  ✗\n• อยากได้สี 4 กระป๋อง  —  3+1+6 = 10\n      0  BUY  ✓\n• สี 4 กระป๋องราคาเท่าไหร่  —  0+1+6 = 7\n      3  PRICE  BUY  ✗\nความแม่นยำของค่าเริ่มต้น = 4 ÷ 8 × 100 = 50.0%\nเกณฑ์ให้คะแนน: ถูกครบ 8 แถว = 3 คะแนน · ถูก 6–7 แถว = 2 คะแนน · ถูก 3–5 แถว = 1 คะแนน\n2.2  เฉลย (2 คะแนน)\nข้อความกลุ่มถามราคาทั้ง 4 ข้อความถูกทำนายผิดเป็น BUY เพราะน้ำหนักจำนวนสินค้าที่สูงถึง 6 ทำให้คะแนน BUY (7) แซงคะแนน PRICE (3) ทั้งที่ข้อความนั้นไม่มีคำแสดงความต้องการซื้อเลย กล่าวคือสัญญาณที่ไม่จำแนกกลบสัญญาณที่จำแนกได้จริง\nเกณฑ์ให้คะแนน: ระบุว่าเป็นข้อความกลุ่มถามราคาทั้ง 4 ข้อความและทำนายผิดเป็น BUY = 1 คะแนน · อธิบายสาเหตุว่าน้ำหนักจำนวนสินค้าสูงเกินจนกลบคะแนน PRICE = 1 คะแนน\n2.3  แนวคำตอบอ้างอิง (2 คะแนน — ส่วนเหตุผลใช้รูบริคส่วน B ประกอบ)\nค่าที่ทำให้ถูกต้องครบ 8 ข้อความคือ น้ำหนักจำนวนสินค้า = 0 หรือ 1 เท่านั้น ตรวจสอบได้ดังนี้ เมื่อใช้ค่า 1 ข้อความกลุ่มซื้อได้ BUY = 3+1+1 = 5 > PRICE = 0 ส่วนกลุ่มถามราคาได้ BUY = 0+1+1 = 2 < PRICE = 3 จึงถูกต้องทั้งสองกลุ่ม หากใช้ค่า 2 ขึ้นไป BUY ของกลุ่มถามราคาจะเป็น 3 ซึ่งเสมอกับ PRICE ทำให้ระบบตอบ CLARIFY และเมื่อค่ามากกว่านั้นจะกลับไปทำนายผิดเป็น BUY อีก\nเหตุผลเชิงหลักการ: “จำนวนสินค้า” เป็นสัญญาณที่ปรากฏได้ทั้งในข้อความสั่งซื้อและข้อความถามราคา จึงมีอำนาจจำแนกต่ำ ควรได้น้ำหนักน้อยกว่าคำบ่งชี้เจตนาโดยตรงเสมอ\nเกณฑ์ให้คะแนน: ระบุค่า 0 หรือ 1 = 1 คะแนน · อธิบายเหตุผลพร้อมเปรียบเทียบคะแนนของทั้งสองกลุ่มข้อความ = 1 คะแนน (ตรวจตามรูบริคส่วน B)"}, {"s": "APPLY", "n": 3, "t": "กิจกรรมที่ 3  ขยายพจนานุกรมภาษาถิ่นและคำสะกดผิด (7 คะแนน)\n3.1  ตารางคำตอบอ้างอิง — ค่าเริ่มต้น: ระดับพจนานุกรม = 0   (3 คะแนน)\n• ข้อความของลูกค้า  —  ระดับภาษา\n      ตรวจพบ?  ถูกต้อง  ระบบทำนาย  ผล\n• ปูนถุงละกี่บาทครับ  —  0\n      พบ  PRICE  ✓\n• มีปูนก่อขายบ่  —  1\n      ไม่พบ  PRODUCT  CLARIFY  ✗\n• เอาปูนก่อ 5 ถุงครับ  —  0\n      พบ  BUY  ✓\n• ปูนก่อจักโลราคาห่าใด  —  2\n      ไม่พบ  PRICE  CLARIFY  ✗\n• มีปูนหยังบ้าง  —  2\n      ไม่พบ  PRODUCT  CLARIFY  ✗\n• เอาปูน5ถุง  —  3\n      ไม่พบ  BUY  CLARIFY  ✗\n• ปูนกี่บาท  —  0\n      พบ  PRICE  ✓\n• มีปูนขายมั้ย  —  1\n      ไม่พบ  PRODUCT  CLARIFY  ✗\nความแม่นยำของค่าเริ่มต้น = 3 ÷ 8 × 100 = 37.5%\nเกณฑ์ให้คะแนน: ถูกครบ 8 แถว = 3 คะแนน · ถูก 6–7 แถว = 2 คะแนน · ถูก 3–5 แถว = 1 คะแนน\n3.2  เฉลย (2 คะแนน)\nข้อความที่ผิดมี 5 ข้อความ ได้แก่ “มีปูนก่อขายบ่”, “ปูนก่อจักโลราคาห่าใด”, “มีปูนหยังบ้าง”, “เอาปูน5ถุง” และ “มีปูนขายมั้ย” ทั้งหมดระบบตอบ CLARIFY เพราะตรวจไม่พบคำบ่งชี้ใดเลย คะแนนทั้งสาม Intent จึงเป็น 0 เท่ากัน\nเกณฑ์ให้คะแนน: ระบุข้อความที่ผิดครบ 5 ข้อความ = 1 คะแนน (ระบุถูก 3–4 ข้อความ = 0.5 คะแนน) · ระบุว่าระบบตอบ CLARIFY พร้อมเหตุผลว่าคะแนนเป็น 0 ทุก Intent = 1 คะแนน\n3.3  แนวคำตอบอ้างอิง (2 คะแนน — ส่วนเหตุผลใช้รูบริคส่วน B ประกอบ)\nต้องตั้งระดับพจนานุกรมเป็นระดับ 3 เท่านั้น จึงจะครอบคลุมทั้งภาษาถิ่นทั่วไป (ระดับ 1) ภาษาถิ่นเฉพาะภาค (ระดับ 2) และคำที่พิมพ์ติดกันหรือสะกดผิด (ระดับ 3) ระดับ 2 ยังตกข้อความ “เอาปูน5ถุง” ทำให้ได้เพียง 7/8 = 87.5%\nผลกระทบ: หากไม่ขยายพจนานุกรม ลูกค้าที่ใช้ภาษาถิ่นจะถูกถามย้ำทุกครั้งที่พิมพ์ ทั้งที่ลูกค้าที่ใช้ภาษามาตรฐานได้รับคำตอบทันที เป็นความไม่เท่าเทียมในการเข้าถึงบริการที่เกิดจากการออกแบบระบบ ไม่ใช่จากความผิดของลูกค้า และอาจทำให้ลูกค้ากลุ่มนั้นเลิกใช้บริการในที่สุด\nเกณฑ์ให้คะแนน: ระบุระดับ 3 = 1 คะแนน · อธิบายผลกระทบต่อลูกค้าที่ใช้ภาษาถิ่นในเชิงความเป็นธรรมหรือการเข้าถึงบริการ = 1 คะแนน (ตรวจตามรูบริคส่วน B)"}, {"s": "APPLY", "n": 4, "t": "กิจกรรมที่ 4  ค่าความมั่นใจขั้นต่ำ (Margin) (7 คะแนน)\n4.1  ตารางคำตอบอ้างอิง — ค่าเริ่มต้น: Margin = 0   (3 คะแนน)\n• ข้อความของลูกค้า  —  B\n      P  PR  ผลต่างอันดับ 1–2  ถูกต้อง  ทำนาย  ผล\n• เอาปูน 5 ถุง แล้วก็เหล็ก 2 เส้นด้วยครับ  —  6\n      0  6  BUY  ✓\n• ปูนราคาถุงละเท่าไหร่ครับ  —  0\n      3  0  3  PRICE  ✓\n• ร้านมีสีกี่ยี่ห้อ มีแบบไหนบ้าง  —  0\n      4  PRODUCT  ✓\n• ปูนนี่ซื้อดีไหม  —  2\n      1  0  1  CLARIFY  BUY  ✗\n• เอาปูนเลยครับ ราคาก็โอเคอยู่  —  5\n      3  0  2  BUY  ✓\n• ปูนกับเหล็กแบบไหนดีกว่ากัน  —  1\n      0  CLARIFY  ✓\n• เอาปูนก่อดีกว่า ร้านมีกี่ยี่ห้อ  —  4\n      0  2  BUY  ✓\n• ปูนนี้มีกี่แบบ แบบไหนดีกว่ากัน  —  2\n      0  3  1  CLARIFY  PRODUCT  ✗\n• ราคาปูนถุงนี้เท่าไหร่ มีรุ่นพรีเมียมไหม  —  0\n      5  2  3  PRICE  ✓\n• ปูนตรานี้เป็นยังไงบ้าง  —  3\n      0  CLARIFY  ✓\nความแม่นยำของค่าเริ่มต้น = 8 ÷ 10 × 100 = 80.0%\nเกณฑ์ให้คะแนน: ถูกครบ 10 แถว = 3 คะแนน · ถูก 8–9 แถว = 2 คะแนน · ถูก 5–7 แถว = 1 คะแนน\n4.2  เฉลย (2 คะแนน)\nผิด 2 ข้อความ คือ “ปูนนี่ซื้อดีไหม” (ผลต่าง 1 ระบบเลือก BUY) และ “ปูนนี้มีกี่แบบ แบบไหนดีกว่ากัน” (ผลต่าง 1 ระบบเลือก PRODUCT) ทั้งคู่เป็นข้อความกำกวมที่ควรถามเพิ่มเติม แต่ Margin = 0 ทำให้ผลต่างเพียง 1 คะแนนก็เพียงพอให้ระบบตัดสินใจ ทั้งที่หลักฐานยังอ่อนมาก\nเกณฑ์ให้คะแนน: ระบุข้อความที่ผิดทั้ง 2 ข้อความ = 1 คะแนน · อธิบายว่าเป็นการตัดสินใจทั้งที่ผลต่างคะแนนน้อยเกินไป = 1 คะแนน\n4.3  แนวคำตอบอ้างอิง (2 คะแนน — ส่วนเหตุผลใช้รูบริคส่วน B ประกอบ)\nค่า Margin ที่ถูกต้องคือ 1 เท่านั้น ทำให้ความแม่นยำเพิ่มจาก 80% เป็น 100% เพราะข้อความที่มีผลต่าง 1 ทั้งสองรายการจะถูกส่งเข้าเงื่อนไข CLARIFY ตามที่ควรเป็น ขณะที่ข้อความที่ตัดสินใจถูกอยู่แล้วมีผลต่างตั้งแต่ 2 ขึ้นไปจึงไม่ได้รับผลกระทบ\nเหตุใดค่าที่สูงกว่านั้นจึงแย่ลง: เมื่อ Margin = 2 ข้อความ “เอาปูนเลยครับ ราคาก็โอเคอยู่” (ผลต่าง 2) และ “เอาปูนก่อดีกว่า ร้านมีกี่ยี่ห้อ” (ผลต่าง 2) จะถูกตีเป็น CLARIFY ทั้งที่มีเจตนาซื้อชัดเจน ความแม่นยำจึงลดกลับเหลือ 80% และลดลงต่อเนื่องเป็น 60% ที่ Margin = 3 และ 50% ที่ Margin = 4 สะท้อนการแลกได้แลกเสีย (trade-off) ระหว่างการระวังตัวมากเกินไปกับการตัดสินใจเร็วเกินไป\nเกณฑ์ให้คะแนน: ระบุค่า Margin = 1 = 1 คะแนน · อธิบาย trade-off พร้อมยกตัวอย่างข้อความที่เสียไปเมื่อ Margin สูงเกิน = 1 คะแนน (ตรวจตามรูบริคส่วน B)"}, {"s": "APPLY", "n": 5, "t": "กิจกรรมที่ 5  ภารกิจรวม: ปรับทุกพารามิเตอร์พร้อมกัน (7 คะแนน)\n5.1  ตารางคำตอบอ้างอิง — ค่าเริ่มต้น: ซื้อ = 2, ราคา = 3, รายการสินค้า = 1, ระบุสินค้า = 1, จำนวนสินค้า = 5, Margin = 0   (3 คะแนน)\n• ข้อความของลูกค้า  —  BUY\n      PRICE  PRODUCT  ถูกต้อง  ทำนาย  ผล\n• เอาปูน 5 ถุงครับ  —  8\n      0  BUY  ✓\n• ปูนกี่บาท  —  1\n      3  0  PRICE  ✓\n• มีปูนกี่ยี่ห้อ  —  1\n      0  1  PRODUCT  CLARIFY  ✗\n• ขอเหล็ก 4 เส้น  —  8\n      0  BUY  ✓\n• เหล็ก 4 เส้นราคาเท่าไหร่  —  6\n      3  0  PRICE  BUY  ✗\n• ร้านมีสีอะไรบ้าง  —  1\n      0  1  PRODUCT  CLARIFY  ✗\n• ซื้อทราย 2 กระสอบ  —  8\n      0  BUY  ✓\n• ทราย 2 กระสอบราคาเท่าไร  —  6\n      3  0  PRICE  BUY  ✗\n• ขายอิฐกี่แบบ  —  1\n      0  1  PRODUCT  CLARIFY  ✗\n• ปูน 5 ถุง (พิมพ์ลอย ๆ)  —  6\n      0  CLARIFY  BUY  ✗\n• ปูนซื้อดีไหม ราคาถูกป่าว  —  3\n      0  CLARIFY  ✓\n• สวัสดีครับ มีคนอยู่ไหม  —  0\n      CLARIFY  ✓\nความแม่นยำของค่าเริ่มต้น = 6 ÷ 12 × 100 = 50.0%\nเกณฑ์ให้คะแนน: ถูกครบ 12 แถว = 3 คะแนน · ถูก 9–11 แถว = 2 คะแนน · ถูก 5–8 แถว = 1 คะแนน\n5.2  เฉลย (2 คะแนน)\nผิด 6 ข้อความ แบ่งตามสาเหตุได้ 3 กลุ่ม (1) กลุ่ม PRODUCT สามข้อความถูกตอบ CLARIFY เพราะน้ำหนักคำรายการสินค้า (1) เท่ากับน้ำหนักคำระบุสินค้าที่ให้แก่ BUY (2) กลุ่มถามราคาสองข้อความถูกตอบ BUY เพราะน้ำหนักจำนวนสินค้าสูงถึง 5 ทำให้ BUY = 6 แซง PRICE = 3 (3) ข้อความ “ปูน 5 ถุง” ท _Q:2": 2, "SHOW_Q:3": 3, "SHOW_Q:4": 4, "LEARN_TASKS:0": 5, "LEARN_TASKS:1": 6, "LEARN_TASKS:2": 7, "LEARN_TASKS:3": 8, "LEARN_TASKS:4": 9, "LEARN_TASKS:5": 10, "LEARN_TASKS:6": 11}, "st": {}, "rb": "2.  ส่วน B — รูบริคการให้คะแนนคำถามอัตนัยเชิงเหตุผล (3 มิติ มิติละ 4 ระดับ) และตารางแปลงระดับเป็นคะแนน\n3.  ส่วน C — แนวทางและมิติการประเมินขั้นตอนที่ 4 REFLECT (ประเมินตนเอง)\nสัดส่วนคะแนน (สอดคล้องกับเว็บแอป Chatbot RiskGuard)\n• ส่วน  —  คะแนนเต็ม\n      รายละเอียดการกระจายคะแนน\n• SHOW  —  10\n      5 ข้อ ข้อละ 2 คะแนน\n• LEARN  —  40\n      ภาระงานที่ 1–5 ภาระงานละ 5 คะแนน (x.1 = 2, x.2 = 3) · ภาระงานที่ 6 = 8 คะแนน (6.1 = 5, 6.2 = 3) · ภาระงานที่ 7 = 7 คะแนน (7.1 = 4, 7.2 = 3)\n• APPLY  —  35\n      5 กิจกรรม กิจกรรมละ 7 คะแนน (x.1 = 3, x.2 = 2, x.3 = 2)\n• REFLECT  —  15\n      ข้อ 4.1–4.4 ข้อละ 2 คะแนน (รวม 8) · ข้อ 4.5 = 3 คะแนน · ข้อ 4.6 = 4 คะแนน\n• รวม  —  100\nข้อที่ต้องใช้รูบริคส่วน B ประกอบการตรวจ\nLEARN: ข้อ 1.2, 2.2 (เฉพาะส่วนอธิบาย), 3.2, 4.2, 5.2, 6.2, 7.2 (ข้อละ 3 คะแนน) · APPLY: ข้อ 1.3, 2.3, 3.3, 4.3, 5.3 (เฉพาะส่วนเหตุผล ข้อละ 2 คะแนน)\n1.2  แนวคำตอบอ้างอิง (3 คะแนน — คำถามอัตนัย ใช้รูบริคส่วน B ประกอบ)\nคำระบุสินค้า เช่น “ปูน” หรือ “เหล็ก” ปรากฏได้ในทั้งสาม Intent — ทั้งข้อความซื้อ (“เอาปูน 5 ถุง”) ข้อความถามราคา (“ปูนกี่บาท”) และข้อความถามรายการสินค้า (“ร้านมีปูนอะไรบ้าง”) จึงเป็นคำที่ “ไม่จำแนก” Intent ถ้าให้น้ำหนักสูงเท่าคำบ่งชี้เจตนา คะแนนของ Intent ที่ผูกกับคำระบุสินค้าจะสูงขึ้นในทุกข้อความ ทำให้ระบบเอนเอียงไปทาง Intent นั้นอย่างไม่มีเหตุผล ส่วนคำอย่าง “เอา” หรือ “กี่บาท” ปรากฏเฉพาะกับเจตนาเดียว จึงมีอำนาจจำแนกสูงกว่าและควรได้น้ำหนักมากกว่า\nเกณฑ์ให้คะแนน: อธิบายว่าคำระบุสินค้าปรากฏได้ในทุก Intent จึงจำแนกไม่ได้ = 1 คะแนน · ยกตัวอย่างข้อความประกอบอย่างน้อย 2 Intent = 1 คะแนน · เชื่อมโยงไปถึงผลเสียของการให้น้ำหนักสูงเกินไป (ระบบเอนเอียง/ทำนายผิด) = 1 คะแนน\n3.2  แนวคำตอบอ้างอิง (3 คะแนน — คำถามอัตนัย ใช้รูบริคส่วน B ประกอบ)\nระบบจะให้คะแนน Intent ได้ก็ต่อเมื่อจับคู่คำในข้อความกับพจนานุกรมคำบ่งชี้ได้ เมื่อพจนานุกรมครอบคลุมเฉพาะภาษามาตรฐาน (ระดับ 0) มีเพียง 3 จาก 8 ข้อความที่ตรวจพบคำบ่งชี้ อีก 5 ข้อความได้คะแนนทุก Intent เป็น 0 ระบบจึงตอบไม่ได้ เมื่อขยายเป็นระดับ 1 เพิ่มเป็น 5 ข้อความ ระดับ 2 เพิ่มเป็น 7 และระดับ 3 ครบทั้ง 8 ข้อความ คิดเป็นการเพิ่มความครอบคลุมจาก 37.5% เป็น 100% การขยายพจนานุกรมจึงเพิ่มจำนวนข้อความที่ระบบ “มีหลักฐานพอจะตัดสินใจ” โดยตรง\nเกณฑ์ให้คะแนน: อธิบายกลไกการจับคู่คำกับพจนานุกรมและผลเมื่อจับคู่ไม่ได้ = 1 คะแนน · อ้างอิงตัวเลขจากตารางอย่างน้อย 2 ค่า = 1 คะแนน · เชื่อมโยงกับความแม่นยำโดยรวมของระบบ = 1 คะแนน\n4.2  แนวคำตอบอ้างอิง (3 คะแนน — คำถามอัตนัย ใช้รูบริคส่วน B ประกอบ)\nถ้าใช้เกณฑ์เพียง “สูงกว่า Intent ใด Intent หนึ่ง” จะมีมากกว่าหนึ่ง Intent ที่ผ่านเกณฑ์พร้อมกัน ทำให้กฎไม่สามารถชี้ขาดคำตอบเดียวได้ ตัวอย่างเช่น BUY = 3, PRICE = 3, PRODUCT = 0 ทั้ง BUY และ PRICE ต่างสูงกว่า PRODUCT จึงผ่านเกณฑ์ทั้งคู่ ระบบต้องเลือกโดยพลการหรือเลือกตามลำดับการเขียนโปรแกรม ซึ่งเป็นการเดา การกำหนดให้ต้องสูงกว่าทั้งสอง Intent จึงรับประกันว่าผู้ชนะมีเพียงหนึ่งเดียว และกรณีที่เหลือทั้งหมดถูกส่งเข้าเงื่อนไข “ถามผู้ใช้เพิ่มเติม” อย่างเป็นระบบ\nเกณฑ์ให้คะแนน: อธิบายว่าเกณฑ์แบบหลังทำให้มีผู้ผ่านเกณฑ์มากกว่าหนึ่ง = 1 คะแนน · ยกตัวอย่างคะแนนที่แสดงปัญหาได้จริง = 1 คะแนน · เชื่อมโยงว่าการเลือกโดยพลการคือการเดาและกฎที่ถูกต้องนำไปสู่ CLARIFY = 1 คะแนน\n5.2  แนวคำตอบอ้างอิง (3 คะแนน — คำถามอัตนัย ใช้รูบริคส่วน B ประกอบ)\nเมื่อคะแนนเสมอกัน โอกาสที่การเดาจะถูกเหลือราวครึ่งเดียว ความผิดพลาดที่เกิดขึ้นมีต้นทุนไม่เท่ากันในแต่ละทิศทาง เช่น ถ้าลูกค้าเพียงถามข้อมูลแต่ระบบเดาเป็น BUY แล้วบันทึกคำสั่งซื้อ อาจเกิดการสั่งซื้อที่ลูกค้าไม่ได้ตั้งใจ ต้องยกเลิกภายหลัง เสียเวลาทั้งสองฝ่ายและกระทบความน่าเชื่อถือของร้าน ในทางกลับกันถ้าลูกค้าต้องการสั่งซื้อแต่ระบบตอบเป็นรายการสินค้า ลูกค้าต้องพิมพ์ซ้ำและอาจเปลี่ยนไปซื้อร้านอื่น การถามกลับหนึ่งประโยคใช้เวลาเพียงเล็กน้อยแต่ตัดความเสี่ยงทั้งสองแบบออกไป\nเกณฑ์ให้คะแนน: ระบุว่าการเดามีโอกาสผิดสูงเมื่อไม่มีหลักฐานชี้ขาด = 1 คะแนน · ยกผลกระทบที่เป็นรูปธรรมต่อลูกค้าหรือร้านค้าอย่างน้อย 1 กรณีพร้อมตัวอย่าง = 1 คะแนน · เปรียบเทียบต้นทุนของการถามกลับกับต้นทุนของการเดาผิด = 1 คะแนน\n6.2  แนวคำตอบอ้างอิง (3 คะแนน — คำถามอัตนัย ใช้รูบริคส่วน B ประกอบ)\nบล็อก จ ทำหน้าที่เป็นทางออกสุดท้าย (default case) ของโครงสร้างเงื่อนไขแบบลูกโซ่ หากตัดออก ข้อความที่ไม่เข้าเงื่อนไขใดเลย เช่น BUY = 3, PRICE = 3, PRODUCT = 0 จะไหลผ่านทั้งสามเงื่อนไขโดยไม่มีคำสั่งใดทำงาน ระบบจึงไม่ส่ง Intent ใดไปยังขั้นตอบคำถาม ผลคือลูกค้าไม่ได้รับการตอบกลับเลย หรือระบบค้างรอ ซึ่งร้ายแรงกว่าการตอบผิด เพราะลูกค้าไม่ทราบว่าเกิดอะไรขึ้นและไม่มีทางแก้ด้วยตนเอง\nเกณฑ์ให้คะแนน: ระบุว่าไม่มีคำสั่งใดทำงานเมื่อไม่เข้าเงื่อนไขใดเลย = 1 คะแนน · ยกตัวอย่างชุดคะแนนที่ทำให้เกิดกรณีนี้ = 1 คะแนน · อธิบายผลที่เกิดกับลูกค้า (ไม่ได้รับคำตอบ/ระบบค้าง) = 1 คะแนน\n7.2  แนวคำตอบอ้างอิง (3 คะแนน — คำถามอัตนัย ใช้รูบริคส่วน B ประกอบ)\nเงื่อนไข if ต้องเปรียบเทียบ “จำนวนในคลัง” กับ “จำนวนที่ลูกค้าสั่ง” ถ้ายังไม่ได้รับค่าที่สองเข้ามาก่อน ตัวแปรนั้นจะยังไม่มีค่า การเปรียบเทียบจึงไม่มีความหมายหรือเกิดข้อผิดพลาดขณะทำงาน ลำดับ “รับข้อมูลก่อน แล้วจึงตัดสินใจ” เป็นหลักพื้นฐานของการเขียนโปรแกรมเชิงลำดับ ส่วนบล็อก จ ผิดเพราะยืนยันคำสั่งซื้อโดยข้ามการตรวจสอบ ทำให้ระบบอาจรับออร์เดอร์เกินจำนวนสินค้าที่มีจริง เกิดการขายเกินสต็อก (overselling) ร้านต้องยกเลิกออร์เดอร์ภายหลัง กระทบทั้งความน่าเชื่อถือและข้อมูลสต็อกที่ผิดพลาดสะสมต่อไป\nเกณฑ์ให้คะแนน: อธิบายเหตุผลด้านลำดับการทำงาน (ต้องมีค่าก่อนเปรียบเทียบ) = 1 คะแนน · ระบุว่าบล็อก จ ข้ามการตรวจสอบเงื่อนไข = 1 คะแนน · อธิบายผลเสียที่เป็นรูปธรรม เช่น ขายเกินสต็อกหรือต้องยกเลิกออร์เดอร์ = 1 คะแนน\n1.3  แนวคำตอบอ้างอิง (2 คะแนน — ส่วนเหตุผลใช้รูบริคส่วน B ประกอบ)\nคำตอบไม่มีชุดเดียวตายตัว เงื่อนไขที่ทำให้ถูกต้องครบ 8 ข้อความคือ น้ำหนักคำ “รายการสินค้า” ≥ 2 และน้ำหนักคำ “ราคา” ≥ 2 ส่วนน้ำหนักคำ “ต้องการซื้อ” ใช้ค่าใดก็ได้ตั้งแต่ 1 ถึง 5 (มีชุดคำตอบที่ถูกต้องรวม 80 ชุด) ตัวอย่างที่ตรงไปตรงมาที่สุดคือ ซื้อ = 3, ราคา = 3, รายการสินค้า = 3 ตามค่ามาตรฐานในสถานการณ์\nเหตุผล: ปัญหาเกิดจากคำ “ปูน/สี/อิฐ” มอบคะแนน 1 ให้ BUY ทุกครั้ง ทำให้ PRODUCT ที่ได้ 1 คะแนนเท่ากันไม่สามารถชนะได้ การยกน้ำหนักคำบ่งชี้รายการสินค้าให้สูงกว่าน้ำหนักคำระบุสินค้าจึงคืนอำนาจจำแนกให้กลุ่ม PRODUCT โดยไม่กระทบข้อความกลุ่ม BUY ซึ่งมีคะแนนนำอยู่แล้ว\nเกณฑ์ให้คะแนน: เสนอค่าน้ำหนักที่อยู่ในเงื่อนไขข้างต้นและตรวจสอบได้ว่าถูก 8/8 = 1 คะแนน · อธิบายเหตุผลเชื่อมโยงกับสาเหตุของความผิดพลาดเดิม = 1 คะแนน (ตรวจตามรูบริคส่วน B)\n2.3  แนวคำตอบอ้างอิง (2 คะแนน — ส่วนเหตุผลใช้รูบริคส่วน B ประกอบ)\nค่าที่ทำให้ถูกต้องครบ 8 ข้อความคือ น้ำหนักจำนวนสินค้า = 0 หรือ 1 เท่านั้น ตรวจสอบได้ดังนี้ เมื่อใช้ค่า 1 ข้อความกลุ่มซื้อได้ BUY = 3+1+1 = 5 > PRICE = 0 ส่วนกลุ่มถามราคาได้ BUY = 0+1+1 = 2 < PRICE = 3 จึงถูกต้องทั้งสองกลุ่ม หากใช้ค่า 2 ขึ้นไป BUY ของกลุ่มถามราคาจะเป็น 3 ซึ่งเสมอกับ PRICE ทำให้ระบบตอบ CLARIFY และเมื่อค่ามากกว่านั้นจะกลับไปทำนายผิดเป็น BUY อีก\nเหตุผลเชิงหลักการ: “จำนวนสินค้า” เป็นสัญญาณที่ปรากฏได้ทั้งในข้อความสั่งซื้อและข้อความถามราคา จึงมีอำนาจจำแนกต่ำ ควรได้น้ำหนักน้อยกว่าคำบ่งชี้เจตนาโดยตรงเสมอ\nเกณฑ์ให้คะแนน: ระบุค่า 0 หรือ 1 = 1 คะแนน · อธิบายเหตุผลพร้อมเปรียบเทียบคะแนนของทั้งสองกลุ่มข้อความ = 1 คะแนน (ตรวจตามรูบริคส่วน B)\n3.3  แนวคำตอบอ้างอิง (2 คะแนน — ส่วนเหตุผลใช้รูบริคส่วน B ประกอบ)\nต้องตั้งระดับพจนานุกรมเป็นระดับ 3 เท่านั้น จึงจะครอบคลุมทั้งภาษาถิ่นทั่วไป (ระดับ 1) ภาษาถิ่นเฉพาะภาค (ระดับ 2) และคำที่พิมพ์ติดกันหรือสะกดผิด (ระดับ 3) ระดับ 2 ยังตกข้อความ “เอาปูน5ถุง” ทำให้ได้เพียง 7/8 = 87.5%\nผลกระทบ: หากไม่ขยายพจนานุกรม ลูกค้าที่ใช้ภาษาถิ่นจะถูกถามย้ำทุกครั้งที่พิมพ์ ทั้งที่ลูกค้าที่ใช้ภาษามาตรฐานได้รับคำตอบทันที เป็นความไม่เท่าเทียมในการเข้าถึงบริการที่เกิดจากการออกแบบระบบ ไม่ใช่จากความผิดของลูกค้า และอาจทำให้ลูกค้ากลุ่มนั้นเลิกใช้บริการในที่สุด\nเกณฑ์ให้คะแนน: ระบุระดับ 3 = 1 คะแนน · อธิบายผลกระทบต่อลูกค้าที่ใช้ภาษาถิ่นในเชิงความเป็นธรรมหรือการเข้าถึงบริการ = 1 คะแนน (ตรวจตามรูบริคส่วน B)\n4.3  แนวคำตอบอ้างอิง (2 คะแนน — ส่วนเหตุผลใช้รูบริคส่วน B ประกอบ)\nค่า Margin ที่ถูกต้องคือ 1 เท่านั้น ทำให้ความแม่นยำเพิ่มจาก 80% เป็น 100% เพราะข้อความที่มีผลต่าง 1 ทั้งสองรายการจะถูกส่งเข้าเงื่อนไข CLARIFY ตามที่ควรเป็น ขณะที่ข้อความที่ตัดสินใจถูกอยู่แล้วมีผลต่างตั้งแต่ 2 ขึ้นไปจึงไม่ได้รับผลกระทบ\nเหตุใดค่าที่สูงกว่านั้นจึงแย่ลง: เมื่อ Margin = 2 ข้อความ “เอาปูนเลยครับ ราคาก็โอเคอยู่” (ผลต่าง 2) และ “เอาปูนก่อดีกว่า ร้านมีกี่ยี่ห้อ” (ผลต่าง 2) จะถูกตีเป็น CLARIFY ทั้งที่มีเจตนาซื้อชัดเจน ความแม่นยำจึงลดกลับเหลือ 80% และลดลงต่อเนื่องเป็น 60% ที่ Margin = 3 และ 50% ที่ Margin = 4 สะท้อนการแลกได้แลกเสีย (trade-off) ระหว่างการระวังตัวมากเกินไปกับการตัดสินใจเร็วเกินไป\nเกณฑ์ให้คะแนน: ระบุค่า Margin = 1 = 1 คะแนน · อธิบาย trade-off พร้อมยกตัวอย่างข้อความที่เสียไปเมื่อ Margin สูงเกิน = 1 คะแนน (ตรวจตามรูบริคส่วน B)\n5.3  แนวคำตอบอ้างอิง (2 คะแนน — ส่วนเหตุผลใช้รูบริคส่วน B ประกอบ)\nมีชุดคำตอบที่ถูกต้องครบ 12 ข้อความอยู่หลายชุด (จากการตรวจสอบครบทุกความเป็นไปได้ในช่วงที่กำหนด พบ 228 ชุด) ชุดที่ตรงไปตรงมาที่สุดและควรใช้เป็นเกณฑ์อ้างอิงคือ ซื้อ = 3, ราคา = 3, รายการสินค้า = 3, ระบุสินค้า = 0, จำนวนสินค้า = 0, Margin = 0 ซึ่งให้ความแม่นยำ 12/12 = 100%\nหลักการของคำตอบชุดนี้: กุญแจสำคัญคือการลดน้ำหนัก “คำระบุสินค้า” และ “จำนวนสินค้า” ให้เป็น 0 เพราะทั้งสองเป็นสัญญาณที่ปรากฏได้ในทุก Intent จึงไม่มีอำนาจจำแนก เมื่อตัดออก คะแนนจะมาจากคำบ่งชี้เจตนาโดยตรงเท่านั้น ข้อความที่มีเจตนาชัดเจนจะได้ 3 คะแนนใน Intent เดียว ส่วนข้อความกำกวมอย่าง “ปูน 5 ถุง” จะได้ 0 ทุก Intent และ “ปูนซื้อดีไหม ราคาถูกป่าว” จะได้ 3 เท่ากันสอง Intent ทั้งคู่จึงเข้าเงื่อนไข CLARIFY ตามที่ควรเป็น\nชุดคำตอบอื่นที่ยอมรับได้: ให้ครูตรวจโดยแทนค่าที่นักเรียนเสนอกลับเข้าตารางข้อ 5.1 หากจำแนกถูกครบ 12 ข้อความถือว่าถูกต้อง เช่น ซื้อ = 2, ราคา = 3, รายการสินค้า = 3, ระบุสินค้า = 1, จำนวนสินค้า = 0, Margin = 1 ก็ให้ผล 100% เช่นกัน\nเกณฑ์ให้คะแนน: เสนอชุดค่าที่ตรวจสอบแล้วได้ 12/12 = 1 คะแนน · อธิบายหลักการว่าต้องลดน้ำหนักสัญญาณที่ไม่จำแนก หรือชดเชยด้วย Margin = 1 คะแนน (ตรวจตามรูบริคส่วน B)\nตารางแปลงระดับรูบริคเป็นคะแนน (สำหรับแต่ละข้อ)\nนำระดับที่ได้จาก 3 มิติ (แต่ละมิติมีน้ำหนักเท่ากัน) มาหาค่าเฉลี่ย แล้วเทียบกับคะแนนเต็มของข้อนั้นตามตาราง\n• ระดับเฉลี่ย 3 มิติ  —  ข้อที่เต็ม 2 คะแนน (APPLY 1.3–5.3)\n      ข้อที่เต็ม 3 คะแนน (LEARN 1.2–7.2)\n• 3.5 – 4.0 (ดีเยี่ยม)  —  2\n      3\n• 2.5 – 3.4 (ดี)  —  1.5\n      2.5\n• 1.8 – 2.4 (พอใช้)  —  1\n      1.5\n• 1.0 – 1.7 (ควรปรับปรุง)  —  0.5\n      1\n• ไม่ตอบ / ตอบไม่เกี่ยวข้อง  —  0\nหมายเหตุ: ข้อ LEARN 2.2 และ APPLY 1.3–5.3 มีส่วนที่เป็นตัวเลขหรือค่าพารามิเตอร์ ให้ตรวจส่วนนั้นตามเฉลยในส่วน A ก่อน (ถูก/ผิดชัดเจน) แล้วจึงใช้รูบริคนี้กับส่วนอธิบายเหตุผลที่เหลือเท่านั้น\nส่วน C · แนวทางการประเมินขั้นตอนที่ 4 REFLECT\n      ประเมิน 3 มิติ มิติละ 3 ระดับ · ใช้ประกอบการตรวจข้อ 4.5 และ 4.6 และการให้ข้อมูลย้อนกลับรายบุคคล\nขั้นตอน REFLECT มีลักษณะต่างจากสามส่วนแรก เพราะเป็นการให้นักเรียนประเมินตนเองและสะท้อนคิดเชิงจริยธรรม ไม่ใช่การวัดความรู้ที่มีคำตอบถูกผิดตายตัว กรอบด้านล่างใช้เพื่อให้การตรวจมีความสม่ำเสมอระหว่างผู้ตรวจ\nมิติที่ 1: ความครบถ้วนและตรงประเด็นของคำตอบ (Completeness & Relevance)\n• ระดับ  —  เกณฑ์การพิจารณา\n• สูง  —  ตอบครบทุกข้อ (4.1–4.6) ตรงประเด็นคำถาม คำตอบปลายเปิดมีทั้งการระบุสิ่งที่ควรทำและเหตุผลประกอบ\n• กลาง  —  ตอบครบหรือเกือบครบ แต่คำตอบปลายเปิดสั้นมาก ระบุเพียงสิ่งที่ควรทำโดยไม่มีเหตุผล หรือมีบางส่วนไม่ตรงคำถาม\n• ต่ำ  —  ตอบไม่ครบหลายข้อ หรือคำตอบปลายเปิดเป็นการทวนคำถาม ไม่มีเนื้อหาของตนเอง\nมิติที่ 2: ความสอดคล้องระหว่างการประเมินตนเองกับผลการปฏิบัติจริง (Consistency with Observed Performance)\n• ระดับ  —  เกณฑ์การพิจารณา"};
  /* ตัวดึงคำตอบจาก state ของแบบทดสอบชุดนี้ */
  var ADAPTER = function (ctx) { 
ctx.own('SHOW', 'LEARN', 'APPLY', 'REFLECT');
var S = ctx.S;
(ctx.c('SHOW_Q') || []).forEach(function (q, i) {
  ctx.mcq({stage:'SHOW', no:i + 1, docNum:i + 1, bankKey:'SHOW_Q:' + i, q:q.q, options:q.opts,
    pick:(S.showAnswers || [])[i], correct:q.correct});
});
(ctx.c('LEARN_TASKS') || []).forEach(function (t, i) {
  var ans = (S.learnAnswers || [])[i], title = ctx.plain(t.title || ('ภาระงานที่ ' + (i + 1)));
  if (t.type === 'blocks') {
    var blocks = t.blocks || [];
    function bt(id) { var b = blocks.filter(function (x) { return x && x.id === id; })[0]; return b ? b.text : (id == null ? null : String(id)); }
    ctx.order({stage:'LEARN', docNum:i + 1, keepEmpty:true, q:title + ' · บล็อกคำสั่งที่ผู้เข้าสอบวางในแต่ละช่อง',
      slots:t.slots.map(function (s) { return s.label; }),
      mine:t.slots.map(function (s, k) { return bt(Array.isArray(ans) ? ans[k] : null); }),
      right:t.slots.map(function (s) { return bt(s.ans); })});
  } else {
    ctx.mcq({stage:'LEARN', docNum:i + 1, bankKey:'LEARN_TASKS:' + i, q:title + ' · ' + t.q, options:t.opts, pick:ans, correct:t.correct});
  }
});
var acts = ctx.c('APPLY_ACTIVITIES') || [], AS = S.applyState || {};
acts.forEach(function (a, i) {
  var acc = (S.applyResults || [])[i];
  if (acc === null || acc === undefined) { ctx.push({stage:'APPLY', kind:'apply', docNum:i + 1, q:ctx.plain(a.title || ('กิจกรรมที่ ' + (i + 1))), answer:'(ยังไม่ได้ทำ)'}); return; }
  var p = AS[a.id] || {}, parts = [];
  (a.controls || []).forEach(function (cn) { if (p[cn.k] !== undefined) parts.push(ctx.plain(cn.l) + ' = ' + p[cn.k]); });
  var pct = acc <= 1 ? Math.round(acc * 100) : Math.round(acc);
  ctx.push({stage:'APPLY', kind:'apply', docNum:i + 1, q:ctx.plain(a.title || ('กิจกรรมที่ ' + (i + 1))),
