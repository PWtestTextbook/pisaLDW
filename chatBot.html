    if (t.length <= 44 && /^[←◀‹]/.test(t)) return true;
    return false;
  }

  function nearestQuestionText(el) {
    var node = el, hops = 0;
    while (node && hops < 6) {
      node = node.parentElement; hops++;
      if (!node) break;
      var head = node.querySelector("h1,h2,h3,h4,h5,.q,.question,.prompt,.qtext,.stem,legend,strong,b");
      if (head) {
        var t = norm(head.textContent);
        if (t.length > 8 && t.length < 400) return t;
      }
    }
    return "";
  }

  function recordChoice(el) {
    var txt = norm(el.textContent);
    if (!txt || txt.length > 320) return;
    if (isNav(txt)) return;

    var stage = stageOf();
    if (!stage || stage === "REPORT") return;

    var hit = optionIndex[squash(txt)];
    var row;
    if (hit) {
      var it = hit.item;
      var cTxt = correctTextOf(it);
      var verdict = "";
      if (typeof it.correct === "number") verdict = (hit.optIdx === it.correct) ? "ถูก" : "ผิด";
      row = {
        key: "bank:" + it.bank + ":" + it.idx,
        bankKey: it.bank + ":" + it.idx,
        stage: it.stage || stage, kind: "choice",
        q: it.q || nearestQuestionText(el) || "(ไม่ระบุโจทย์)",
        answer: txt, correctText: cTxt, verdict: verdict,
        explain: it.explain || "", ts: Date.now()
      };
    } else {
      /* ไม่ตรงกับคลังข้อสอบ: รับเฉพาะการคลิกที่เป็น "ตัวเลือกคำตอบ" จริง ๆ
         เพื่อไม่ให้แถบความคืบหน้า/ชิป/ป้ายกำกับ กลายเป็นแถวขยะในตาราง */
      var tag = (el.tagName || "").toLowerCase();
      var cls = (typeof el.className === "string") ? el.className : "";
      var interactive = /^(button|label|li|a|option)$/.test(tag) ||
                        el.getAttribute("role") === "button" ||
                        /(opt|choice|ans|btn)/i.test(cls);
      if (!interactive) return;
      /* ตัวเลขโดด ๆ มักเป็นหมายเลขขั้นตอน/ชิปความคืบหน้า ยกเว้นมาตรวัด REFLECT */
      if (txt.length < 2 && stage !== "REFLECT") return;
      var q = nearestQuestionText(el);
      if (!q || q.length < 20) return;    /* ไม่ใช่ตัวเลือกคำตอบ - ข้าม */
      row = {
        key: "dom:" + stage + ":" + squash(q).slice(0, 60),
        stage: stage, kind: "choice", q: q,
        answer: txt, correctText: "", verdict: "", explain: "", ts: Date.now()
      };
    }
    upsert(row);
    captureFeedback(el, row);
  }

  /* เก็บข้อความเฉลย/ผลตรวจที่ตัวแบบทดสอบแสดงเองหลังเลือกคำตอบ */
  /* อ่านเฉพาะข้อความที่ผู้ใช้เห็นจริง ตัด <script>/<style> ออก */
  function textOf(node) {
    try {
      var c = node.cloneNode(true);
      var junk = c.querySelectorAll("script,style,noscript,canvas,svg");
      for (var i = 0; i < junk.length; i++) junk[i].remove();
      return c.textContent || "";
    } catch (e) { return ""; }
  }
  /* ข้อความที่หน้าตาเป็นซอร์สโค้ด ไม่ใช่คำอธิบายเชิงวิชาการ */
  function looksLikeCode(t) {
    if (!t) return false;
    return /(function\s*\(|=>|document\.|querySelector|getElementById|await |const |let |var |JSON\.|addEventListener|\{\s*\}|;\s*\})/.test(t);
  }
  function captureFeedback(el, row) {
    setTimeout(function () {
      try {
        var box = el.closest ? el.closest("div,li,section,form") : null;
        for (var hop = 0; box && hop < 4; hop++) {
          var t = norm(textOf(box));
          var m = t.match(/(ถูกต้อง|ไม่ถูกต้อง|ยังไม่ถูก|คำอธิบาย|เฉลย|แนวคำตอบ)[\s:：]*([^]{0,300})/);
          if (m) {
            if (!row.verdict && /^(ถูกต้อง)/.test(m[1])) row.verdict = "ถูก";
            if (!row.verdict && /^(ไม่ถูกต้อง|ยังไม่ถูก)/.test(m[1])) row.verdict = "ผิด";

            return;
          }
          box = box.parentElement;
        }
      } catch (e) {}
    }, 260);
  }

  function labelForField(el) {
    /* หาคำถามที่ใกล้ช่องกรอกที่สุดก่อน แล้วค่อยไล่ออกไปกว้างขึ้น */
    if (el.id) {
      var lab = document.querySelector('label[for="' + el.id + '"]');
      if (lab) { var t = norm(lab.textContent); if (t) return t; }
    }
    var aria = el.getAttribute && (el.getAttribute("aria-label") || el.getAttribute("title"));
    if (aria && norm(aria)) return norm(aria);
    var wrapLab = el.closest && el.closest("label");
    if (wrapLab) {
      var wt = norm(wrapLab.textContent);
      if (wt.length > 3) return clip(wt, 220);
    }
    var prev = el.previousElementSibling;
    for (var i = 0; prev && i < 3; i++) {
      var pt = norm(prev.textContent);
      if (pt.length > 6) return clip(pt, 220);
      prev = prev.previousElementSibling;
    }
    var par = el.parentElement;
    if (par) {
      var clone = par.cloneNode(true);
      var kill = clone.querySelectorAll("input,textarea,select,button");
      for (var k = 0; k < kill.length; k++) kill[k].remove();
      var ptxt = norm(clone.textContent);
      if (ptxt.length > 6) return clip(ptxt, 220);
    }
    var ph = el.getAttribute && el.getAttribute("placeholder");
    var near = nearestQuestionText(el);
    return near || (ph ? norm(ph) : "") || "คำตอบเขียนบรรยาย";
  }

  var GATE_IDS = { inName: 1, inputName: 1, nameInput: 1, gateName: 1, "inp-name": 1, inpName: 1 };
  function recordText(el) {
    if (!el || GATE_IDS[el.id]) return;
    var val = norm(el.value);
    if (!val) return;
    var stage = stageOf();
    if (!stage || stage === "REPORT") return;
    var key = "txt:" + (el.id || el.name || labelForField(el)).slice(0, 60);
    upsert({
      key: key, stage: stage, kind: "text",
      q: labelForField(el), answer: el.value, correctText: "",
      verdict: "", explain: "", ts: Date.now()
    });
  }

  document.addEventListener("click", function (ev) {
    try {
      var el = ev.target;
      if (!el || !el.closest) return;
      if (el.closest("#pisaReviewPanel,#pisaHistoryOverlay")) return;
      var clickable = el.closest("button,label,li,a,[role='button'],[class*='opt'],[class*='choice'],[class*='ans'],[class*='card']") || el;
      recordChoice(clickable);
    } catch (e) {}
  }, true);

  document.addEventListener("change", function (ev) {
    try {
      var el = ev.target;
      if (!el) return;
      if (el.closest && el.closest("#pisaReviewPanel,#pisaHistoryOverlay")) return;
      var tag = (el.tagName || "").toLowerCase();
      if (tag === "textarea" || (tag === "input" && /^(text|number|range)$/.test(el.type || "text"))) recordText(el);
      if (tag === "select" && el.id !== "inGrade" && el.getAttribute("data-pisa-grade") !== "1") {
        var opt = el.options[el.selectedIndex];
        if (opt) recordChoice(opt);
      }
    } catch (e) {}
  }, true);
  document.addEventListener("blur", function (ev) {
    try {
      var el = ev.target, tag = (el && el.tagName || "").toLowerCase();
      /* เฉพาะช่องพิมพ์ข้อความเท่านั้น - ปุ่มตัวเลือก radio/checkbox ถูกเก็บจากการคลิกอยู่แล้ว */
      if (tag === "textarea" || (tag === "input" && /^(text|search|email)$/.test(el.type || "text"))) recordText(el);
    } catch (e) {}
  }, true);

  /* ---------- attempts storage ---------- */
  function readAttempts() {
    try { return JSON.parse(localStorage.getItem(ATTEMPTS_KEY) || "{}"); } catch (e) { return {}; }
  }
  function saveAttempt(payload, scores) {
    try {
      var all = readAttempts();
      var lk = learnerKey();
      if (!all[lk]) all[lk] = {};
      if (!all[lk][SCENARIO_ID]) all[lk][SCENARIO_ID] = [];
      all[lk][SCENARIO_ID].push({
        title: SCENARIO_TITLE, name: LNAME, grade: LGRADE,
        finishedAt: new Date().toISOString(),
        scores: scores || {},
        rows: allRows().map(function (r) {
          return { stage: r.stage, kind: r.kind, bankKey: r.bankKey || "", docNum: r.docNum || null, slotted: !!r.slotted, score: (r.score == null ? null : r.score), q: clip(r.q, 300),
                   answer: clipML(r.answer, 1600), correctText: clipML(r.correctText, 600),
                   verdict: r.verdict, explain: clip(r.explain, 600) };
        })
      });
      while (all[lk][SCENARIO_ID].length > MAX_ATTEMPTS_PER_SCENARIO) all[lk][SCENARIO_ID].shift();
      localStorage.setItem(ATTEMPTS_KEY, JSON.stringify(all));
    } catch (e) {}
  }
  function attemptsForLearner() {
    var all = readAttempts();
    return (all[learnerKey()] && all[learnerKey()][SCENARIO_ID]) || [];
  }

  /* ---------- scores out of the payload the app posts ---------- */
  function num(v) { return (typeof v === "number" && isFinite(v)) ? Math.round(v) : null; }
  function pctFromText(t) {
    if (typeof t !== "string") return null;
    var m = t.match(/(?:รวม|เฉลี่ย)\s*([\d.]+)\s*%/) || t.match(/([\d.]+)\s*%/);
    return m ? Math.round(parseFloat(m[1])) : null;
  }
  function fromTotal(p, label) {
    if (typeof p.totalReport !== "string") return null;
    var m = p.totalReport.match(new RegExp(label + "\\s*([\\d.]+)"));
    return m ? Math.round(parseFloat(m[1])) : null;
  }
  function sect(p, keys, textKey, label) {
    for (var i = 0; i < keys.length; i++) { var v = num(p[keys[i]]); if (v !== null) return v; }
    var ft = fromTotal(p, label); if (ft !== null) return ft;
    return pctFromText(p[textKey]);
  }
  function scoresOf(p) {
    return {
      show: sect(p, ["show", "show_score"], "showReport", "SHOW"),
      learn: sect(p, ["learn", "learn_score"], "learnReport", "LEARN"),
      apply: sect(p, ["apply", "apply_score"], "applyReport", "APPLY"),
      reflect: sect(p, ["reflect", "reflect_score"], "reflectReport", "REFLECT"),
      overall: (function () {
        var v = num(p.overall); if (v !== null) return v;
        v = num(p.overall_score); if (v !== null) return v;
        var t = [p.overallReport, p.totalReport, p.qualityReport].filter(Boolean).join(" ");
        var m = t.match(/([\d.]+)\s*%/) || t.match(/([\d.]+)\s*\/\s*100/);
        return m ? Math.round(parseFloat(m[1])) : null;
      })(),
      levelName: p.levelName || p.levelLabel || p.quality_label || p.qualityLevel || p.qualityReport || ""
    };
  }

  function verdictHTML(r) {
    var v = r.verdict;
    if (/^\((ยังไม่ได้ตอบ|ยังไม่ได้ทำ)\)$/.test(String(r.answer || "").trim())) return '<span class="pr-v no">ไม่ได้ตอบ</span>';
    if (r.kind === "likert" || (r.stage === "REFLECT" && r.kind === "text")) return '<span class="pr-v na">ตอบแล้ว</span>';
    if (v === "ถูก") return '<span class="pr-v ok">✓ ถูก</span>';
    if (v === "ผิด") return '<span class="pr-v no">✗ ผิด</span>';
    if (r.score != null) {
      var w = Math.max(0, Math.min(100, r.score));
      return '<div><span class="pr-v ' + (w >= 80 ? "ok" : (w >= 50 ? "na" : "no")) + '">ได้ ' + w + '%</span>' +
             '<div class="pr-bar"><i style="width:' + w + '%"></i></div></div>';
    }
    return '<span class="pr-v na">บันทึกแล้ว</span>';
  }

  function labelFor(r) {
    /* ถ้าข้อความโจทย์ที่จับได้เป็นเพียงหัวข้อสั้น ๆ ให้เติมเลขข้อจากคู่มือเฉลยกำกับไว้ */
    var q = r.q || "";
    if (/^(ข้อ|กิจกรรม|ภาระงาน|ภารกิจ|คำถาม)/.test(q)) return q;   /* มีเลขข้อ/ชื่อภาระงานอยู่แล้ว */
    if (q.length < 46 && !/[?？]$/.test(q)) {
      var d = docItemFor(r);
      if (d && d.n) return "ข้อ " + d.n + " · " + q;
    }
    return q;
  }
  function tableFor(stage, list, scores, idPrefix) {
    var sc = scores && scores[stage.toLowerCase()];
    var head = '<h4>' + esc(STAGE_TH[stage] || stage) +
      (sc != null ? ' <span class="pr-chip">คะแนนขั้นตอนนี้ ' + sc + '%</span>' : '') +
      ' <span class="pr-chip">' + list.length + ' รายการ</span></h4>';
    if (!list.length) {
      if (sc != null) {
        var noKey0 = (stage === "REFLECT");
        return head +
          '<table><thead><tr><th class="pr-no">ข้อ</th><th>โจทย์ / ภาระงาน</th>' +
          '<th>คำตอบของผู้เข้าสอบ</th><th>ผลการตรวจ</th>' +
          (noKey0 ? '' : '<th>แนวคำตอบ / เฉลย</th>') + '</tr></thead><tbody>' +
          '<tr><td class="pr-no">1</td>' +
          '<td>' + (noKey0 ? 'แบบประเมินตนเองของขั้นตอนนี้' :
                   'ภาระงานเชิงปฏิบัติของขั้นตอนนี้ (ต่อวงจร / เขียนบล็อกคำสั่ง / ปรับพารามิเตอร์ / ผังงาน)') + '</td>' +
          '<td class="pr-ans">' + (noKey0 ? 'ตอบแบบประเมินตนเองแล้ว' : 'ทำภาระงานในระบบจำลอง') + '</td>' +
          '<td><span class="pr-v na">ได้ ' + sc + '%</span></td>' +
          (noKey0 ? '' : '<td>' + (function () {
            var dt = stageDocText(stage);
            if (!dt) return '<span style="color:#9aa3b5;">ระบบให้คะแนนจากผลการปฏิบัติในระบบจำลอง</span>';
            var kid = idPrefix + "-stage-" + stage;
            return '<button type="button" class="pr-toggle" data-key="' + kid + '">ดูเกณฑ์การให้คะแนน</button>' +
                   '<div class="pr-key" id="' + kid + '">' + esc(dt) + '</div>';
          })() + '</td>') + '</tr>' +
          '</tbody></table>';
      }
      return head + '<div class="pr-empty">ไม่มีข้อมูลการตอบที่บันทึกไว้ในขั้นตอนนี้</div>';
    }
    /* REFLECT คือการประเมินตนเอง ไม่มีเฉลย จึงไม่ต้องมีคอลัมน์แนวคำตอบ */
    var noKey = (stage === "REFLECT");
    var html = head + '<table><thead><tr>' +
      '<th class="pr-no">ข้อ</th><th>โจทย์ / ภาระงาน</th><th>คำตอบของผู้เข้าสอบ</th>' +
      '<th>ผลการตรวจ</th>' + (noKey ? '' : '<th>แนวคำตอบ / เฉลย</th>') + '</tr></thead><tbody>';
    for (var i = 0; i < list.length; i++) {
      var r = list[i];
      var keyId = idPrefix + "-" + stage + "-" + i;
      /* ขั้น REFLECT เป็นการประเมินตนเอง ไม่มีคำตอบถูก-ผิด จึงแสดงเฉพาะคำตอบของผู้เข้าสอบ */
      var keyText = (stage === "REFLECT") ? "" : keyTextFor(r);
      var keyCell = keyText
        ? '<button type="button" class="pr-toggle" data-key="' + keyId + '">ดูแนวคำตอบ</button>' +
          '<div class="pr-key" id="' + keyId + '">' + esc(keyText) + '</div>'
        : '<span style="color:#9aa3b5;">—</span>';
      html += '<tr>' +
        '<td class="pr-no">' + (i + 1) + '</td>' +
        '<td>' + esc(clip(labelFor(r), 260)) + '</td>' +
        '<td class="pr-ans ' + (/\n/.test(r.answer || "") || r.kind === "text" ? "pr-txt" : "") + '">' +
          esc(clipML(r.answer, 1600)) + '</td>' +
        '<td>' + verdictHTML(r) + '</td>' +
        (noKey ? '' : '<td>' + keyCell + '</td>') +
        '</tr>';
    }
    return html + '</tbody></table>';
  }

  function groupRows(list) {
    var g = { SHOW: [], LEARN: [], APPLY: [], REFLECT: [] };
    for (var i = 0; i < list.length; i++) {
      var s = list[i].stage;
      if (!g[s]) g[s] = [];
      g[s].push(list[i]);
    }
    return g;
  }

  /* ประวัติที่บันทึกไว้ก่อนปรับปรุง อาจมีข้อความปุ่มนำทางปนเป็นคำตอบ — กรองออกก่อนแสดง */
  function cleanSaved(list) {
    return list.filter(function (r) {
      var a = norm(String(r.answer || ""));
      if (!a) return false;
      if (r.kind === "choice" && !r.bankKey && !r.docNum && isNav(a)) return false;
      if (looksLikeCode(a) && !r.docNum) return false;
      return true;
    }).map(function (r) {
      if (r.explain && looksLikeCode(r.explain)) r.explain = "";
      return r;
    });
  }
  function detailHTML(list, scores, idPrefix) {
    var g = groupRows(list), out = "";
    for (var i = 0; i < STAGE_ORDER.length; i++) {
      var st = STAGE_ORDER[i];
      out += '<div class="pr-stage">' + tableFor(st, g[st] || [], scores, idPrefix) + '</div>';
    }
    var extra = Object.keys(g).filter(function (k) { return STAGE_ORDER.indexOf(k) === -1; });
    for (var j = 0; j < extra.length; j++) {
      out += '<div class="pr-stage">' + tableFor(extra[j], g[extra[j]], scores, idPrefix) + '</div>';
    }
    return out;
  }

  function wireToggles(root) {
    var btns = root.querySelectorAll(".pr-toggle");
    for (var i = 0; i < btns.length; i++) {
      btns[i].addEventListener("click", function (ev) {
        var box = document.getElementById(ev.currentTarget.getAttribute("data-key"));
        if (!box) return;
        var open = box.classList.contains("pr-open");
        box.classList.toggle("pr-open", !open);
        ev.currentTarget.textContent = open ? "ดูแนวคำตอบ" : "ซ่อนแนวคำตอบ";
      });
    }
  }

  /* ---------- history mode (read-only + watermark) ---------- */
  function watermark(text) {
    var wm = document.createElement("div");
    wm.id = "pisaWatermark";
    var html = "";
    for (var y = -1; y < 14; y++) {
      for (var x = -1; x < 4; x++) {
        html += '<div style="top:' + (y * 120 + 30) + 'px;left:' + (x * 420 - 60) + 'px;">' + esc(text) + '</div>';
      }
    }
    wm.innerHTML = html;
    return wm;
  }

  function closeHistory() {
    var o = document.getElementById("pisaHistoryOverlay");
    var w = document.getElementById("pisaWatermark");
    if (o) o.remove();
    if (w) w.remove();
    document.body.style.overflow = "";
  }

  function openHistory() {
    closeHistory();
    injectCSS();
    var attempts = attemptsForLearner().slice().reverse();
    var ov = document.createElement("div");
    ov.id = "pisaHistoryOverlay";

    var listHTML = "";
    if (!attempts.length) {
      listHTML = '<div class="ph-item"><div><b>ยังไม่มีประวัติการทำแบบทดสอบของสถานการณ์นี้</b>' +
        '<div class="ph-meta">ประวัติจะถูกบันทึกอัตโนมัติทุกครั้งที่ทำแบบทดสอบจนจบและส่งผลสำเร็จ</div></div></div>';
    } else {
      for (var i = 0; i < attempts.length; i++) {
        var a = attempts[i];
        var when = "";
        try { when = new Date(a.finishedAt).toLocaleString("th-TH"); } catch (e) { when = a.finishedAt; }
        var ov2 = (a.scores && a.scores.overall != null) ? a.scores.overall + "%" : "—";
        listHTML += '<div class="ph-item"><div><b>ครั้งที่ ' + (attempts.length - i) + ' · ' + esc(when) + '</b>' +
          '<div class="ph-meta">คะแนนรวม ' + esc(ov2) + (a.scores && a.scores.levelName ? ' · ' + esc(a.scores.levelName) : '') +
          ' · บันทึกคำตอบ ' + cleanSaved(a.rows || []).length + ' รายการ</div></div>' +
          '<button type="button" class="ph-open" data-idx="' + i + '">เปิดดูคำตอบ</button></div>';
      }
    }

    ov.innerHTML =
      '<div class="ph-inner">' +
        '<div class="ph-bar">' +
          '<div><h3>📜 โหมดย้อนดูประวัติการทำแบบทดสอบ</h3>' +
          '<div class="ph-note">ดูได้อย่างเดียว — แก้ไขหรือเปลี่ยนคำตอบไม่ได้ · ' + esc(SCENARIO_TITLE) + ' · ' + esc(LNAME || "ผู้เข้าสอบ") + '</div></div>' +
          '<button type="button" class="ph-exit" id="pisaHistExit">ออกจากโหมดย้อนดู ✕</button>' +
        '</div>' +
        '<div class="ph-list" id="pisaHistList">' + listHTML + '</div>' +
        '<div id="pisaHistDetail"></div>' +
      '</div>';

    document.body.appendChild(ov);
    document.body.appendChild(watermark("ย้อนดูประวัติการทำแบบทดสอบ · อ่านอย่างเดียว"));
    document.body.style.overflow = "hidden";

    document.getElementById("pisaHistExit").addEventListener("click", closeHistory);

    var openers = ov.querySelectorAll(".ph-open");
    for (var k = 0; k < openers.length; k++) {
      openers[k].addEventListener("click", function (ev) {
        var idx = parseInt(ev.currentTarget.getAttribute("data-idx"), 10);
        var a = attempts[idx];
        var det = document.getElementById("pisaHistDetail");
        var when = "";
        try { when = new Date(a.finishedAt).toLocaleString("th-TH"); } catch (e) {}
        det.innerHTML = '<div class="ph-body ph-readonly" id="pisaHistBody">' +
          '<div id="pisaReviewPanel" style="margin:0;max-width:none;"><div class="pr-card" style="border:none;box-shadow:none;">' +
          '<div class="pr-head"><div><h3>คำตอบของครั้งที่ ' + (attempts.length - idx) + '</h3>' +
          '<div class="pr-sub">' + esc(when) + ' · คะแนนรวม ' +
          esc(a.scores && a.scores.overall != null ? a.scores.overall + "%" : "—") + '</div></div></div>' +
          detailHTML(cleanSaved(a.rows || []), a.scores || {}, "hist" + idx) +
          '</div></div></div>';
        /* ปุ่มดูแนวคำตอบต้องกดได้ แม้เนื้อหาอื่นจะอ่านอย่างเดียว */
        var body = document.getElementById("pisaHistBody");
        var tgs = body.querySelectorAll(".pr-toggle");
        for (var t = 0; t < tgs.length; t++) tgs[t].style.pointerEvents = "auto";
        wireToggles(body);
        det.scrollIntoView({ behavior: "smooth", block: "start" });
      });
    }
  }

  /* ---------- หน้าที่ 1: แถบบนหน้าแดชบอร์ดสรุปผล (คงหน้าเดิมไว้ทุกอย่าง) ---------- */
  function isVisible(el) {
    return !!(el && (el.offsetWidth || el.offsetHeight || el.getClientRects().length));
  }
  function anchorEl() {
    /* ต้องเลือกกล่องที่ "มองเห็นอยู่จริง" เพราะบางไฟล์ซ่อนกล่องของหน้าแรก
       ไว้ตอนเข้าสู่หน้าทำข้อสอบ/หน้ารายงานผล */
    var sel = ["#app-main", "#app", "#screen", "main", ".wrap", ".container"];
    for (var i = 0; i < sel.length; i++) {
      var list = document.querySelectorAll(sel[i]);
      for (var j = 0; j < list.length; j++) {
        if (isVisible(list[j])) return list[j];
      }
    }
    return document.body;
  }

  var lastScores = {};

  function renderBar(scores) {
    injectCSS();
    lastScores = scores || lastScores || {};
    var old = document.getElementById("pisaReportBar");
    if (old) old.remove();

    var n = attemptsForLearner().length;
    var bar = document.createElement("div");
    bar.id = "pisaReportBar";
    bar.innerHTML =
      '<div class="rb-card">' +
        '<div><h3>📋 รายละเอียดการทำแบบทดสอบรายข้อ</h3>' +
        '<div class="rb-sub">ดูว่าทำข้อใดบ้าง ตอบอะไรไว้ ได้ผลอย่างไร พร้อมแนวคำตอบและเกณฑ์การให้คะแนนตามคู่มือเฉลย</div></div>' +
        '<div class="rb-actions">' +
          '<button type="button" class="rb-btn" id="pisaGoDetail">เปิดตารางรายละเอียดรายข้อ →</button>' +
          '<button type="button" class="rb-btn ghost" id="pisaOpenHist">📜 ย้อนดูประวัติ (' + n + ')</button>' +
        '</div>' +
      '</div>';
    anchorEl().appendChild(bar);
    document.getElementById("pisaGoDetail").addEventListener("click", function () { openDetail(); });
    document.getElementById("pisaOpenHist").addEventListener("click", openHistory);
  }

  /* ---------- หน้าที่ 2: ตารางรายละเอียดการทำแบบทดสอบรายข้อ ---------- */
  function closeDetail() {
    var o = document.getElementById("pisaDetailOverlay");
    if (o) o.remove();
    document.body.style.overflow = "";
  }

  function openDetail() {
    injectCSS();
    closeDetail();
    var ov = document.createElement("div");
    ov.id = "pisaDetailOverlay";
    ov.innerHTML =
      '<div class="pd-inner">' +
        '<div class="pd-bar">' +
          '<div><h3>📋 ตารางรายละเอียดการทำแบบทดสอบรายข้อ</h3>' +
          '<div class="pd-sub">' + esc(SCENARIO_TITLE) + ' · ' + esc(LNAME || "ผู้เข้าสอบ") +
          (LGRADE ? " · " + esc(LGRADE) : "") +
          ' · คะแนนรวม ' + esc(lastScores.overall != null ? lastScores.overall + "%" : "—") + '</div></div>' +
          '<div style="display:flex;gap:8px;flex-wrap:wrap;">' +
            '<button type="button" class="pd-btn ghost" id="pisaDetailHist">📜 ย้อนดูประวัติ</button>' +
            '<button type="button" class="pd-btn" id="pisaBackDash">← กลับไปหน้าสรุปผล (แดชบอร์ด)</button>' +
          '</div>' +
        '</div>' +
        '<div class="pr-card" id="pisaReviewPanel" style="max-width:none;margin:0;padding:0;">' +
          detailHTML(allRows(), lastScores, "cur") +
          '<div class="pr-foot">บันทึกจากการทำจริงของผู้เข้าสอบในครั้งนี้ · ช่อง “แนวคำตอบ / เฉลย” ใช้ข้อความจาก “คู่มือเฉลยและเกณฑ์การให้คะแนน” ของหน่วยข้อสอบนี้</div>' +
        '</div>' +
      '</div>';
    document.body.appendChild(ov);
    document.body.style.overflow = "hidden";
    wireToggles(ov);
    document.getElementById("pisaBackDash").addEventListener("click", closeDetail);
    document.getElementById("pisaDetailHist").addEventListener("click", openHistory);
  }

  /* ---------- hook the app's result POST = the report moment ---------- */
  var origFetch = window.fetch;
  window.fetch = function (url, opts) {
    try {
      if (opts && opts.body && typeof opts.body === "string") {
        var p = JSON.parse(opts.body);
        if (p && (p.name || p.user) && p.grade) {
          buildBanks();
          var sc = scoresOf(p);
          saveAttempt(p, sc);
          setTimeout(function () { try { renderBar(sc); } catch (e) {} }, 900);
          /* แบบทดสอบบางไฟล์วาดหน้ารายงานผลใหม่อีกครั้ง (เช่น หลังอัปเดตสถานะการบันทึก)
             ซึ่งจะลบตารางของเราไปด้วย - คอยตรวจและเติมกลับให้อัตโนมัติ */
          var guard = 0;
          var watchdog = setInterval(function () {
            guard++;
            try {
              var bar = document.getElementById("pisaReportBar");
              if (!document.getElementById("pisaHistoryOverlay") &&
                  !document.getElementById("pisaDetailOverlay") &&
                  (!bar || !isVisible(bar))) {
                renderBar(sc);
              }
            } catch (e) {}
            if (guard > 120) clearInterval(watchdog);   /* ~3 นาที */
          }, 1500);
        }
      }
    } catch (e) {}
    return origFetch.apply(this, arguments);
  };

  /* banks can only be read once the app's own scripts have run */
  try { buildBanks(); } catch (e) {}
  setTimeout(function () { try { buildBanks(); } catch (e) {} }, 1200);

  /* expose for manual use/debugging */
  window.pisaReview = {
    openHistory: openHistory, closeHistory: closeHistory,
    openDetail: openDetail, closeDetail: closeDetail,
    rows: function () { return rows; }, banks: function () { return bankItems; },
    audit: function () {
      return allRows().map(function (r) {
        return { stage: r.stage, kind: r.kind, q: labelFor(r), answer: r.answer, verdict: r.verdict, correct: r.correctText,
                 score: r.score, key: r.stage === "REFLECT" ? "" : keyTextFor(r) };
      });
    },
    docKeys: function () { return DOCKEY; },
    render: function (sc) { renderBar(sc || {}); }
  };
})();

</script>
</body>
</html>
