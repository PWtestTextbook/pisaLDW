<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ระบบเตือนเมื่อรถออกนอกเลน — แบบฝึกเทียบเคียง PISA 2025 (LDW)</title>
<style>
  :root{
    --bg:#0E1620;
    --surface:#16202B;
    --surface2:#1E2A38;
    --surface3:#243343;
    --line:#2A3A4A;
    --amber:#FFB020;
    --amber-dim:#8A6420;
    --amber-soft:#3A2E14;
    --green:#35C285;
    --green-soft:#12301F;
    --red:#E5573F;
    --red-soft:#3A1B15;
    --text:#EAF0F5;
    --muted:#93A5B7;
    --muted-dim:#5E7185;
    --radius:14px;
    --radius-sm:8px;
    font-size:21px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 15% -10%, #1c2b3c 0%, transparent 45%),
      radial-gradient(circle at 100% 0%, #182432 0%, transparent 40%),
      var(--bg);
    color:var(--text);
    font-family:'Segoe UI','Sarabun','Noto Sans Thai','TH Sarabun New',Tahoma,sans-serif;
    min-height:100vh;
    line-height:1.55;
  }
  #app{max-width:920px;margin:0 auto;padding:0 18px 60px;}
  a{color:var(--amber);}

  /* ---------- top status bar ---------- */
  .statusbar{
    position:sticky;top:0;z-index:50;
    background:rgba(14,22,32,0.94);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);
    padding:10px 0 14px;
    margin-bottom:26px;
  }
  .statusbar-row{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding-top:10px;}
  .identity{display:flex;align-items:center;gap:10px;}
  .identity-badge{
    width:38px;height:38px;border-radius:50%;
    background:var(--surface3);border:1px solid var(--amber-dim);
    display:flex;align-items:center;justify-content:center;
    font-weight:700;color:var(--amber);flex-shrink:0;
  }
  .identity-name{font-weight:600;font-size:0.95rem;}
  .identity-grade{font-size:0.78rem;color:var(--muted);}
  .timerbox{display:flex;align-items:center;gap:8px;background:var(--surface2);border:1px solid var(--line);padding:7px 14px;border-radius:999px;}
  .timerbox .dot{width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulse 1.6s infinite;}
  .timerbox.warn .dot{background:var(--red);}
  .timerbox .t{font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:0.5px;}
  .timerbox.warn .t{color:var(--red);}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.25;}}

  /* ---------- lane stepper ---------- */
  .lanewrap{margin-top:14px;position:relative;height:34px;}
  .laneline{
    position:absolute;top:16px;left:0;right:0;height:2px;
    background-image:repeating-linear-gradient(to right, var(--muted-dim) 0 14px, transparent 14px 26px);
  }
  .lanesteps{position:relative;display:flex;justify-content:space-between;}
  .lanestep{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--bg);padding:0 6px;position:relative;z-index:2;}
  .lanestep .pip{width:14px;height:14px;border-radius:50%;background:var(--surface2);border:2px solid var(--muted-dim);}
  .lanestep.done .pip{background:var(--green);border-color:var(--green);}
  .lanestep.active .pip{background:var(--amber);border-color:var(--amber);box-shadow:0 0 0 5px var(--amber-soft);}
  .lanestep .lbl{font-size:0.72rem;color:var(--muted);letter-spacing:0.3px;}
  .lanestep.active .lbl{color:var(--amber);font-weight:700;}
  .lanestep.done .lbl{color:var(--green);}

  /* ---------- layout blocks ---------- */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:26px 26px 24px;margin-bottom:20px;}
  .eyebrow{color:var(--amber);font-size:0.8rem;font-weight:700;margin:0 0 6px;}
  h1{font-size:1.7rem;margin:0 0 10px;font-weight:700;}
  h2{font-size:1.28rem;margin:0 0 12px;font-weight:700;}
  h3{font-size:1.05rem;margin:0 0 8px;font-weight:700;color:var(--text);}
  p{color:#CBD8E4;margin:0 0 12px;}
  .muted{color:var(--muted);}
  .hero{
    background:radial-gradient(1100px 400px at 15% -10%, rgba(255,176,32,0.14), transparent),
               linear-gradient(160deg, #182636 0%, #0D141C 100%);
    color:#EAF0F5; border-radius:16px; padding:34px 30px; position:relative; overflow:hidden;
    margin-bottom:22px; border:1px solid var(--line);
    display:grid; grid-template-columns:1.15fr 0.85fr; gap:26px; align-items:center;
  }
  @media (max-width:820px){ .hero{grid-template-columns:1fr;} .hero-art{order:-1; max-width:260px; margin:0 auto;} }
  .hero h1{max-width:20ch;}
  .hero p{color:#C7D3DF;}
  .intro-badges{display:flex; gap:9px; flex-wrap:wrap; margin:16px 0 4px;}
  .badge{background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.14);
    padding:7px 12px; border-radius:10px; font-size:0.72rem; color:#DCE4EC;}
  .hero-art{position:relative;}
  .hero-art svg{width:100%; height:auto; display:block;}
  .spark{position:absolute; border-radius:50%;
    background:radial-gradient(circle at 32% 28%, rgba(255,214,140,0.9), rgba(255,176,32,0.04) 70%);
    opacity:0.55; animation:rise 7s ease-in-out infinite;}
  @keyframes rise{0%{transform:translateY(0) scale(1);opacity:0.15;}50%{opacity:0.6;}100%{transform:translateY(-26px) scale(1.08);opacity:0.1;}}
  @media (prefers-reduced-motion:reduce){ .spark{animation:none;} }
  @keyframes warnPulse{0%,100%{opacity:1;}50%{opacity:0.45;}}
  .warn-pulse{animation:warnPulse 1.8s ease-in-out infinite;}

  label{display:block;font-size:0.85rem;color:var(--muted);margin-bottom:6px;font-weight:600;}
  input[type=text], select, input[type=number], textarea{
    width:100%;background:var(--surface2);border:1px solid var(--line);color:var(--text);
    padding:11px 13px;border-radius:var(--radius-sm);font-size:0.95rem;font-family:inherit;
  }
  textarea{resize:vertical;min-height:70px;}
  input[type=range]{width:100%;accent-color:var(--amber);cursor:pointer;touch-action:none;height:28px;}
  .field{margin-bottom:16px;}
  .btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;}
  button{
    font-family:inherit;font-size:0.92rem;font-weight:700;cursor:pointer;
    border-radius:999px;padding:11px 22px;border:1px solid transparent;
    transition:transform .12s ease, filter .12s ease;
  }
  button:active{transform:scale(0.97);}
  .btn-primary{background:var(--amber);color:#1a1200;}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-primary:disabled{background:var(--surface3);color:var(--muted-dim);cursor:not-allowed;}
  .btn-ghost{background:transparent;color:var(--text);border-color:var(--line);}
  .btn-ghost:hover{border-color:var(--muted);}
  .btn-sm{padding:7px 14px;font-size:0.8rem;}

  .choice{
    display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border:1px solid var(--line);
    border-radius:var(--radius-sm);margin-bottom:9px;cursor:pointer;background:var(--surface2);
  }
  .choice:hover{border-color:var(--muted-dim);}
  .choice.selected{border-color:var(--amber);background:var(--amber-soft);}
  .choice input{margin-top:3px;accent-color:var(--amber);}
  .qnum{display:inline-block;background:var(--surface3);color:var(--amber);font-weight:700;font-size:0.75rem;padding:3px 9px;border-radius:6px;margin-bottom:10px;}

  .tag{display:inline-block;font-size:0.72rem;font-weight:700;padding:3px 10px;border-radius:999px;margin-right:6px;}
  .tag-sun{background:#3a3312;color:#F4D35E;}
  .tag-rain{background:#122a3a;color:#6EC3F4;}
  .tag-faded{background:#302030;color:#D9A0E0;}

  .condrow{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface2);margin-bottom:10px;}
  .condrow .roadmini{width:120px;height:34px;border-radius:6px;position:relative;background:#1b1f24;overflow:hidden;flex-shrink:0;}
  .roadmini .lm{position:absolute;top:50%;left:0;right:0;height:3px;transform:translateY(-50%);background-image:repeating-linear-gradient(to right, #ffffff 0 10px, transparent 10px 20px);}
  .roadmini.sun .lm{opacity:1;}
  .roadmini.rain .lm{opacity:0.55;filter:blur(0.6px);}
  .roadmini.rain::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(115deg, rgba(110,195,244,0.12) 0 2px, transparent 2px 9px);}
  .roadmini.faded .lm{opacity:0.22;}
  .result-pill{font-size:0.75rem;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap;}
  .pill-pass{background:var(--green-soft);color:var(--green);}
  .pill-fail{background:var(--red-soft);color:var(--red);}
  .pill-idle{background:var(--surface3);color:var(--muted);}

  table{width:100%;border-collapse:collapse;font-size:0.88rem;margin:14px 0;}
  th,td{text-align:center;padding:9px 6px;border-bottom:1px solid var(--line);}
  th{color:var(--muted);font-weight:700;font-size:0.76rem;text-transform:none;}
  tr:hover td{background:rgba(255,255,255,0.02);}
  .ok{color:var(--green);font-weight:700;}
  .bad{color:var(--red);font-weight:700;}

  .paramgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media(max-width:640px){.paramgrid{grid-template-columns:1fr;}}
  .metric{background:var(--surface2);border:1px solid var(--line);border-radius:var(--radius-sm);padding:14px;text-align:center;}
  .metric .num{font-size:1.6rem;font-weight:800;color:var(--amber);}
  .metric .lbl{font-size:0.76rem;color:var(--muted);margin-top:3px;}

  .barrow{margin-bottom:16px;}
  .barrow .toprow{display:flex;justify-content:space-between;font-size:0.85rem;margin-bottom:6px;}
  .bartrack{height:12px;background:var(--surface2);border-radius:999px;overflow:hidden;}
  .barfill{height:100%;border-radius:999px;background:linear-gradient(90deg,#FFB020,#FF8A3D);}

  .levelbadge{
    display:inline-flex;align-items:center;gap:10px;padding:16px 22px;border-radius:var(--radius);
    border:1px solid var(--amber-dim);background:var(--amber-soft);margin:6px 0 18px;
  }
  .levelbadge .lv{font-size:2rem;font-weight:800;color:var(--amber);}
  .likert{display:flex;gap:8px;margin-top:6px;}
  .likert button{flex:1;background:var(--surface2);color:var(--text);border:1px solid var(--line);padding:10px 6px;font-size:0.8rem;}
  .likert button.sel{background:var(--amber);color:#1a1200;border-color:var(--amber);}

  .footer-nav{display:flex;justify-content:space-between;margin-top:8px;}
  .small{font-size:0.82rem;color:var(--muted);}
  .divider{height:1px;background:var(--line);margin:20px 0;}
  .historytable{overflow-x:auto;}
  code{background:var(--surface3);padding:2px 6px;border-radius:5px;font-size:0.85em;}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================================================
   หน่วยข้อสอบ: "ระบบเตือนเมื่อรถออกนอกเลน" (Lane Departure Warning)
   แบบฝึกเทียบเคียงลักษณะข้อสอบ PISA 2025: Learning in the Digital World
   โครงสร้าง: Show -> Learn (3 ภาระงาน) -> Apply -> Reflect
   ============================================================ */

const TOTAL_SECONDS = 30 * 60;
const STORAGE_PREFIX = "ldw_lanedeparture_record:";
const CONFIG_KEY = "ldw_config:webhook_url";
const DEFAULT_WEBHOOK_URL = "https://script.google.com/macros/s/AKfycby_qOyx8J8WZJyRuYGKmdy6sdMGg3gvo4cOIXbCex56Nok1W2zVID81M41o40rQAyW9/exec";

const state = {
  screen: "login",
  user: "",
  grade: "",
  showSettings: false,
  config: { webhookUrl: "", draft: "", status: "" },
  timerId: null,
  remaining: TOTAL_SECONDS,
  finished: false,
  show: { a1:null, a2:[], a3:null, a4:null, conf:null },
  learn: {
    t1: { threshold:50, tested:{sun:false,rain:false,faded:false}, results:{}, explain:"", locked:false },
    t2: { comparator:"<", value:0.4, explain:"" },
    t3: { fn:"", fp:"", acc:"", worst:null }
  },
  apply: { sens:50, dist:0.5, delay:1.5, ran:false, results:null, tradeoff:"" },
  reflect: { understand:null, confidence:null, difficulty:null, strategy:"", more:"" },
  scores: { show:0, learn:0, learn1:0, learn2:0, learn3:0, apply:0, reflect:0, overall:0, level:1 }
};

/* ---------------- utility ---------------- */
function el(html){ const d=document.createElement("div"); d.innerHTML=html.trim(); return d.firstElementChild; }
function fmtTime(s){ const m=Math.floor(s/60); const sec=s%60; return String(m).padStart(2,"0")+":"+String(sec).padStart(2,"0"); }
function initials(name){ return (name||"?").trim().slice(0,1).toUpperCase(); }
function clamp(v,min,max){ return Math.max(min,Math.min(max,v)); }

function startTimer(){
  if(state.timerId) clearInterval(state.timerId);
  state.timerId = setInterval(()=>{
    if(state.finished){ clearInterval(state.timerId); return; }
    state.remaining--;
    if(state.remaining<=0){
      state.remaining=0;
      clearInterval(state.timerId);
      finishTest(true);
      return;
    }
    const t = document.getElementById("timerText");
    const box = document.getElementById("timerBox");
    if(t) t.textContent = fmtTime(state.remaining);
    if(box) box.classList.toggle("warn", state.remaining<300);
  },1000);
}

/* ---------------- navigation ---------------- */
function goto(screen){ state.screen = screen; render(); window.scrollTo({top:0,behavior:"smooth"}); }

const PHASES = [
  {key:"show", label:"SHOW"},
  {key:"learn", label:"LEARN"},
  {key:"apply", label:"APPLY"},
  {key:"reflect", label:"REFLECT"},
];
function phaseIndexFor(screen){
  if(screen==="show") return 0;
  if(screen.startsWith("learn")) return 1;
  if(screen==="apply") return 2;
  if(screen==="reflect") return 3;
  return -1;
}

/* ---------------- SHOW scoring ---------------- */
function scoreShow(){
  let s=0;
  if(state.show.a1==="b") s+=25;
  const a2ok = state.show.a2.includes("weather") && state.show.a2.includes("faded") && !state.show.a2.includes("color");
  if(a2ok) s+=25;
  if(state.show.a3==="c") s+=25;
  if(state.show.a4==="a") s+=25;
  state.scores.show = s;
  return s;
}

/* ---------------- LEARN Task 1 ---------------- */
const T1_RANGES = { sun:[20,95], rain:[55,80], faded:[68,88] };
function t1Test(cond){
  const v = state.learn.t1.threshold;
  const [lo,hi] = T1_RANGES[cond];
  const pass = v>=lo && v<=hi;
  state.learn.t1.tested[cond]=true;
  state.learn.t1.results[cond]=pass;
  render();
}
function scoreLearn1(){
  const r = state.learn.t1.results;
  const passCount = ["sun","rain","faded"].filter(c=>r[c]===true).length;
  const explainOk = state.learn.t1.explain.trim().length>=15;
  const s = Math.round((passCount/3)*70) + (explainOk?30:0);
  state.scores.learn1 = s;
  return s;
}

/* ---------------- LEARN Task 2 ---------------- */
const T2_CASES = [
  {distance:0.15, signalOn:false, expected:true},
  {distance:0.45, signalOn:false, expected:false},
  {distance:0.10, signalOn:true,  expected:false},
  {distance:0.35, signalOn:false, expected:true},
  {distance:0.60, signalOn:false, expected:false},
  {distance:0.20, signalOn:false, expected:true},
];
function t2Predict(c){
  const v = state.learn.t2.value;
  const cmp = state.learn.t2.comparator;
  const distCond = cmp==="<" ? c.distance < v : c.distance <= v;
  return distCond && !c.signalOn;
}
function t2Accuracy(){
  let correct=0;
  T2_CASES.forEach(c=>{ if(t2Predict(c)===c.expected) correct++; });
  return correct;
}
function scoreLearn2(){
  const correct = t2Accuracy();
  const s = Math.round((correct/T2_CASES.length)*100);
  state.scores.learn2 = s;
  return s;
}

/* ---------------- LEARN Task 3 ---------------- */
const T3_DATA = [
  {no:1, speed:60,  cond:"ปกติ",   detected:true,  actual:true},
  {no:2, speed:90,  cond:"ฝนตก",   detected:false, actual:true},
  {no:3, speed:45,  cond:"ปกติ",   detected:true,  actual:true},
  {no:4, speed:100, cond:"กลางคืน",detected:false, actual:true},
  {no:5, speed:70,  cond:"ปกติ",   detected:false, actual:false},
  {no:6, speed:80,  cond:"ฝนตก",   detected:true,  actual:false},
  {no:7, speed:55,  cond:"กลางคืน",detected:true,  actual:true},
  {no:8, speed:95,  cond:"ฝนตก",   detected:false, actual:true},
  {no:9, speed:65,  cond:"ปกติ",   detected:true,  actual:true},
  {no:10,speed:110, cond:"กลางคืน",detected:false, actual:false},
];
function scoreLearn3(){
  let s=0;
  if(parseInt(state.learn.t3.fn)===3) s+=25;
  if(parseInt(state.learn.t3.fp)===1) s+=25;
  const accNum = parseInt(String(state.learn.t3.acc).replace("%",""));
  if(accNum===60) s+=25;
  if(state.learn.t3.worst==="ฝนตก") s+=25;
  state.scores.learn3 = s;
  return s;
}

function scoreLearnOverall(){
  const s = Math.round((scoreLearn1()+scoreLearn2()+scoreLearn3())/3);
  state.scores.learn = s;
  return s;
}

/* ---------------- APPLY ---------------- */
const APPLY_SCENARIOS = [
  {name:"ถนนตรง กลางวัน",            reqSens:50, reqDist:0.50, reqDelay:2.0},
  {name:"ถนนตรง ฝนตก",              reqSens:65, reqDist:0.40, reqDelay:1.5},
  {name:"ทางโค้ง กลางวัน",          reqSens:60, reqDist:0.35, reqDelay:1.2},
  {name:"ทางโค้ง กลางคืน",          reqSens:75, reqDist:0.30, reqDelay:1.0},
  {name:"ทางโค้ง ฝนตก กลางคืน",     reqSens:85, reqDist:0.25, reqDelay:0.8},
  {name:"ถนนตรง กลางคืน",           reqSens:70, reqDist:0.40, reqDelay:1.3},
  {name:"ทางโค้ง ฝนตก กลางวัน",     reqSens:78, reqDist:0.30, reqDelay:1.0},
  {name:"ถนนตรง ฝนตก กลางคืน",      reqSens:80, reqDist:0.30, reqDelay:0.9},
];
function runApply(){
  const {sens,dist,delay} = state.apply;
  const rows = APPLY_SCENARIOS.map(sc=>{
    const pass = sens>=sc.reqSens && dist<=sc.reqDist && delay<=sc.reqDelay;
    return {...sc, pass};
  });
  const passCount = rows.filter(r=>r.pass).length;
  const accuracy = Math.round((passCount/rows.length)*100);
  const nuisance = Math.max(0, Math.round((sens-90)*0.6 + (0.5-delay>0?(0.5-delay)*10:0)));
  state.apply.results = {rows, accuracy, nuisance};
  state.apply.ran = true;
  render();
}
function scoreApply(){
  if(!state.apply.results){ state.scores.apply=0; return 0; }
  const accPart = Math.round(state.apply.results.accuracy*0.7);
  const explainOk = state.apply.tradeoff.trim().length>=20;
  const s = accPart + (explainOk?30:0);
  state.scores.apply = Math.min(100,s);
  return state.scores.apply;
}

/* ---------------- REFLECT ---------------- */
function scoreReflect(){
  let filled=0, total=4;
  if(state.reflect.understand) filled++;
  if(state.reflect.confidence) filled++;
  if(state.reflect.difficulty) filled++;
  if(state.reflect.strategy.trim().length>=5) filled++;
  state.scores.reflect = Math.round((filled/total)*100);
  return state.scores.reflect;
}

/* ---------------- overall ---------------- */
function computeLevel(overall){
  if(overall>=85) return {n:4, name:"ผู้เรียนรู้ขั้นสูงในโลกดิจิทัล", en:"Advanced Digital Learner"};
  if(overall>=70) return {n:3, name:"ผู้เรียนรู้ที่ชำนาญ", en:"Proficient Digital Learner"};
  if(overall>=50) return {n:2, name:"ผู้เรียนรู้ที่กำลังพัฒนา", en:"Developing Digital Learner"};
  return {n:1, name:"ผู้เรียนรู้เริ่มต้น", en:"Emerging Digital Learner"};
}

async function finishTest(timedOut){
  state.finished = true;
  if(state.timerId) clearInterval(state.timerId);
  scoreShow();
  scoreLearnOverall();
  scoreApply();
  scoreReflect();
  const overall = Math.round(
    state.scores.show*0.15 + state.scores.learn*0.40 + state.scores.apply*0.35 + state.scores.reflect*0.10
  );
  state.scores.overall = overall;
  const lvl = computeLevel(overall);
  state.scores.level = lvl.n;
  state.scores.levelName = lvl.name;
  state.scores.levelEn = lvl.en;

  const record = {
    sheet: "Sheet6",
    timestamp: new Date().toISOString(),
    scenario: "Lane Departure Warning",
    user: state.user,
    grade: state.grade,
    show: state.scores.show,
    learn: state.scores.learn,
    learn_detail: {task1:state.scores.learn1, task2:state.scores.learn2, task3:state.scores.learn3},
    apply: state.scores.apply,
    reflect: state.scores.reflect,
    overall: state.scores.overall,
    level: state.scores.level,
    levelName: state.scores.levelName,
    timedOut: !!timedOut
  };
  try{
    const key = STORAGE_PREFIX + Date.now() + "_" + (state.user||"user").replace(/\s+/g,"_");
    await window.storage.set(key, JSON.stringify(record), true);
  }catch(e){ console.error("บันทึกข้อมูลไม่สำเร็จ", e); }

  await sendToSheet(record);

  goto("report");
}

/* ---------------- Google Sheet webhook (Apps Script) ---------------- */
async function loadConfig(){
  try{
    const cfg = await window.storage.get(CONFIG_KEY, true);
    if(cfg && cfg.value){
      state.config.webhookUrl = cfg.value;
      state.config.draft = cfg.value;
    }else{
      // ยังไม่เคยมีการตั้งค่ามาก่อน ใช้ URL เริ่มต้นที่กำหนดไว้ และบันทึกเก็บไว้ทันที
      state.config.webhookUrl = DEFAULT_WEBHOOK_URL;
      state.config.draft = DEFAULT_WEBHOOK_URL;
      await window.storage.set(CONFIG_KEY, DEFAULT_WEBHOOK_URL, true);
    }
  }catch(e){
    state.config.webhookUrl = DEFAULT_WEBHOOK_URL;
    state.config.draft = DEFAULT_WEBHOOK_URL;
  }
}

async function saveConfig(url){
  state.config.status = "กำลังบันทึก...";
  render();
  try{
    await window.storage.set(CONFIG_KEY, url, true);
    state.config.webhookUrl = url;
    state.config.status = url ? "บันทึก URL เรียบร้อยแล้ว นักเรียนทุกคนที่ใช้แบบฝึกนี้จะส่งผลไปยัง Google Sheet เดียวกัน" : "ลบการเชื่อมต่อแล้ว";
  }catch(e){
    state.config.status = "บันทึกไม่สำเร็จ ลองใหม่อีกครั้ง";
  }
  render();
}

async function sendToSheet(record){
  const url = state.config.webhookUrl;
  if(!url) return; // ยังไม่ได้ตั้งค่า Apps Script Web App URL
  try{
    // ใช้ text/plain + no-cors เพื่อเลี่ยงปัญหา CORS preflight กับ Apps Script Web App
    await fetch(url, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(record)
    });
  }catch(e){
    console.error("ส่งข้อมูลไปยัง Google Sheet ไม่สำเร็จ", e);
  }
}

async function testWebhook(){
  state.config.status = "กำลังส่งข้อมูลทดสอบ...";
  render();
  const sample = {
    sheet: "Sheet6",

    user: "ทดสอบระบบ", grade: "ทดสอบ",
    show: 100, learn: 100, learn_detail:{task1:100,task2:100,task3:100},
    apply: 100, reflect: 100, overall: 100, level: 4, levelName: "ทดสอบการเชื่อมต่อ", timedOut:false

  await sendToSheet(sample);
  state.config.status = "ส่งข้อมูลทดสอบแล้ว กรุณาตรวจสอบแถวใหม่ใน Google Sheet ของคุณ";
  render();
}

function render(){
  const app = document.getElementById("app");
  let html = "";
  const needsBar = ["show","learn1","learn2","learn3","apply","reflect"].includes(state.screen);

  if(needsBar) html += renderStatusBar();

  switch(state.screen){
    case "login": html += renderLogin(); break;
    case "show": html += renderShow(); break;
    case "learn1": html += renderLearn1(); break;
    case "learn2": html += renderLearn2(); break;
    case "learn3": html += renderLearn3(); break;
    case "apply": html += renderApply(); break;
    case "reflect": html += renderReflect(); break;
    case "report": html += renderReport(); break;
    case "history": html += renderHistory(); break;
  }
  app.innerHTML = html;
  attachHandlers();
}

  const opts = labels || ["ไม่เข้าใจเลย","เข้าใจเล็กน้อย","เข้าใจดี","เข้าใจดีมาก"];
  return `

      ${opts.map((o,i)=>`<button type="button" class="${current===(i+1)?"sel":""}" data-val="${i+1}">${o}</button>`).join("")}
    </div>
  </div>`;
}

async function loadHistory(){
  const container = document.getElementById("historyContent");
  if(!container) return;
  try{
    const list = await window.storage.list(STORAGE_PREFIX, true);
    const keys = (list && list.keys) || [];
    if(keys.length===0){ container.innerHTML = "<p class='small'>ยังไม่มีข้อมูลการทำแบบทดสอบ</p>"; return; }
    const records = [];
    for(const k of keys){
      try{
        const r = await window.storage.get(k, true);
        if(r && r.value) records.push(JSON.parse(r.value));
      }catch(e){}
    }
    records.sort((a,b)=> new Date(b.timestamp) - new Date(a.timestamp));
    window.__ldw_records = records;
    container.innerHTML = `
    <div class="historytable">
    <table>
      <tr><th>วันเวลา</th><th>ชื่อ</th><th>ระดับชั้น</th><th>Show</th><th>Learn</th><th>Apply</th><th>Reflect</th><th>รวม</th><th>ระดับ</th></tr>
      ${records.map(r=>`
        <tr>
          <td>${new Date(r.timestamp).toLocaleString("th-TH")}</td>
          <td style="text-align:left;">${r.user}</td>
          <td>${r.grade}</td>
          <td>${r.show}</td>
          <td>${r.learn}</td>
          <td>${r.apply}</td>
          <td>${r.reflect}</td>
          <td style="color:var(--amber);font-weight:700;">${r.overall}</td>
          <td>${r.level} — ${r.levelName}</td>
        </tr>`).join("")}
    </table>
    </div>`;
  }catch(e){
    container.innerHTML = "<p class='small' style='color:var(--red)'>ไม่สามารถโหลดข้อมูลได้</p>";
  }
}

function exportCsv(){
  const records = window.__ldw_records || [];
  const header = ["timestamp","user","grade","show","learn","learn_task1","learn_task2","learn_task3","apply","reflect","overall","level","levelName"];
  const lines = [header.join(",")];
  records.forEach(r=>{
    lines.push([
      r.timestamp, r.user, r.grade, r.show, r.learn,
      r.learn_detail? r.learn_detail.task1:"", r.learn_detail? r.learn_detail.task2:"", r.learn_detail? r.learn_detail.task3:"",
      r.apply, r.reflect, r.overall, r.level, r.levelName
    ].map(v=>`"${String(v).replace(/"/g,'""')}"`).join(","));
  });
  const blob = new Blob([lines.join("\n")], {type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "ldw_lane_departure_results.csv";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function attachHandlers(){
  // login
  const btnStart = document.getElementById("btnStart");
  if(btnStart) btnStart.onclick = ()=>{
    const name = document.getElementById("inpName").value.trim();
    const grade = document.getElementById("inpGrade").value;
    if(!name || !grade){
      document.getElementById("loginError").textContent = "กรุณาป้อนชื่อและเลือกระดับชั้นก่อนเริ่มทำแบบทดสอบ";
      return;
    }
    state.user = name; state.grade = grade;
    state.remaining = TOTAL_SECONDS;
    state.finished = false;
    startTimer();
    goto("show");
  };
  const btnHistory = document.getElementById("btnHistory");
  if(btnHistory) btnHistory.onclick = ()=>{ goto("history"); loadHistory(); };

  const btnToggleSettings = document.getElementById("btnToggleSettings");
  if(btnToggleSettings) btnToggleSettings.onclick = ()=>{ state.showSettings = !state.showSettings; render(); };
  const webhookUrl = document.getElementById("webhookUrl");
  if(webhookUrl) webhookUrl.oninput = (e)=>{ state.config.draft = e.target.value; };
  const btnSaveWebhook = document.getElementById("btnSaveWebhook");
  if(btnSaveWebhook) btnSaveWebhook.onclick = ()=> saveConfig(state.config.draft.trim());
  const btnTestWebhook = document.getElementById("btnTestWebhook");
  if(btnTestWebhook) btnTestWebhook.onclick = testWebhook;
  const btnClearWebhook = document.getElementById("btnClearWebhook");
  if(btnClearWebhook) btnClearWebhook.onclick = ()=>{ state.config.draft=""; saveConfig(""); };

  // choice groups (radio/checkbox) generic binding
  document.querySelectorAll(".choicegroup").forEach(g=>{
    const name = g.dataset.name;
    const type = g.dataset.type;
    g.querySelectorAll("input").forEach(inp=>{
      inp.addEventListener("change", ()=>{
        if(name==="show_a1") state.show.a1 = inp.value;
        if(name==="show_a4") state.show.a4 = inp.value;
        if(name==="show_a2"){
          const val = inp.value;
          const arr = state.show.a2;
          if(inp.checked){ if(!arr.includes(val)) arr.push(val); }
          else{ state.show.a2 = arr.filter(v=>v!==val); }
        }
        render();
      });
    });
  });

  // graph points for show a3
  document.querySelectorAll(".graphpt").forEach(g=>{
    g.addEventListener("click", ()=>{ state.show.a3 = g.dataset.val; render(); });
  });

  const btnToLearn = document.getElementById("btnToLearn");
  if(btnToLearn) btnToLearn.onclick = ()=> goto("learn1");

  // learn1
  const t1slider = document.getElementById("t1slider");
  if(t1slider) t1slider.oninput = (e)=>{ state.learn.t1.threshold = parseInt(e.target.value); updateSliderLabel(e.target, e.target.value); };
  document.querySelectorAll("[data-t1test]").forEach(b=>{
    b.onclick = ()=> t1Test(b.dataset.t1test);
  });

  if(t1explain) t1explain.oninput = (e)=>{ state.learn.t1.explain = e.target.value; };

<script>
/* ===================================================================
   PISA Hub integration bootstrap (auto-added)
   - Reads name/grade from URL (?name=..&grade=..) or localStorage
     "pisaLearner" written by index.html, so the learner never types
     the name or picks the grade again inside this scenario.
   - Pre-fills the name field and rebuilds the grade <select> with the
     SAME option list used on index.html, learner's grade preselected.
   - Does NOT auto-click "start" and does NOT skip the intro/story
     screen - the learner reads the scenario and starts it themselves.
   - Marks this scenario as "started" for the current learner as soon
     as it is opened, and upgrades it to "completed" (with SHOW /
     LEARN / APPLY / REFLECT scores) when the result is posted to the
     Google Sheet, so index.html can report either real scores or
     "did not finish".
   - Progress is stored per learner (name + grade), so switching user
     on index.html switches to that person's own history.
   =================================================================== */
(function () {
  "use strict";
  var SCENARIO_ID = "laneDepartWarning";
  var SCENARIO_TITLE = "Lane Departure Warning";
  var PROGRESS_KEY = "pisaProgressByUser";

  /* the single source of truth for grade options - identical to index.html */
  var GRADE_CHOICES = [
    "ระดับชั้นมัธยมศึกษาปีที่ 1",
    "ระดับชั้นมัธยมศึกษาปีที่ 2",
    "ระดับชั้นมัธยมศึกษาปีที่ 3",
    "อื่นๆ/บุคคลทั่วไป"
  ];

  function qs(k) {
    try { return new URLSearchParams(location.search).get(k) || ""; }
    catch (e) { return ""; }
  }
  var saved = null;
  try { saved = JSON.parse(localStorage.getItem("pisaLearner") || "null"); } catch (e) {}
  var fillName = (qs("name") || (saved && saved.name) || "").trim();
  var fillGrade = (qs("grade") || (saved && saved.grade) || "").trim();
  var fromHub = !!(fillName && fillGrade);
  var learnerKey = fillName + "|" + fillGrade;

  /* ---------------- progress store (per learner) ---------------- */
  function readAll() {
    try { return JSON.parse(localStorage.getItem(PROGRESS_KEY) || "{}"); }
    catch (e) { return {}; }
  }
  function writeRecord(rec) {
    if (!learnerKey || learnerKey === "|") return;
    try {
      var all = readAll();
      if (!all[learnerKey]) all[learnerKey] = {};
      all[learnerKey][SCENARIO_ID] = rec;
      localStorage.setItem(PROGRESS_KEY, JSON.stringify(all));
    } catch (e) {}
  }
  function currentRecord() {
    var all = readAll();
    return (all[learnerKey] && all[learnerKey][SCENARIO_ID]) || null;
  }

  if (fromHub) {
    try {
      localStorage.setItem("pisaLearner", JSON.stringify({ name: fillName, grade: fillGrade, ts: Date.now() }));
    } catch (e) {}

    /* mark as "opened but not finished" - only when this learner has no
       finished result yet, so a finished result is never downgraded */
    var existing = currentRecord();
    if (!existing || !existing.completed) {
      writeRecord({
        title: SCENARIO_TITLE, name: fillName, grade: fillGrade,
        completed: false, started: true, startedAt: new Date().toISOString()
      });
    }

    var NAME_IDS = ["inName", "inputName", "nameInput", "gateName", "inp-name", "inpName"];
    var GRADE_IDS = ["inGrade", "gradeSelect", "gradeInput", "gateGrade", "inp-grade", "inpGrade"];

    function byIds(ids) {
      for (var i = 0; i < ids.length; i++) {
        var el = document.getElementById(ids[i]);
        if (el) return el;
      }
      return null;
    }
    function fire(el) {
      el.dispatchEvent(new Event("input", { bubbles: true }));
      el.dispatchEvent(new Event("change", { bubbles: true }));
    }

    function applyLearner() {
      var nameEl = byIds(NAME_IDS);
      var gradeEl = byIds(GRADE_IDS);

      if (nameEl && fillName && !(nameEl.value || "").trim()) {
        nameEl.value = fillName;
        fire(nameEl);
      }
      if (!gradeEl) return;

      if (gradeEl.tagName === "SELECT") {
        if (gradeEl.getAttribute("data-pisa-grade") !== "1") {
          var list = GRADE_CHOICES.slice();
          if (fillGrade && list.indexOf(fillGrade) === -1) list.unshift(fillGrade);
          gradeEl.innerHTML = "";
          for (var i = 0; i < list.length; i++) {
            var opt = document.createElement("option");
            opt.value = list[i];
            opt.textContent = list[i];
            if (list[i] === fillGrade) opt.selected = true;
            gradeEl.appendChild(opt);
          }
          gradeEl.setAttribute("data-pisa-grade", "1");
          gradeEl.value = fillGrade;
          fire(gradeEl);
        } else if (!(gradeEl.value || "").trim() && fillGrade) {
          gradeEl.value = fillGrade;
          fire(gradeEl);
        }
      } else if (fillGrade && !(gradeEl.value || "").trim()) {
        gradeEl.value = fillGrade;
        fire(gradeEl);
      }
    }

    var tries = 0;
    var poll = setInterval(function () {
      tries++;
      try { applyLearner(); } catch (e) {}
      if (tries > 9000) clearInterval(poll); // ~25 min safety cap
    }, 170);
    try { applyLearner(); } catch (e) {}

    var bar = document.createElement("div");
    bar.style.cssText = "position:fixed;right:0;bottom:0;z-index:999999;display:flex;justify-content:flex-end;pointer-events:none;";
    var backBtn = document.createElement("button");
    backBtn.type = "button";
    backBtn.textContent = "🏠 กลับสู่หน้าหลัก";
    backBtn.style.cssText = "pointer-events:auto;margin:12px;padding:10px 20px;border-radius:999px;border:none;background:#1f2a44;color:#fff;font-weight:700;font-family:system-ui,'IBM Plex Sans Thai',sans-serif;font-size:13px;box-shadow:0 6px 18px rgba(0,0,0,.28);cursor:pointer;opacity:.9;transition:opacity .15s;";
    backBtn.addEventListener("mouseenter", function () { backBtn.style.opacity = "1"; });
    backBtn.addEventListener("mouseleave", function () { backBtn.style.opacity = ".9"; });
    backBtn.addEventListener("click", goBackToHub);
    bar.appendChild(backBtn);
    document.body.appendChild(bar);
    /* keep the floating button from covering the page content */
    try { document.body.style.paddingBottom = "76px"; } catch (e) {}
  }

  /* ---------------- capture the result sent to Google Sheet ------------- */
  var lastPayload = null;
  var origFetch = window.fetch;
  window.fetch = function (url, opts) {
    try {
      if (opts && opts.body && typeof opts.body === "string") {
        var bodyObj = JSON.parse(opts.body);
        var hasName = bodyObj && (bodyObj.name || bodyObj.user);
        var hasGrade = bodyObj && bodyObj.grade;
        if (hasName && hasGrade) {
          lastPayload = bodyObj;
          recordProgress(bodyObj);
        }
      }
    } catch (e) {}
    return origFetch.apply(this, arguments);
  };

  function num(v) {
    return (typeof v === "number" && isFinite(v)) ? Math.round(v) : null;
  }
  /* pull a percentage out of a report sentence:
     "... (รวม 62%)" / "ความแม่นยำเฉลี่ย 75% (...)" -> the summary number,
     otherwise the first percentage in the text ("4/5 (80%)" -> 80) */
  function pctFromText(t) {
    if (typeof t !== "string") return null;
    var m = t.match(/(?:รวม|เฉลี่ย)\s*([\d.]+)\s*%/);
    if (m) return Math.round(parseFloat(m[1]));
    m = t.match(/([\d.]+)\s*%/);
    if (m) return Math.round(parseFloat(m[1]));
    return null;
  }
  /* "รวม 78/100 (SHOW 60, LEARN 80, APPLY 75, REFLECT 90)" */
  function fromTotalReport(p, label) {
    var t = p.totalReport;
    if (typeof t !== "string") return null;
    var m = t.match(new RegExp(label + "\\s*([\\d.]+)"));
    return m ? Math.round(parseFloat(m[1])) : null;
  }
  function section(p, keys, textKey, label) {
    for (var i = 0; i < keys.length; i++) {
      var v = num(p[keys[i]]);
      if (v !== null) return v;
    }
    var fromTotal = fromTotalReport(p, label);
    if (fromTotal !== null) return fromTotal;
    return pctFromText(p[textKey]);
  }
  function extractSections(p) {
    return {
      show:    section(p, ["show", "show_score", "showScore"], "showReport", "SHOW"),
      learn:   section(p, ["learn", "learn_score", "learnScore"], "learnReport", "LEARN"),
      apply:   section(p, ["apply", "apply_score", "applyScore"], "applyReport", "APPLY"),
      reflect: section(p, ["reflect", "reflect_score", "reflectScore"], "reflectReport", "REFLECT")
    };
  }
  function extractOverall(p) {
    var v = num(p.overall);
    if (v !== null) return v;
    v = num(p.overall_score);
    if (v !== null) return v;
    var texts = [p.overallReport, p.totalReport, p.qualityReport].filter(Boolean).join(" ");
    var m = texts.match(/([\d.]+)\s*%/) || texts.match(/([\d.]+)\s*\/\s*100/);
    return m ? Math.round(parseFloat(m[1])) : null;
  }
  function extractLevelName(p) {
    return p.levelName || p.levelLabel || p.quality_label || p.qualityLevel || p.qualityReport || "";
  }
  function recordProgress(p) {
    var sec = extractSections(p);
    writeRecord({
      title: SCENARIO_TITLE,
      name: p.name || p.user || fillName,
      grade: p.grade || fillGrade,
      overall: extractOverall(p),
      show: sec.show, learn: sec.learn, apply: sec.apply, reflect: sec.reflect,
      levelName: extractLevelName(p),
      timestamp: p.timestamp || new Date().toISOString(),
      completed: true
    });
  }

  function goBackToHub() {
    var q = new URLSearchParams();
    q.set("done", SCENARIO_ID);
    if (fillName) q.set("name", fillName);
    if (fillGrade) q.set("grade", fillGrade);
    if (lastPayload) {
      var ov = extractOverall(lastPayload);
      var ln = extractLevelName(lastPayload);
      var sec = extractSections(lastPayload);
      if (ov != null) q.set("overall", ov);
      if (ln) q.set("levelName", ln);
      if (sec.show != null) q.set("show", sec.show);
      if (sec.learn != null) q.set("learn", sec.learn);
      if (sec.apply != null) q.set("apply", sec.apply);
      if (sec.reflect != null) q.set("reflect", sec.reflect);
    }
    location.href = "index.html?" + q.toString();
  }
})();
</script>
<script>
/* ===================================================================
   PISA Review & History module (auto-added)
   -------------------------------------------------------------------
   1) บันทึก "รอยการทำแบบทดสอบ" ของผู้เข้าสอบระหว่างทำ (เลือกตัวเลือกใด
      และเขียนคำตอบอัตนัยว่าอย่างไร) โดยไม่ยุ่งกับตรรกะเดิมของแบบทดสอบ
   2) จับคู่ตัวเลือกที่เลือกกับคลังข้อสอบของไฟล์นั้นเอง (SHOW_ITEMS /
      SHOW_Q / SHOW_QUESTIONS / SHOW_MCQ / REFLECT_* ฯลฯ) เพื่อดึงโจทย์
      เฉลย และคำอธิบาย/รูบริคมาแสดง
   3) เติม "ตารางรายละเอียดรายข้อ" ลงในหน้ารายงานผล แยกตาม 4 ขั้นตอน
   4) ปุ่ม "ย้อนดูประวัติการทำแบบทดสอบ" เปิดโหมดอ่านอย่างเดียว พร้อม
      ลายน้ำบนเลเยอร์บนสุด และปุ่มออกจากโหมด
   =================================================================== */
(function () {
  "use strict";

  var SCENARIO_ID = "laneDepartWarning";
  var SCENARIO_TITLE = "Lane Departure Warning";
  var ATTEMPTS_KEY = "pisaAttempts";
  /* เฉลย/รูบริคจาก "คู่มือเฉลยและเกณฑ์การให้คะแนน" (.docx) ของสถานการณ์นี้ - คัดลอกมาตามเอกสารทุกประการ */
  var DOCKEY = {"i": [{"s": "SHOW", "n": 1, "t": "ข้อ 1  (5 คะแนน)  ระบบ LDW ใช้ข้อมูลจากกล้องเพื่อคำนวณสิ่งใดเป็นหลัก?\n• ก  —  ✗ ตัวลวง\n      ความเร็วของรถเทียบกับรถคันหน้า\n      เป็นหลักการทำงานของระบบควบคุมความเร็วอัตโนมัติแบบปรับได้ (Adaptive Cruise Control) หรือระบบเตือนการชนด้านหน้า (Forward Collision Warning) ซึ่งใช้เรดาร์หรือไลดาร์วัดระยะและความเร็วสัมพัทธ์กับรถคันหน้า ไม่ใช่การประมวลผลภาพจากกล้องเพื่อดูเส้นเลนตามที่โจทย์กำหนด จึงเป็นการสับสนระหว่างเซนเซอร์คนละประเภทและระบบช่วยเหลือคนละหน้าที่\n• ข  —  ✓ ถูกต้อง\n      ตำแหน่งของรถเทียบกับเส้นแบ่งช่องจราจร\n      กล้องของระบบ LDW ทำหน้าที่ประมวลผลภาพ (image processing) เพื่อตรวจจับเส้นแบ่งช่องจราจร (lane marking detection) แล้วคำนวณตำแหน่งเชิงข้าง (lateral position) ของรถเทียบกับเส้นเลน ตรงตามหลักการทำงานที่โจทย์อธิบายไว้ในสถานการณ์ทุกประการ\n• ค  —  ✗ ตัวลวง\n      ระดับน้ำมันเชื้อเพลิงที่เหลือ\n      เป็นข้อมูลจากเซนเซอร์วัดระดับของเหลวในถังน้ำมัน ซึ่งอยู่คนละระบบกับกล้องหรือระบบความปลอดภัยเชิงรุก (active safety system) ไม่มีความเชื่อมโยงเชิงเหตุผลกับกลไกการตรวจจับเส้นเลนของ LDW เลย เป็นตัวลวงที่ไม่เกี่ยวข้องกับบริบทของคำถาม\n• ง  —  ✗ ตัวลวง\n      อุณหภูมิของเครื่องยนต์\n      เป็นข้อมูลจากเซนเซอร์ในระบบบริหารจัดการเครื่องยนต์ (engine management system) ไม่เกี่ยวข้องกับการมองเห็นภาพถนนหรือเส้นเลนแต่อย่างใด เป็นตัวลวงในลักษณะเดียวกับข้อ ค. คือหยิบยืมคำศัพท์ที่เกี่ยวกับรถยนต์มาสร้างความสับสน\nให้คะแนนเต็ม 5 คะแนน เฉพาะเมื่อเลือกข้อ ข. เท่านั้น"}, {"s": "SHOW", "n": 2, "t": "ข้อ 2  (5 คะแนน)  ปัจจัยใดบ้างที่อาจทำให้ระบบตรวจจับเส้นเลนผิดพลาด? (เลือกได้มากกว่า 1 ข้อ)\n• 1  —  ✓ ถูกต้อง\n      สภาพอากาศ เช่น ฝนตก หมอกลง\n      กล้องเป็นเซนเซอร์เชิงแสง (optical sensor) เมื่อทัศนวิสัยลดลงจากฝนหรือหมอก ความเปรียบต่างของภาพ (contrast) จะลดลง ทำให้อัลกอริทึมตรวจจับขอบ (edge detection) แยกเส้นเลนออกจากพื้นถนนได้ยากขึ้น สอดคล้องกับผลการทดลองในภาระงานที่ 1 ที่สภาพฝนตกต้องใช้ค่าความไวอยู่ในช่วงแคบกว่าสภาพแดดจ้าอย่างชัดเจน (55-80 เทียบกับ 20-95)\n• 2  —  ✓ ถูกต้อง\n      เส้นแบ่งช่องจราจรที่จางหรือลบเลือน\n      ความเปรียบต่างของขอบเขต (edge contrast) ระหว่างพื้นถนนกับเส้นเลนลดลงโดยตรง ทำให้สัญญาณเส้นเลนในภาพที่กล้องจับได้อ่อนลง อัลกอริทึมจึงตรวจจับพลาดได้ง่ายขึ้น สอดคล้องกับสภาพ “เส้นเลนจาง” ในภาระงานที่ 1 ซึ่งต้องใช้ช่วงค่าความไวที่แคบที่สุดในบรรดา 3 สภาพ (68-88)\n• 3  —  ✗ ตัวลวง\n      สีของตัวถังรถยนต์\n      สีตัวถังเป็นคุณสมบัติภายนอกของรถคันที่ติดตั้งระบบเอง ไม่ได้อยู่ในมุมมอง (field of view) ของกล้องที่ติดตั้งมองไปข้างหน้าเพื่อตรวจจับเส้นเลนบนพื้นถนน จึงไม่มีความสัมพันธ์เชิงเหตุ-ผล (causal relationship) ใด ๆ กับความแม่นยำของการตรวจจับเส้นเลน เป็นตัวลวงที่ฟังดูเกี่ยวกับตัวรถแต่ไม่เกี่ยวกับกลไกการทำงานของเซนเซอร์เลย\nเกณฑ์การให้คะแนน: ให้คะแนนเต็ม 5 คะแนน เมื่อเลือกถูกทั้งข้อ 1 และ 2 โดยไม่เลือกข้อ 3 · ให้คะแนนบางส่วน 3 คะแนน เมื่อเลือกถูกเพียง 1 ใน 2 ข้อ โดยไม่เลือกข้อ 3 · ให้ 0 คะแนน หากเลือกข้อ 3 ไม่ว่าจะเลือกข้ออื่นถูกด้วยหรือไม่ก็ตาม (เพราะสะท้อนความเข้าใจที่คลาดเคลื่อนเกี่ยวกับกลไกของเซนเซอร์)"}, {"s": "SHOW", "n": 3, "t": "ข้อ 3  (5 คะแนน)  กราฟแสดงระยะห่างของรถจากขอบเลนตามเวลา จุดใดคือช่วงที่ระบบควรแจ้งเตือน?\n• จุด A  —  ✗ ตัวลวง\n      ช่วงที่ระยะห่างจากขอบเลนกำลังเพิ่มขึ้น\n      เป็นช่วงที่รถกำลังเคลื่อนตัวเข้าใกล้กึ่งกลางเลนมากขึ้น (ค่าระยะห่างจากขอบเลนเพิ่มขึ้น) จึงยังอยู่ในตำแหน่งที่ปลอดภัย ไม่มีเหตุอันควรแจ้งเตือน ณ จุดนี้\n• จุด B  —  ✗ ตัวลวง\n      จุดสูงสุดของกราฟ (ระยะห่างจากขอบเลนมากที่สุด)\n      เป็นจุดที่รถอยู่ห่างจากขอบเลนมากที่สุดในช่วงเวลาที่แสดง กล่าวคือ อยู่ในตำแหน่งปลอดภัยที่สุด ตรงข้ามกับสถานการณ์เสี่ยงโดยสิ้นเชิง ตัวลวงนี้ทดสอบว่าผู้เข้าสอบอ่านทิศทางของแกนกราฟและความหมายของค่าสูงสุด/ต่ำสุดได้ถูกต้องตรงกับสถานการณ์จริงหรือไม่\n• จุด C  —  ✓ ถูกต้อง\n      จุดที่เส้นกราฟตัดกับเส้นขอบเขต “ออกนอกเลน” พอดี\n      ตามหลักการของระบบแจ้งเตือนแบบใช้ค่าขีดจำกัด (threshold-based alerting) ระบบต้องแจ้งเตือนทันทีที่ค่าที่วัดได้ถึงหรือเกินค่าขีดจำกัดที่กำหนดไว้ จุด C คือตำแหน่งที่ค่าระยะห่างจากขอบเลนลดลงจนแตะเส้นขอบเขตอันตรายพอดี จึงเป็นจุดที่ต้องแจ้งเตือนก่อนที่รถจะออกนอกเลนจริง การอ่านกราฟให้ตรงกับเงื่อนไขเชิงตัวเลขเช่นนี้เป็นทักษะการตีความข้อมูล (data interpretation) ที่ PISA ด้านการเรียนรู้ในโลกดิจิทัลให้ความสำคัญ\nให้คะแนนเต็ม 5 คะแนน เฉพาะเมื่อระบุจุด C เท่านั้น"}, {"s": "SHOW", "n": 4, "t": "ข้อ 4  (5 คะแนน)  เงื่อนไขการแจ้งเตือนของระบบ: “ถ้าระยะห่างจากเส้นน้อยกว่าค่าที่กำหนด และผู้ขับไม่ได้เปิดไฟเลี้ยว” จะเกิดผลลัพธ์ใด?\n• ก  —  ✓ ถูกต้อง\n      ระบบแจ้งเตือนผู้ขับ\n      ตรงตามโครงสร้างตรรกะเชิงเงื่อนไข (conditional logic: IF...AND...THEN) ที่โจทย์กำหนดไว้ตรงตัว ผลลัพธ์ที่ระบุในกฎคือการแจ้งเตือน สะท้อนหลักการของระบบช่วยเหลือผู้ขับขี่ระดับการแจ้งเตือน (advisory / warning system) ซึ่งจัดอยู่ในกลุ่มระบบช่วยเหลือผู้ขับขี่ระดับต้น (Driver Assistance, SAE Level 1-2) ที่ให้มนุษย์เป็นผู้ควบคุมและตัดสินใจขั้นสุดท้ายเสมอ\n• ข  —  ✗ ตัวลวง\n      ระบบเบรกรถโดยอัตโนมัติ\n      เป็นการทำงานของระบบคนละประเภท คือระบบเบรกฉุกเฉินอัตโนมัติ (Autonomous Emergency Braking: AEB) ซึ่งเข้าแทรกแซงการควบคุมรถโดยตรง (active intervention) ขณะที่ LDW เป็นเพียงระบบแจ้งเตือน (warning only) ตัวลวงนี้ทดสอบว่าผู้เข้าสอบแยกแยะระหว่างระบบ “แจ้งเตือน” กับระบบ “แทรกแซงอัตโนมัติ” ได้หรือไม่ ซึ่งต้องตีความเงื่อนไขให้ตรงตามที่ระบุไว้ ไม่ใช่อนุมานเกินกว่าข้อมูลที่ให้ (over-inference)\n• ค  —  ✗ ตัวลวง\n      ระบบปิดตัวเองชั่วคราว\n      ไม่มีส่วนใดของเงื่อนไขที่กล่าวถึงการปิดการทำงานของระบบเลย เป็นตัวลวงที่ไม่มีมูลฐานอ้างอิงจากกฎที่โจทย์ให้ไว้ (not supported by the given premise)\n• ง  —  ✗ ตัวลวง\n      ไม่มีสิ่งใดเกิดขึ้น\n      ขัดแย้งโดยตรงกับโครงสร้างประโยคเงื่อนไข “ถ้า...แล้ว...” ซึ่งระบุผลลัพธ์ (consequent) ไว้ชัดเจนว่าต้องเกิดการแจ้งเตือนเมื่อเงื่อนไขทั้งสองข้อ (antecedent) เป็นจริงพร้อมกัน การตอบว่าไม่มีอะไรเกิดขึ้นคือการละเลยผลสรุปเชิงตรรกะทั้งที่เงื่อนไขเป็นจริง\nให้คะแนนเต็ม 5 คะแนน เฉพาะเมื่อเลือกข้อ ก. เท่านั้น"}, {"s": "LEARN", "n": 1, "t": "ส่วนที่ 2 · LEARN ภาระงานที่ 1 (รวม 15 คะแนน)\n• 1.1  —  ตั้งแต่ threshold = 68 ถึง 80\n      5  ช่วงที่ทำให้ทั้ง 3 สภาพผ่านพร้อมกัน (ดูตารางในแบบทดสอบ) ให้คะแนนเต็มหากคำตอบเป็นช่วงที่อยู่ภายใน [68, 80] ให้ค่าคะแนน 5 คะแนน\n        หากระบุเพียงค่าเดียวที่ถูกต้อง (ไม่ได้ตอบเป็นช่วง) เช่น 68 หรือ 80 เพียงค่าใดค่าหนึ่ง ให้คะแนนบางส่วน 3 คะแนน\n• 1.2  —  อัตนัย — ดูรูบริคในส่วน ข\n      10  ประเมิน 3 มิติ: ความเข้าใจแนวคิด / การใช้หลักฐาน / ความชัดเจนของการสื่อสาร"}, {"s": "LEARN", "n": 2, "t": "ส่วนที่ 2 · LEARN ภาระงานที่ 2 (รวม 10 คะแนน)\nตัวอย่างกฎที่ถูกต้อง (ทำนายถูกทั้ง 6/6 เคส): “ถ้าระยะห่างจากเส้น < 0.40 เมตร และไม่ได้เปิดไฟเลี้ยว → แจ้งเตือน” กฎอื่นที่สมเหตุสมผลก็ยอมรับได้ ตราบใดที่ตำแหน่งค่าตัวเลขอยู่ในช่วง 0.35 < ค่า ≤ 0.45 (สำหรับ “<”) หรือ 0.35 ≤ ค่า < 0.45 (สำหรับ “≤”) เนื่องจากค่าดังกล่าวแบ่งเคส “แจ้งเตือน” (0.15, 0.35, 0.20 ม.) ออกจากเคส “ไม่แจ้งเตือน” (0.45, 0.60 ม.) ได้ถูกต้องทุกเคส (เคส 0.10 ม. ไม่แจ้งเตือนเพราะเปิดไฟเลี้ยว ไม่ขึ้นกับค่าตัวเลข)\nตารางเฉลย (ใช้กฎ “< 0.40 เมตร”)\n• เคส  —  ระยะห่าง (ม.)\n      ไฟเลี้ยว  ผลที่ควรเป็น  ผลจากกฎเฉลย  ถูกต้อง?\n• 1  —  0.15\n      ปิด  แจ้งเตือน  ✓\n• 2  —  0.45\n      ปิด  ไม่แจ้งเตือน  ✓\n• 3  —  0.10\n      เปิด  ไม่แจ้งเตือน  ✓\n• 4  —  0.35\n      ปิด  แจ้งเตือน  ✓\n• 5  —  0.60\n      ปิด  ไม่แจ้งเตือน  ✓\n• 6  —  0.20\n      ปิด  แจ้งเตือน  ✓\nเกณฑ์การให้คะแนน:\nข้อ 2.1 (2 คะแนน) ให้เต็มเมื่อระบุตัวเปรียบเทียบและค่าตัวเลขที่สอดคล้องกับช่วงข้างต้น (น้อยกว่า และ 0.40)\nข้อ 2.2 (6 คะแนน) ให้ 1 คะแนนต่อเคสที่ผลจากกฎของนักเรียนตรงกับ “ผลที่ควรเป็น” จริง (ตรวจตามกฎที่นักเรียนเขียนไว้เอง ไม่จำเป็นต้องเทียบกับกฎเฉลย จากตารางเฉลย (ใช้กฎ “< 0.40 เมตร”)เพียงอย่างเดียวก็ได้\nข้อ 2.3 (2 คะแนน) ให้เต็มเมื่อจำนวนเคสที่ถูกต้องตรงกับที่กรอกไว้จริงในตารางเฉลย"}, {"s": "LEARN", "n": 2, "t": "ข้อ 2.1 (2 คะแนน) ให้เต็มเมื่อระบุตัวเปรียบเทียบและค่าตัวเลขที่สอดคล้องกับช่วงข้างต้น (น้อยกว่า และ 0.40)"}, {"s": "LEARN", "n": 2, "t": "ข้อ 2.2 (6 คะแนน) ให้ 1 คะแนนต่อเคสที่ผลจากกฎของนักเรียนตรงกับ “ผลที่ควรเป็น” จริง (ตรวจตามกฎที่นักเรียนเขียนไว้เอง ไม่จำเป็นต้องเทียบกับกฎเฉลย จากตารางเฉลย (ใช้กฎ “< 0.40 เมตร”)เพียงอย่างเดียวก็ได้"}, {"s": "LEARN", "n": 2, "t": "ข้อ 2.3 (2 คะแนน) ให้เต็มเมื่อจำนวนเคสที่ถูกต้องตรงกับที่กรอกไว้จริงในตารางเฉลย"}, {"s": "LEARN", "n": 3, "t": "ส่วนที่ 2 · LEARN ภาระงานที่ 3 (รวม 15 คะแนน) ครั้งจาก10ครั้งครั้งที่1357910=60%34อัตนัยดูรูบริคในส่วนขคำตอบที่ถูกฝนตก5สภาพฝนตกเกิดข้อผิดพลาด3ครั้งจากทั้งหมด3ครั้งที่ทดสอบในสภาพนี้ครั้งที่268คิดเป็นร้อยละ100ซึ่งสูงกว่าสภาพกลางคืนผิดพลาด1จาก3ครั้งและปกติไม่ผิดพลาดเลย"], "m": {}, "st": {"SHOW": "แต่ละข้อด้านล่างแสดงคำตอบที่ถูกต้องพร้อมเหตุผลเชิงวิชาการ และอธิบายเหตุผลของตัวลวง (ตัวเลือกที่ไม่ถูกต้อง) แต่ละข้อ เพื่อให้ครูผู้สอนใช้ประกอบการอภิปรายหรือชี้แจงข้อสงสัยของนักเรียนได้", "APPLY": "• 4.1  —  ไม่มีคำตอบตายตัว เป็นค่าที่นักเรียนกำหนดเอง ให้คะแนนเต็มเมื่อค่าทั้ง 3 อยู่ในช่วงที่กำหนด: ความไว 0-100, ระยะห่าง 0.10-0.70 เมตร, เวลาหน่วง 0.2-3.0 วินาที\n      5\n• 4.2  —  ไม่มีคำตอบตายตัว ตรวจโดยนำค่าพารามิเตอร์ที่นักเรียนกำหนดในข้อ 4.1 ไปเปรียบเทียบกับข้อกำหนดของแต่ละสถานการณ์ในตารางที่ 1 ทีละสถานการณ์ ตามกติกา “ความไว ≥ ค่าที่กำหนด และ ระยะห่าง ≤ ค่าที่กำหนด และ เวลาหน่วง ≤ ค่าที่กำหนด ครบทั้ง 3 เงื่อนไข = ผ่าน” (ดูตัวอย่างการตรวจสอบในหน้าถัดไป) ให้ 1 คะแนนต่อสถานการณ์ที่นักเรียนกากบาทผลตรงกับผลจริง (รวม 8 คะแนน) และ 2 คะแนน เมื่อคำนวณร้อยละความแม่นยำถูกต้องตามตารางที่กรอกจริง\n      10\n• 4.3  —  อัตนัย — ดูรูบริคในส่วน ข\n      10\nตัวอย่างการตรวจสอบข้อ 4.2 (ใช้ค่าความไว = 85, ระยะห่าง = 0.25 ม., เวลาหน่วง = 0.8 วิ ซึ่งเป็นค่าต่ำสุดที่ผ่านครบทุกสถานการณ์)\n• สถานการณ์  —  ความไวขั้นต่ำ\n      ระยะห่างสูงสุด (ม.)  เวลาหน่วงสูงสุด (วิ)  ผล (ตัวอย่าง)\n• ถนนตรง กลางวัน  —  50\n      0.50  2.0  ผ่าน\n• ถนนตรง ฝนตก  —  65\n      0.40  1.5  ผ่าน\n• ทางโค้ง กลางวัน  —  60\n      0.35  1.2  ผ่าน\n• ทางโค้ง กลางคืน  —  75\n      0.30  1.0  ผ่าน\n• ทางโค้ง ฝนตก กลางคืน  —  85\n      0.25  0.8  ผ่าน\n• ถนนตรง กลางคืน  —  70\n      0.40  1.3  ผ่าน\n• ทางโค้ง ฝนตก กลางวัน  —  78\n      0.30  1.0  ผ่าน\n• ถนนตรง ฝนตก กลางคืน  —  80\n      0.30  0.9  ผ่าน\nความแม่นยำของตัวอย่างนี้ = 8 ÷ 8 × 100 = 100% หากนักเรียนเลือกค่าต่ำกว่านี้ในบางพารามิเตอร์ สถานการณ์ที่ “ทางโค้ง ฝนตก กลางคืน” (ข้อกำหนดสูงสุด) มักจะเป็นสถานการณ์แรกที่ไม่ผ่าน\nส่วน ข · รูบริคการให้คะแนนข้อคำถามแบบอัตนัย\n      แต่ละข้อประเมินอย่างน้อย 3 มิติ มิติละ 4 ระดับคะแนน (3 = ดีมาก, 2 = ดี, 1 = พอใช้, 0 = เริ่มต้น/ไม่ตอบ)\nรูบริค: ข้อ 1.2 — อธิบายเหตุใดค่าความไวเพียงค่าเดียวจึงอาจใช้ไม่ได้ผลดีในทุกสภาพอากาศ\n      คะแนนเต็ม 10 คะแนน · ประเมิน 3 มิติ · แต่ละมิติมี 4 ระดับ\nมิติที่ 1: ความถูกต้องของแนวคิดเชิงเหตุผล  (คะแนนเต็ม 4)\n• ระดับ / คะแนน  —  คำอธิบายเกณฑ์การให้คะแนน\n• ระดับ 4 (ดีมาก)  —  อธิบายได้ถูกต้องและครบถ้วนว่าค่าความไวที่เหมาะสมของแต่ละสภาพถนนมีช่วงต่างกัน และบางครั้งอาจไม่ทับซ้อนกันเลย ทำให้ไม่มีค่าเดียวที่ตอบโจทย์ทุกสภาพได้เสมอไป\n• ระดับ 3 (ดี)  —  อธิบายถูกทิศทาง (กล่าวถึงความแตกต่างระหว่างสภาพ) แต่ไม่ครบถ้วนสมบูรณ์ เช่น ไม่ได้กล่าวถึงกรณีช่วงไม่ทับซ้อนกัน\n• ระดับ 2 (พอใช้)  —  กล่าวถึงว่าค่าความไวส่งผลต่อสภาพถนนต่าง ๆ แต่ไม่ได้อธิบายกลไกหรือเหตุผลเชิงเปรียบเทียบที่ชัดเจน\n• ระดับ 1-0 (เริ่มต้น/ไม่ตอบ)  —  ตอบไม่ตรงประเด็น เข้าใจผิดหลักการทำงานของระบบ หรือไม่ตอบ\nมิติที่ 2: การใช้หลักฐานจากข้อมูล  (คะแนนเต็ม 3)\n• ระดับ / คะแนน  —  คำอธิบายเกณฑ์การให้คะแนน\n• ระดับ 3 (ดีมาก)  —  อ้างอิงตัวเลข/ช่วงค่าจากตารางผลการทดลองได้ถูกต้อง อย่างน้อย 2 สภาพขึ้นไป เพื่อสนับสนุนคำอธิบาย\n• ระดับ 2 (ดี)  —  อ้างอิงตัวเลขจากตารางได้ถูกต้อง 1 สภาพ หรืออ้างอิงตัวเลขคลาดเคลื่อนเล็กน้อย\n• ระดับ 1 (พอใช้)  —  กล่าวถึงตารางหรือผลการทดลองลอย ๆ โดยไม่ได้ระบุตัวเลขที่ชัดเจน\n• ระดับ 0 (เริ่มต้น)  —  ไม่มีการอ้างอิงข้อมูลจากตารางเลย\nมิติที่ 3: ความชัดเจนและความสมบูรณ์ของการสื่อสาร  (คะแนนเต็ม 3)\n• ระดับ / คะแนน  —  คำอธิบายเกณฑ์การให้คะแนน\n• ระดับ 3 (ดีมาก)  —  เรียบเรียงชัดเจน อ่านเข้าใจง่าย ครบตามความยาวที่กำหนด (อย่างน้อย 3-4 บรรทัด) ลำดับความคิดเป็นเหตุเป็นผล\n• ระดับ 2 (ดี)  —  สื่อสารเข้าใจได้ แต่สั้นกว่าที่กำหนดเล็กน้อยหรือลำดับความคิดวกวนบ้าง\n• ระดับ 1 (พอใช้)  —  สื่อสารไม่ชัดเจน สั้นเกินไป (น้อยกว่า 2 บรรทัด) หรือใช้ภาษากำกวม\n• ระดับ 0 (เริ่มต้น/ไม่ตอบ)  —  ไม่ตอบ หรือเขียนข้อความที่ไม่เกี่ยวข้องกับคำถาม\nรูบริค: ข้อ 3.4 — สภาพถนนที่ระบบมีความผิดพลาดมากที่สุด พร้อมเหตุผล\n      คะแนนเต็ม 5 คะแนน · ประเมิน 1 มิติ · แต่ละมิติมี 4 ระดับ\nมิติเดียว: ความถูกต้องของคำตอบและคุณภาพของเหตุผลเชิงตัวเลข  (คะแนนเต็ม 5)\n• ระดับ / คะแนน  —  คำอธิบายเกณฑ์การให้คะแนน\n• ระดับ 3 (5 คะแนน)  —  ระบุ “ฝนตก” ถูกต้อง พร้อมคำนวณสัดส่วนถูกต้อง (ผิดพลาด 3 จาก 3 ครั้ง คิดเป็นร้อยละ 100) และอธิบายเหตุผลเชื่อมโยงกับข้อมูลในตารางอย่างชัดเจน\n• ระดับ 2 (3-4 คะแนน)  —  ระบุ “ฝนตก” ถูกต้อง มีตัวเลขประกอบ แต่คำนวณสัดส่วนคลาดเคลื่อนหรืออธิบายไม่ครบถ้วน\n• ระดับ 1 (1-2 คะแนน)  —  ระบุ “ฝนตก” ถูกต้อง แต่ไม่มีตัวเลขหรือเหตุผลประกอบเลย\n• ระดับ 0 (0 คะแนน)  —  ระบุสภาพถนนผิด (ปกติ หรือ กลางคืน) หรือไม่ตอบ\nรูบริค: ข้อ 4.3 — วิเคราะห์ข้อแลกเปลี่ยน (Trade-off) และเสนอค่าพารามิเตอร์ที่เหมาะสม\n      คะแนนเต็ม 10 คะแนน · ประเมิน 3 มิติ · แต่ละมิติมี 4 ระดับ\nมิติที่ 1: ความเข้าใจแนวคิดข้อแลกเปลี่ยน (Trade-off)  (คะแนนเต็ม 4)\n• ระดับ / คะแนน  —  คำอธิบายเกณฑ์การให้คะแนน\n• ระดับ 4 (ดีมาก)  —  อธิบายได้ถูกต้องชัดเจนว่าการตั้งค่าให้ไวเกินความจำเป็นจะเพิ่มการแจ้งเตือนที่ไม่จำเป็น (ผลบวกลวง) โดยไม่ได้เพิ่มความแม่นยำในการตรวจจับที่แท้จริง เพราะสถานการณ์ที่ยากที่สุดกำหนดค่าต่ำสุดที่ต้องใช้ไว้แล้ว\n• ระดับ 3 (ดี)  —  อธิบายถูกทิศทาง (กล่าวถึงการแจ้งเตือนที่มากขึ้นเมื่อความไวสูงขึ้น) แต่ไม่ได้เชื่อมโยงครบกับเหตุผลว่าเหตุใดจึงไม่จำเป็น\n• ระดับ 2 (พอใช้)  —  กล่าวถึงคำว่า trade-off หรือข้อแลกเปลี่ยนอย่างผิวเผิน โดยไม่อธิบายกลไก\n• ระดับ 1-0 (เริ่มต้น/ไม่ตอบ)  —  ไม่เข้าใจแนวคิด หรือไม่ตอบคำถามนี้\nมิติที่ 2: การใช้หลักฐานจากตารางผลการทดลอง  (คะแนนเต็ม 3)\n• ระดับ / คะแนน  —  คำอธิบายเกณฑ์การให้คะแนน\n• ระดับ 3 (ดีมาก)  —  เปรียบเทียบตัวเลขระหว่างชุดการทดลองในตารางที่ 2 ได้อย่างถูกต้องและมีความหมาย (เช่น ชุดที่ 4 และชุดที่ 5 ได้ความแม่นยำ 100% เท่ากัน แต่ชุดที่ 5 มีการแจ้งเตือนที่ไม่จำเป็นสูงกว่า)\n• ระดับ 2 (ดี)  —  อ้างอิงตัวเลขจากตารางที่ 2 หรือผลการตรวจสอบของตนเองบางส่วน แต่ไม่ได้เปรียบเทียบอย่างสมบูรณ์\n• ระดับ 1 (พอใช้)  —  กล่าวถึงตารางหรือผลการทดลองลอย ๆ โดยไม่ระบุตัวเลข\n• ระดับ 0 (เริ่มต้น)  —  ไม่มีการอ้างอิงข้อมูลใดประกอบการวิเคราะห์\nมิติที่ 3: ข้อเสนอค่าพารามิเตอร์และความสมเหตุสมผลของเหตุผล  (คะแนนเต็ม 3)\n• ระดับ / คะแนน  —  คำอธิบายเกณฑ์การให้คะแนน\n• ระดับ 3 (ดีมาก)  —  เสนอค่าพารามิเตอร์ที่ผ่านครบทุกสถานการณ์แบบพอดี ไม่สูงเกินความจำเป็น (ใกล้เคียงความไว ≈ 85, ระยะห่าง ≈ 0.25 ม., เวลาหน่วง ≈ 0.8 วิ) พร้อมให้เหตุผลว่าเป็นค่าต่ำสุดที่เพียงพอ\n• ระดับ 2 (ดี)  —  เสนอค่าที่ผ่านครบทุกสถานการณ์ แต่สูงเกินความจำเป็นอย่างชัดเจน หรือให้เหตุผลไม่ครบถ้วน\n• ระดับ 1 (พอใช้)  —  เสนอค่าที่ไม่ผ่านครบทุกสถานการณ์ หรือเหตุผลไม่สอดคล้องกับค่าที่เสนอ\n• ระดับ 0 (เริ่มต้น/ไม่ตอบ)  —  ไม่เสนอค่าพารามิเตอร์ หรือไม่ตอบคำถามนี้\n— จบคู่มือครู —"}, "rb": "เฉลยข้อสอบแบบเลือกตอบ และรูบริคการให้คะแนนข้ออัตนัย\nหน่วยข้อสอบ: ระบบเตือนเมื่อรถออกนอกเลน (Lane Departure Warning)\nแบบทดสอบเทียบเคียง PISA 2025 การเรียนรู้ในโลกดิจิทัล (ฉบับกระดาษ) · คะแนนเต็ม 100 คะแนน\nเอกสารนี้ใช้คู่กับ “แบบทดสอบสำหรับผู้เข้าสอบ” แบ่งเป็น 2 ส่วน คือ ส่วน ก. เฉลยและเกณฑ์การให้คะแนนข้อคำถามแบบปิด (เลือกตอบ / เติมคำ / คำนวณ) และส่วน ข. รูบริคการให้คะแนนข้อคำถามแบบอัตนัยที่ต้องใช้เหตุผลประกอบ ซึ่งแต่ละข้อประเมิน อย่างน้อย 3 มิติ มิติละ 4 ระดับคะแนน\nส่วน ก · เฉลยข้อสอบแบบเลือกตอบและข้อคำถามแบบปิด\n• 1.2  —  อัตนัย — ดูรูบริคในส่วน ข\n      10  ประเมิน 3 มิติ: ความเข้าใจแนวคิด / การใช้หลักฐาน / ความชัดเจนของการสื่อสาร\n• 4.3  —  อัตนัย — ดูรูบริคในส่วน ข\n      10\nตัวอย่างการตรวจสอบข้อ 4.2 (ใช้ค่าความไว = 85, ระยะห่าง = 0.25 ม., เวลาหน่วง = 0.8 วิ ซึ่งเป็นค่าต่ำสุดที่ผ่านครบทุกสถานการณ์)\n• สถานการณ์  —  ความไวขั้นต่ำ\n      ระยะห่างสูงสุด (ม.)  เวลาหน่วงสูงสุด (วิ)  ผล (ตัวอย่าง)\n• ถนนตรง กลางวัน  —  50\n      0.50  2.0  ผ่าน\n• ถนนตรง ฝนตก  —  65\n      0.40  1.5  ผ่าน\n• ทางโค้ง กลางวัน  —  60\n      0.35  1.2  ผ่าน\n• ทางโค้ง กลางคืน  —  75\n      0.30  1.0  ผ่าน\n• ทางโค้ง ฝนตก กลางคืน  —  85\n      0.25  0.8  ผ่าน\n• ถนนตรง กลางคืน  —  70\n      0.40  1.3  ผ่าน\n• ทางโค้ง ฝนตก กลางวัน  —  78\n      0.30  1.0  ผ่าน\n• ถนนตรง ฝนตก กลางคืน  —  80\n      0.30  0.9  ผ่าน\nความแม่นยำของตัวอย่างนี้ = 8 ÷ 8 × 100 = 100% หากนักเรียนเลือกค่าต่ำกว่านี้ในบางพารามิเตอร์ สถานการณ์ที่ “ทางโค้ง ฝนตก กลางคืน” (ข้อกำหนดสูงสุด) มักจะเป็นสถานการณ์แรกที่ไม่ผ่าน\nส่วน ข · รูบริคการให้คะแนนข้อคำถามแบบอัตนัย\n      แต่ละข้อประเมินอย่างน้อย 3 มิติ มิติละ 4 ระดับคะแนน (3 = ดีมาก, 2 = ดี, 1 = พอใช้, 0 = เริ่มต้น/ไม่ตอบ)\nรูบริค: ข้อ 1.2 — อธิบายเหตุใดค่าความไวเพียงค่าเดียวจึงอาจใช้ไม่ได้ผลดีในทุกสภาพอากาศ\n      คะแนนเต็ม 10 คะแนน · ประเมิน 3 มิติ · แต่ละมิติมี 4 ระดับ\nมิติที่ 1: ความถูกต้องของแนวคิดเชิงเหตุผล  (คะแนนเต็ม 4)\n• ระดับ / คะแนน  —  คำอธิบายเกณฑ์การให้คะแนน\n• ระดับ 4 (ดีมาก)  —  อธิบายได้ถูกต้องและครบถ้วนว่าค่าความไวที่เหมาะสมของแต่ละสภาพถนนมีช่วงต่างกัน และบางครั้งอาจไม่ทับซ้อนกันเลย ทำให้ไม่มีค่าเดียวที่ตอบโจทย์ทุกสภาพได้เสมอไป\n• ระดับ 3 (ดี)  —  อธิบายถูกทิศทาง (กล่าวถึงความแตกต่างระหว่างสภาพ) แต่ไม่ครบถ้วนสมบูรณ์ เช่น ไม่ได้กล่าวถึงกรณีช่วงไม่ทับซ้อนกัน\n• ระดับ 2 (พอใช้)  —  กล่าวถึงว่าค่าความไวส่งผลต่อสภาพถนนต่าง ๆ แต่ไม่ได้อธิบายกลไกหรือเหตุผลเชิงเปรียบเทียบที่ชัดเจน\n• ระดับ 1-0 (เริ่มต้น/ไม่ตอบ)  —  ตอบไม่ตรงประเด็น เข้าใจผิดหลักการทำงานของระบบ หรือไม่ตอบ\nมิติที่ 2: การใช้หลักฐานจากข้อมูล  (คะแนนเต็ม 3)\n• ระดับ / คะแนน  —  คำอธิบายเกณฑ์การให้คะแนน\n• ระดับ 3 (ดีมาก)  —  อ้างอิงตัวเลข/ช่วงค่าจากตารางผลการทดลองได้ถูกต้อง อย่างน้อย 2 สภาพขึ้นไป เพื่อสนับสนุนคำอธิบาย\n• ระดับ 2 (ดี)  —  อ้างอิงตัวเลขจากตารางได้ถูกต้อง 1 สภาพ หรืออ้างอิงตัวเลขคลาดเคลื่อนเล็กน้อย\n• ระดับ 1 (พอใช้)  —  กล่าวถึงตารางหรือผลการทดลองลอย ๆ โดยไม่ได้ระบุตัวเลขที่ชัดเจน\n• ระดับ 0 (เริ่มต้น)  —  ไม่มีการอ้างอิงข้อมูลจากตารางเลย\nมิติที่ 3: ความชัดเจนและความสมบูรณ์ของการสื่อสาร  (คะแนนเต็ม 3)\n• ระดับ / คะแนน  —  คำอธิบายเกณฑ์การให้คะแนน\n• ระดับ 3 (ดีมาก)  —  เรียบเรียงชัดเจน อ่านเข้าใจง่าย ครบตามความยาวที่กำหนด (อย่างน้อย 3-4 บรรทัด) ลำดับความคิดเป็นเหตุเป็นผล\n• ระดับ 2 (ดี)  —  สื่อสารเข้าใจได้ แต่สั้นกว่าที่กำหนดเล็กน้อยหรือลำดับความคิดวกวนบ้าง\n• ระดับ 1 (พอใช้)  —  สื่อสารไม่ชัดเจน สั้นเกินไป (น้อยกว่า 2 บรรทัด) หรือใช้ภาษากำกวม\n• ระดับ 0 (เริ่มต้น/ไม่ตอบ)  —  ไม่ตอบ หรือเขียนข้อความที่ไม่เกี่ยวข้องกับคำถาม\nรูบริค: ข้อ 3.4 — สภาพถนนที่ระบบมีความผิดพลาดมากที่สุด พร้อมเหตุผล\n      คะแนนเต็ม 5 คะแนน · ประเมิน 1 มิติ · แต่ละมิติมี 4 ระดับ\nมิติเดียว: ความถูกต้องของคำตอบและคุณภาพของเหตุผลเชิงตัวเลข  (คะแน านครบทุกสถานการณ์แบบพอดี ไม่สูงเกินความจำเป็น (ใกล้เคียงความไว ≈ 85, ระยะห่าง ≈ 0.25 ม., เวลาหน่วง ≈ 0.8 วิ) พร้อมให้เหตุผลว่าเป็นค่าต่ำสุดที่เพียงพอ\n• ระดับ 2 (ดี)  —  เสนอค่าที่ผ่านครบทุกสถานการณ์ แต่สูงเกินความจำเป็นอย่างชัดเจน หรือให้เหตุผลไม่ครบถ้วน\n• ระดับ 1 (พอใช้)  —  เสนอค่าที่ไม่ผ่านครบทุกสถานการณ์ หรือเหตุผลไม่สอดคล้องกับค่าที่เสนอ\n• ระดับ 0 (เริ่มต้น/ไม่ตอบ)  —  ไม่เสนอค่าพารามิเตอร์ หรือไม่ตอบคำถามนี้\n— จบคู่มือครู —"};

      for (var j = 0; j < DOCKEY.q.length; j++) {
        if (DOCKEY.q[j] && as.length > 10 && DOCKEY.q[j].indexOf(as.slice(0, 26)) > -1 &&
            (!row.stage || !DOCKEY.i[j].s || DOCKEY.i[j].s === row.stage)) return DOCKEY.i[j];
      }
    }
    return null;
  }
  function docBlockFor(row) {
    if (!DOCKEY || !DOCKEY.i) return "";
    /* 1) ข้อที่จับคู่กับคลังข้อสอบได้ - ใช้การจับคู่ที่ตรวจทานไว้แล้ว */
    if (row.bankKey && DOCKEY.m && DOCKEY.m[row.bankKey] !== undefined) {
      var b = DOCKEY.i[DOCKEY.m[row.bankKey]];
      if (b) return b.t;
    }
    /* 2) ค้นจากข้อความโจทย์หรือคำตอบที่ผู้เข้าสอบเลือก */
    var qs = squash(row.q), as = squash(row.answer);
    if (DOCKEY.q) {
      for (var i = 0; i < DOCKEY.q.length; i++) {
        var hay = DOCKEY.q[i];
        if (!hay) continue;
        if (qs.length > 18 && hay.indexOf(qs.slice(0, 36)) > -1) return DOCKEY.i[i].t;
      }
      for (var j = 0; j < DOCKEY.q.length; j++) {
        var hay2 = DOCKEY.q[j];
        if (!hay2) continue;
        if (as.length > 10 && hay2.indexOf(as.slice(0, 26)) > -1 &&
            (!row.stage || !DOCKEY.i[j].s || DOCKEY.i[j].s === row.stage)) return DOCKEY.i[j].t;
      }
    }
    /* 3) เกณฑ์ระดับขั้นตอน แล้วจึงรูบริคอัตนัยส่วนท้ายเอกสาร */
    if (DOCKEY.st && row.stage && DOCKEY.st[row.stage]) return DOCKEY.st[row.stage];
    if (row.kind === "text" && DOCKEY.rb) return DOCKEY.rb;
    return "";
  }
  function stageDocText(stage) {
    if (!DOCKEY) return "";
    if (DOCKEY.st && DOCKEY.st[stage]) return DOCKEY.st[stage];
    var out = [];
    if (DOCKEY.i) {
      for (var i = 0; i < DOCKEY.i.length; i++) {
        if (DOCKEY.i[i].s === stage) out.push(DOCKEY.i[i].t);
      }
    }
    return out.join("\n\n");
  }

  /* ---------- ดึงคำตอบจาก state ของแบบทดสอบ (เรียงลำดับ / เติมคำ / ผลการทดสอบ APPLY) ---------- */
  function hostState() {
    var names = ["state", "S", "appState", "APP"];
    for (var i = 0; i < names.length; i++) {
      var o = probe(names[i]);
      if (o && typeof o === "object") return o;
    }
    return null;
  }
  function fmtVal(v) {
    if (v === null || v === undefined || v === "") return "—";
    if (typeof v === "boolean") return v ? "ใช่" : "ไม่ใช่";
    if (typeof v === "number") return String(Math.round(v * 100) / 100);
    if (typeof v === "string") return v;
    if (Array.isArray(v)) return v.map(fmtVal).join(", ");
    if (typeof v === "object") {
      return Object.keys(v).filter(function (k) {
        return typeof v[k] !== "function" && (Array.isArray(v[k]) || typeof v[k] !== "object");
      }).map(function (k) { return k + " = " + fmtVal(v[k]); }).join(", ");
    }
    return String(v);
  }
  function asNum(v) {
    return (typeof v === "number" && isFinite(v)) ? Math.round(v) : null;
  }
  function adapterRows() {
    var st = hostState();
    if (!st || typeof ADAPTER !== "function") return [];
    var out = [];
    var ctx = {
      S: st,
      c: function (n) { return probe(n); },
      fmt: fmtVal,
      num: asNum,
      push: function (r) {
        if (!r || (!r.answer && r.score == null)) return;
        r.kind = r.kind || "state";
        r.stage = r.stage || "LEARN";
        r.fromState = true;
        out.push(r);
      }
    };
    try { ADAPTER(ctx); } catch (e) {}
    return out;
  }
  function allRows() {
    var extra = adapterRows();
    if (!extra.length) return rows;
    /* ไม่ให้ซ้ำกับแถวที่เก็บจากการคลิก/พิมพ์ */
    var seen = {};
    rows.forEach(function (r) { seen[squash(r.q).slice(0, 40)] = 1; });
    var merged = rows.slice();
    extra.forEach(function (r) {
      var k = squash(r.q).slice(0, 40);
      if (!seen[k]) { seen[k] = 1; merged.push(r); }
    });
    return merged;
  }

  /* ---------- the running transcript ---------- */
  /* rows: {stage, kind:'choice'|'text', q, answer, correctText, verdict, explain, key, ts} */
  var rows = [];
  var rowByKey = {};

  function upsert(row) {
    if (rowByKey[row.key]) {
      var old = rowByKey[row.key];
      for (var k in row) if (row[k] !== undefined && row[k] !== "") old[k] = row[k];
      old.ts = row.ts;
    } else {
      rowByKey[row.key] = row;
      rows.push(row);
    }
  }

  /* ปุ่มนำทาง/ปุ่มระบบ - ไม่ใช่คำตอบ (ตรวจแบบ "มีคำนี้อยู่" กับข้อความสั้น ๆ
     เพื่อให้ครอบคลุมคำอย่าง "ข้อถัดไป" หรือ "▶ ถัดไป" ด้วย) */
  var NAV_WORDS = /(ถัดไป|ต่อไป|ย้อนกลับ|ก่อนหน้า|เริ่ม|บันทึก|ส่งผล|ส่งคำตอบ|ตรวจคำตอบ|ตรวจสอบ|รีเซ็ต|เคลียร์|ล้าง|ปิด|ตกลง|ยืนยัน|ดาวน์โหลด|พิมพ์|ทำอีกครั้ง|กลับสู่หน้าหลัก|เข้าสู่ระบบ|ดูเฉลย|แนวคำตอบ|รัน|run|reset|next|back|start|close|submit|ย้อนดูประวัติ|ออกจากโหมด)/i;
  function isNav(t) { return t.length <= 30 && NAV_WORDS.test(t); }

  function nearestQuestionText(el) {
    var node = el, hops = 0;
    while (node && hops < 6) {
      node = node.parentElement; hops++;
      if (!node) break;
      var head = node.querySelector("h1,h2,h3,h4,h5,.q,.question,.prompt,.qtext,.stem,legend,strong,b");
      if (head) {
        var t = norm(head.textContent);
        if (t.length > 8 && t.length < 400) return t;
      }
    }
    return "";
  }

  function recordChoice(el) {
    var txt = norm(el.textContent);
    if (!txt || txt.length > 320) return;
    if (isNav(txt)) return;

    var stage = stageOf();
    if (!stage || stage === "REPORT") return;

    var hit = optionIndex[squash(txt)];
    var row;
    if (hit) {
      var it = hit.item;
      var cTxt = correctTextOf(it);
      var verdict = "";
      if (typeof it.correct === "number") verdict = (hit.optIdx === it.correct) ? "ถูก" : "ผิด";
      row = {
        key: "bank:" + it.bank + ":" + it.idx,
        bankKey: it.bank + ":" + it.idx,
        stage: it.stage || stage, kind: "choice",
        q: it.q || nearestQuestionText(el) || "(ไม่ระบุโจทย์)",
        answer: txt, correctText: cTxt, verdict: verdict,
        explain: it.explain || "", ts: Date.now()
      };
    } else {
      /* ไม่ตรงกับคลังข้อสอบ: รับเฉพาะการคลิกที่เป็น "ตัวเลือกคำตอบ" จริง ๆ
         เพื่อไม่ให้แถบความคืบหน้า/ชิป/ป้ายกำกับ กลายเป็นแถวขยะในตาราง */
      var tag = (el.tagName || "").toLowerCase();
      var cls = (typeof el.className === "string") ? el.className : "";
      var interactive = /^(button|label|li|a|option)$/.test(tag) ||
                        el.getAttribute("role") === "button" ||
                        /(opt|choice|ans|btn)/i.test(cls);
      if (!interactive) return;
      /* ตัวเลขโดด ๆ มักเป็นหมายเลขขั้นตอน/ชิปความคืบหน้า ยกเว้นมาตรวัด REFLECT */
      if (txt.length < 2 && stage !== "REFLECT") return;
      var q = nearestQuestionText(el);
      if (!q || q.length < 20) return;    /* ไม่ใช่ตัวเลือกคำตอบ - ข้าม */
      row = {
        key: "dom:" + stage + ":" + squash(q).slice(0, 60),
        stage: stage, kind: "choice", q: q,
        answer: txt, correctText: "", verdict: "", explain: "", ts: Date.now()
      };
    }
    upsert(row);
    captureFeedback(el, row);
  }

  /* เก็บข้อความเฉลย/ผลตรวจที่ตัวแบบทดสอบแสดงเองหลังเลือกคำตอบ */
  function captureFeedback(el, row) {
    setTimeout(function () {
      try {
        var box = el.closest ? el.closest("div,li,section,form") : null;
        for (var hop = 0; box && hop < 4; hop++) {
          var t = norm(box.textContent);
          var m = t.match(/(ถูกต้อง|ไม่ถูกต้อง|ยังไม่ถูก|คำอธิบาย|เฉลย|แนวคำตอบ)[\s:：]*([^]{0,300})/);
          if (m) {
            if (!row.verdict && /^(ถูกต้อง)/.test(m[1])) row.verdict = "ถูก";
            if (!row.verdict && /^(ไม่ถูกต้อง|ยังไม่ถูก)/.test(m[1])) row.verdict = "ผิด";
            if (!row.explain) row.explain = clip(m[0], 320);
            return;
          }
          box = box.parentElement;
        }
      } catch (e) {}
    }, 260);
  }

  function labelForField(el) {
    /* หาคำถามที่ใกล้ช่องกรอกที่สุดก่อน แล้วค่อยไล่ออกไปกว้างขึ้น */
    if (el.id) {
      var lab = document.querySelector('label[for="' + el.id + '"]');
      if (lab) { var t = norm(lab.textContent); if (t) return t; }
    }
    var aria = el.getAttribute && (el.getAttribute("aria-label") || el.getAttribute("title"));
    if (aria && norm(aria)) return norm(aria);
    var wrapLab = el.closest && el.closest("label");
    if (wrapLab) {
      var wt = norm(wrapLab.textContent);
      if (wt.length > 3) return clip(wt, 220);
    }
    var prev = el.previousElementSibling;
    for (var i = 0; prev && i < 3; i++) {
      var pt = norm(prev.textContent);
      if (pt.length > 6) return clip(pt, 220);
      prev = prev.previousElementSibling;
    }
    var par = el.parentElement;
    if (par) {
      var clone = par.cloneNode(true);
      var kill = clone.querySelectorAll("input,textarea,select,button");
      for (var k = 0; k < kill.length; k++) kill[k].remove();
      var ptxt = norm(clone.textContent);
      if (ptxt.length > 6) return clip(ptxt, 220);
    }
    var ph = el.getAttribute && el.getAttribute("placeholder");
    var near = nearestQuestionText(el);
    return near || (ph ? norm(ph) : "") || "คำตอบเขียนบรรยาย";
  }

  var GATE_IDS = { inName: 1, inputName: 1, nameInput: 1, gateName: 1, "inp-name": 1, inpName: 1 };
  function recordText(el) {
    if (!el || GATE_IDS[el.id]) return;
    var val = norm(el.value);
    if (!val) return;
    var stage = stageOf();
    if (!stage || stage === "REPORT") return;
    var key = "txt:" + (el.id || el.name || labelForField(el)).slice(0, 60);
    upsert({
      key: key, stage: stage, kind: "text",
      q: labelForField(el), answer: el.value, correctText: "",
      verdict: "", explain: "", ts: Date.now()
    });
  }

  document.addEventListener("click", function (ev) {
    try {
      var el = ev.target;
      if (!el || !el.closest) return;
      if (el.closest("#pisaReviewPanel,#pisaHistoryOverlay")) return;
      var clickable = el.closest("button,label,li,a,[role='button'],[class*='opt'],[class*='choice'],[class*='ans'],[class*='card']") || el;
      recordChoice(clickable);
    } catch (e) {}
  }, true);

  document.addEventListener("change", function (ev) {
    try {
      var el = ev.target;
      if (!el) return;
      if (el.closest && el.closest("#pisaReviewPanel,#pisaHistoryOverlay")) return;
      var tag = (el.tagName || "").toLowerCase();
      if (tag === "textarea" || (tag === "input" && /^(text|number|range)$/.test(el.type || "text"))) recordText(el);
      if (tag === "select" && el.id !== "inGrade" && el.getAttribute("data-pisa-grade") !== "1") {
        var opt = el.options[el.selectedIndex];
        if (opt) recordChoice(opt);
      }
    } catch (e) {}
  }, true);
  document.addEventListener("blur", function (ev) {
    try {
      var el = ev.target, tag = (el && el.tagName || "").toLowerCase();
      /* เฉพาะช่องพิมพ์ข้อความเท่านั้น - ปุ่มตัวเลือก radio/checkbox ถูกเก็บจากการคลิกอยู่แล้ว */
      if (tag === "textarea" || (tag === "input" && /^(text|search|email)$/.test(el.type || "text"))) recordText(el);
    } catch (e) {}
  }, true);

  /* ---------- attempts storage ---------- */
  function readAttempts() {
    try { return JSON.parse(localStorage.getItem(ATTEMPTS_KEY) || "{}"); } catch (e) { return {}; }
  }
  function saveAttempt(payload, scores) {
    try {
      var all = readAttempts();
      var lk = learnerKey();
      if (!all[lk]) all[lk] = {};
      if (!all[lk][SCENARIO_ID]) all[lk][SCENARIO_ID] = [];
      all[lk][SCENARIO_ID].push({
        title: SCENARIO_TITLE, name: LNAME, grade: LGRADE,
        finishedAt: new Date().toISOString(),
        scores: scores || {},
        rows: allRows().map(function (r) {
          return { stage: r.stage, kind: r.kind, bankKey: r.bankKey || "", score: (r.score == null ? null : r.score), q: clip(r.q, 300),
                   answer: clip(r.answer, 1200), correctText: clip(r.correctText, 300),
                   verdict: r.verdict, explain: clip(r.explain, 600) };
        })
      });
      while (all[lk][SCENARIO_ID].length > MAX_ATTEMPTS_PER_SCENARIO) all[lk][SCENARIO_ID].shift();
      localStorage.setItem(ATTEMPTS_KEY, JSON.stringify(all));
    } catch (e) {}
  }
  function attemptsForLearner() {
    var all = readAttempts();
    return (all[learnerKey()] && all[learnerKey()][SCENARIO_ID]) || [];
  }

  /* ---------- scores out of the payload the app posts ---------- */
  function num(v) { return (typeof v === "number" && isFinite(v)) ? Math.round(v) : null; }
  function pctFromText(t) {
    if (typeof t !== "string") return null;
    var m = t.match(/(?:รวม|เฉลี่ย)\s*([\d.]+)\s*%/) || t.match(/([\d.]+)\s*%/);
    return m ? Math.round(parseFloat(m[1])) : null;
  }
  function fromTotal(p, label) {
    if (typeof p.totalReport !== "string") return null;
    var m = p.totalReport.match(new RegExp(label + "\\s*([\\d.]+)"));
    return m ? Math.round(parseFloat(m[1])) : null;
  }
  function sect(p, keys, textKey, label) {
    for (var i = 0; i < keys.length; i++) { var v = num(p[keys[i]]); if (v !== null) return v; }
    var ft = fromTotal(p, label); if (ft !== null) return ft;
    return pctFromText(p[textKey]);
  }
  function scoresOf(p) {
    return {
      show: sect(p, ["show", "show_score"], "showReport", "SHOW"),
      learn: sect(p, ["learn", "learn_score"], "learnReport", "LEARN"),
      apply: sect(p, ["apply", "apply_score"], "applyReport", "APPLY"),
      reflect: sect(p, ["reflect", "reflect_score"], "reflectReport", "REFLECT"),
      overall: (function () {
        var v = num(p.overall); if (v !== null) return v;
        v = num(p.overall_score); if (v !== null) return v;
        var t = [p.overallReport, p.totalReport, p.qualityReport].filter(Boolean).join(" ");
        var m = t.match(/([\d.]+)\s*%/) || t.match(/([\d.]+)\s*\/\s*100/);
        return m ? Math.round(parseFloat(m[1])) : null;
      })(),
      levelName: p.levelName || p.levelLabel || p.quality_label || p.qualityLevel || p.qualityReport || ""
    };
  }

    "#pisaDetailOverlay .pd-bar h3{margin:0;font-size:15.5px;}",
    "#pisaDetailOverlay .pd-bar .pd-sub{font-size:11.5px;opacity:.82;margin-top:2px;}",

    "#pisaDetailOverlay .pd-btn.ghost{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.38);}",
