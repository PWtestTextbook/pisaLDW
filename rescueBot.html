  var DOCKEY = {"i": [{"s": "REFLECT", "n": 3, "t": "LEARN: ข้อ 3.2, 4.2, 6.2 (ข้อละ 3 คะแนน) · APPLY: ข้อ 1.3, 2.3, 3.3, 4.3, 5.3 (เฉพาะส่วนเหตุผล ข้อละ 2 คะแนน) · REFLECT: ข้อ 4.5, 4.6 ใช้กรอบส่วน C\nข้อคำนวณ/ตอบสั้น (LEARN 1.2, 2.2, 5.2) และข้อเติมช่อง ตรวจตามเฉลยและเกณฑ์ในส่วน A โดยไม่ต้องใช้รูบริค"}, {"s": "SHOW", "n": 1, "t": "ข้อ 1 ค. ลำดับคำสั่ง (sequence) (2 คะแนน)\nโจทย์: เมื่อสั่งงาน RESCUE-BOT ด้วยคำสั่ง moveForward(); turnRight(); moveForward(); เรียงต่อกันแบบนี้ เรียกว่าโครงสร้างแบบใด\n• ก. เงื่อนไข (conditional)  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      ไม่มี if หรือการตรวจสอบสถานการณ์ใด ๆ ทุกคำสั่งทำงานโดยไม่มีการเลือก\n• ข. กระบวนงานย่อย (procedure)  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      Procedure ต้องมีการตั้งชื่อชุดคำสั่งย่อยแล้วเรียกใช้ (เช่น checkStructure()) แต่ที่นี่เป็นคำสั่งพื้นฐานเรียงกัน ไม่ได้นิยามกระบวนงานใหม่\n• ค. ลำดับคำสั่ง (sequence)  —  ✓ ถูกต้อง\n      Sequence คือการเรียงคำสั่งให้ทำทีละคำสั่งจากบนลงล่าง ลำดับที่ต่างกันให้ผลต่างกัน (เดินหน้า → เลี้ยว → เดินหน้า)\n• ง. การวนซ้ำ (loop)  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      Loop ต้องมีคำสั่งเดิมถูกทำซ้ำหลายรอบ (เช่น repeat) แต่ชุดนี้แต่ละบรรทัดต่างกันและทำเพียงครั้งเดียวตามลำดับ"}, {"s": "SHOW", "n": 2, "t": "ข้อ 2 ก. เดินหน้าซ้ำกัน 4 ครั้งติดต่อกัน (2 คะแนน)\nโจทย์: คำสั่ง repeat(4){ moveForward(); } มีความหมายตรงกับข้อใดมากที่สุด\n• ก. เดินหน้าซ้ำกัน 4 ครั้งติดต่อกัน  —  ✓ ถูกต้อง\n      repeat(N){ } คือทำคำสั่งในวงเล็บปีกกาซ้ำ N รอบ จึงเรียก moveForward() 4 ครั้งต่อเนื่อง หุ่นยนต์เดินหน้า 4 ช่อง\n• ข. สร้างกระบวนงานใหม่ชื่อว่า 4  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      การสร้างกระบวนงานย่อยต้องนิยามชื่อ (define) ส่วน repeat(4){ } เป็นการใช้ลูป ไม่ใช่การตั้งชื่อกระบวนงาน\n• ค. เดินหน้า 1 ครั้ง แล้วหยุดรอ 4 วินาที  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      ตีความเลข 4 เป็นเวลา (วินาที) ทั้งที่ repeat(N) ระบุ \"จำนวนรอบ\" และในชุดคำสั่งไม่มีคำสั่งหยุดรอ\n• ง. เดินหน้าเฉพาะเมื่อพบสิ่งกีดขวาง 4 ช่อง  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      สับสนกับ if — repeat ไม่มีเงื่อนไขตรวจสิ่งกีดขวาง ทำซ้ำตามจำนวนรอบที่ระบุเสมอ"}, {"s": "SHOW", "n": 3, "t": "ข้อ 3 ง. ทิศทางที่หุ่นยนต์กำลังหันอยู่ในขณะนั้น (2 คะแนน)\nโจทย์: ในแผนที่กริดของพื้นที่ภัยพิบัติ หากหุ่นยนต์อยู่ที่ช่อง (แถว 2, คอลัมน์ 3) แล้วเดินหน้าไปอีก 1 ช่องในทิศที่หันอยู่ ตำแหน่งใหม่ขึ้นอยู่กับสิ่งใดเป็นหลัก\n• ก. สีของช่องเดิม  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      สีของช่องเป็นเพียงลักษณะการแสดงผลบนแผนที่ ไม่มีผลต่อพิกัดใหม่\n• ข. ชื่อของผู้เขียนโปรแกรม  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      ชื่อผู้เขียนโปรแกรมไม่มีส่วนเกี่ยวข้องกับการคำนวณตำแหน่ง\n• ค. จำนวนผู้ประสบภัยทั้งหมด  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      จำนวนผู้ประสบภัยไม่ได้กำหนดการเคลื่อนที่ในแต่ละก้าว\n• ง. ทิศทางที่หุ่นยนต์กำลังหันอยู่ในขณะนั้น  —  ✓ ถูกต้อง\n      moveForward() เคลื่อนที่ตามทิศที่หันหน้า เช่น หันตะวันออก → คอลัมน์ +1, หันใต้ → แถว +1 ตำแหน่งใหม่ = ตำแหน่งเดิม + เวกเตอร์ของทิศนั้น"}, {"s": "SHOW", "n": 4, "t": "ข้อ 4 ข. ตรวจสอบสถานการณ์ก่อน แล้วเลือกทำคำสั่งเฉพาะเมื่อเงื่อนไขเป็นจริง (2 คะแนน)\nโจทย์: คำสั่งเงื่อนไข if (fireDetected()) { turnLeft(); } ใช้ทำอะไร\n• ก. ทำให้หุ่นยนต์เลี้ยวซ้ายเสมอทุกครั้งที่เดิน  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      ขัดกับความหมายของ if — เลี้ยวซ้ายเฉพาะเมื่อ fireDetected() เป็นจริงเท่านั้น ไม่ใช่ทุกครั้ง\n• ข. ตรวจสอบสถานการณ์ก่อน แล้วเลือกทำคำสั่งเฉพาะเมื่อเงื่อนไขเป็นจริง  —  ✓ ถูกต้อง\n      if คือการตัดสินใจ: ตรวจเงื่อนไขก่อน แล้วจึงทำหรือไม่ทำคำสั่งในวงเล็บปีกกา ทำให้หุ่นยนต์ตอบสนองต่อสถานการณ์จริงได้\n• ค. ปิดการทำงานของหุ่นยนต์ทันที  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      ไม่มีคำสั่งปิดระบบในโค้ดนี้ ผลลัพธ์คือ turnLeft() เท่านั้น\n• ง. บันทึกข้อมูลไฟไหม้ลงฐานข้อมูล  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      ไม่มีคำสั่งบันทึกข้อมูลใด ๆ ในโค้ดนี้ เป็นการเพิ่มสิ่งที่โค้ดไม่ได้ทำ"}, {"s": "SHOW", "n": 5, "t": "ข้อ 5 ก. เพราะปัจจัยเดียวมักไม่เพียงพอต่อการสะท้อนความเสี่ยงจริงที่เกิดจากหลายสาเหตุร่วมกัน (2 คะแนน)\nโจทย์: ทำไมระบบประเมินความเสี่ยงภารกิจกู้ภัยจึงมักใช้ \"คะแนนความเสี่ยงรวม\" จากหลายปัจจัย แทนที่จะตัดสินจากปัจจัยเดียว\n• ก. เพราะปัจจัยเดียวมักไม่เพียงพอต่อการสะท้อนความเสี่ยงจริงที่เกิดจากหลายสาเหตุร่วมกัน  —  ✓ ถูกต้อง\n      ความเสี่ยงจริงเกิดจากหลายสาเหตุร่วมกัน (พลังงาน ไฟ โครงสร้าง ฯลฯ) ปัจจัยเดียวอาจซ่อนอันตรายที่มาจากปัจจัยอื่น การถ่วงน้ำหนักรวมจึงสะท้อนความเสี่ยงได้ครบกว่า\n• ข. เพราะคำนวณง่ายกว่าการใช้ปัจจัยเดียว  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      ตรงข้าม การรวมหลายปัจจัยซับซ้อนกว่า ไม่ได้เลือกเพราะความง่าย\n• ค. เพราะหุ่นยนต์คำนวณเลขจำนวนเดียวไม่ได้  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      หุ่นยนต์คำนวณค่าเดียวได้ปกติ — และระบบนี้ก็สรุปเป็นคะแนนเดียว 0–100 อยู่แล้ว\n• ง. เพราะกฎหมายบังคับให้ใช้อย่างน้อย 5 ปัจจัยเท่านั้น  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      ไม่มีกฎหมายกำหนดจำนวนปัจจัย เป็นการออกแบบเชิงวิศวกรรมเพื่อความแม่นยำ"}, {"s": "LEARN", "n": 1, "t": "ภาระงานที่ 1 เส้นทางและพลังงานที่ใช้ (4 คะแนน)\n1.1 ง. 108% (2 คะแนน)\nโจทย์: จากตาราง ถ้าเส้นทางหนึ่งต้องเดิน 9 ช่อง (moveForward() 9 ครั้ง) และแต่ละช่องใช้พลังงานเท่ากับที่ตารางแสดง คาดว่าจะใช้พลังงานประมาณเท่าใด\n• ก. 36%  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      เท่ากับการเดิน 3 ช่อง (3 × 12) ไม่ใช่ 9 ช่อง\n• ข. 72%  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      เท่ากับการเดิน 6 ช่อง (เส้นทาง F) ซึ่งยังไม่ถึง 9 ช่อง\n• ค. 24%  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      เท่ากับการเดิน 2 ช่อง (เส้นทาง B)\n• ง. 108%  —  ✓ ถูกต้อง\n      ตารางแสดงว่าทุกช่องใช้พลังงานคงที่ 12% ต่อช่อง (12 ÷ 1 = 24 ÷ 2 = … = 72 ÷ 6) จึงคำนวณ 9 × 12 = 108%\n1.2 เฉลยและเกณฑ์ให้คะแนน (2 คะแนน — ตรวจตามเฉลย ไม่ใช้รูบริค)\nไป 6 ช่อง + กลับ 6 ช่อง = 12 ช่อง → 12 × 12% = 144%\n144% > 100% จึง ไม่เพียงพอ (พลังงานเต็มเดินไป–กลับได้สูงสุด 8 ช่อง = 4 ช่องไป + 4 ช่องกลับ = 96%)\nเกณฑ์ให้คะแนน: คำนวณพลังงานรวม 144% ได้ถูกต้อง (นับไป–กลับ 12 ช่อง) = 1 คะแนน · สรุปว่าไม่เพียงพอ เพราะเกิน 100% = 1 คะแนน"}, {"s": "LEARN", "n": 2, "t": "ภาระงานที่ 2 ความถี่จุดเสี่ยงที่ต้องผ่าน (4 คะแนน)\n2.1 ค. ภารกิจ 7 (2 คะแนน)\nโจทย์: ภารกิจใดที่โปรแกรมควรใช้ repeat(N) โดย N มีค่ามากที่สุดสำหรับ scanArea() เพื่อให้ครอบคลุมจุดเสี่ยงทั้งหมด\n• ก. ภารกิจ 3  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      พบ 8 จุด มากเป็นอันดับสอง ไม่ใช่มากที่สุด\n• ข. ภารกิจ 1  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      พบเพียง 2 จุด น้อยที่สุด ต้องการ N น้อยที่สุด\n• ค. ภารกิจ 7  —  ✓ ถูกต้อง\n      พบ 9 จุด สูงที่สุดในตาราง จึงต้องวนสแกนมากรอบที่สุดจึงจะครอบคลุมทุกจุด\n• ง. ภารกิจ 4  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      พบเพียง 3 จุด น้อยกว่าภารกิจอื่นหลายภารกิจ\n2.2 เฉลยและเกณฑ์ให้คะแนน (2 คะแนน — ตรวจตามเฉลย ไม่ใช้รูบริค)\nผลรวม = 2+5+8+3+7+4+9+6 = 44 → ค่าเฉลี่ย = 44 ÷ 8 = 5.5 จุด\nภารกิจที่มากกว่า 5.5: ภารกิจ 3 (8), 5 (7), 7 (9), 8 (6) รวม 4 ภารกิจ\nเกณฑ์ให้คะแนน: หาค่าเฉลี่ย 5.5 ได้ถูกต้อง = 1 คะแนน · ระบุภารกิจ 3, 5, 7, 8 ครบ = 1 คะแนน (ระบุถูก 3 ภารกิจ = 0.5 คะแนน)"}, {"s": "LEARN", "n": 3, "t": "ภาระงานที่ 3 ตำแหน่งไฟและความเร็วการลาม (5 คะแนน)\n3.1 ข. โซน G (2 คะแนน)\nโจทย์: โซนใดที่เงื่อนไข if(fireDetected()) ควรสั่งให้หุ่นยนต์ \"หลีกเลี่ยงทันที\" มากที่สุด (ระยะใกล้ไฟ + ไฟลามเร็ว)\n• ก. โซน C  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      ระยะ 60 เมตร ไกลที่สุด และลามช้า (20) จึงปลอดภัยที่สุด — ตรงข้ามกับที่โจทย์ถาม\n• ข. โซน G  —  ✓ ถูกต้อง\n      ระยะเพียง 8 เมตร (ใกล้ที่สุด) และลามระดับ 90 (เร็วที่สุด) ตรงเงื่อนไข \"ใกล้ + ลามเร็ว\" ทั้งสองปัจจัยพร้อมกัน\n• ค. โซน E  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      ระยะ 50 เมตร และลามช้า (30) ไกลและช้าทั้งสองปัจจัย\n• ง. โซน A  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      ระยะ 35 เมตร ลามระดับ 40 อยู่ระดับกลาง ไม่ได้ทั้งใกล้และเร็ว\n3.2 แนวคำตอบอ้างอิง (3 คะแนน — คำถามอัตนัย ใช้รูบริคส่วน B ประกอบ)\nโจทย์: หากใช้กฎ \"หลีกเลี่ยงเมื่อระยะห่างจากไฟ < 30 เมตร\" (ปัจจัยเดียว) เปรียบเทียบกับกฎ \"หลีกเลี่ยงเมื่อระยะห่างจากไฟ < 20 เมตร และ ความเร็วการลาม > 60\" (สองปัจจัยร่วมกัน) จงอธิบายว่าสองกฎนี้ให้ผลต่างกันอย่างไรกับข้อมูลในตาราง และเหตุใดการพิจารณาสองปัจจัยร่วมกันจึงสมเหตุสมผลกว่า\nกฎปัจจัยเดียว (ระยะ < 30 ม.) จะให้หลีกเลี่ยง 4 โซน คือ B (10 ม.), D (18 ม.), F (25 ม.) และ G (8 ม.) ส่วนกฎสองปัจจัย (ระยะ < 20 ม. และลาม > 60) จะหลีกเลี่ยงเพียง 3 โซน คือ B (10 ม., ลาม 85), D (18 ม., ลาม 65) และ G (8 ม., ลาม 90)\nความต่างอยู่ที่โซน F: อยู่ห่างไฟ 25 เมตร แต่ไฟลามเพียงระดับ 55 ซึ่งช้ากว่า B, D, G มาก กฎปัจจัยเดียวจึงปิดโซน F โดยไม่จำเป็น ทำให้เสียโอกาสช่วยผู้ประสบภัยที่ยังเข้าถึงได้ ขณะที่กฎสองปัจจัยเลือกหลีกเลี่ยงเฉพาะโซนที่ \"ใกล้และลามเร็ว\" จริง ๆ\nสรุป: อันตรายจริงเกิดจากปัจจัยหลายอย่างร่วมกัน การดูปัจจัยเดียวอาจระมัดระวังเกินหรือมองข้ามความเสี่ยง (เช่น ไฟที่ไกลแต่ลามเร็วมาก) จึงควรใช้ if ที่ตรวจหลายเงื่อนไขร่วมกัน แลกกับการที่ต้องตั้งค่าเกณฑ์ให้เหมาะสม\nประเด็นที่ควรปรากฏในคำตอบ (ใช้ประกอบการประเมินทั้ง 3 มิติ):\n• #  —  ประเด็น\n      มิติหลักที่เกี่ยวข้อง\n• 1  —  ระบุโซนที่ถูกหลีกเลี่ยงของทั้งสองกฎได้ถูกต้อง (B, D, F, G เทียบกับ B, D, G)\n      1 ความถูกต้อง/หลักฐาน\n• 2  —  ชี้ว่าโซน F คือจุดที่ผลต่างกัน พร้อมตัวเลข (25 ม., ลาม 55)\n      1 ความถูกต้อง/หลักฐาน\n• 3  —  อธิบายว่าปัจจัยเดียวทำให้ระมัดระวังเกินจำเป็น/พลาดโอกาสช่วยเหลือ และสองปัจจัยสะท้อนอันตรายจริงกว่า\n      2 ความลึกเชิงเหตุ–ผล\n• 4  —  (ระดับสูง) กล่าวถึงข้อแลกเปลี่ยนหรือข้อจำกัด เช่น ต้องตั้งเกณฑ์ให้เหมาะสม หรือปัจจัยไกลแต่ลามเร็วก็อันตราย\n      2 ความลึกเชิงระบบ\nตัวอย่างคำตอบระดับ \"พอใช้\" (ใช้ปรับมาตรฐานผู้ตรวจ): ต้องดูทั้งระยะและความเร็วเพราะจะได้ปลอดภัยกว่า (ไม่มีตัวเลขหรือชื่อโซน ไม่อธิบายว่าสองกฎต่างกันอย่างไร) → มิติที่ 1 = 1, มิติที่ 2 = 2, มิติที่ 3 = 2"}, {"s": "LEARN", "n": 4, "t": "ภาระงานที่ 4 สถานะความมั่นคงของโครงสร้าง (5 คะแนน)\n4.1 ง. เพราะลดการเขียนคำสั่งซ้ำซ้อนและแก้ไขจุดเดียวมีผลกับทุกจุดที่เรียกใช้ (2 คะแนน)\nโจทย์: เพราะเหตุใดการเขียนเป็นกระบวนงานย่อย checkStructure() แทนการเขียนคำสั่งตรวจซ้ำทุกจุด จึงเป็นแนวทางที่ดีกว่า\n• ก. เพราะทำให้หุ่นยนต์เดินเร็วขึ้นโดยอัตโนมัติ  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      การจัดโครงสร้างโปรแกรมไม่ได้ทำให้ความเร็วในการเดินของหุ่นยนต์เปลี่ยนไป\n• ข. เพราะเปลี่ยนสีของอาคารในตาราง  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      สีของอาคารเป็นการแสดงผล ไม่เกี่ยวข้องกับการเขียนโปรแกรมแบบกระบวนงาน\n• ค. เพราะทำให้พลังงานแบตเตอรี่เพิ่มขึ้น  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      โปรแกรมไม่สามารถเพิ่มพลังงานแบตเตอรี่ได้ พลังงานขึ้นกับฮาร์ดแวร์และการใช้งาน\n• ง. เพราะลดการเขียนคำสั่งซ้ำซ้อนและแก้ไขจุดเดียวมีผลกับทุกจุดที่เรียกใช้  —  ✓ ถูกต้อง\n      หัวใจของ procedure คือ \"เขียนครั้งเดียว เรียกใช้ซ้ำ\" (reuse) ลดความซ้ำซ้อน และเมื่อต้องแก้ไข แก้จุดเดียวก็มีผลทุกจุดที่เรียก จึงบำรุงรักษาง่ายและลดความผิดพลาด\n4.2 แนวคำตอบอ้างอิง (3 คะแนน — คำถามอัตนัย ใช้รูบริคส่วน B ประกอบ)\nโจทย์: ทีมกู้ภัยต้องการปรับเกณฑ์ตัดสินว่า \"อาคารไม่ปลอดภัย\" จากคะแนนความไม่มั่นคง ≥ 60 เป็น ≥ 70 จงเปรียบเทียบจำนวนตำแหน่งในโปรแกรมที่ต้องแก้ไข ระหว่างการเขียนเป็น checkStructure() กับการเขียนคำสั่งตรวจซ้ำทุกอาคาร และอธิบายผลของการเปลี่ยนเกณฑ์ต่อการตัดสินใจ โดยอ้างอิงข้อมูลอาคารในตาราง\nเกณฑ์ ≥ 60 ทำให้อาคาร 2 (72), 4 (88) และ 7 (65) ถูกตัดสินว่าไม่ปลอดภัย รวม 3 อาคาร ส่วนเกณฑ์ ≥ 70 เหลือ 2 อาคาร (อาคาร 2 และ 4) อาคาร 7 (65) จะกลายเป็น \"ผ่านได้\"\nถ้าเขียนคำสั่งตรวจซ้ำทุกอาคาร ต้องแก้ 8 ตำแหน่ง และหากลืมแก้บางที่ อาคารเดียวกันอาจถูกตัดสินต่างกัน (เกิดความไม่สอดคล้องกัน) แต่ถ้าเขียนเป็นกระบวนงานย่อย checkStructure() แก้เพียง 1 ตำแหน่ง ทุกจุดที่เรียกใช้จะเปลี่ยนตามพร้อมกัน\nอย่างไรก็ตาม การเพิ่มเกณฑ์เป็น 70 ทำให้หุ่นยนต์เข้าอาคาร 7 ได้ (ช่วยผู้ประสบภัยได้มากขึ้น) แต่เสี่ยงมากขึ้นเพราะอาคารที่ไม่มั่นคง 65 ถูกมองว่าปลอดภัย ผู้พัฒนาจึงต้องชั่งน้ำหนักระหว่างโอกาสช่วยเหลือกับความปลอดภัย\nประเด็นที่ควรปรากฏในคำตอบ (ใช้ประกอบการประเมินทั้ง 3 มิติ):\n• #  —  ประเด็น\n      มิติหลักที่เกี่ยวข้อง\n• 1  —  ระบุจำนวนอาคารที่ไม่ปลอดภัยของแต่ละเกณฑ์ถูกต้อง (3 อาคาร → 2 อาคาร) และชี้อาคาร 7 (65) เป็นอาคารที่เปลี่ยนผล\n      1 ความถูกต้อง/หลักฐาน\n• 2  —  เปรียบเทียบจำนวนตำแหน่งที่ต้องแก้ไข (8 ตำแหน่ง เทียบกับ 1 ตำแหน่ง) และอธิบายผลจากความไม่สอดคล้อง\n      1 ความถูกต้อง/หลักฐาน\n• 3  —  อธิบายเชิงเหตุ–ผลว่า procedure ทำให้แก้ที่เดียวมีผลทุกจุดที่เรียกใช้\n      2 ความลึกเชิงเหตุ–ผล\n• 4  —  (ระดับสูง) กล่าวถึงข้อแลกเปลี่ยนของการปรับเกณฑ์ (โอกาสช่วยเหลือ vs ความปลอดภัย)\n      2 ความลึกเชิงระบบ\nตัวอย่างคำตอบระดับ \"พอใช้\" (ใช้ปรับมาตรฐานผู้ตรวจ): เขียนเป็น procedure ดีกว่าเพราะแก้ง่ายและไม่ต้องเขียนซ้ำ (ไม่มีตัวเลขอาคาร ไม่พูดถึงผลของการเปลี่ยนเกณฑ์) → มิติที่ 1 = 1, มิติที่ 2 = 2, มิติที่ 3 = 2\n• สูง  —  ระดับความเข้าใจและความมั่นใจที่เลือกในข้อ 4.1–4.4 สอดคล้องกับคะแนนที่ทำได้จริงในส่วน LEARN และ APPLY\n• กลาง  —  สอดคล้องบางส่วน เช่น ประเมินความเข้าใจตรงแต่ประเมินความมั่นใจสูงหรือต่ำกว่าผลจริงอย่างเห็นได้ชัดในบางข้อ"}, {"s": "LEARN", "n": 5, "t": "ภาระงานที่ 5 พฤติกรรมเบี่ยงเบนจากแผนเดิม (3 คะแนน)\n5.1 ก. t4 (2 คะแนน)\nโจทย์: ช่วงเวลาใดที่ค่าความเบี่ยงเบนสูงสุด แสดงว่าหุ่นยนต์กำลังอยู่ในโหมดหลีกเลี่ยงสิ่งกีดขวางมากที่สุด\n• ก. t4  —  ✓ ถูกต้อง\n      ค่า 6 สูงที่สุดในทั้ง 10 ช่วงเวลา แสดงว่าหุ่นยนต์เบี่ยงออกจากแผนมากที่สุด\n• ข. t3  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      ค่า 3 ยังอยู่ในช่วงที่ความเบี่ยงเบนกำลังเพิ่มขึ้น ยังไม่ใช่จุดสูงสุด\n• ค. t1  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      ค่า 0 ยังไม่ได้เริ่มเบี่ยง (ยังไม่พบสิ่งกีดขวาง)\n• ง. t8  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      ค่า 0 หุ่นยนต์กลับเข้าเส้นทางตามแผนแล้ว จึงไม่ใช่โหมดหลีกเลี่ยงสูงสุด\n5.2 เฉลยและเกณฑ์ให้คะแนน (1 คะแนน — ตรวจตามเฉลย ไม่ใช้รูบริค)\nเบี่ยงเบนตั้งแต่ t2 ถึง t7 รวม 6 ช่วงเวลา (ค่า 1, 3, 6, 4, 2, 1)\nกลับเข้าเส้นทางเดิมสมบูรณ์ที่ t8 (ค่าเป็น 0 และคงที่จนถึง t10)\nเกณฑ์ให้คะแนน: ตอบ 6 ช่วงเวลา = 0.5 คะแนน · ตอบ t8 = 0.5 คะแนน"}, {"s": "LEARN", "n": 6, "t": "ภาระงานที่ 6 คะแนนความเสี่ยงภารกิจโดยรวม (5 คะแนน)\n6.1 ข. ปรับน้ำหนักให้ปัจจัยที่ส่งผลต่อความเสี่ยงจริงมากกว่า (เช่น ไฟ/โครงสร้าง) มีอิทธิพลต่อคะแนนมากขึ้น (2 คะแนน)\nโจทย์: ในขั้นตอน APPLY ถัดไป หากพบว่าน้ำหนักเท่ากันทุกปัจจัยให้ผลการจัดระดับผิดพลาดในหลายภารกิจ ควรทำอย่างไรจึงจะสมเหตุสมผลที่สุด\n• ก. ยกเลิกการใช้คะแนนรวม แล้วเดาผลแทน  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      การเดาไม่มีหลักฐาน ให้ผลแย่กว่าการปรับพารามิเตอร์ของแบบจำลองที่มีอยู่\n• ข. ปรับน้ำหนักให้ปัจจัยที่ส่งผลต่อความเสี่ยงจริงมากกว่า (เช่น ไฟ/โครงสร้าง) มีอิทธิพลต่อคะแนนมากขึ้น  —  ✓ ถูกต้อง\n      ปัจจัยไฟและโครงสร้างมีผลต่ออันตรายจริงมากกว่า การเพิ่มน้ำหนักทำให้ภารกิจที่ไฟ/โครงสร้างสูงได้คะแนนรวมสูงขึ้นและถูกจัดเป็นระดับสูงได้ถูกต้อง\n• ค. เพิ่มจำนวนภารกิจตัวอย่างให้มากขึ้นโดยไม่แก้น้ำหนัก  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      ข้อผิดพลาดมาจากน้ำหนักที่ไม่สะท้อนความสำคัญจริง การเพิ่มจำนวนตัวอย่างโดยไม่แก้น้ำหนัก ยังคงให้ความผิดพลาดเดิม\n• ง. เปลี่ยนหน่วยของตารางจากเปอร์เซ็นต์เป็นจำนวนเต็ม  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      การเปลี่ยนหน่วยหรือรูปแบบตัวเลขไม่เปลี่ยนคะแนนสัมพัทธ์ระหว่างภารกิจ จึงไม่แก้ปัญหา\n6.2 แนวคำตอบอ้างอิง (3 คะแนน — คำถามอัตนัย ใช้รูบริคส่วน B ประกอบ)\nโจทย์: ภารกิจ M1 (ผู้เชี่ยวชาญประเมิน \"สูง\") ได้คะแนน 46.0 และ M2 (ผู้เชี่ยวชาญประเมิน \"ต่ำ\") ได้คะแนน 39.0 ทั้งสองถูกจัดเป็น \"ปานกลาง\" จงอธิบายสาเหตุที่น้ำหนักเท่ากันทำให้ระบบแยก M1 กับ M2 ไม่ได้ โดยเปรียบเทียบค่าปัจจัยของทั้งสองภารกิจ และเสนอแนวทางปรับที่เหมาะสม\nM1 มีปัจจัยไฟ (95) และโครงสร้าง (90) สูงมาก แต่ปัจจัยพลังงาน จุดเสี่ยง และเบี่ยงเบนต่ำ (20, 15, 10) ส่วน M2 กลับตรงข้าม คือพลังงาน (80) และจุดเสี่ยง (70) สูง แต่ไฟและโครงสร้างต่ำ (15, 10) เมื่อให้น้ำหนักเท่ากันทุกปัจจัย ค่าสูงกับค่าต่ำหักล้างกันเมื่อเฉลี่ย ได้ 46.0 และ 39.0 ซึ่งต่างกันเพียง 7 คะแนนและอยู่ในช่วงเดียวกัน (35–65)\nปัญหาคือระบบปฏิบัติต่อทุกปัจจัยเสมือนมีความสำคัญเท่ากัน ทั้งที่ไฟและโครงสร้างเป็นอันตรายต่อชีวิตโดยตรงมากกว่า แนวทางคือเพิ่มน้ำหนักไฟและโครงสร้าง เช่น 5 : 5 : 40 : 40 : 10 จะได้ M1 = 76.75 (สูง) และ M2 = 19.5 (ต่ำ) ตรงกับผู้เชี่ยวชาญ\nข้อระวังคือถ้าเพิ่มน้ำหนักบางปัจจัยมากเกินไป อาจมองข้ามความเสี่ยงจากปัจจัยอื่น (เช่น ความเบี่ยงเบนสูงของ M8) จึงต้องทดสอบกับหลายภารกิจ\nประเด็นที่ควรปรากฏในคำตอบ (ใช้ประกอบการประเมินทั้ง 3 มิติ):\n• #  —  ประเด็น\n      มิติหลักที่เกี่ยวข้อง\n• 1  —  เปรียบเทียบค่าปัจจัยของ M1 และ M2 ด้วยตัวเลขที่ถูกต้อง (ไฟ 95/15, โครงสร้าง 90/10, พลังงาน 20/80 ฯลฯ)\n      1 ความถูกต้อง/หลักฐาน\n• 2  —  อธิบายว่าการเฉลี่ยด้วยน้ำหนักเท่ากันทำให้ค่าสูง–ต่ำหักล้างกัน จนคะแนนรวมใกล้กัน (46.0 กับ 39.0) และอยู่ระดับเดียวกัน\n      1 ความถูกต้อง/หลักฐาน\n• 3  —  เสนอปรับน้ำหนักปัจจัยไฟ/โครงสร้างให้สูงขึ้นพร้อมเหตุผลว่าเชื่อมโยงกับอันตรายจริง\n      2 ความลึกเชิงเหตุ–ผล\n• 4  —  (ระดับสูง) กล่าวถึงผลกระทบต่อเนื่อง/ข้อแลกเปลี่ยน เช่น ต้องทดสอบกับภารกิจอื่นเพราะอาจกระทบ M8 หรือปัจจัยอื่น\n      2 ความลึกเชิงระบบ\nตัวอย่างคำตอบระดับ \"พอใช้\" (ใช้ปรับมาตรฐานผู้ตรวจ): น้ำหนักเท่ากันไม่ดี ควรปรับน้ำหนักให้ถูก จะได้จัดระดับถูก (ไม่อ้างค่าปัจจัยของ M1, M2 ไม่อธิบายว่าเฉลี่ยแล้วหักล้างกัน) → มิติที่ 1 = 1, มิติที่ 2 = 2, มิติที่ 3 = 2"}, {"s": "LEARN", "n": 7, "t": "ภาระงานที่ 7 ต่อวงจรระบบตรวจจับสิ่งกีดขวางและขับเคลื่อน (4 คะแนน)\n7.1 เฉลยการเติมช่อง (3 คะแนน — ช่องละ 0.5 คะแนน)\n• ช่องที่  —  ตำแหน่ง\n      คำตอบที่ถูกต้อง\n• 1  —  อุปกรณ์ตรวจจับสิ่งกีดขวาง\n      จ  เซนเซอร์อัลตราโซนิก HC-SR04\n• 2  —  วงจรรับคำสั่งไปขับมอเตอร์\n      ฌ  โมดูลขับมอเตอร์ L298N\n• 3  —  ขาที่ Arduino ใช้ส่งสัญญาณออกไปกระตุ้นเซนเซอร์ (TRIG)\n      ซ  ขาดิจิทัล D8 (OUTPUT)\n• 4  —  ขาที่ Arduino ใช้รับสัญญาณสะท้อนกลับจากเซนเซอร์ (ECHO)\n      ข  ขาดิจิทัล D9 (INPUT)\n• 5  —  แหล่งจ่ายไฟสำหรับมอเตอร์ (แยกจากไฟบอร์ด เพื่อไม่ให้บอร์ดรีเซ็ต)\n      ค  แบตเตอรี่ 12V แยกวงจรมอเตอร์\n• 6  —  สายที่ต้องต่อร่วมกันทุกอุปกรณ์ เพื่อให้ใช้ระดับแรงดันอ้างอิงเดียวกัน\n      ฉ  สาย GND ร่วม (common ground)\nเหตุผลเชิงวิชาการของบล็อกทุกชิ้น (ทั้งคำตอบที่ถูกและตัวลวง)\n• บล็อก  —  ประเภท\n      ข้อความในบล็อก  ผล  เหตุผลเชิงวิชาการ\n• ก  —  ขา\n      ขาอนาล็อก A0 (อ่านค่าแรงดัน)  ✗ ตัวลวง  ขาอนาล็อกอ่านแรงดันต่อเนื่อง 0–5 V แต่ HC-SR04 สื่อสารด้วยพัลส์ดิจิทัล จึงไม่ใช่ขาที่ใช้ในวงจรนี้\n• ข  —  ขา\n      ขาดิจิทัล D9 (INPUT)  ✓ ช่อง 4  ขา ECHO รับพัลส์สะท้อนกลับ (ความยาวพัลส์แปรผันตามระยะทาง) จึงต้องตั้งเป็นขา INPUT ของ Arduino\n• ค  —  แหล่งไฟ\n      แบตเตอรี่ 12V แยกวงจรมอเตอร์  ✓ ช่อง 5  มอเตอร์กินกระแสสูงและสร้างสัญญาณรบกวน การแยกแหล่งจ่ายไฟกันไม่ให้แรงดันบอร์ดตกจนรีเซ็ต\n• ง  —  อุปกรณ์\n      จอ LCD 16×2  ✗ ตัวลวง  แสดงข้อความ ไม่ได้ตรวจจับสิ่งกีดขวางหรือขับมอเตอร์ จึงไม่จำเป็นต่อวงจรนี้\n• จ  —  อุปกรณ์\n      เซนเซอร์อัลตราโซนิก HC-SR04  ✓ ช่อง 1  ส่งคลื่นเสียงความถี่สูงแล้วจับเสียงสะท้อนเพื่อวัดระยะ ตรงกับ \"อุปกรณ์ตรวจจับสิ่งกีดขวาง\"\n• ฉ  —  สาย\n      สาย GND ร่วม (common ground)  ✓ ช่อง 6  ทุกอุปกรณ์ต้องใช้จุดอ้างอิงแรงดัน 0 V ร่วมกัน สัญญาณควบคุมจึงตีความระดับ HIGH/LOW ตรงกัน\n• ช  —  อุปกรณ์\n      ลำโพงบัซเซอร์แจ้งเตือน  ✗ ตัวลวง  ส่งเสียงเตือน ไม่ใช่ส่วนประกอบของระบบตรวจจับหรือขับเคลื่อน\n• ซ  —  ขา\n      ขาดิจิทัล D8 (OUTPUT)  ✓ ช่อง 3  ขา TRIG ต้องให้ Arduino ส่งพัลส์ออกไปกระตุ้นเซนเซอร์ จึงต้องเป็นขา OUTPUT\n• ฌ  —  อุปกรณ์\n      โมดูลขับมอเตอร์ L298N  ✓ ช่อง 2  รับสัญญาณควบคุมกระแสต่ำจาก Arduino แล้วจ่ายกระแสสูงจากแบตเตอรี่ให้มอเตอร์ (วงจร H-bridge)\n7.2 ง. เพราะมอเตอร์กินกระแสสูงและสร้างสัญญาณรบกวน การแยกไฟป้องกันบอร์ดรีเซ็ต ส่วน GND ร่วมทำให้สัญญาณควบคุมมีระดับแรงดันอ้างอิงเดียวกัน (1 คะแนน)\nโจทย์: เหตุใดวงจรนี้จึงต้องใช้แบตเตอรี่แยกสำหรับมอเตอร์ (ไม่ดึงจากไฟของบอร์ด) แต่ยังต้องต่อสาย GND ร่วมกับทุกอุปกรณ์\n• ก. เพื่อให้มอเตอร์หมุนช้าลงและลดเสียงรบกวนของเซนเซอร์  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      การแยกแบตเตอรี่ไม่ได้ทำให้มอเตอร์ช้าลง ความเร็วขึ้นกับสัญญาณควบคุมและแรงดันที่จ่าย\n• ข. เพื่อให้ Arduino ไม่ต้องใช้กราวด์  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      Arduino ทุกบอร์ดต้องมีกราวด์เป็นจุดอ้างอิง ตรงข้ามกับที่ระบุ — กราวด์ร่วมเป็นสิ่งจำเป็น\n• ค. เพื่อเพิ่มแรงดันไฟของ HC-SR04 ให้เป็น 12 V  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      HC-SR04 ใช้ไฟ 5 V การจ่าย 12 V อาจทำให้เซนเซอร์เสียหาย และแบตเตอรี่ 12 V ทำหน้าที่จ่ายไฟให้มอเตอร์เท่านั้น\n• ง. เพราะมอเตอร์กินกระแสสูงและสร้างสัญญาณรบกวน การแยกไฟป้องกันบอร์ดรีเซ็ต ส่วน GND ร่วมทำให้สัญญาณควบคุมมีระดับแรงดันอ้างอิงเดียวกัน  —  ✓ ถูกต้อง\n      มอเตอร์ดึงกระแสสูงจนแรงดันของบอร์ดอาจตกและรีเซ็ตได้ จึงแยกแหล่งจ่าย ขณะที่ GND ร่วมจำเป็นเพื่อให้สัญญาณ HIGH/LOW จากบอร์ดมีจุดอ้างอิง 0 V เดียวกับโมดูลขับมอเตอร์"}, {"s": "LEARN", "n": 8, "t": "ภาระงานที่ 8 ต่อวงจรระบบตรวจจับความร้อนและพ่นน้ำดับไฟ (4 คะแนน)\n8.1 เฉลยการเติมช่อง (3 คะแนน — ช่องละ 0.5 คะแนน)\n• ช่องที่  —  ตำแหน่ง\n      คำตอบที่ถูกต้อง\n• 1  —  อุปกรณ์ตรวจวัดอุณหภูมิจากการเผาไหม้\n      ช  เซนเซอร์วัดอุณหภูมิ DS18B20\n• 2  —  วงจรที่รับคำสั่งจากบอร์ดไปตัด–ต่อไฟให้ปั๊มน้ำ\n      ก  โมดูลรีเลย์ 1 ช่อง\n• 3  —  ขาที่ Arduino ใช้อ่านค่าอุณหภูมิเข้ามา\n      ซ  ขาดิจิทัล D2 (INPUT)\n• 4  —  ขาที่ Arduino ใช้ส่งสัญญาณ PWM ควบคุมมุมหัวฉีดของเซอร์โว\n      ค  ขาดิจิทัล D6 (PWM OUTPUT)\n• 5  —  แหล่งจ่ายไฟสำหรับปั๊มน้ำ (กินกระแสสูง ต้องแยกจากไฟบอร์ด)\n      ฌ  แหล่งจ่ายไฟ 12V สำหรับปั๊มน้ำ\n• 6  —  สายที่ต้องต่อร่วมกันทุกอุปกรณ์ เพื่อให้ใช้ระดับแรงดันอ้างอิงเดียวกัน\n      ฉ  สาย GND ร่วม (common ground)\nเหตุผลเชิงวิชาการของบล็อกทุกชิ้น (ทั้งคำตอบที่ถูกและตัวลวง)\n• บล็อก  —  ประเภท\n      ข้อความในบล็อก  ผล  เหตุผลเชิงวิชาการ\n• ก  —  อุปกรณ์\n      โมดูลรีเลย์ 1 ช่อง  ✓ ช่อง 2  รีเลย์เป็นสวิตช์ไฟฟ้า ให้สัญญาณกระแสต่ำจาก Arduino ตัด–ต่อวงจรไฟ 12 V ของปั๊มน้ำได้อย่างปลอดภัย\n• ข  —  อุปกรณ์\n      มอเตอร์ DC ขับเคลื่อนล้อ  ✗ ตัวลวง  ใช้ขับล้อของหุ่นยนต์ ไม่ใช่ปั๊มน้ำหรือหัวฉีด จึงไม่อยู่ในวงจรพ่นน้ำ\n• ค  —  ขา\n      ขาดิจิทัล D6 (PWM OUTPUT)  ✓ ช่อง 4  เซอร์โวควบคุมมุมด้วยสัญญาณ PWM จาก Arduino ซึ่งเป็นสัญญาณขาออก (OUTPUT) และ D6 เป็นขา PWM\n• ง  —  อุปกรณ์\n      เซนเซอร์อัลตราโซนิก HC-SR04  ✗ ตัวลวง  วัดระยะทาง ไม่ใช่อุณหภูมิ จึงตอบโจทย์ \"ตรวจวัดอุณหภูมิจากการเผาไหม้\" ไม่ได้\n• จ  —  ขา\n      ขาอนาล็อก A3 (อ่านค่าแสง)  ✗ ตัวลวง  ระบุการอ่านค่าแสง ไม่ใช่ขาที่ต่อกับเซนเซอร์อุณหภูมิแบบดิจิทัล DS18B20 ในวงจรนี้\n• ฉ  —  สาย\n      สาย GND ร่วม (common ground)  ✓ ช่อง 6  ทุกอุปกรณ์ต้องใช้จุดอ้างอิง 0 V ร่วมกัน\n• ช  —  อุปกรณ์\n      เซนเซอร์วัดอุณหภูมิ DS18B20  ✓ ช่อง 1  เซนเซอร์อุณหภูมิแบบดิจิทัลสำหรับวัดความร้อนจากการเผาไหม้ ตรงกับช่อง 1\n• ซ  —  ขา\n      ขาดิจิทัล D2 (INPUT)  ✓ ช่อง 3  Arduino ต้อง \"อ่านค่า\" อุณหภูมิเข้ามา จึงใช้ขา INPUT\n• ฌ  —  แหล่งไฟ\n      แหล่งจ่ายไฟ 12V สำหรับปั๊มน้ำ  ✓ ช่อง 5  ปั๊มน้ำกินกระแสสูง ต้องแยกจากไฟของบอร์ด และจ่ายผ่านรีเลย์\n8.2 ก. ขาดิจิทัลจ่ายกระแสได้จำกัด ขณะที่ปั๊มกินกระแสสูง รีเลย์ให้ขาของ Arduino ใช้กระแสน้อย ๆ สั่งตัด–ต่อวงจรไฟ 12 V ที่แยกออกมา (1 คะแนน)\nโจทย์: เหตุใดจึงต้องใช้โมดูลรีเลย์คั่นระหว่าง Arduino กับปั๊มน้ำ 12 V แทนการต่อปั๊มน้ำเข้ากับขาดิจิทัลของ Arduino โดยตรง\n• ก. ขาดิจิทัลจ่ายกระแสได้จำกัด ขณะที่ปั๊มกินกระแสสูง รีเลย์ให้ขาของ Arduino ใช้กระแสน้อย ๆ สั่งตัด–ต่อวงจรไฟ 12 V ที่แยกออกมา  —  ✓ ถูกต้อง\n      ขาดิจิทัลของ Arduino จ่ายกระแสได้เพียงราว 20 mA การต่อโหลดกระแสสูงโดยตรงทำให้ขา/บอร์ดเสียหายได้ รีเลย์จึงทำหน้าที่สวิตช์ควบคุมด้วยกระแสต่ำ\n• ข. เพื่อเพิ่มความเร็วในการอ่านค่าอุณหภูมิ  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      รีเลย์ไม่เกี่ยวกับความเร็วในการอ่านอุณหภูมิ ซึ่งเป็นหน้าที่ของเซนเซอร์และขา INPUT\n• ค. เพราะปั๊มน้ำรับได้เฉพาะสัญญาณอนาล็อก รีเลย์จึงแปลงเป็นอนาล็อกให้  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      รีเลย์เป็นสวิตช์เปิด–ปิด ไม่ใช่ตัวแปลงดิจิทัลเป็นอนาล็อก และปั๊มก็ไม่ได้ต้องการสัญญาณอนาล็อก\n• ง. เพราะรีเลย์เก็บพลังงานสำรองไว้ให้ปั๊มน้ำ  —  ✗ ไม่ถูกต้อง (ตัวลวง)\n      รีเลย์ไม่มีความสามารถเก็บพลังงาน แหล่งพลังงานของปั๊มคือแหล่งจ่ายไฟ 12 V"}, {"s": "LEARN", "n": 9, "t": "ภาระงานที่ 9 เขียนโปรแกรมบล็อกให้หุ่นยนต์ไปปิดวาล์วแก๊ส (5 คะแนน)\n9.1 เฉลยการเติมช่อง (5 คะแนน — ช่องละ 1 คะแนน)\n• ช่องที่  —  ตำแหน่ง\n      คำตอบที่ถูกต้อง\n• 1  —  เงื่อนไขหยุดการวนซ้ำ\n      ก  ถึงตำแหน่งวาล์วแก๊ส\n• 2  —  เงื่อนไขที่ต้องตรวจสอบก่อนเคลื่อนที่\n      จ  ตรวจพบสิ่งกีดขวางข้างหน้า\n• 3  —  คำสั่งเมื่อเงื่อนไขเป็นจริง\n      ค  เลี้ยวขวา 90°\n• 4  —  คำสั่งเมื่อเงื่อนไขเป็นเท็จ\n      ซ  เดินหน้า 1 ช่อง\n• 5  —  คำสั่งหลังออกจากลูป\n      ฉ  ปิดวาล์วแก๊ส\nเหตุผลเชิงวิชาการของบล็อกทุกชิ้น (ทั้งคำตอบที่ถูกและตัวลวง)\n• บล็อก  —  ประเภท\n      ข้อความในบล็อก  ผล  เหตุผลเชิงวิชาการ\n• ก  —  เงื่อนไข\n      ถึงตำแหน่งวาล์วแก๊ส  ✓ ช่อง 1  เงื่อนไขหยุดการวนซ้ำที่ตรงเป้าหมายภารกิจ — เดินไปเรื่อย ๆ จนกว่าจะถึงวาล์ว\n• ข  —  เงื่อนไข\n      พลังงานแบตเตอรี่ = 0  ✗ ตัวลวง  ถ้าใช้เป็นเงื่อนไขหยุดลูป หุ่นยนต์จะหยุดวนซ้ำเมื่อพลังงานหมดเท่านั้น ไม่ใช่เมื่อถึงวาล์ว จึงปิดวาล์วไม่สำเร็จ\n• ค  —  การกระทำ\n      เลี้ยวขวา 90°  ✓ ช่อง 3  เมื่อมีสิ่งกีดขวางข้างหน้า ต้องเปลี่ยนทิศก่อนเดินต่อ (ขอบตารางนับเป็นสิ่งกีดขวางด้วย)\n• ง  —  การกระทำ\n      หยุดการทำงานถาวร  ✗ ตัวลวง  ทำให้หุ่นยนต์หยุดทันทีโดยไม่ถึงวาล์ว ขัดกับเป้าหมายของภารกิจ\n• จ  —  เงื่อนไข\n      ตรวจพบสิ่งกีดขวางข้างหน้า  ✓ ช่อง 2  เงื่อนไขที่ต้องตรวจก่อนเคลื่อนที่ทุกก้าว เพื่อเลือกระหว่างเลี้ยวกับเดินหน้า\n• ฉ  —  การกระทำ\n      ปิดวาล์วแก๊ส  ✓ ช่อง 5  ภารกิจหลักที่ต้องทำเมื่อออกจากลูปแล้ว (หุ่นยนต์อยู่ที่วาล์ว)\n• ช  —  การกระทำ\n      ส่งเสียงเตือน  ✗ ตัวลวง  เป็นเพียงการแจ้งเตือน ไม่เคลื่อนที่และไม่แก้ปัญหา หากใส่ในช่อง 3 หรือ 4 หุ่นยนต์จะติดวนซ้ำไม่ก้าวหน้า\n• ซ  —  การกระทำ\n      เดินหน้า 1 ช่อง  ✓ ช่อง 4  เมื่อทางข้างหน้าโล่ง (เงื่อนไขในช่อง 2 เป็นเท็จ) หุ่นยนต์เดินหน้าเข้าใกล้เป้าหมาย\nการจำลองการทำงานของโปรแกรมที่ถูกต้อง (ใช้ตรวจสอบเฉลย) — เริ่มที่แถว 1 คอลัมน์ 1 หันขวา ขอบตารางนับเป็นสิ่งกีดขวาง\n• รอบ  —  พบสิ่งกีดขวางข้างหน้า? (ช่อง 2)\n      คำสั่งที่ทำ  ตำแหน่งหลังทำ  ทิศที่หัน\n• 1  —  เท็จ\n      เดินหน้า 1 ช่อง  แถว 1, คอลัมน์ 2  ขวา\n• 2  —  จริง\n      เลี้ยวขวา  แถว 1, คอลัมน์ 2  ล่าง\n• 3  —  เท็จ\n      เดินหน้า 1 ช่อง  แถว 2, คอลัมน์ 2  ล่าง\n• 4  —  เท็จ\n      เดินหน้า 1 ช่อง  แถว 3, คอลัมน์ 2  ล่าง\n• 5  —  เท็จ\n      เดินหน้า 1 ช่อง  แถว 4, คอลัมน์ 2  ล่าง\n• 6  —  เท็จ\n      เดินหน้า 1 ช่อง  แถว 5, คอลัมน์ 2  ล่าง\n• 7  —  จริง\n      เลี้ยวขวา  แถว 5, คอลัมน์ 2  ซ้าย\n• 8  —  เท็จ\n      เดินหน้า 1 ช่อง  แถว 5, คอลัมน์ 1  ซ้าย\n• 9  —  จริง\n      เลี้ยวขวา  แถว 5, คอลัมน์ 1  บน\n• 10  —  จริง\n      เลี้ยวขวา  แถว 5, คอลัมน์ 1  ขวา\n• 11  —  เท็จ\n      เดินหน้า 1 ช่อง  แถว 5, คอลัมน์ 2  ขวา\n• 12  —  เท็จ\n      เดินหน้า 1 ช่อง  แถว 5, คอลัมน์ 3  ขวา\n• 13  —  เท็จ\n      เดินหน้า 1 ช่อง  แถว 5, คอลัมน์ 4  ขวา\n• 14  —  เท็จ\n      เดินหน้า 1 ช่อง  แถว 5, คอลัมน์ 5  ขวา\n• 15  —  เท็จ\n      เดินหน้า 1 ช่อง  แถว 5, คอลัมน์ 6  ขวา\nหุ่นยนต์ถึงวาล์ว (แถว 5, คอลัมน์ 6) หลัง 15 รอบ เงื่อนไขในช่อง 1 เป็นจริง ออกจากลูป แล้วทำช่อง 5 = ปิดวาล์วแก๊สสำเร็จ\nผลเมื่อใช้ตัวลวง/สลับผิด (ตัวอย่างสำหรับอธิบายเหตุผล): สลับช่อง 3 กับ 4 (เดินหน้าเมื่อมีสิ่งกีดขวาง) → หุ่นยนต์ติดที่เดิมไม่ก้าวหน้า · ใช้ \"พลังงาน = 0\" เป็นเงื่อนไขหยุด → หยุดเมื่อครบ 60 รอบโดยยังไม่ถึงวาล์ว · ใช้ \"หยุดถาวร\" ในช่อง 5 → ถึงวาล์วแต่ไม่ปิดวาล์ว · ใช้ \"ส่งเสียงเตือน\" ในช่อง 3 → ไม่เปลี่ยนทิศ จึงติดสิ่งกีดขวางไม่จบ"}, {"s": "LEARN", "n": 10, "t": "ภาระงานที่ 10 เขียนโปรแกรมบล็อกควบคุมระบบพ่นน้ำดับไฟ (6 คะแนน)\n10.1 เฉลยการเติมช่อง (6 คะแนน — ช่องละ 1 คะแนน)\n• ช่องที่  —  ตำแหน่ง\n      คำตอบที่ถูกต้อง\n• 1  —  เงื่อนไขหยุดการวนซ้ำ (ไฟดับแล้ว)\n      ง  อุณหภูมิต่ำกว่า 45°C\n• 2  —  เงื่อนไขที่บอกว่าพบการเผาไหม้รุนแรง\n      ฌ  อุณหภูมิ ≥ 60°C\n• 3  —  คำสั่งที่ 1 เมื่อร้อนจัด\n      ค  เปิดปั๊มน้ำแรงดันสูง\n• 4  —  คำสั่งที่ 2 เมื่อร้อนจัด\n      ซ  กวาดเซอร์โวหัวฉีด 30°–150°\n• 5  —  คำสั่งเมื่อยังไม่ร้อนจัด\n      ฉ  ฉีดน้ำแรงดันต่ำต่อเนื่อง\n• 6  —  คำสั่งหลังออกจากลูป\n      ข  ปิดปั๊มและรายงานศูนย์ควบคุม\nเหตุผลเชิงวิชาการของบล็อกทุกชิ้น (ทั้งคำตอบที่ถูกและตัวลวง)\n• บล็อก  —  ประเภท\n      ข้อความในบล็อก  ผล  เหตุผลเชิงวิชาการ\n• ก  —  เงื่อนไข\n      อุณหภูมิ ≥ 20°C  ✗ ตัวลวง  ขณะอยู่ในลูป อุณหภูมิยังไม่ต่ำกว่า 45°C ดังนั้น ≥ 20°C เป็นจริงเสมอ ทำให้ทางเลือก \"ยังไม่ร้อนจัด\" ไม่เคยถูกใช้ และไม่แยกความร้อนจัดออกจากความร้อนปานกลาง\n• ข  —  การกระทำ\n      ปิดปั๊มและรายงานศูนย์ควบคุม  ✓ ช่อง 6  งานที่ต้องทำเมื่อไฟดับแล้ว หลังออกจากลูป เพื่อหยุดใช้น้ำและแจ้งผล\n• ค  —  การกระทำ\n      เปิดปั๊มน้ำแรงดันสูง  ✓ ช่อง 3  ใช้เมื่อพบการเผาไหม้รุนแรง เพราะต้องลดอุณหภูมิให้เร็ว\n• ง  —  เงื่อนไข\n      อุณหภูมิต่ำกว่า 45°C  ✓ ช่อง 1  ไฟดับ/เย็นลงแล้ว จึงเป็นเงื่อนไขหยุดการวนซ้ำ\n• จ  —  การกระทำ\n      หยุดระบบถาวร  ✗ ตัวลวง  หยุดทั้งระบบทั้งที่ไฟยังไม่ดับ ภารกิจล้มเหลวและไม่ได้รายงาน\n• ฉ  —  การกระทำ\n      ฉีดน้ำแรงดันต่ำต่อเนื่อง  ✓ ช่อง 5  ใช้เมื่อยังไม่ร้อนจัด เพื่อประหยัดน้ำ (น้ำมีจำกัด) แต่ยังลดอุณหภูมิต่อเนื่อง\n• ช  —  การกระทำ\n      เปิดไฟสัญญาณเตือนอย่างเดียว  ✗ ตัวลวง  ไม่ได้ฉีดน้ำ จึงไม่ลดอุณหภูมิ ไฟลุกลามต่อ\n• ซ  —  การกระทำ\n      กวาดเซอร์โวหัวฉีด 30°–150°  ✓ ช่อง 4  กวาดหัวฉีดให้น้ำครอบคลุมพื้นที่ไฟ ใช้ร่วมกับปั๊มแรงดันสูงเมื่อร้อนจัด\n• ฌ  —  เงื่อนไข\n      อุณหภูมิ ≥ 60°C  ✓ ช่อง 2  เกณฑ์ที่บอกว่าเป็นการเผาไหม้รุนแรง ใช้แยกกรณีร้อนจัดออกจากกรณีปานกลาง\nการจำลองการทำงานของโปรแกรมที่ถูกต้อง (ใช้ตรวจสอบเฉลย) — เริ่มที่ 85 °C น้ำ 100% แรงดันสูง + เซอร์โว: −12 °C ใช้น้ำ 10% · แรงดันต่ำ: −5 °C ใช้น้ำ 3% · ไฟลุกเพิ่มรอบละ +6 °C (ถ้ายัง ≥ 60 °C) หรือ +2 °C\n• รอบ  —  อุณหภูมิเริ่มรอบ\n      ร้อนจัด (≥ 60)?  คำสั่งที่ทำ  ไฟลุกเพิ่ม  อุณหภูมิสิ้นรอบ  น้ำคงเหลือ\n• 1  —  85\n      จริง  ปั๊มแรงดันสูง + กวาดเซอร์โว (−12 °C, ใช้น้ำ 10%)  +6  79  90%\n• 2  —  79\n      จริง  ปั๊มแรงดันสูง + กวาดเซอร์โว (−12 °C, ใช้น้ำ 10%)  +6  73  80%\n• 3  —  73\n      จริง  ปั๊มแรงดันสูง + กวาดเซอร์โว (−12 °C, ใช้น้ำ 10%) 5\n      ต่ำ  ✓\n• M3  —  10.5\n      ต่ำ  ✓\n• M4  —  42.75\n      ปานกลาง  ✓\n• M5  —  68.05\n      สูง  ✓\n• M6  —  42.25\n      ปานกลาง  ✓\n• M7  —  66.2\n      สูง  ✓\n• M8  —  27.55\n      ต่ำ  ✓\nตรวจคัดกรองเร็ว (เงื่อนไขจำเป็น เมื่อทำน้ำหนักเป็นสัดส่วนของผลรวม): (ไฟ + โครงสร้าง) ≥ 65% · (พลังงาน + จุดเสี่ยง) ≤ 35% · เบี่ยงเบน ≤ 25% · ผ่านเงื่อนไขเหล่านี้ยังไม่ได้แปลว่าถูกครบ ต้องคำนวณยืนยัน โดยแถวที่พลาดบ่อยคือ M7, M4, M5, M1, M8\nแนวคำตอบส่วนเหตุผล (2 คะแนน — ใช้รูบริคส่วน B):\nภารกิจที่ผู้เชี่ยวชาญจัดเป็น \"สูง\" (M1, M5, M7) มีค่าไฟและโครงสร้างสูงพร้อมกัน (เช่น M1 ไฟ 95 โครงสร้าง 90; M7 ไฟ 80 โครงสร้าง 92) แต่ปัจจัยอื่นต่ำ เมื่อน้ำหนักเท่ากัน ค่าเฉลี่ยจึงถูกดึงลงเหลือ 46–50 จัดเป็นปานกลางผิด\nส่วนภารกิจ \"ต่ำ\" ที่ถูกจัดเป็นปานกลางผิด (M2 พลังงาน 80 จุดเสี่ยง 70, M8 เบี่ยงเบน 88) สูงเฉพาะปัจจัยที่ไม่ใช่อันตรายโดยตรง จึงควรลดน้ำหนักพลังงาน จุดเสี่ยง และเบี่ยงเบน แล้วเพิ่มน้ำหนักไฟและโครงสร้าง เช่น 10 : 10 : 35 : 35 : 10 จะได้ M1 = 69.25 (สูง), M2 = 25.75 (ต่ำ), M8 = 27.55 (ต่ำ)\nข้อแลกเปลี่ยน: ถ้าลดน้ำหนักปัจจัยอื่นเหลือ 0 ทั้งหมด (ใช้ไฟอย่างเดียว) ระบบจะมองไม่เห็นความเสี่ยงด้านพลังงานและจุดเสี่ยงเลย เช่น M4 (พลังงาน 85 จุดเสี่ยง 80) จะได้คะแนนตกลงมาที่ 35.0 พอดีขอบระหว่างต่ำกับปานกลาง จึงควรคงน้ำหนักปัจจัยอื่นไว้บางส่วน\nประเด็นที่ควรปรากฏ: (1) ระบุรายการที่ผิดและอ้างตัวเลขจากตาราง (2) อธิบายว่าเหตุใดการปรับพารามิเตอร์แบบนั้นแก้ข้อผิดพลาดได้ (3) ชี้ข้อแลกเปลี่ยนหรือขีดจำกัดของการปรับ"}, {"s": "APPLY", "n": 2, "t": "กิจกรรมที่ 2 ปรับเส้นเกณฑ์ตัดระดับความเสี่ยง (2 เส้น) (6 คะแนน)\n2.1 เฉลย (lo = 25, hi = 55)\n• ภารกิจ  —  คะแนนรวม\n      ระดับจริง  ระบบจัดเป็น  ถูก?\n• M1  —  15\n      ต่ำ  ✓\n• M2  —  22\n      ต่ำ  ✓\n• M3  —  30\n      ต่ำ  ปานกลาง  ✗\n• M4  —  38\n      ปานกลาง  ✓\n• M5  —  45\n      ปานกลาง  ✓\n• M6  —  52\n      ปานกลาง  ✓\n• M7  —  58\n      ปานกลาง  สูง  ✗\n• M8  —  66\n      สูง  ✓\n• M9  —  73\n      สูง  ✓\n• M10  —  88\n      สูง  ✓\nความแม่นยำของค่าเริ่มต้น = 8 ÷ 10 × 100 = 80 %\n2.2 เฉลย (1 คะแนน): ระบบจัดผิด 2 รายการ ได้แก่ M ปลี่ยนหรือขีดจำกัดของการปรับ"}, {"s": "REFLECT", "n": 4, "t": "ข้อ 4.1–4.4 (Likert ข้อละ 2 คะแนน รวม 8 คะแนน) และข้อ 4.5 (3 คะแนน) ข้อ 4.6 (4 คะแนน) เป็นคำถามสะท้อนคิด ให้ตรวจตามกรอบในส่วน C\nแนวคำตอบอ้างอิง ข้อ 4.5 (3 คะแนน)\nตัวอย่าง: \"ขั้น APPLY ยากที่สุด เพราะต้องคิดหาน้ำหนักหรือเกณฑ์ใหม่เองและตรวจว่าทุกรายการถูกพร้อมกัน เช่น กิจกรรมที่ 1 พอเพิ่มน้ำหนักไฟและโครงสร้างให้ M1 ถูกแล้ว ต้องกลับมาดู M4 และ M8 อีกว่ายังถูกอยู่หรือไม่\" (ขั้นใดก็ได้ ขอให้ยกตัวอย่างและให้เหตุผลที่สอดคล้องกับผลการทำจริง)\nแนวคำตอบอ้างอิง ข้อ 4.6 (4 คะแนน)\nควรตั้งเกณฑ์จากข้อมูลจริงให้ผลตรงกับผู้เชี่ยวชาญมากที่สุด เช่น กิจกรรมที่ 4 ที่ช่วง T = 54–61 ถ้าต่ำกว่านั้นหุ่นยนต์รอโดยไม่จำเป็นและพลาดโอกาสช่วยเหลือ (S4, S5) ถ้าสูงกว่านั้นจะเข้าพื้นที่อันตรายจริง (S6) และควรมีมาตรการเสริม เช่น (1) ให้เจ้าหน้าที่หรือมนุษย์ตรวจทานกรณีดัชนีอยู่ใกล้เส้นเกณฑ์ (human-in-the-loop) (2) ให้ค่าความผิดพลาดชนิดที่เสี่ยงต่อชีวิตมีน้ำหนักมากกว่า เพราะการเข้าจุดอันตรายผิดพลาดแก้คืนไม่ได้ (3) ทบทวนเกณฑ์เป็นระยะเมื่อได้ข้อมูลภารกิจใหม่ (4) มีขั้นตอนหยุดฉุกเฉิน\nส่วน B · รูบริคการให้คะแนนคำถามอัตนัยเชิงเหตุผล\n      ประเมิน 3 มิติ มิติละ 4 ระดับ · ใช้กับข้อ LEARN 3.2, 4.2, 6.2 และ APPLY 1.3, 2.3, 3.3, 4.3, 5.3 (ส่วนเหตุผล)\nมิติที่ 1: ความถูกต้องและการอ้างอิงข้อมูลเชิงประจักษ์ (Accuracy & Evidence-based Reasoning)\n• ระดับ  —  เกณฑ์การพิจารณา\n• 4 — ดีเยี่ยม  —  อ้างอิงตัวเลขหรือข้อความจากตาราง/ชุดข้อมูลได้ถูกต้องครบถ้วน ค่าที่ยกมาตรงกับที่คำนวณได้จริง และใช้หลักฐานนั้นสนับสนุนข้อสรุปอย่างตรงประเด็น\n• 3 — ดี  —  อ้างอิงข้อมูลได้ถูกต้องเป็นส่วนใหญ่ อาจมีความคลาดเคลื่อนเล็กน้อยที่ไม่กระทบข้อสรุป\n• 2 — พอใช้  —  กล่าวถึงข้อมูลอย่างกว้าง ๆ โดยไม่ยกตัวเลขหรือตัวอย่างเฉพาะ หรือมีตัวเลขที่คลาดเคลื่อนจนกระทบความน่าเชื่อถือบางส่วน\n• 1 — ควรปรับปรุง  —  ไม่อ้างอิงข้อมูลใดเลย หรือข้อมูลที่ยกมาขัดแย้งกับชุดข้อมูลที่ให้ไว้\nมิติที่ 2: ความลึกของการให้เหตุผลเชิงเหตุ–ผลและเชิงระบบ (Depth of Causal / Systems Reasoning)\n• ระดับ  —  เกณฑ์การพิจารณา\n• 4 — ดีเยี่ยม  —  อธิบายความเชื่อมโยงเชิงเหตุ–ผลได้ชัดเจนว่าพารามิเตอร์หรือกฎใดส่งผลต่อผลลัพธ์อย่างไร และมองเห็นผลกระทบต่อเนื่องหรือการแลกได้แลกเสียของทั้งระบบ เช่น การแก้จุดหนึ่งไปกระทบอีกจุดหนึ่ง\n• 3 — ดี  —  อธิบายเหตุและผลได้ถูกต้องในประเด็นหลัก แต่ยังไม่กล่าวถึงผลกระทบต่อเนื่องหรือการแลกได้แลกเสีย\n• 2 — พอใช้  —  ระบุได้ว่ามีความเกี่ยวข้องกัน แต่อธิบายกลไกไม่ชัดเจน หรือสลับเหตุกับผล\n• 1 — ควรปรับปรุง  —  บรรยายสิ่งที่เห็นโดยไม่อธิบายสาเหตุ หรือให้เหตุผลที่ไม่สอดคล้องกับหลักการทำงานของระบบ\nมิติที่ 3: ความชัดเจนในการสื่อสาร (Clarity of Communication)\n• ระดับ  —  เกณฑ์การพิจารณา\n• 4 — ดีเยี่ยม  —  เรียบเรียงความคิดเป็นลำดับ อ่านเข้าใจง่าย ใช้ศัพท์เฉพาะของระบบ (น้ำหนัก, คะแนนรวม, เกณฑ์, ความแม่นยำ, ลูป, เงื่อนไข) ได้ถูกต้องตรงความหมาย\n• 3 — ดี  —  สื่อสารเข้าใจได้ดี มีการใช้ศัพท์เฉพาะบ้าง อาจมีบางจุดที่เรียบเรียงวกวนเล็กน้อย\n• 2 — พอใช้  —  พอเข้าใจ แต่ลำดับความคิดสับสน หรือใช้ศัพท์เฉพาะผิดความหมายบางคำ\n• 1 — ควรปรับปรุง  —  สื่อสารไม่ชัดเจน ตีความเจตนาของผู้เขียนได้ยาก หรือตอบไม่ตรงคำถาม\nตารางแปลงระดับรูบริคเป็นคะแนน (สำหรับแต่ละข้อ)\nนำระดับที่ได้จาก 3 มิติ (แต่ละมิติมีน้ำหนักเท่ากัน) มาหาค่าเฉลี่ย แล้วเทียบกับคะแนนเต็มของข้อนั้นตามตาราง\n• ระดับเฉลี่ย 3 มิติ  —  ข้อที่เต็ม 2 คะแนน (APPLY 1.3–5.3 ส่วนเหตุผล)\n      ข้อที่เต็ม 3 คะแนน (LEARN 3.2, 4.2, 6.2)\n• 3.5 – 4.0 (ดีเยี่ยม)  —  2\n      3\n• 2.5 – 3.4 (ดี)  —  1.5\n      2.5\n• 1.8 – 2.4 (พอใช้)  —  1\n      1.5\n• 1.0 – 1.7 (ควรปรับปรุง)  —  0.5\n      1\n• ไม่ตอบ / ตอบไม่เกี่ยวข้อง  —  0\nหมายเหตุ: ข้อ APPLY x.3 ให้ตรวจส่วนค่าพารามิเตอร์ (1 คะแนน) ตามเฉลยในส่วน A ก่อน (ถูก/ผิดชัดเจนด้วยการคำนวณ) แล้วจึงใช้รูบริคนี้กับส่วนอธิบายเหตุผลเท่านั้น\nส่วน C · แนวทางการประเมินขั้นตอนที่ 4 REFLECT\n      ประเมิน 3 มิติ มิติละ 3 ระดับ · ใช้ประกอบการตรวจข้อ 4.5 และ 4.6 และการให้ข้อมูลย้อนกลับรายบุคคล\nขั้นตอน REFLECT ต่างจากสามส่วนแรกเพราะเป็นการให้นักเรียนประเมินตนเองและสะท้อนคิดเชิงจริยธรรม ไม่ใช่การวัดความรู้ที่มีคำตอบถูกผิดตายตัว กรอบด้านล่างใช้เพื่อให้การตรวจมีความสม่ำเสมอระหว่างผู้ตรวจ\nมิติที่ 1: ความครบถ้วนและตรงประเด็นของคำตอบ (Completeness & Relevance)\n• ระดับ  —  เกณฑ์การพิจ นกลับ: ควรให้คำแนะนำสั้น ๆ 1–2 ประโยคต่อนักเรียน โดยอิงมิติที่ 2 (ความสอดคล้องกับผลจริง) เพื่อส่งเสริมการประเมินตนเองที่ตรงความเป็นจริง\n5. ระดับสมรรถนะรวม (ถ้าต้องการรายงาน): ≥ 85 = ระดับ 4 ขั้นสูง · 70–84 = ระดับ 3 ชำนาญ · 50–69 = ระดับ 2 พื้นฐาน · < 50 = ระดับ 1 ควรพัฒนาเพิ่มเติม (ตามเกณฑ์ของเว็บแอป)"}, "rb": "2. ส่วน B — รูบริคการให้คะแนนคำถามอัตนัยเชิงเหตุผล (3 มิติ มิติละ 4 ระดับ) และตารางแปลงระดับเป็นคะแนน\n3. ส่วน C — แนวทางและมิติการประเมินขั้นตอนที่ 4 REFLECT (ประเมินตนเอง)\nสัดส่วนคะแนน (สอดคล้องกับเว็บแอป RESCUE-BOT)\n• ส่วน  —  คะแนนเต็ม\n      รายละเอียดการกระจายคะแนน\n• SHOW  —  10\n      5 ข้อ ข้อละ 2 คะแนน\n• LEARN  —  45\n      ภาระงาน 1, 2 = 4 คะแนน (x.1 = 2, x.2 = 2) · ภาระงาน 3, 4, 6 = 5 คะแนน (x.1 = 2, x.2 = 3) · ภาระงาน 5 = 3 คะแนน (5.1 = 2, 5.2 = 1) · ภาระงาน 7, 8 = 4 คะแนน (เติมช่อง 6 ช่อง ช่องละ 0.5 = 3 + ข้อ x.2 = 1) · ภาระงาน 9 = 5 คะแนน (5 ช่อง ช่องละ 1) · ภาระงาน 10 = 6 คะแนน (6 ช่อง ช่องละ 1)\n• APPLY  —  30\n      5 กิจกรรม กิจกรรมละ 6 คะแนน (x.1 = 2, x.2 = 1, x.3 = 3 [ค่าพารามิเตอร์ใหม่ 1 + เหตุผล 2])\n• REFLECT  —  15\n      ข้อ 4.1–4.4 ข้อละ 2 คะแนน (รวม 8) · ข้อ 4.5 = 3 คะแนน · ข้อ 4.6 = 4 คะแนน\nข้อที่ต้องใช้รูบริคส่วน B ประกอบการตรวจ\nข้อคำนวณ/ตอบสั้น (LEARN 1.2, 2.2, 5.2) และข้อเติมช่อง ตรวจตามเฉลยและเกณฑ์ในส่วน A โดยไม่ต้องใช้รูบริค\n1.2 เฉลยและเกณฑ์ให้คะแนน (2 คะแนน — ตรวจตามเฉลย ไม่ใช้รูบริค)\nไป 6 ช่อง + กลับ 6 ช่อง = 12 ช่อง → 12 × 12% = 144%\n144% > 100% จึง ไม่เพียงพอ (พลังงานเต็มเดินไป–กลับได้สูงสุด 8 ช่อง = 4 ช่องไป + 4 ช่องกลับ = 96%)\nเกณฑ์ให้คะแนน: คำนวณพลังงานรวม 144% ได้ถูกต้อง (นับไป–กลับ 12 ช่อง) = 1 คะแนน · สรุปว่าไม่เพียงพอ เพราะเกิน 100% = 1 คะแนน\n2.2 เฉลยและเกณฑ์ให้คะแนน (2 คะแนน — ตรวจตามเฉลย ไม่ใช้รูบริค)\nผลรวม = 2+5+8+3+7+4+9+6 = 44 → ค่าเฉลี่ย = 44 ÷ 8 = 5.5 จุด\nภารกิจที่มากกว่า 5.5: ภารกิจ 3 (8), 5 (7), 7 (9), 8 (6) รวม 4 ภารกิจ\nเกณฑ์ให้คะแนน: หาค่าเฉลี่ย 5.5 ได้ถูกต้อง = 1 คะแนน · ระบุภารกิจ 3, 5, 7, 8 ครบ = 1 คะแนน (ระบุถูก 3 ภารกิจ = 0.5 คะแนน)\n3.2 แนวคำตอบอ้างอิง (3 คะแนน — คำถามอัตนัย ใช้รูบริคส่วน B ประกอบ)\nโจทย์: หากใช้กฎ \"หลีกเลี่ยงเมื่อระยะห่างจากไฟ < 30 เมตร\" (ปัจจัยเดียว) เปรียบเทียบกับกฎ \"หลีกเลี่ยงเมื่อระยะห่างจากไฟ < 20 เมตร และ ความเร็วการลาม > 60\" (สองปัจจัยร่วมกัน) จงอธิบายว่าสองกฎนี้ให้ผลต่างกันอย่างไรกับข้อมูลในตาราง และเหตุใดการพิจารณาสองปัจจัยร่วมกันจึงสมเหตุสมผลกว่า\nกฎปัจจัยเดียว (ระยะ < 30 ม.) จะให้หลีกเลี่ยง 4 โซน คือ B (10 ม.), D (18 ม.), F (25 ม.) และ G (8 ม.) ส่วนกฎสองปัจจัย (ระยะ < 20 ม. และลาม > 60) จะหลีกเลี่ยงเพียง 3 โซน คือ B (10 ม., ลาม 85), D (18 ม., ลาม 65) และ G (8 ม., ลาม 90)\nความต่างอยู่ที่โซน F: อยู่ห่างไฟ 25 เมตร แต่ไฟลามเพียงระดับ 55 ซึ่งช้ากว่า B, D, G มาก กฎปัจจัยเดียวจึงปิดโซน F โดยไม่จำเป็น ทำให้เสียโอกาสช่วยผู้ประสบภัยที่ยังเข้าถึงได้ ขณะที่กฎสองปัจจัยเลือกหลีกเลี่ยงเฉพาะโซนที่ \"ใกล้และลามเร็ว\" จริง ๆ\nสรุป: อันตรายจริงเกิดจากปัจจัยหลายอย่างร่วมกัน การดูปัจจัยเดียวอาจระมัดระวังเกินหรือมองข้ามความเสี่ยง (เช่น ไฟที่ไกลแต่ลามเร็วมาก) จึงควรใช้ if ที่ตรวจหลายเงื่อนไขร่วมกัน แลกกับการที่ต้องตั้งค่าเกณฑ์ให้เหมาะสม\nประเด็นที่ควรปรากฏในคำตอบ (ใช้ประกอบการประเมินทั้ง 3 มิติ):\n• #  —  ประเด็น\n      มิติหลักที่เกี่ยวข้อง\n• 1  —  ระบุโซนที่ถูกหลีกเลี่ยงของทั้งสองกฎได้ถูกต้อง (B, D, F, G เทียบกับ B, D, G)\n      1 ความถูกต้อง/หลักฐาน\n• 2  —  ชี้ว่าโซน F คือจุดที่ผลต่างกัน พร้อมตัวเลข (25 ม., ลาม 55)\n      1 ความถูกต้อง/หลักฐาน\n• 3  —  อธิบายว่าปัจจัยเดียวทำให้ระมัดระวังเกินจำเป็น/พลาดโอกาสช่วยเหลือ และสองปัจจัยสะท้อนอันตรายจริงกว่า\n      2 ความลึกเชิงเหตุ–ผล\n• 4  —  (ระดับสูง) กล่าวถึงข้อแลกเปลี่ยนหรือข้อจำกัด เช่น ต้องตั้งเกณฑ์ให้เหมาะสม หรือปัจจัยไกลแต่ลามเร็วก็อันตราย\n      2 ความลึกเชิงระบบ\nตัวอย่างคำตอบระดับ \"พอใช้\" (ใช้ปรับมาตรฐานผู้ตรวจ): ต้องดูทั้งระยะและความเร็วเพราะจะได้ปลอดภัยกว่า (ไม่มีตัวเลขหรือชื่อโซน ไม่อธิบายว่าสองกฎต่างกันอย่างไร) → มิติที่ 1 = 1, มิติที่ 2 = 2, มิติที่ 3 = 2\n4.2 แนวคำตอบอ้างอิง (3 คะแนน — คำถามอัตนัย ใช้รูบริคส่วน B ประกอบ)\nโจทย์: ทีมกู้ภัยต้องการปรับเกณฑ์ตัดสินว่า \"อาคารไม่ปลอดภัย\" จากคะแนนความไม่มั่นคง ≥ 60 เป็น ≥ 70 จงเปรียบเทียบจำนวนตำแหน่งในโปรแกรมที่ต้องแก้ไข ระหว่างการเขียนเป็น checkStructure() กับการเขียนคำสั่งตรวจซ้ำทุกอาคาร และอธิบายผลของการเปลี่ยนเกณฑ์ต่อการตัดสินใจ โดยอ้างอิงข้อมูลอาคารในตาราง\nเกณฑ์ ≥ 60 ทำให้อาคาร 2 (72), 4 (88) และ 7 (65) ถูกตัดสินว่าไม่ปลอดภัย รวม 3 อาคาร ส่วนเกณฑ์ ≥ 70 เหลือ 2 อาคาร (อาคาร 2 และ 4) อาคาร 7 (65) จะกลายเป็น \"ผ่านได้\"\nถ้าเขียนคำสั่งตรวจซ้ำทุกอาคาร ต้องแก้ 8 ตำแหน่ง และหากลืมแก้บางที่ อาคารเดียวกันอาจถูกตัดสินต่างกัน (เกิดความไม่สอดคล้องกัน) แต่ถ้าเขียนเป็นกระบวนงานย่อย checkStructure() แก้เพียง 1 ตำแหน่ง ทุกจุดที่เรียกใช้จะเปลี่ยนตามพร้อมกัน\nอย่างไรก็ตาม การเพิ่มเกณฑ์เป็น 70 ทำให้หุ่นยนต์เข้าอาคาร 7 ได้ (ช่วยผู้ประสบภัยได้มากขึ้น) แต่เสี่ยงมากขึ้นเพราะอาคารที่ไม่มั่นคง 65 ถูกมองว่าปลอดภัย ผู้พัฒนาจึงต้องชั่งน้ำหนักระหว่างโอกาสช่วยเหลือกับความปลอดภัย\nประเด็นที่ควรปรากฏในคำตอบ (ใช้ประกอบการประเมินทั้ง 3 มิติ):\n• #  —  ประเด็น\n      มิติหลักที่เกี่ยวข้อง\n• 1  —  ระบุจำนวนอาคารที่ไม่ปลอดภัยของแต่ละเกณฑ์ถูกต้อง (3 อาคาร → 2 อาคาร) และชี้อาคาร 7 (65) เป็นอาคารที่เปลี่ยนผล\n      1 ความถูกต้อง/หลักฐาน\n• 2  —  เปรียบเทียบจำนวนตำแหน่งที่ต้องแก้ไข (8 ตำแหน่ง เทียบกับ 1 ตำแหน่ง) และอธิบายผลจากความไม่สอดคล้อง\n      1 ความถูกต้อง/หลักฐาน\n• 3  —  อธิบายเชิงเหตุ–ผลว่า procedure ทำให้แก้ที่เดียวมีผลทุกจุดที่เรียกใช้\n      2 ความลึกเชิงเหตุ–ผล\n• 4  —  (ระดับสูง) กล่าวถึงข้อแลกเปลี่ยนของการปรับเกณฑ์ (โอกาสช่วยเหลือ vs ความปลอดภัย)\n      2 ความลึกเชิงระบบ\nตัวอย่างคำตอบระดับ \"พอใช้\" (ใช้ปรับมาตรฐานผู้ตรวจ): เขียนเป็น procedure ดีกว่าเพราะแก้ง่ายและไม่ต้องเขียนซ้ำ (ไม่มีตัวเลขอาคาร ไม่พูดถึงผลของการเปลี่ยนเกณฑ์) → มิติที่ 1 = 1, มิติที่ 2 = 2, มิติที่ 3 = 2\n5.2 เฉลยและเกณฑ์ให้คะแนน (1 คะแนน — ตรวจตามเฉลย ไม่ใช้รูบริค)\nเบี่ยงเบนตั้งแต่ t2 ถึง t7 รวม 6 ช่วงเวลา (ค่า 1, 3, 6, 4, 2, 1)\nกลับเข้าเส้นทางเดิมสมบูรณ์ที่ t8 (ค่าเป็น 0 และคงที่จนถึง t10)\nเกณฑ์ให้คะแนน: ตอบ 6 ช่วงเวลา = 0.5 คะแนน · ตอบ t8 = 0.5 คะแนน\n6.2 แนวคำตอบอ้างอิง (3 คะแนน — คำถามอัตนัย ใช้รูบริคส่วน B ประกอบ)\nโจทย์: ภารกิจ M1 (ผู้เชี่ยวชาญประเมิน \"สูง\") ได้คะแนน 46.0 และ M2 (ผู้เชี่ยวชาญประเมิน \"ต่ำ\") ได้คะแนน 39.0 ทั้งสองถูกจัดเป็น \"ปานกลาง\" จงอธิบายสาเหตุที่น้ำหนักเท่ากันทำให้ระบบแยก M1 กับ M2 ไม่ได้ โดยเปรียบเทียบค่าปัจจัยของทั้งสองภารกิจ และเสนอแนวทางปรับที่เหมาะสม\nM1 มีปัจจัยไฟ (95) และโครงสร้าง (90) สูงมาก แต่ปัจจัยพลังงาน จุดเสี่ยง และเบี่ยงเบนต่ำ (20, 15, 10) ส่วน M2 กลับตรงข้าม คือพลังงาน (80) และจุดเสี่ยง (70) สูง แต่ไฟและโครงสร้างต่ำ (15, 10) เมื่อให้น้ำหนักเท่ากันทุกปัจจัย ค่าสูงกับค่าต่ำหักล้างกันเมื่อเฉลี่ย ได้ 46.0 และ 39.0 ซึ่งต่างกันเพียง 7 คะแนนและอยู่ในช่วงเดียวกัน (35–65)\nปัญหาคือระบบปฏิบัติต่อทุกปัจจัยเสมือนมีความสำคัญเท่ากัน ทั้งที่ไฟและโครงสร้างเป็นอันตรายต่อชีวิตโดยตรงมากกว่า แนวทางคือเพิ่มน้ำหนักไฟและโครงสร้าง เช่น 5 : 5 : 40 : 40 : 10 จะได้ M1 = 76.75 (สูง) และ M2 = 19.5 (ต่ำ) ตรงกับผู้เชี่ยวชาญ\nข้อระวังคือถ้าเพิ่มน้ำหนักบางปัจจัยมากเกินไป อาจมองข้ามความเสี่ยงจากปัจจัยอื่น (เช่น ความเบี่ยงเบนสูงของ M8) จึงต้องทดสอบกับหลายภารกิจ\nประเด็นที่ควรปรากฏในคำตอบ (ใช้ประกอบการประเมินทั้ง 3 มิติ):\n• #  —  ประเด็น\n      มิติหลักที่เกี่ยวข้อง\n• 1  —  เปรียบเทียบค่าปัจจัยของ M1 และ M2 ด้วยตัวเลขที่ถูกต้อง (ไฟ 95/15, โครงสร้าง 90/10, พลังงาน 20/80 ฯลฯ)\n      1 ความถูกต้อง/หลักฐาน\n• 2  —  อธิบายว่าการเฉลี่ยด้วยน้ำหนักเท่ากันทำให้ค่าสูง–ต่ำหักล้างกัน จนคะแนนรวมใกล้กัน (46.0 กับ 39.0) และอยู่ระดับเดียวกัน\n      1 ความถูกต้อง/หลักฐาน\n• 3  —  เสนอปรับน้ำหนักปัจจัยไฟ/โครงสร้างให้สูงขึ้นพร้อมเหตุผลว่าเชื่อมโยงกับอันตรายจริง\n      2 ความลึกเชิงเหตุ–ผล\n• 4  —  (ระดับสูง) กล่าวถึงผลกระทบต่อเนื่อง/ข้อแลกเปลี่ยน เช่น ต้องทดสอบกับภารกิจอื่นเพราะอาจกระทบ M8 หรือปัจจัยอื่น\n      2 ความลึกเชิงระบบ\nตัวอย่างคำตอบระดับ \"พอใช้\" (ใช้ปรับมาตรฐานผู้ตรวจ): น้ำหนักเท่ากันไม่ดี ควรปรับน้ำหนักให้ถูก จะได้จัดระดับถูก (ไม่อ้างค่าปัจจัยของ M1, M2 ไม่อธิบายว่าเฉลี่ยแล้วหักล้างกัน) → มิติที่ 1 = 1, มิติที่ 2 = 2, มิติที่ 3 = 2\nแนวคำตอบส่วนเหตุผล (2 คะแนน — ใช้รูบริคส่วน B):\nภารกิจที่ผู้เชี่ยวชาญจัดเป็น \"สูง\" (M1, M5, M7) มีค่าไฟและโครงสร้างสูงพร้อมกัน (เช่น M1 ไฟ 95 โครงสร้าง 90; M7 ไฟ 80 โครงสร้าง 92) แต่ปัจจัยอื่นต่ำ เมื่อน้ำหนักเท่ากัน ค่าเฉลี่ยจึงถูกดึงลงเหลือ 46–50 จัดเป็นปานกลางผิด\nส่วนภารกิจ \"ต่ำ\" ที่ถูกจัดเป็นปานกลางผิด (M2 พลังงาน 80 จุดเสี่ยง 70, M8 เบี่ยงเบน 88) สูงเฉพาะปัจจัยที่ไม่ใช่อันตรายโดยตรง จึงควรลดน้ำหนักพลังงาน จุดเสี่ยง และเบี่ยงเบน แล้วเพิ่มน้ำหนักไฟและโครงสร้าง เช่น 10 : 10 : 35 : 35 : 10 จะได้ M1 = 69.25 (สูง), M2 = 25.75 (ต่ำ), M8 = 27.55 (ต่ำ)\nข้อแลกเปลี่ยน: ถ้าลดน้ำหนักปัจจัยอื่นเหลือ 0 ทั้งหมด (ใช้ไฟอย่างเดียว) ระบบจะมองไม่เห็นความเสี่ยงด้านพลังงานและจุดเสี่ยงเลย เช่น M4 (พลังงาน 85 จุดเสี่ยง 80) จะได้คะแนนตกลงมาที่ 35.0 พอดีขอบระหว่างต่ำกับปานกลาง จึงควรคงน้ำหนักปัจจัยอื่นไว้บางส่วน\nประเด็นที่ควรปรากฏ: (1) ระบุรายการที่ผิดและอ้างตัวเลขจากตาราง (2) อธิบายว่าเหตุใดการปรับพารามิเตอร์แบบนั้นแก้ข้อผิดพลาดได้ (3) ชี้ข้อแลกเปลี่ยนหรือขีดจำกัดของการปรับ\nแนวคำตอบส่วนเหตุผล (2 คะแนน — ใช้รูบริคส่วน B):\nด้วยค่าเริ่มต้น M3 (30) ถูกจัดเป็นปานกลางทั้งที่จริงคือต่ำ แปลว่า lo ต่ำเกินไป ต้องยก lo ให้สูงกว่า 30 และ M7 (58) ถูกจัดเป็นสูงทั้งที่จริงคือปานกลาง แปลว่า hi ต่ำเกินไป ต้องยก hi ให้สูงกว่า 58\nแต่เลื่อนได้ไม่ไกลนัก: lo ต้องไม่เกิน 38 เพราะ M4 (38) ต้องยังคงเป็นปานกลาง ถ้า lo = 39 M4 จะถูกจัดเป็นต่ำผิด และ hi ต้องไม่เกิน 66 เพราะ M8 (66) ต้องเป็นสูง ถ้า hi = 67 M8 จะกลายเป็นปานกลางผิด จึงได้ช่วงที่ถูกต้องคือ lo = 31–38 และ hi = 59–66 ตัวอย่างเช่น lo = 35, hi = 62 ได้ 10/10 = 100%\nสรุป: การขยับเส้นเกณฑ์แก้ข้อผิดพลาดหนึ่งฝั่งได้ แต่ถ้าขยับมากเกินจะไปสร้างข้อผิดพลาดใหม่ที่ภารกิจที่อยู่ชิดเส้นอีกฝั่ง (trade-off)\nประเด็นที่ควรปรากฏ: (1) ระบุรายการที่ผิดและอ้างตัวเลขจากตาราง (2) อธิบายว่าเหตุใดการปรับพารามิเตอร์แบบนั้นแก้ข้อผิดพลาดได้ (3) ชี้ข้อแลกเปลี่ยนหรือขีดจำกัดของการปรับ\nแนวคำตอบส่วนเหตุผล (2 คะแนน — ใช้รูบริคส่วน B):\nเส้นทางที่ผู้เชี่ยวชาญจัดเป็น \"ต่ำ\" แต่ระบบจัดเป็นปานกลางผิด (เส้นทาง 2, 5, 7) มีจำนวนรอบ loop สูงหรือปานกลาง (85, 40, 60) แต่จุดเสี่ยงและโครงสร้างต่ำ แสดงว่าการใช้รอบ loop มากไม่ได้ทำให้เส้นทางอันตราย (ทำให้เสียเวลา/พลังงาน แต่ไม่เสี่ยงชีวิต) จึงควรลดน้ำหนักจำนวนรอบ loop\nขณะที่เส้นทาง 3 (จุดเสี่ยง 85 โครงสร้าง 80) ควรเป็น \"สูง\" แต่ได้เพียง 64.65 เมื่อน้ำหนักเท่ากัน เพราะค่ารอบ loop ต่ำ (30) ดึงลง จึงต้องเพิ่มน้ำหนักจุดเสี่ยงและโครงสร้าง เช่น 10 : 40 : 50 ได้เส้นทาง 3 = 77.0 (สูง) และเส้นทาง 2 = 24.0 (ต่ำ)\nข้อแลกเปลี่ยน: ถ้าตัดน้ำหนักจำนวนรอบ loop เป็น 0 ทั้งหมด ระบบจะไม่สนใจเลยว่าเส้นทางยาวและใช้พลังงานมาก ซึ่งยังเป็นปัจจัยด้านทรัพยากร จึงควรคงไว้ในสัดส่วนน้อย\nประเด็นที่ควรปรากฏ: (1) ระบุรายการที่ผิดและอ้างตัวเลขจากตาราง (2) อธิบายว่าเหตุใดการปรับพารามิเตอร์แบบนั้นแก้ข้อผิดพลาดได้ (3) ชี้ข้อแลกเปลี่ยนหรือขีดจำกัดของการปรับ\nแนวคำตอบส่วนเหตุผล (2 คะแนน — ใช้รูบริคส่วน B):\nที่ T = 45 สถานการณ์ S4 (47) และ S5 (53) ถูกตัดสินว่า WAIT ทั้งที่ผู้เชี่ยวชาญตัดสินให้ GO แปลว่า T ต่ำเกินไป (ระมัดระวังเกินจำเป็น) ทำให้เสียโอกาสช่วยผู้ประสบภัย จึงต้องยก T ให้สูงกว่า 53 เพื่อให้ S5 ผ่านเป็น GO\nแต่ T สูงเกิน 61 ไม่ได้ เพราะ S6 (61) ผู้เชี่ยวชาญให้ WAIT ถ้า T = 62 ขึ้นไป S6 จะถูกตัดสินเป็น GO ทั้งที่อันตราย ซึ่งเป็นความผิดพลาดที่ร้ายแรงกว่า (หุ่นยนต์เข้าไปในจุดเสี่ยงจริง) ช่วงที่ถูกต้องคือ T = 54–61 เช่น T = 58 ได้ 10/10 = 100%\nสรุป: T ต่ำ = ปลอดภัยแต่พลาดโอกาสช่วย · T สูง = ช่วยได้มากแต่เสี่ยง ต้องหาจุดสมดุลที่ข้อมูลรองรับ\nประเด็นที่ควรปรากฏ: (1) ระบุรายการที่ผิดและอ้างตัวเลขจากตาราง (2) อธิบายว่าเหตุใดการปรับพารามิเตอร์แบบนั้นแก้ข้อผิดพลาดได้ (3) ชี้ข้อแลกเปลี่ยนหรือขีดจำกัดของการปรับ\nแนวคำตอบส่วนเหตุผล (2 คะแนน — ใช้รูบริคส่วน B):\nการจัดลำดับช่วยเหลือของทีมแพทย์ให้ความสำคัญกับ \"ความเร่งด่วนของอาการ\" เป็นหลัก ผู้ประสบภัย 1 และ 2 ถูกจัดเป็นต่ำ แม้เข้าถึงยากและอยู่ในจุดเสี่ยงโครงสร้างสูง (70/80 และ 50/60) เพราะอาการไม่เร่งด่วน (0 และ 10) แต่ระบบน้ำหนักเท่ากันดึงคะแนนขึ้นเป็น 49.5 และ 39.7 (ปานกลางผิด)\nในทางกลับกัน ผู้ประสบภัย 3 (เร่งด่วน 80) ควรเป็นสูง แต่ได้เพียง 56.9 เพราะเข้าถึงง่าย (0) ดึงลง จึงต้องเพิ่มน้ำหนักความเร่งด่วนอาการให้สูง เช่น 70 : 15 : 15 ได้ผู้ประสบภัย 3 = 69.5 (สูง), ผู้ประสบภัย 1 = 22.5 (ต่ำ), ผู้ประสบภัย 6 = 63.0 (ปานกลางถูกต้อง)\nข้อแลกเปลี่ยน: ถ้าน้ำหนักความเร่งด่วนสูงเกินไป (เช่น 100 : 0 : 0) ระบบจะไม่นึกถึงความเสี่ยงต่อชีวิตของผู้ช่วยเหลือหรือความยากในการเข้าถึงเลย จึงควรคงน้ำหนักอีกสองปัจจัยไว้เล็กน้อย\nประเด็นที่ควรปรากฏ: (1) ระบุรายการที่ผิดและอ้างตัวเลขจากตาราง (2) อธิบายว่าเหตุใดการปรับพารามิเตอร์แบบนั้นแก้ข้อผิดพลาดได้ (3) ชี้ข้อแลกเปลี่ยนหรือขีดจำกัดของการปรับ\nตารางแปลงระดับรูบริคเป็นคะแนน (สำหรับแต่ละข้อ)\nนำระดับที่ได้จาก 3 มิติ (แต่ละมิติมีน้ำหนักเท่ากัน) มาหาค่าเฉลี่ย แล้วเทียบกับคะแนนเต็มของข้อนั้นตามตาราง\n• ระดับเฉลี่ย 3 มิติ  —  ข้อที่เต็ม 2 คะแนน (APPLY 1.3–5.3 ส่วนเหตุผล)\n      ข้อที่เต็ม 3 คะแนน (LEARN 3.2, 4.2, 6.2)\n• 3.5 – 4.0 (ดีเยี่ยม)  —  2\n      3\n• 2.5 – 3.4 (ดี)  —  1.5\n      2.5\n• 1.8 – 2.4 (พอใช้)  —  1\n      1.5\n• 1.0 – 1.7 (ควรปรับปรุง)  —  0.5\n      1\n• ไม่ตอบ / ตอบไม่เกี่ยวข้อง  —  0\nหมายเหตุ: ข้อ APPLY x.3 ให้ตรวจส่วนค่าพารามิเตอร์ (1 คะแนน) ตามเฉลยในส่วน A ก่อน (ถูก/ผิดชัดเจนด้วยการคำนวณ) แล้วจึงใช้รูบริคนี้กับส่วนอธิบายเหตุผลเท่านั้น\nส่วน C · แนวทางการประเมินขั้นตอนที่ 4 REFLECT\n      ประเมิน 3 มิติ มิติละ 3 ระดับ · ใช้ประกอบการตรวจข้อ 4.5 และ 4.6 และการให้ข้อมูลย้อนกลับรายบุคคล\nขั้นตอน REFLECT ต่างจากสามส่วนแรกเพราะเป็นการให้นักเรียนประเมินตนเองและสะท้อนคิดเชิงจริยธรรม ไม่ใช่การวัดความรู้ที่มีคำตอบถูกผิดตายตัว กรอบด้านล่างใช้เพื่อให้การตรวจมีความสม่ำเสมอระหว่างผู้ตรวจ\nมิติที่ 1: ความครบถ้วนและตรงประเด็นของคำตอบ (Completeness & Relevance)\n• ระดับ  —  เกณฑ์การพิจารณา\n• สูง  —  ตอบครบทุกข้อ (4.1–4.6) ตรงประเด็นคำถาม คำตอบปลายเปิดมีทั้งการระบุสิ่งที่ควรทำและเหตุผลประกอบ\n• กลาง  —  ตอบครบหรือเกือบครบ แต่คำตอบปลายเปิดสั้นมาก ระบุเพียงสิ่งที่ควรทำโดยไม่มีเหตุผล หรือมีบางส่วนไม่ตรงคำถาม\n• ต่ำ  —  ตอบไม่ครบหลายข้อ หรือคำตอบปลายเปิดเป็นการทวนคำถาม ไม่มีเนื้อหาของตนเอง\nมิติที่ 2: ความสอดคล้องระหว่างการประเมินตนเองกับผลการปฏิบัติจริง (Consistency with Observed Performance)\n• ระดับ  —  เกณฑ์การพิจารณา"};

  var ADAPTER = function (ctx) { 
var acts = ctx.c('APPLY_ACTIVITIES') || [], LT = ctx.c('LEARN_TASKS') || [];
var DA = ctx.S.dragAnswers || {};
Object.keys(DA).forEach(function (tid) {
  var picked = DA[tid] || {}, keys = Object.keys(picked);
  if (!keys.length) return;
  var t = LT.filter(function (x) { return x && x.id === tid; })[0] || {};
  var slots = t.slots || [], items = t.items || [];
  function itemLabel(id) {
    var it = items.filter(function (x) { return x && x.id === id; })[0];
    return it ? it.label : String(id);
  }
  var lines = [], keyLines = [], right = 0, total = 0;
  (slots.length ? slots : keys.map(function (k) { return {id:k, label:k}; })).forEach(function (sl) {
    var chosen = picked[sl.id];
    if (chosen === undefined || chosen === null) return;
    total++;
    if (sl.correct && sl.correct === chosen) right++;
    lines.push(sl.label + ' → ' + itemLabel(chosen));
    if (sl.correct) keyLines.push(sl.label + ' → ' + itemLabel(sl.correct));
  });
  if (!lines.length) return;
  var _tn = parseInt(String((t.title || '')).replace(/^\D*?(\d+).*$/, '$1'), 10) ||
            parseInt(String(tid).replace(/[^0-9]/g, ''), 10) || null;
  ctx.push({stage:'LEARN', kind:'order', docNum:_tn,
    q:(t.title || ('ภาระงาน ' + tid)) + ' · อุปกรณ์/ชิ้นส่วนที่ผู้เข้าสอบวางในแต่ละช่อง',
    answer:lines.join('\n'),
    correctText:keyLines.join('\n'),
    verdict:(total && right === total ? 'ถูก' : (total ? 'ผิด' : ''))});
});
var AR = ctx.S.applyResults || {}, TR = ctx.S.testResult || {};
Object.keys(AR).forEach(function (id) {
  var a = acts.filter(function (x) { return x && x.id === id; })[0] || {};
  var v = AR[id] || {}, parts = [];
  if (v.weights) parts.push('น้ำหนักที่ตั้ง: ' + v.weights.join(', '));
  if (v.thresholds) parts.push('เกณฑ์ที่ตั้ง: ' + Object.keys(v.thresholds).map(function (k) { return k + ' = ' + v.thresholds[k]; }).join(', '));
  if (v.threshold !== undefined) parts.push('เกณฑ์ที่ตั้ง: ' + v.threshold);
  var tr = TR[id];
  if (tr !== undefined && tr !== null) parts.push('ผลการทดสอบ: ' + ctx.fmt(tr && tr.accuracy !== undefined ? tr.accuracy + '%' : tr));
  var _an = parseInt(String(id).replace(/[^0-9]/g, ''), 10) || null;
  ctx.push({stage:'APPLY', kind:'apply', docNum:_an, q:a.title || ('กิจกรรม ' + id), answer:parts.join('\n') || ctx.fmt(v),
    score:ctx.num(tr && tr.accuracy !== undefined ? tr.accuracy : (typeof tr === 'number' ? tr : null))});
});
var RO = ctx.S.reflectOpen || {};
Object.keys(RO).forEach(function (k, i) {
  if (RO[k] && String(RO[k]).trim()) ctx.push({stage:'REFLECT', kind:'text', q:'คำถามเขียนบรรยาย ' + k, answer:RO[k]});
});

  var EXP_KEYS = ["explain", "explanation", "why", "rationale", "feedback", "rubric", "guide", "hint", "note", "model"];

  function firstKey(obj, keys) {
    for (var i = 0; i < keys.length; i++) {
      if (obj && obj[keys[i]] !== undefined && obj[keys[i]] !== null && obj[keys[i]] !== "") return obj[keys[i]];
    }
    return undefined;
  }

  /* index: normalised option text -> bank item */
  var optionIndex = {};
  var bankItems = [];
  function buildBanks() {
    optionIndex = {}; bankItems = [];
    for (var b = 0; b < BANK_NAMES.length; b++) {
      var name = BANK_NAMES[b][0], stage = BANK_NAMES[b][1];
      var arr = probe(name);
      if (!Array.isArray(arr)) continue;
      for (var i = 0; i < arr.length; i++) {
        var it = arr[i];
        if (!it || typeof it !== "object") {
          if (typeof it === "string") {
            bankItems.push({ bank: name, stage: stage, idx: i, q: it, options: null, correct: null, explain: "" });
          }
          continue;
        }
        var qt = firstKey(it, QTEXT_KEYS);
        var opts = firstKey(it, OPT_KEYS);
        var corr = firstKey(it, ANS_KEYS);
        var exp = firstKey(it, EXP_KEYS);
        var rec = {
          bank: name, stage: stage, idx: i,
          q: typeof qt === "string" ? qt : "",
          options: Array.isArray(opts) ? opts.map(function (o) {
            return typeof o === "string" ? o : (o && (o.text || o.label || o.t)) || String(o);
          }) : null,
          correct: (typeof corr === "number" || typeof corr === "string" || typeof corr === "boolean") ? corr : null,
          explain: typeof exp === "string" ? exp : ""
        };
        bankItems.push(rec);
        if (rec.options) {
          for (var o2 = 0; o2 < rec.options.length; o2++) {
            var k = squash(rec.options[o2]);
            if (k && k.length >= 2 && !optionIndex[k]) optionIndex[k] = { item: rec, optIdx: o2 };
          }
        }
      }
    }
  }

  function correctTextOf(item) {
    if (!item || item.correct === null) return "";
    if (typeof item.correct === "number" && item.options && item.options[item.correct] !== undefined) {
      return item.options[item.correct];
    }
    if (typeof item.correct === "string") return item.correct;
    if (typeof item.correct === "boolean") return item.correct ? "ถูก" : "ผิด";
    return "";
  }

  /* ---------- เฉลย/รูบริคตามคู่มือเฉลย ---------- */
  function docItemFor(row) {
    if (!DOCKEY || !DOCKEY.i) return null;
    /* แถวที่รู้เลขข้อในคู่มือเฉลยแน่นอน (เช่น กิจกรรมที่ 1 ของขั้น APPLY) */
    if (row.docNum && row.stage) {
      for (var d = 0; d < DOCKEY.i.length; d++) {
        if (DOCKEY.i[d].s === row.stage && DOCKEY.i[d].n === row.docNum) return DOCKEY.i[d];
      }
    }
    if (row.bankKey && DOCKEY.m && DOCKEY.m[row.bankKey] !== undefined) {
      return DOCKEY.i[DOCKEY.m[row.bankKey]] || null;
    }
    var qs = squash(row.q), as = squash(row.answer);
    if (DOCKEY.q) {
      for (var i = 0; i < DOCKEY.q.length; i++) {
        if (DOCKEY.q[i] && qs.length > 18 && DOCKEY.q[i].indexOf(qs.slice(0, 36)) > -1) return DOCKEY.i[i];
      }
      for (var j = 0; j < DOCKEY.q.length; j++) {
        if (DOCKEY.q[j] && as.length > 10 && DOCKEY.q[j].indexOf(as.slice(0, 26)) > -1 &&
            (!row.stage || !DOCKEY.i[j].s || DOCKEY.i[j].s === row.stage)) return DOCKEY.i[j];
      }
    }
    return null;
  }
  function docBlockFor(row) {
    if (!DOCKEY || !DOCKEY.i) return "";
    /* ใช้ตัวจับคู่ชุดเดียวกับ docItemFor (เลขข้อในคู่มือ → คลังข้อสอบ → ข้อความ) */
    var hit = docItemFor(row);
    if (hit && hit.t) return hit.t;
    /* เกณฑ์ระดับขั้นตอน แล้วจึงรูบริคอัตนัยส่วนท้ายเอกสาร */
    if (DOCKEY.st && row.stage && DOCKEY.st[row.stage]) return DOCKEY.st[row.stage];
    if (row.kind === "text" && DOCKEY.rb) return DOCKEY.rb;
    return "";
  }
  function stageDocText(stage) {
    if (!DOCKEY) return "";
    if (DOCKEY.st && DOCKEY.st[stage]) return DOCKEY.st[stage];
    var out = [];
    if (DOCKEY.i) {
      for (var i = 0; i < DOCKEY.i.length; i++) {
        if (DOCKEY.i[i].s === stage) out.push(DOCKEY.i[i].t);
      }
    }
    return out.join("\n\n");
  }

  /* ---------- ดึงคำตอบจาก state ของแบบทดสอบ (เรียงลำดับ / เติมคำ / ผลการทดสอบ APPLY) ---------- */
  function hostState() {
    var names = ["state", "S", "appState", "APP"];
    for (var i = 0; i < names.length; i++) {
      var o = probe(names[i]);
      if (o && typeof o === "object") return o;
    }
    return null;
  }
  function fmtVal(v) {
    if (v === null || v === undefined || v === "") return "—";
    if (typeof v === "boolean") return v ? "ใช่" : "ไม่ใช่";
    if (typeof v === "number") return String(Math.round(v * 100) / 100);
    if (typeof v === "string") return v;
    if (Array.isArray(v)) return v.map(fmtVal).join(", ");
    if (typeof v === "object") {
      return Object.keys(v).filter(function (k) {
        return typeof v[k] !== "function" && (Array.isArray(v[k]) || typeof v[k] !== "object");
      }).map(function (k) { return k + " = " + fmtVal(v[k]); }).join(", ");
    }
    return String(v);
  }
  function asNum(v) {
    return (typeof v === "number" && isFinite(v)) ? Math.round(v) : null;
  }
  function adapterRows() {
    var st = hostState();
    if (!st || typeof ADAPTER !== "function") return [];
    var out = [];
    var ctx = {
      S: st,
      c: function (n) { return probe(n); },
      fmt: fmtVal,
      num: asNum,
      push: function (r) {
        if (!r || (!r.answer && r.score == null)) return;
        r.kind = r.kind || "state";
        r.stage = r.stage || "LEARN";
        r.fromState = true;
        out.push(r);
      }
    };
    try { ADAPTER(ctx); } catch (e) {}
    return out;
  }
  function allRows() {
    var extra = adapterRows();
    if (!extra.length) return rows;
    /* ไม่ให้ซ้ำกับแถวที่เก็บจากการคลิก/พิมพ์ */
    var seen = {};
    rows.forEach(function (r) { seen[squash(r.q).slice(0, 40)] = 1; });
    var merged = rows.slice();
    extra.forEach(function (r) {
      var k = squash(r.q).slice(0, 40);
      if (!seen[k]) { seen[k] = 1; merged.push(r); }
    });
    return merged;
  }

  /* ---------- the running transcript ---------- */
  /* rows: {stage, kind:'choice'|'text', q, answer, correctText, verdict, explain, key, ts} */
  var rows = [];
  var rowByKey = {};

  function upsert(row) {
    if (rowByKey[row.key]) {
      var old = rowByKey[row.key];
      for (var k in row) if (row[k] !== undefined && row[k] !== "") old[k] = row[k];
      old.ts = row.ts;
    } else {
      rowByKey[row.key] = row;
      rows.push(row);
    }
  }

  /* ปุ่มนำทาง/ปุ่มระบบ - ไม่ใช่คำตอบ (ตรวจแบบ "มีคำนี้อยู่" กับข้อความสั้น ๆ
     เพื่อให้ครอบคลุมคำอย่าง "ข้อถัดไป" หรือ "▶ ถัดไป" ด้วย) */
  var NAV_WORDS = /(ถัดไป|ต่อไป|ไปขั้นตอน|ขั้นตอนถัดไป|ไปต่อ|ย้อนกลับ|ก่อนหน้า|เริ่ม|บันทึก|ส่งผล|ส่งคำตอบ|ตรวจคำตอบ|ตรวจสอบ|รีเซ็ต|เคลียร์|ล้าง|ปิด|ตกลง|ยืนยัน|ดาวน์โหลด|พิมพ์|ทำอีกครั้ง|กลับสู่หน้าหลัก|กลับไป|เข้าสู่ระบบ|ดูเฉลย|ดูผล|สรุปผล|รายงานผล|แนวคำตอบ|รัน|run|reset|next|back|start|close|submit|ย้อนดูประวัติ|ออกจากโหมด)/i;
  function isNav(t) {
    if (t.length <= 44 && NAV_WORDS.test(t)) return true;
    /* ปุ่มนำทางมักลงท้ายด้วยลูกศร เช่น "ไปขั้นตอน REFLECT →" */
    if (t.length <= 44 && /[→➔»▶›]\s*$/.test(t)) return true;
    if (t.length <= 44 && /^[←◀‹]/.test(t)) return true;
    return false;
  }

  function nearestQuestionText(el) {
    var node = el, hops = 0;
    while (node && hops < 6) {
      node = node.parentElement; hops++;
      if (!node) break;
      var head = node.querySelector("h1,h2,h3,h4,h5,.q,.question,.prompt,.qtext,.stem,legend,strong,b");
      if (head) {
        var t = norm(head.textContent);
        if (t.length > 8 && t.length < 400) return t;
      }
    }
    return "";
  }

  function recordChoice(el) {
    var txt = norm(el.textContent);
    if (!txt || txt.length > 320) return;
    if (isNav(txt)) return;

    var stage = stageOf();
    if (!stage || stage === "REPORT") return;

    var hit = optionIndex[squash(txt)];
    var row;
    if (hit) {
      var it = hit.item;
      var cTxt = correctTextOf(it);
      var verdict = "";
      if (typeof it.correct === "number") verdict = (hit.optIdx === it.correct) ? "ถูก" : "ผิด";
      row = {
        key: "bank:" + it.bank + ":" + it.idx,
        bankKey: it.bank + ":" + it.idx,
        stage: it.stage || stage, kind: "choice",
        q: it.q || nearestQuestionText(el) || "(ไม่ระบุโจทย์)",
        answer: txt, correctText: cTxt, verdict: verdict,
        explain: it.explain || "", ts: Date.now()
      };
    } else {
      /* ไม่ตรงกับคลังข้อสอบ: รับเฉพาะการคลิกที่เป็น "ตัวเลือกคำตอบ" จริง ๆ
         เพื่อไม่ให้แถบความคืบหน้า/ชิป/ป้ายกำกับ กลายเป็นแถวขยะในตาราง */
      var tag = (el.tagName || "").toLowerCase();
      var cls = (typeof el.className === "string") ? el.className : "";
      var interactive = /^(button|label|li|a|option)$/.test(tag) ||
                        el.getAttribute("role") === "button" ||
                        /(opt|choice|ans|btn)/i.test(cls);
      if (!interactive) return;
      /* ตัวเลขโดด ๆ มักเป็นหมายเลขขั้นตอน/ชิปความคืบหน้า ยกเว้นมาตรวัด REFLECT */
      if (txt.length < 2 && stage !== "REFLECT") return;
      var q = nearestQuestionText(el);
      if (!q || q.length < 20) return;    /* ไม่ใช่ตัวเลือกคำตอบ - ข้าม */
      row = {
        key: "dom:" + stage + ":" + squash(q).slice(0, 60),
        stage: stage, kind: "choice", q: q,
        answer: txt, correctText: "", verdict: "", explain: "", ts: Date.now()
      };
    }
    upsert(row);
    captureFeedback(el, row);
  }

  /* เก็บข้อความเฉลย/ผลตรวจที่ตัวแบบทดสอบแสดงเองหลังเลือกคำตอบ */
  /* อ่านเฉพาะข้อความที่ผู้ใช้เห็นจริง ตัด <script>/<style> ออก */
  function textOf(node) {
    try {
      var c = node.cloneNode(true);
      var junk = c.querySelectorAll("script,style,noscript,canvas,svg");
      for (var i = 0; i < junk.length; i++) junk[i].remove();
      return c.textContent || "";
    } catch (e) { return ""; }
  }
  /* ข้อความที่หน้าตาเป็นซอร์สโค้ด ไม่ใช่คำอธิบายเชิงวิชาการ */
  function looksLikeCode(t) {
    if (!t) return false;
    return /(function\s*\(|=>|document\.|querySelector|getElementById|await |const |let |var |JSON\.|addEventListener|\{\s*\}|;\s*\})/.test(t);
  }
  function captureFeedback(el, row) {
    setTimeout(function () {
      try {
        var box = el.closest ? el.closest("div,li,section,form") : null;
        for (var hop = 0; box && hop < 4; hop++) {
          var t = norm(textOf(box));
          var m = t.match(/(ถูกต้อง|ไม่ถูกต้อง|ยังไม่ถูก|คำอธิบาย|เฉลย|แนวคำตอบ)[\s:：]*([^]{0,300})/);
          if (m) {
            if (!row.verdict && /^(ถูกต้อง)/.test(m[1])) row.verdict = "ถูก";
            if (!row.verdict && /^(ไม่ถูกต้อง|ยังไม่ถูก)/.test(m[1])) row.verdict = "ผิด";
            if (!row.explain && !looksLikeCode(m[0])) row.explain = clip(m[0], 320);
            return;
          }
          box = box.parentElement;
        }
      } catch (e) {}
    }, 260);
  }

  function labelForField(el) {
    /* หาคำถามที่ใกล้ช่องกรอกที่สุดก่อน แล้วค่อยไล่ออกไปกว้างขึ้น */
    if (el.id) {
      var lab = document.querySelector('label[for="' + el.id + '"]');
      if (lab) { var t = norm(lab.textContent); if (t) return t; }
    }
    var aria = el.getAttribute && (el.getAttribute("aria-label") || el.getAttribute("title"));
    if (aria && norm(aria)) return norm(aria);
    var wrapLab = el.closest && el.closest("label");
    if (wrapLab) {
      var wt = norm(wrapLab.textContent);
      if (wt.length > 3) return clip(wt, 220);
    }
    var prev = el.previousElementSibling;
    for (var i = 0; prev && i < 3; i++) {
      var pt = norm(prev.textContent);
      if (pt.length > 6) return clip(pt, 220);
      prev = prev.previousElementSibling;
    }
    var par = el.parentElement;
    if (par) {
      var clone = par.cloneNode(true);
      var kill = clone.querySelectorAll("input,textarea,select,button");
      for (var k = 0; k < kill.length; k++) kill[k].remove();
      var ptxt = norm(clone.textContent);
      if (ptxt.length > 6) return clip(ptxt, 220);
    }
    var ph = el.getAttribute && el.getAttribute("placeholder");
    var near = nearestQuestionText(el);
    return near || (ph ? norm(ph) : "") || "คำตอบเขียนบรรยาย";
  }

  var GATE_IDS = { inName: 1, inputName: 1, nameInput: 1, gateName: 1, "inp-name": 1, inpName: 1 };
  function recordText(el) {
    if (!el || GATE_IDS[el.id]) return;
    var val = norm(el.value);
    if (!val) return;
    var stage = stageOf();
    if (!stage || stage === "REPORT") return;
    var key = "txt:" + (el.id || el.name || labelForField(el)).slice(0, 60);
    upsert({
      key: key, stage: stage, kind: "text",
      q: labelForField(el), answer: el.value, correctText: "",
      verdict: "", explain: "", ts: Date.now()
    });
  }

  document.addEventListener("click", function (ev) {
    try {
      var el = ev.target;
      if (!el || !el.closest) return;
      if (el.closest("#pisaReviewPanel,#pisaHistoryOverlay")) return;
      var clickable = el.closest("button,label,li,a,[role='button'],[class*='opt'],[class*='choice'],[class*='ans'],[class*='card']") || el;
      recordChoice(clickable);
    } catch (e) {}
  }, true);

  document.addEventListener("change", function (ev) {
    try {
      var el = ev.target;
      if (!el) return;
      if (el.closest && el.closest("#pisaReviewPanel,#pisaHistoryOverlay")) return;
      var tag = (el.tagName || "").toLowerCase();
      if (tag === "textarea" || (tag === "input" && /^(text|number|range)$/.test(el.type || "text"))) recordText(el);
      if (tag === "select" && el.id !== "inGrade" && el.getAttribute("data-pisa-grade") !== "1") {
        var opt = el.options[el.selectedIndex];
        if (opt) recordChoice(opt);
      }
    } catch (e) {}
  }, true);
  document.addEventListener("blur", function (ev) {
    try {
      var el = ev.target, tag = (el && el.tagName || "").toLowerCase();
      /* เฉพาะช่องพิมพ์ข้อความเท่านั้น - ปุ่มตัวเลือก radio/checkbox ถูกเก็บจากการคลิกอยู่แล้ว */
      if (tag === "textarea" || (tag === "input" && /^(text|search|email)$/.test(el.type || "text"))) recordText(el);
    } catch (e) {}
  }, true);

  /* ---------- attempts storage ---------- */
  function readAttempts() {
    try { return JSON.parse(localStorage.getItem(ATTEMPTS_KEY) || "{}"); } catch (e) { return {}; }
  }
  function saveAttempt(payload, scores) {
    try {
      var all = readAttempts();
      var lk = learnerKey();
      if (!all[lk]) all[lk] = {};
      if (!all[lk][SCENARIO_ID]) all[lk][SCENARIO_ID] = [];
      all[lk][SCENARIO_ID].push({
        title: SCENARIO_TITLE, name: LNAME, grade: LGRADE,
        finishedAt: new Date().toISOString(),
        scores: scores || {},
        rows: allRows().map(function (r) {
          return { stage: r.stage, kind: r.kind, bankKey: r.bankKey || "", score: (r.score == null ? null : r.score), q: clip(r.q, 300),
                   answer: clipML(r.answer, 1600), correctText: clipML(r.correctText, 600),
                   verdict: r.verdict, explain: clip(r.explain, 600) };
        })
      });
      while (all[lk][SCENARIO_ID].length > MAX_ATTEMPTS_PER_SCENARIO) all[lk][SCENARIO_ID].shift();
      localStorage.setItem(ATTEMPTS_KEY, JSON.stringify(all));
    } catch (e) {}
  }
  function attemptsForLearner() {
    var all = readAttempts();
    return (all[learnerKey()] && all[learnerKey()][SCENARIO_ID]) || [];
  }

  /* ---------- scores out of the payload the app posts ---------- */
  function num(v) { return (typeof v === "number" && isFinite(v)) ? Math.round(v) : null; }
  function pctFromText(t) {
    if (typeof t !== "string") return null;
    var m = t.match(/(?:รวม|เฉลี่ย)\s*([\d.]+)\s*%/) || t.match(/([\d.]+)\s*%/);
    return m ? Math.round(parseFloat(m[1])) : null;
  }
  function fromTotal(p, label) {
    if (typeof p.totalReport !== "string") return null;
    var m = p.totalReport.match(new RegExp(label + "\\s*([\\d.]+)"));
    return m ? Math.round(parseFloat(m[1])) : null;
  }
  function sect(p, keys, textKey, label) {
    for (var i = 0; i < keys.length; i++) { var v = num(p[keys[i]]); if (v !== null) return v; }
    var ft = fromTotal(p, label); if (ft !== null) return ft;
    return pctFromText(p[textKey]);
  }
  function scoresOf(p) {
    return {
      show: sect(p, ["show", "show_score"], "showReport", "SHOW"),
      learn: sect(p, ["learn", "learn_score"], "learnReport", "LEARN"),
      apply: sect(p, ["apply", "apply_score"], "applyReport", "APPLY"),
      reflect: sect(p, ["reflect", "reflect_score"], "reflectReport", "REFLECT"),
      overall: (function () {
        var v = num(p.overall); if (v !== null) return v;
        v = num(p.overall_score); if (v !== null) return v;
        var t = [p.overallReport, p.totalReport, p.qualityReport].filter(Boolean).join(" ");
        var m = t.match(/([\d.]+)\s*%/) || t.match(/([\d.]+)\s*\/\s*100/);
        return m ? Math.round(parseFloat(m[1])) : null;
      })(),
      levelName: p.levelName || p.levelLabel || p.quality_label || p.qualityLevel || p.qualityReport || ""
    };
  }

  /* ---------- styles ---------- */
  var CSS = [
    "#pisaReviewPanel{font-family:'IBM Plex Sans Thai',system-ui,sans-serif;max-width:1040px;margin:26px auto 90px;padding:0 14px;color:#1d2330;}",
    "#pisaReviewPanel *{box-sizing:border-box;}",
    "#pisaReviewPanel,#pisaDetailOverlay,#pisaHistoryOverlay,#pisaReportBar{text-align:left;}",
    "#pisaReviewPanel td,#pisaReviewPanel th,#pisaReviewPanel h4{text-align:left;}",
    "#pisaReviewPanel h4{background:none !important;-webkit-background-clip:border-box !important;-webkit-text-fill-color:#14213d !important;color:#14213d !important;letter-spacing:normal;}",
    "#pisaDetailOverlay .pd-bar h3,#pisaReportBar h3,#pisaHistoryOverlay .ph-bar h3,#pisaReviewPanel .pr-head h3{background:none !important;-webkit-background-clip:border-box !important;-webkit-text-fill-color:#fff !important;color:#fff !important;letter-spacing:normal;text-shadow:none;}",
    "#pisaReviewPanel .pr-ans{text-align:left;}",
    "#pisaReviewPanel .pr-card{background:#fff;border:1px solid #dfe3ea;border-radius:14px;box-shadow:0 6px 20px rgba(20,30,50,.08);overflow:hidden;}",
    "#pisaReviewPanel .pr-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:16px 18px;background:#14213d;color:#fff;}",
    "#pisaReviewPanel .pr-head h3{margin:0;font-size:16px;font-weight:700;}",
    "#pisaReviewPanel .pr-head .pr-sub{font-size:11.5px;opacity:.8;margin-top:2px;}",
    "#pisaReviewPanel .pr-btn{border:none;border-radius:999px;padding:9px 16px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;background:#f0a500;color:#14213d;}",
